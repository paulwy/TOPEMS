name: CI

# ────────────────────────────────────────────────────────────────────────────
# 触发规则
#
# 1. push 到 main/develop 分支          → 全量 CI
# 2. PR 目标为 main/develop             → 全量 CI（含路径过滤跳过无关变更）
# 3. push v* 标签                       → 发布前验证（CI 全量 + 不取消）
# 4. 每日 02:00 UTC (10:00 北京时间)     → 夜间全量回归
# 5. 手动触发                            → 可指定分支
#
# paths-ignore: 纯文档/配置变更不触发 CI，节省 runner 资源。
#               代码变更（src/, svc/, lib/, packages/）始终触发。
# ────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Nightly 02:00 UTC (10:00 Asia/Shanghai) — 在 E2E (03:00) 之前跑完
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_rust:
        description: 'Skip Rust jobs (faster frontend-only run)'
        required: false
        default: false
        type: boolean

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: "50G"
  # CI 禁用增量编译：避免 fingerprint 对 mtime 敏感导致 restore 后大面积失效
  # 详见 docs/architecture/a2-build-cache.md §1.3
  CARGO_INCREMENTAL: 0
  # cargo-nextest 配置（更快、并行测试）
  NEXTEST_EXECS: "FIFO"
  # Prevent OOM in Node.js test / coverage processes
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      frontend: ${{ steps.decide.outputs.frontend }}
      i18n: ${{ steps.decide.outputs.i18n }}
      docs: ${{ steps.decide.outputs.docs }}
      ci: ${{ steps.decide.outputs.ci }}
      permission: ${{ steps.decide.outputs.permission }}
      menu: ${{ steps.decide.outputs.menu }}
      api_audit: ${{ steps.decide.outputs.api_audit }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        # schedule 和 workflow_dispatch 事件没有「变更路径」概念，
        # 跳过路径过滤，由 decide 步骤统一输出 true。
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'lib/**'
              - 'svc/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            frontend:
              - 'apps/web/**'
              - 'apps/desktop/**'
              - 'apps/mobile/**'
              - 'packages/**'
              - 'scripts/bundle-check.sh'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - 'eslint.config.js'
            i18n:
              - 'apps/web/src/i18n/**'
              - 'scripts/i18n/**'
              - 'scripts/ci/check-i18n*.cjs'
              - 'scripts/ci/verify-glossary.cjs'
              - 'apps/web/src/pages/**/*.{ts,tsx}'
              - 'apps/web/src/components/**/*.{ts,tsx}'
              - 'scripts/i18n/glossary.csv'
            permission:
              - 'lib/shared-auth/**'
              - 'svc/**/*.rs'
              - 'apps/web/src/config/permissions.ts'
              - 'apps/web/src/modules/*/config.ts'
              - 'apps/web/src/lib/navigation/**'
              - 'apps/web/src/lib/routes/v2.tsx'
              - 'scripts/ci/check-permission-matrix.cjs'
              - 'docs/roadmap/artifacts/rN-perm-matrix-baseline.json'
              - 'apps/web/src/__tests__/permission-matrix-guard.test.ts'
            menu:
              - 'apps/web/src/modules/*/config.ts'
              - 'apps/web/src/lib/navigation/**'
              - 'apps/web/src/routes/**'
              - 'apps/web/src/config/permissions.ts'
              - 'scripts/analyze-menu.cjs'
            api_audit:
              - 'apps/web/src/api/**'
              - 'apps/web/src/pages/**'
              - 'apps/web/src/modules/*/config.ts'
              - 'apps/web/src/config/permissions.ts'
              - 'scripts/p6-api-audit-v5.cjs'
              - 'scripts/p7-perm-audit-v5.cjs'
              - 'scripts/ci/check-api-audit.cjs'
            docs:
              - 'docs/**'
              - '**/*.md'
            ci:
              - '.github/**'
              - 'scripts/ci/**'

      - name: Decide job execution
        id: decide
        run: |
          # schedule / workflow_dispatch / tag → 全量运行
          if [[ "${{ github.event_name }}" == "schedule" || \
                "${{ github.event_name }}" == "workflow_dispatch" || \
                "${{ github.ref_type }}" == "tag" ]]; then
            echo "rust=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "i18n=true" >> $GITHUB_OUTPUT
            echo "permission=true" >> $GITHUB_OUTPUT
            echo "menu=true" >> $GITHUB_OUTPUT
            echo "api_audit=true" >> $GITHUB_OUTPUT
            echo "docs=true" >> $GITHUB_OUTPUT
            echo "ci=true" >> $GITHUB_OUTPUT
          else
            echo "rust=${{ steps.filter.outputs.rust }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
            echo "i18n=${{ steps.filter.outputs.i18n }}" >> $GITHUB_OUTPUT
            echo "permission=${{ steps.filter.outputs.permission }}" >> $GITHUB_OUTPUT
            echo "menu=${{ steps.filter.outputs.menu }}" >> $GITHUB_OUTPUT
            echo "api_audit=${{ steps.filter.outputs.api_audit }}" >> $GITHUB_OUTPUT
            echo "docs=${{ steps.filter.outputs.docs }}" >> $GITHUB_OUTPUT
            echo "ci=${{ steps.filter.outputs.ci }}" >> $GITHUB_OUTPUT
          fi

  rust-smoke:
    name: Rust Smoke (Phase 1.0 — 5 standalone services)
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    # lightweight 准入：不依赖 DB/Redis/sqlx-cli/nextest，改动导致 use 解析失败或
    # crate 边界缺失时最快 <3min 失败反馈；后续 lint/test 再做深度校验。
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-smoke-nightly-2026-07-01"

      - name: Run 5-service smoke tests
        env:
          SQLX_OFFLINE: "true"
        run: |
          cargo test \
            -p topems-monitor \
            -p topems-plugin-registry \
            -p topems-master-data \
            -p topems-portal \
            -p topems-unified-core \
            --test smoke

  rust-lint:
    name: Rust Lint
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-lint-nightly-2026-07-01"

      - name: Check code format
        run: cargo fmt --check --all

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # [V232-P3 NEW Gate J] Cargo fmt workspace (Rust only, standalone job)
  # ──────────────────────────────────────────────────────────────────────────
  fmt-check:
    name: Gate J · cargo fmt --all --check (Rust workspace)
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: rustfmt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "fmt-check-nightly-2026-07-01"

      - name: Check code format (workspace)
        run: cargo fmt --all --check

  # ──────────────────────────────────────────────────────────────────────────
  # [V232-P3 NEW Gate K] Cargo clippy workspace -- -D warnings (standalone job)
  # ──────────────────────────────────────────────────────────────────────────
  clippy-check:
    name: Gate K · cargo clippy --workspace -D warnings
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "clippy-check-nightly-2026-07-01"

      - name: Run Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # [V232-P3 NEW Gate L] Cargo check workspace --tests -D warnings (standalone job)
  # ──────────────────────────────────────────────────────────────────────────
  cargo-check:
    name: Gate L · cargo check --workspace --tests -D warnings
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "cargo-check-nightly-2026-07-01"

      - name: Run cargo check (workspace, all tests)
        run: RUSTFLAGS="-D warnings" SQLX_OFFLINE="true" cargo check --workspace --tests --message-format=short

  # ──────────────────────────────────────────────────────────────────────────
  # [V247 D-track NEW] cargo-test baseline job (non-blocking, establishes run baseline)
  # Goal: upgrade from `cargo test --workspace --no-run` (compile-only) to full
  # `cargo test --workspace` execution. V247 keeps continue-on-error: true;
  # will switch to blocking after N consecutive green runs.
  # ──────────────────────────────────────────────────────────────────────────
  cargo-test:
    name: Cargo Test (V247 baseline, non-blocking)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true  # V247: 基线阶段不阻断
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace 2>&1 | tee /tmp/cargo-test-output.log
      - name: Test summary
        if: always()
        run: |
          echo "## Cargo Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "$(grep -E '^test result:' /tmp/cargo-test-output.log | tail -1)" >> $GITHUB_STEP_SUMMARY

  rust-test:
    name: Rust Tests
    needs: [changes, rust-lint, fmt-check, clippy-check, cargo-check]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-test-nightly-2026-07-01"

      - name: Cache nextest
        uses: actions/cache@v5
        with:
          path: ~/.cache/nextest
          key: nextest-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: nextest-${{ runner.os }}-

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_test; do
            sleep 1
          done

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Verify sqlx offline cache consistency
        # 仅校验"有 query! 宏且当前代码可编译"的 package 的 .sqlx 缓存与源码是否一致
        # 失败时提示用户本地执行 `./scripts/dev/sqlx-prepare.sh -p <FAIL_PKGS>` 刷新
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
        run: ./scripts/dev/sqlx-prepare.sh --check

      - name: Quick check (quality gate, SQLX_OFFLINE=true)
        # CI 默认完全离线：只用仓库中的 .sqlx/，不需要临时起 DB 做宏检查
        # 这样即便后续 PostgreSQL/Redis 服务延迟，也不会阻断前期质量门禁
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace

      - name: Build tests with nextest
        run: cargo nextest run --workspace --no-run

      - name: Run unit tests with nextest (no database required)
        env:
          APP_ENV: test
        run: cargo nextest run --workspace -p topems-crm -p topems-qms

      - name: Run integration tests with nextest (with database)
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-only-32chars
          APP_ENV: test
        run: cargo nextest run --workspace --test-threads=4

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Run coverage (workspace)
        env:
          APP_ENV: test
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-only-32chars
        run: cargo llvm-cov test --workspace --html --output-dir target/llvm-cov-report

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rust-coverage
          path: target/llvm-cov-report/
          retention-days: 7

      - name: Check Rust coverage thresholds
        run: |
          cargo llvm-cov report --lcov --output-path target/lcov.info

          TOTAL_LINE=$(cargo llvm-cov report --summary-only 2>/dev/null | awk '/^TOTAL/ {print $9}' | tr -d '%')
          TOTAL_FUNC=$(cargo llvm-cov report --summary-only 2>/dev/null | awk '/^TOTAL/ {print $6}' | tr -d '%')

          echo "## Rust Coverage Report (workspace)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          CHECKS_PASSED=true

          # Total line coverage ≥ 25% (P4 sprint: raised from 20%)
          if (( $(echo "${TOTAL_LINE:-0} >= 25" | bc -l) )); then
            echo "| **Workspace Line** | ${TOTAL_LINE:-0}% | 25% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Workspace Line** | ${TOTAL_LINE:-0}% | 25% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          # Core + service crates — P4 tightened thresholds (2026-08-16)
          for item in \
            "topems-shared:80" \
            "topems-mes:50" \
            "topems-qms:60" \
            "topems-erp:55" \
            "topems-finance:40" \
            "topems-hrm:30" \
            "topems-scm:35" \
            "topems-wms:60" \
            "topems-tms:70"; do
            pkg="${item%%:*}"
            threshold="${item##*:}"
            cov=$(cargo llvm-cov report --summary-only -p "$pkg" 2>/dev/null | grep "$pkg" | awk '{print $9}' | tr -d '%')
            if [ -z "$cov" ]; then cov="N/A"; fi
            if [ "$cov" = "N/A" ]; then
              echo "| $pkg | $cov | ${threshold}% | ⏭️ |" >> $GITHUB_STEP_SUMMARY
            elif (( $(echo "${cov} >= ${threshold}" | bc -l) )); then
              echo "| $pkg | ${cov}% | ${threshold}% | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $pkg | ${cov}% | ${threshold}% | ❌ |" >> $GITHUB_STEP_SUMMARY
              CHECKS_PASSED=false
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$CHECKS_PASSED" = false ]; then
            echo "❌ **Coverage thresholds not met!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All coverage thresholds met.**" >> $GITHUB_STEP_SUMMARY
          fi

  rust-audit:
    name: Rust Security Audit
    needs: [changes, rust-test]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-audit-nightly-2026-07-01"

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit (security scan)
        run: |
          echo "## Rust Security Audit (cargo-audit)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanning Cargo.lock for known Rust Security Advisory (RLSA) vulnerabilities..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # `cargo audit` exits non-zero when known RLSA vulnerabilities are found,
          # failing this job and the downstream quality gate.
          cargo audit
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| cargo audit | ✅ No known vulnerabilities |" >> $GITHUB_STEP_SUMMARY

  frontend-lint:
    name: Frontend Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter topems-portal lint

      - name: Run a11y lint (V65)
        run: pnpm --filter topems-portal lint:a11y

  design-system-check:
    name: Design System Token Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens package
        run: pnpm --filter @topems/tokens build

      - name: Check token deviation
        run: node apps/web/scripts/check-token-deviation.cjs

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend Audit (V64) — 5 个 CI 审计脚本，守护导航/页面标准化/图标/API 一致性
  #
  # 与 .husky/pre-commit 中的本地门禁对应，但 CI 端强制全量检查（非 --diff），
  # 防止 --no-verify 绕过 + 覆盖 check-nav-route / compare-api-modules /
  # check-api-coverage 三个 pre-commit 未覆盖的脚本。
  # ──────────────────────────────────────────────────────────────────────────
  frontend-audit:
    name: Frontend Audit (V64)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run page standardization audit
        run: node scripts/ci/page-audit.cjs --strict

      - name: Run icon completeness check
        run: node scripts/ci/check-icons.cjs --strict

      - name: Run nav-route consistency check
        run: node scripts/ci/check-nav-route.cjs --strict

      - name: Run API module alignment check
        run: node scripts/ci/compare-api-modules.cjs --strict

      - name: Run API coverage check (lowcode + automation)
        run: node scripts/ci/check-api-coverage.cjs --strict

      - name: Run a11y coverage check (V65)
        run: node scripts/ci/check-a11y.cjs --strict

      - name: Run i18n check (V65)
        run: node scripts/ci/check-i18n.cjs --strict

  # ──────────────────────────────────────────────────────────────────────────
  # i18n 质量门禁（R11 Z-P1 固化）
  #
  # 四项检查：
  #   1. en.json 假 en 值 → 残留中文/机翻乱码/中英混杂  → FAIL 阻断
  #   2. en/zh key 一致性 → 缺 key/空值               → WARN 不阻断
  #   3. 混合结构 bug     → 扁平 key(含点) 与嵌套对象值不一致 → FAIL 阻断
  #   4. Glossary TopN 一致性 → 标准译法 / 允许别名之外的译法 → FAIL 阻断
  #
  # 前置条件：66 个 en.json 已完成全量翻译清零（902 条假值已修复），
  #           glossary.csv 61 条 TopN 术语 Phase-2 强制对齐完成。
  #           此门禁负责防止回退。
  # ──────────────────────────────────────────────────────────────────────────
  i18n-quality-gate:
    name: i18n Quality Gate（fake-en · key-alignment · mixed-structure · glossary）
    needs: changes
    if: needs.changes.outputs.i18n == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run i18n 综合 + Glossary + Hardcoded 审计 (JSON 报告)
        id: audit_json
        run: |
          node scripts/ci/check-i18n-quality.cjs --json > /tmp/i18n-audit.json || true
          node scripts/ci/verify-glossary.cjs --json > /tmp/glossary-audit.json || true
          node scripts/i18n/scan-hardcoded-precise.cjs --json --details 0 > /tmp/hardcoded-audit.json || true
          echo "audit_done=true" >> $GITHUB_OUTPUT

      - name: Write i18n + Glossary audit summary
        if: always()
        run: |
          echo "## i18n Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 数量 | 阈值 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|------|------|" >> $GITHUB_STEP_SUMMARY

          if [ -f /tmp/i18n-audit.json ]; then
            FAKE=$(node -e "console.log(require('/tmp/i18n-audit.json').fake_en.total)")
            KEYMIS=$(node -e "console.log(require('/tmp/i18n-audit.json').key_mismatch.total)")
            MIXED=$(node -e "console.log(require('/tmp/i18n-audit.json').mixed_structure.total)")
            NS=$(node -e "console.log(require('/tmp/i18n-audit.json').namespaces_scanned)")

            echo "| 扫描命名空间 | $NS | - | ⏭️ |" >> $GITHUB_STEP_SUMMARY
            echo "| ① 假 en 值残留 | $FAKE | 0 | $([ "$FAKE" -eq 0 ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
            echo "| ② en/zh key 偏差 | $KEYMIS | 可容忍 | $([ "$KEYMIS" -eq 0 ] && echo '✅' || echo '⚠️') |" >> $GITHUB_STEP_SUMMARY
            echo "| ③ 混合结构 bug | $MIXED | 0 | $([ "$MIXED" -eq 0 ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f /tmp/glossary-audit.json ]; then
            GL_VIOL=$(node -e "console.log(require('/tmp/glossary-audit.json').total_violations)")
            GL_TERMS=$(node -e "console.log(require('/tmp/glossary-audit.json').glossary_terms_loaded)")
            echo "| ④ Glossary TopN 非标准译法 | $GL_VIOL | 0 | $([ "$GL_VIOL" -eq 0 ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_Glossary 加载 \`$GL_TERMS\` 条术语（含标准译法 + allowed_aliases 白名单）_" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ④ Glossary TopN 非标准译法 | N/A | 0 | ⚪ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f /tmp/hardcoded-audit.json ]; then
            HC_TOTAL=$(node -e "console.log(require('/tmp/hardcoded-audit.json').total || 0)")
            HC_NS=$(node -e "console.log(require('/tmp/hardcoded-audit.json').namespaces_scanned || 0)")
            echo "| ⑤ 源码硬编码 CJK（UI only） | $HC_TOTAL | 0 | $([ "$HC_TOTAL" -eq 0 ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_扫描范围：\`apps/web/src\` 下全部 TS/TSX（含 pages/ / components/，已排除 locales / test / stories / mock / type-only 声明）；扫描 \`$HC_NS\` 个顶层模块_" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ⑤ 源码硬编码 CJK（UI only） | N/A | 0 | ⚪ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f /tmp/i18n-audit.json ]; then
            # 假 en 值按类型
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 假 en 值类型分布" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('/tmp/i18n-audit.json');
              const t = d.fake_en.by_type;
              if (Object.keys(t).length === 0) {
                console.log('_全部清零_');
              } else {
                console.log('| 类型 | 数量 |');
                console.log('|------|------|');
                Object.entries(t).sort((a,b)=>b[1]-a[1]).forEach(([k,v]) => console.log('|', k, '|', v, '|'));
              }
            " >> $GITHUB_STEP_SUMMARY

            # key 不一致按子类型
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Key 不一致明细" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('/tmp/i18n-audit.json').key_mismatch;
              console.log('| 子项 | 数量 |');
              console.log('|------|------|');
              console.log('| en 缺 key |', d.missing_in_en, '|');
              console.log('| zh 缺 key |', d.missing_in_zh, '|');
              console.log('| en 空值 |', d.empty_in_en, '|');
              console.log('| zh 空值 |', d.empty_in_zh, '|');
            " >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f /tmp/glossary-audit.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Glossary 违规 Top 词条 / Top 命名空间" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('/tmp/glossary-audit.json');
              const t = Object.entries(d.by_term || {});
              const n = Object.entries(d.by_ns || {});
              if (t.length === 0 && n.length === 0) {
                console.log('_100% 一致，无违规_');
              } else {
                if (t.length > 0) {
                  console.log('');
                  console.log('**Top 违规词条**');
                  console.log('| 中文词条 | 违规数 |');
                  console.log('|----------|--------|');
                  t.slice(0, 10).forEach(([k, v]) => console.log('|', k, '|', v, '|'));
                }
                if (n.length > 0) {
                  console.log('');
                  console.log('**Top 违规命名空间**');
                  console.log('| 命名空间 | 违规数 |');
                  console.log('|----------|--------|');
                  n.slice(0, 10).forEach(([k, v]) => console.log('|', k, '|', v, '|'));
                }
                if (d.samples && d.samples.length > 0) {
                  console.log('');
                  console.log('**样本**');
                  console.log('| 命名空间 | 词条 | 标准译法 | 实际译法 |');
                  console.log('|----------|------|----------|----------|');
                  d.samples.slice(0, 10).forEach(s => console.log('|', s.ns, '|', s.zh_term, '|', s.standard_en, '|', s.actual_en, '|'));
                }
              }
            " >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f /tmp/hardcoded-audit.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 硬编码 CJK Top 违规模块 / 详情样本" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('/tmp/hardcoded-audit.json');
              const sm = Object.entries(d.top_submodules || {});
              const det = d.details || [];
              if (sm.length === 0 && det.length === 0) {
                console.log('_全部清零_');
              } else {
                if (sm.length > 0) {
                  console.log('');
                  console.log('**Top 30 违规子模块**');
                  console.log('| 子模块 | 违规数 |');
                  console.log('|--------|--------|');
                  sm.slice(0, 30).forEach(([k, v]) => console.log('|', k, '|', v, '|'));
                }
                if (det.length > 0) {
                  console.log('');
                  console.log('**前 30 条详情样本**');
                  console.log('| 文件 | 行 | 内容 |');
                  console.log('|------|----|------|');
                  det.slice(0, 30).forEach(s => console.log('|', s.file, '|', s.line, '|', s.content, '|'));
                }
              }
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run i18n 质量门禁 (strict 模式)
        run: node scripts/ci/check-i18n-quality.cjs --strict

      - name: Run Glossary 一致性门禁 (strict 模式)
        run: node scripts/ci/verify-glossary.cjs --strict

      - name: Run Hardcoded CJK 门禁 (strict 模式 · 全量)
        run: node scripts/i18n/scan-hardcoded-precise.cjs --strict --details 50

  # ──────────────────────────────────────────────────────────────────────────
  # 权限矩阵三向验证（Perm-Gate）— 后端路由 × 前端导航 × 权限常量
  #
  # 6 rules:
  #   R1/R2/R3 = FAIL (--fail-fast on CI = threshold=1 for each: R1,R2,R3 ≥1 → red)
  #   R4/R5/R6 = WARN (never red · visible only in summary JSON + step logs)
  #
  # Integrity L2 FATAL → always exit=2 red even in dry-run.
  # Guardian Vitest also runs R1≤0/R2≤0/R3≤0 in frontend-test job as
  # Layer-2 never-rebound safety net (R1/R2/R3 三项清零后永久 0 容忍基线).
  # ──────────────────────────────────────────────────────────────────────────
  permission-matrix-gate:
    name: Permission Matrix 3-Way Gate (Perm-Gate)
    needs: changes
    if: needs.changes.outputs.permission == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Perm-Gate (report-json + fail-fast @ baseline thresholds)
        run: |
          # Baseline thresholds = MAX ALLOWED (inclusive):
          #   R1=0, R2=0, R3=0 — R1/R2 清零 + R3 清零后最终基线（2026-08-17 R3攻坚完成）
          #   (previous: R1=8/R2=12 frozen 2026-08-16; then R1/R2 tightened to 0 on 2026-08-17; R3=1018→0)
          # count > threshold → exit 1 → CI red (PR blocked).
          # Known violations are allowed; only NEW regressions that INCREASE
          # R1/R2/R3 beyond baseline block merging.
          node scripts/ci/check-permission-matrix.cjs \
            --fail-fast \
            --thresholds '{"R1":0,"R2":0,"R3":0}' \
            --report-json=/tmp/perm-gate-ci.json
          PERM_EXIT=$?
          if [ $PERM_EXIT -ne 0 ]; then
            echo "Perm-Gate exit=$PERM_EXIT — failing the job"
            exit $PERM_EXIT
          fi

      - name: Write Perm-Gate summary
        if: always()
        run: |
          echo "## Permission Matrix 3-Way Gate (Perm-Gate)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/perm-gate-ci.json ]; then
            node -e "
              const j = require('/tmp/perm-gate-ci.json');
              console.log('### Integrity L2 (anti-false-green)');
              console.log('| Check | Result |');
              console.log('|-------|--------|');
              console.log('| Integrity PASS |', j.integrity && j.integrity.passed ? '✅' : '❌', '|');
              console.log('');
              console.log('### Scanner coverage');
              console.log('| Metric | Value | Min threshold |');
              console.log('|--------|-------|---------------|');
              Object.entries(j.scanners || {}).forEach(([k,v]) => {
                const mins = {
                  scannedBackendFiles: 50,
                  scannedFrontendConfigs: 20,
                  totalBackendCodes: 25,
                  totalFrontendNavCodes: 100
                };
                const min = mins[k];
                const ok = min ? v >= min : true;
                console.log('|', k, '|', v, '|', (min ?? 'n/a'), ok ? '✅' : '⚠️', '|');
              });
              console.log('');
              console.log('### 6 Rules vs Baseline');
              console.log('| Rule | Count | Level | Baseline max | Status |');
              console.log('|------|-------|-------|--------------|--------|');
              const bl = { R1: 8, R2: 12, R3: 1018, R4: null, R5: null, R6: null };
              const lvl = { R1: 'FAIL', R2: 'FAIL', R3: 'FAIL', R4: 'WARN', R5: 'WARN', R6: 'WARN' };
              [1,2,3,4,5,6].forEach(i => {
                const r = 'R'+i, c = j.summary[r], base = bl[r] ?? '∞';
                const under = bl[r] !== null ? c <= bl[r] : true;
                console.log('|', r, '|', c, '|', lvl[r], '|', base, '|', under ? (bl[r]!==null?'✅':'♾️') : '❌ > baseline', '|');
              });
              console.log('');
              console.log('**Top failures (FAIL-level, first 30):**');
              console.log('');
              console.log('| Rule | File:Line | Code | Message |');
              console.log('|------|-----------|------|---------|');
              (j.failures || []).slice(0,30).forEach(f => {
                const msg = String(f.msg||'').replace(/\\|/g, '\\\\|').slice(0,140);
                console.log('|', f.rule, '|', (f.file||'') + ':' + (f.line||''), '|', (f.code||'') , '|', msg, '|');
              });
              console.log('');
              console.log('**Top warnings (WARN-level, first 20):**');
              console.log('');
              console.log('| Rule | Message |');
              console.log('|------|---------|');
              (j.warnings || []).slice(0,20).forEach(w => {
                const msg = String(w.msg||'').replace(/\\|/g, '\\\\|').slice(0,200);
                console.log('|', w.rule, '|', msg, '|');
              });
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "_/tmp/perm-gate-ci.json not available — check Perm-Gate step logs above_" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 菜单健康门禁（Menu-Gate）— 37 模块 Route × NavItem 双向一致性
  #
  # 8 rules (T1/T2/P1/R3 = FAIL 永久 0 容忍；其余 = WARN 永不阻断)：
  #   FAIL: T1(Route缺titleKey) · T2(NavItem缺labelKey) · P1(权限码未注册) · R3(NavItem无对应Route→404)
  #   WARN: R1(路径冲突) · R2(前缀不匹配) · R4(菜单无入口) · G1(缺NavGroup) · O1(order冲突) · C1(缺code) · M1(空壳模块)
  #
  # 与 permission-matrix-gate 共享同一批变更路径（menu / permission / frontend / rust / ci）
  # CI 默认 DRY-RUN 不阻断 + 生成 JSON summary 写入 Step Summary；
  # --fail-fast 在基线阈值(T1/T2/P1/R3=0)上判定超限时 exit=1 → CI red。
  # ──────────────────────────────────────────────────────────────────────────
  menu-health-gate:
    name: Menu Health Gate (37 modules · Route×NavItem 2-way)
    needs: changes
    if: needs.changes.outputs.menu == 'true' || needs.changes.outputs.permission == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Menu-Gate (report-json + fail-fast @ baseline T1=0 T2=0 P1=0 R3=0)
        run: |
          node scripts/analyze-menu.cjs \
            --fail-fast \
            --thresholds '{"T1":0,"T2":0,"P1":0,"R3":0}' \
            --report-json=/tmp/menu-gate-ci.json \
            --quiet
          MENU_EXIT=$?
          if [ $MENU_EXIT -ne 0 ]; then
            echo "Menu-Gate exit=$MENU_EXIT — failing the job"
            exit $MENU_EXIT
          fi

      - name: Write Menu-Gate summary
        if: always()
        run: |
          echo "## Menu Health Gate (37 modules · Route × NavItem 2-way)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/menu-gate-ci.json ]; then
            node -e "
              const j = require('/tmp/menu-gate-ci.json');
              console.log('### Overview');
              console.log('| Metric | Value |');
              console.log('|--------|-------|');
              const s = j.stats || {};
              console.log('| 总模块数 |', s.totalModules ?? '-', '|');
              console.log('| Core / Plugin |', (s.coreModules?s.coreModules.length:0), '/', (s.pluginModules?s.pluginModules.length:0), '|');
              console.log('| Route 项总数 |', s.totalRoutes ?? '-', '|');
              console.log('| NavItem 项总数 |', s.totalNavItems ?? '-', '|');
              console.log('| 权限要求总数 |', s.totalPermissionsRequired ?? '-', '|');
              console.log('| 已注册权限码数 |', j.registeredPermissionsCount ?? '-', '|');
              console.log('| 菜单最大嵌套深度 |', s.maxDepth ?? '-', '|');
              console.log('| 空壳模块数 |', (j.emptyModules||[]).length, '|');
              console.log('');
              console.log('### Rules vs Baseline');
              console.log('| Rule | Level | Count | Baseline max | Status |');
              console.log('|------|-------|-------|--------------|--------|');
              (j.issues || []).forEach(x => {
                const base = x.threshold !== null && x.threshold !== undefined ? x.threshold : '∞';
                const ok = x.threshold !== null && x.threshold !== undefined ? x.count <= x.threshold : true;
                const mark = x.threshold === null ? '⚠️ WARN 不阻断' : (ok ? '✅' : '❌ > baseline');
                console.log('|', x.id, '|', x.level, '|', x.count, '|', base, '|', mark, '|');
              });
              console.log('');
              // 按模块 TOP 汇总（routes/navItems 数 Top 15）
              const ms = (j.modulesSummary || []).slice().sort((a,b)=> (b.routesCount+b.navItemsCount)-(a.routesCount+b.navItemsCount)).slice(0,15);
              if (ms.length) {
                console.log('### Top 15 模块（按 Route+NavItem 数）');
                console.log('| 模块 | source | suite | Routes | NavItems | nameKey |');
                console.log('|------|--------|-------|--------|----------|---------|');
                ms.forEach(m => {
                  console.log('|', m.code, '|', (m.source||'-'), '|', (m.suite||'-'), '|', m.routesCount, '|', m.navItemsCount, '|', (m.hasNameKey?'✅':'❌'), '|');
                });
              }
              console.log('');
              // 空壳模块
              if ((j.emptyModules||[]).length) {
                console.log('**空壳模块（无 routes/navItems）：**', j.emptyModules.join(', '));
                console.log('');
              }
              // 孤立路由 & 孤立导航
              console.log('### 双向匹配');
              console.log('- Route 有定义但菜单无入口（R4，多为详情页/创建页）：**', j.orphanRoutesCount, '** 条');
              console.log('- NavItem 有菜单但无对应 Route（R3，会 404）：**', j.orphanNavItemsCount, '** 条');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "_/tmp/menu-gate-ci.json not available — check Menu-Gate step logs above_" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # [V242 NEW Gate M] Axum 中间件层序静态校验（Layer-Order Gate）
  #
  # 3 rules:
  #   R1 = FAIL (层序反序 = tenant_middleware 在 auth_middleware 之后调用 → 500 Missing Claims)
  #   R2 = WARN (只有 auth，无 tenant — 可能绕过租户隔离)
  #   R3 = WARN (只有 tenant，无 auth — 对 build_application 模式是假阳性)
  #
  # CI 默认 DRY-RUN 不阻断（exit=0 即使 R1>0）；
  # 等 R3 假阳性消除（build_application 模式识别 + C 模式覆盖）后再启用 --fail-fast。
  # Integrity WEAK_PASS 仅提示，永不阻断。
  # ──────────────────────────────────────────────────────────────────────────
  axum-layer-gate:
    name: Axum Layer Order Gate (Gate M · R1 FAIL / R2/R3 WARN)
    needs: changes
    # rust: lib/** + svc/** + Cargo.*
    # ci: scripts/ci/** + .github/workflows/**
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: "Run Axum Layer Order Checker (R1 strict: --fail-fast R1:0, R2:3_buffered / R3 allowed)"
        run: |
          node scripts/ci/check-axum-layer-order.cjs \
            --fail-fast --thresholds=R1:0,R2:3,R3:999999 \
            --report-json=/tmp/axum-layer-report.json 2>&1 | tee /tmp/axum-layer-output.log
          EXIT_CODE=${PIPESTATUS[0]}

          echo "## Axum Layer Order Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/axum-layer-output.log ]; then
            # 只写入 summary block 部分（含分隔线和结论）
            awk '/=====/{p=1} p{print}' /tmp/axum-layer-output.log >> $GITHUB_STEP_SUMMARY || true
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/axum-layer-report.json ]; then
            cp /tmp/axum-layer-report.json axum-layer-report-ci.json
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[Download full JSON report](axum-layer-report-ci.json) · uploaded as workflow artifact below" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Exit code: $EXIT_CODE"
          exit $EXIT_CODE

  # ──────────────────────────────────────────────────────────────────────────
  # API 审计门禁（API-Audit-Gate）— P6 (Page→API) + P7 (RBAC 权限码)
  #
  # 3 FAIL 规则（永久 0 容忍，与 project_memory R1/R2/R3 对齐）：
  #   p6.red          — Page 调用了 API 字典中不存在的方法（运行时 404/500）
  #   p7.not_legal    — 前端使用了未在 PERMISSION_DEFS 注册的权限码（RBAC 绕过）
  #   p7.mismatch     — NavItem.code 与 Route.permission 不一致（菜单可见但 403）
  #
  # 3 WARN 规则（仅报告，永不阻断）：
  #   p6.yellow       — Page 期望分页结构但 API 返回非分页（需适配器兼容）
  #   p6.amber        — API 返回类型未知（多为 createCrudApi 工厂方法）
  #   p7.dead         — 已注册但前端未使用的权限码（待清理）
  #
  # CI 默认 DRY-RUN 不阻断 + 生成 JSON summary 写入 Step Summary；
  # --fail-fast 在基线阈值(p6.red=0, p7.not_legal=0, p7.mismatch=0)上判定超限时 exit=1 → CI red。
  # ──────────────────────────────────────────────────────────────────────────
  api-audit-gate:
    name: API Audit Gate (P6 Page→API + P7 RBAC)
    needs: changes
    if: needs.changes.outputs.api_audit == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run API Audit (P6 + P7, fail-fast @ baseline p6.red=0 p7.not_legal=0 p7.mismatch=0)
        run: |
          node scripts/ci/check-api-audit.cjs \
            --fail-fast \
            --thresholds '{"p6.red":0,"p7.not_legal":0,"p7.mismatch":0}' \
            --report-json=/tmp/api-audit-ci.json \
            --quiet
          AUDIT_EXIT=$?
          if [ $AUDIT_EXIT -ne 0 ]; then
            echo "API-Audit-Gate exit=$AUDIT_EXIT — failing the job"
            exit $AUDIT_EXIT
          fi

      - name: Write API-Audit summary
        if: always()
        run: |
          echo "## API Audit Gate (P6 Page→API + P7 RBAC Permission Codes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/api-audit-ci.json ]; then
            node -e "
              const j = require('/tmp/api-audit-ci.json');
              console.log('### Overview');
              console.log('| Metric | Value | Threshold | Level |');
              console.log('|--------|-------|-----------|-------|');
              (j.results || []).forEach(r => {
                const thr = r.threshold === Infinity ? '∞ (WARN)' : r.threshold;
                const mark = r.level === 'PASS' ? '✅' : (r.level === 'FAIL' ? '❌' : '⚠️');
                console.log('|', r.key, '|', r.value, '|', thr, '|', mark, r.level, '|');
              });
              console.log('');
              console.log('### P7 RBAC Coverage');
              console.log('- Legal permission codes: **', j.metrics['p7.legal_count'] ?? '-', '**');
              console.log('- Used permission codes: **', j.metrics['p7.used_count'] ?? '-', '**');
              console.log('- Coverage: **', j.metrics['p7.coverage_pct'] ?? '-', '%**');
              console.log('- Dead codes (WARN, not blocking): **', j.metrics['p7.dead'] ?? 0, '**');
              console.log('');
              // P6 RED 样本
              const p6Red = (j.samples && j.samples.p6Red) || [];
              if (p6Red.length > 0) {
                console.log('### P6 RED Samples (Page→API 方法不存在, 前 30 条)');
                console.log('| keyPath | shapes | page |');
                console.log('|---------|--------|------|');
                p6Red.forEach(c => {
                  console.log('|', c.keyPath, '|', (c.shapes || []).join(','), '|', c.page, '|');
                });
              }
              // P7 NOT_LEGAL 样本
              const p7nl = (j.samples && j.samples.p7NotLegal) || [];
              if (p7nl.length > 0) {
                console.log('');
                console.log('### P7 NOT_LEGAL Samples (未注册权限码, 前 30 条)');
                console.log('| code | usages |');
                console.log('|------|--------|');
                p7nl.forEach(x => {
                  console.log('|', x.code, '|', (x.usages || []).join(' ; '), '|');
                });
              }
              // P7 MISMATCH 样本
              const p7mm = (j.samples && j.samples.p7Mismatch) || [];
              if (p7mm.length > 0) {
                console.log('');
                console.log('### P7 MISMATCH Samples (NavItem.code ≠ Route.permission)');
                console.log('```json');
                console.log(JSON.stringify(p7mm, null, 2));
                console.log('```');
              }
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "_/tmp/api-audit-ci.json not available — check API-Audit-Gate step logs above_" >> $GITHUB_STEP_SUMMARY
          fi

  frontend-typecheck:
    name: Frontend Type Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check (tsc --noEmit)
        run: pnpm --filter topems-portal typecheck

      - name: Run type check for all shared packages
        run: |
          set -o pipefail
          mapfile -t PKGS < <(pnpm ls -r --depth -1 --json 2>/dev/null \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{JSON.parse(d).forEach(p=>{if(p.name&&p.path&&p.path.includes("/packages/"))console.log(p.name)})})' 2>/dev/null)
          echo "Packages discovered (in /packages/): ${PKGS[*]}"
          FAILED=0;TOTAL=0
          for pkg in "${PKGS[@]}"; do
            TOTAL=$((TOTAL+1))
            echo "::group::$pkg"
            if ! pnpm --filter "$pkg" exec tsc --noEmit --project tsconfig.json >/tmp/tsc_${pkg//[@\/]/_}.log 2>&1; then
              echo "❌ $pkg FAILED"; tail -10 /tmp/tsc_${pkg//[@\/]/_}.log; FAILED=$((FAILED+1))
            else echo "✅ $pkg OK"; fi
            echo "::endgroup::"
          done
          echo "Result: $((TOTAL-FAILED))/$TOTAL passed. Failures: $FAILED"
          # V246-CI-tighten-anchor: after N consecutive 0-errors runs change below to: exit $FAILED
          exit 0

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend Tests — 9 路并行分片（unit + 8 component shards）
  #
  # 旧方案在单个 job 中运行 `test:coverage`（全量测试 + 覆盖率 + 构建），
  # 导致内存峰值过高、反馈周期长（~12 min）。
  #
  # 新方案将测试拆为 9 个并行 matrix job，每个 job 只运行一个分片：
  #   - unit:    vitest run --project unit          (纯函数/工具类)
  #   - shard-N: vitest run --project component --shard=N/8  (组件/页面)
  #
  # 覆盖率和构建拆为独立 job，与测试并行执行。
  # ──────────────────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests (${{ matrix.name }})
    needs: [changes, frontend-lint, frontend-typecheck, design-system-check]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            cmd: test:unit
          - name: shard-1
            cmd: test:shard:1
          - name: shard-2
            cmd: test:shard:2
          - name: shard-3
            cmd: test:shard:3
          - name: shard-4
            cmd: test:shard:4
          - name: shard-5
            cmd: test:shard:5
          - name: shard-6
            cmd: test:shard:6
          - name: shard-7
            cmd: test:shard:7
          - name: shard-8
            cmd: test:shard:8

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch ESM modules (react-transition-group etc.)
        run: node scripts/patch-react-transition-group.js

      - name: Run tests (${{ matrix.name }})
        run: pnpm --filter topems-portal ${{ matrix.cmd }}

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend Coverage — 独立 job，与分片测试并行
  #
  # 运行全量测试并收集覆盖率。由于测试已修复 OOM 根因（useGlobalSearch mock），
  # 单进程运行稳定。NODE_OPTIONS=--max-old-space-size=4096 防止边缘 OOM。
  # ──────────────────────────────────────────────────────────────────────────
  frontend-coverage:
    name: Frontend Coverage
    needs: [changes, frontend-lint, frontend-typecheck]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch ESM modules
        run: node scripts/patch-react-transition-group.js

      - name: Run tests with coverage
        run: pnpm --filter topems-portal test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 7

      - name: Check coverage thresholds (V65 不退化门禁)
        run: |
          COVERAGE_JSON=$(cat apps/web/coverage/coverage-summary.json)
          STATEMENTS=$(echo "$COVERAGE_JSON" | jq -r '.total.statements.pct')
          BRANCHES=$(echo "$COVERAGE_JSON" | jq -r '.total.branches.pct')
          FUNCTIONS=$(echo "$COVERAGE_JSON" | jq -r '.total.functions.pct')
          LINES=$(echo "$COVERAGE_JSON" | jq -r '.total.lines.pct')

          # V65 baseline（coverage.include 扩展到 api/hooks/utils/lib/store 后的基线）
          # 允许 ±2% 波动，低于 baseline-2% 则失败
          STMT_BASELINE=13
          BRANCH_BASELINE=6
          FUNC_BASELINE=6
          LINE_BASELINE=13

          echo "## Coverage Report (V65)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage include: components + pages + api + hooks + utils + lib + store" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Baseline | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|----------|--------|" >> $GITHUB_STEP_SUMMARY

          CHECKS_PASSED=true

          if (( $(echo "$STATEMENTS >= $STMT_BASELINE" | bc -l) )); then
            echo "| Statements | $STATEMENTS% | ≥${STMT_BASELINE}% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Statements | $STATEMENTS% | ≥${STMT_BASELINE}% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$BRANCHES >= $BRANCH_BASELINE" | bc -l) )); then
            echo "| Branches | $BRANCHES% | ≥${BRANCH_BASELINE}% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Branches | $BRANCHES% | ≥${BRANCH_BASELINE}% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$FUNCTIONS >= $FUNC_BASELINE" | bc -l) )); then
            echo "| Functions | $FUNCTIONS% | ≥${FUNC_BASELINE}% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Functions | $FUNCTIONS% | ≥${FUNC_BASELINE}% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$LINES >= $LINE_BASELINE" | bc -l) )); then
            echo "| Lines | $LINES% | ≥${LINE_BASELINE}% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lines | $LINES% | ≥${LINE_BASELINE}% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          # 输出各目录覆盖率
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 各目录覆盖率" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | Statements | Branches | Functions | Lines |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------------|----------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          for DIR in components pages api hooks utils lib store; do
            DIR_DATA=$(echo "$COVERAGE_JSON" | jq -r "to_entries | map(select(.key | contains(\"/src/$DIR/\"))) | {s: (map(.value.statements.pct) | add / length), b: (map(.value.branches.pct) | add / length), f: (map(.value.functions.pct) | add / length), l: (map(.value.lines.pct) | add / length)}")
            S=$(echo "$DIR_DATA" | jq -r '.s' | awk '{printf "%.1f", $1}')
            B=$(echo "$DIR_DATA" | jq -r '.b' | awk '{printf "%.1f", $1}')
            F=$(echo "$DIR_DATA" | jq -r '.f' | awk '{printf "%.1f", $1}')
            L=$(echo "$DIR_DATA" | jq -r '.l' | awk '{printf "%.1f", $1}')
            echo "| $DIR | ${S}% | ${B}% | ${F}% | ${L}% |" >> $GITHUB_STEP_SUMMARY
          done

          if [ "$CHECKS_PASSED" = false ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Coverage regression detected!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend Build — 独立 job，与测试并行
  # ──────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Bundle Check
    needs: [changes, frontend-lint, frontend-typecheck]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch ESM modules
        run: node scripts/patch-react-transition-group.js

      - name: Build and check bundle size
        run: |
          pnpm --filter topems-portal build
          cd apps/web
          BUILD_SIZE=$(du -sh dist | cut -f1)
          BUILD_SIZE_KB=$(du -sk dist | cut -f1)

          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Build Size | $BUILD_SIZE | 5.0M | $([ $BUILD_SIZE_KB -lt 5120 ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Chunk Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chunk | Size (KB) | Threshold (KB) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|---------------|--------|" >> $GITHUB_STEP_SUMMARY

          BUNDLE_OK=true
          MAX_CHUNK_KB=500
          MAX_VENDOR_KB=2500

          for f in dist/assets/*.js; do
            [ -f "$f" ] || continue
            CHUNK_NAME=$(basename "$f" .js | sed 's/\.[a-f0-9]*$//')
            CHUNK_SIZE_KB=$(du -k "$f" | cut -f1)

            if echo "$CHUNK_NAME" | grep -q "vendor"; then
              THRESHOLD=$MAX_VENDOR_KB
            else
              THRESHOLD=$MAX_CHUNK_KB
            fi

            if [ $CHUNK_SIZE_KB -gt $THRESHOLD ]; then
              STATUS="❌"
              BUNDLE_OK=false
            else
              STATUS="✅"
            fi

            echo "| $CHUNK_NAME | $CHUNK_SIZE_KB | $THRESHOLD | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$BUNDLE_OK" = false ]; then
            echo "❌ **Bundle size thresholds exceeded! Review chunk sizes above.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All bundle chunks within size budget.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Bundle size budget check
        run: bash scripts/bundle-check.sh --json /tmp/bundle-report.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-build
          path: apps/web/dist/
          retention-days: 3

  security-scan:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit (production deps)
        run: pnpm audit --prod --audit-level=high || true

      - name: Check for secrets in code
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ✅ Completed (see logs) |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ✅ No secrets detected |" >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - rust-lint
      - fmt-check
      - clippy-check
      - rust-test
      - rust-audit
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-coverage
      - frontend-build
      - design-system-check
      - frontend-audit
      - i18n-quality-gate
      - permission-matrix-gate
      - menu-health-gate
      - axum-layer-gate
      - security-scan
      - schema-defense-gate
    if: always()
    steps:
      - name: Check all jobs passed or skipped
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Lint | ${{ needs.rust-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate J · cargo fmt workspace | ${{ needs.fmt-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate K · cargo clippy workspace | ${{ needs.clippy-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Tests | ${{ needs.rust-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Security Audit | ${{ needs.rust-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Defense Gate（26 services · strict） | ${{ needs.schema-defense-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Type Check | ${{ needs.frontend-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests (9 shards) | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Coverage | ${{ needs.frontend-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build & Bundle | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Design System Check | ${{ needs.design-system-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Audit (V64) | ${{ needs.frontend-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| i18n Quality Gate (R12 · 7-in-1: fake-en / key-align / mixed-structure / glossary / hardcoded / EN-missing / styleguide) | ${{ needs.i18n-quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Permission Matrix 3-Way Gate (R1/R2/R3 FAIL × backend×frontend×const) | ${{ needs.permission-matrix-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Menu Health Gate (37 modules · T1/T2/P1/R3 FAIL × Route×NavItem 2-way) | ${{ needs.menu-health-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Axum Layer Order Gate (Gate M · R1 FAIL / R2/R3 WARN) | ${{ needs.axum-layer-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### PR Review Checklist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] No \`console.log\` or debugger statements left in code" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] No hardcoded API URLs or secrets (use environment variables)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] New components use MUI theme tokens (no hardcoded colors)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] New pages use PageContainerV2 and ListPageTemplate/FormPageTemplate" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] API routes follow \`/api/{service}/v1/*\` format" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Business tables include \`tenant_id\` field" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Tests added for new features (coverage ≥60%)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] No circular dependencies introduced" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Bundle size did not increase significantly" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] i18n: No hardcoded CJK text in TSX + no fake EN values in locale JSON" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Menu: Routes 含 titleKey / NavItems 含 labelKey / 权限码已注册 / 无悬空 NavItem(404)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Treat "skipped" as acceptable (path-filtered jobs); only fail on failure/cancelled.
          RESULTS="${{ needs.rust-lint.result }} ${{ needs.fmt-check.result }} ${{ needs.clippy-check.result }} ${{ needs.rust-test.result }} ${{ needs.rust-audit.result }} ${{ needs.schema-defense-gate.result }} ${{ needs.frontend-lint.result }} ${{ needs.frontend-typecheck.result }} ${{ needs.frontend-test.result }} ${{ needs.frontend-coverage.result }} ${{ needs.frontend-build.result }} ${{ needs.design-system-check.result }} ${{ needs.frontend-audit.result }} ${{ needs.i18n-quality-gate.result }} ${{ needs.permission-matrix-gate.result }} ${{ needs.menu-health-gate.result }} ${{ needs.axum-layer-gate.result }} ${{ needs.security-scan.result }}"

          FAILED=false
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=true
              break
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "❌ **Some quality checks failed. Please fix the issues before merging.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All quality checks passed (or skipped due to path filter).**" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================================================
  # Schema Defense Gate（V69.4 · 四批 26 服务全覆盖 · 严格模式）
  #
  # 作用：26 服务（4 批全覆盖）启动后跑
  #       ./scripts/topems.sh db defense-check-all
  #       自动解析两阶段自检日志 + 缺列数；任何 1 列缺失 / 1 服务 build 失败
  #       → 直接标红 FAIL，并阻断合并。
  #
  # 退出码与门控行为（SCHEMA_DEFENSE_VERIFY_STRICT=true）：
  #   0 → ✅ 全通过（0 WARN / 0 ERROR）→ 放行
  #   1 → ⚠️ 有警告（存在缺列或 defense=N/A 服务）→ ❌ 阻断
  #   2 → ❌ 有错误（cargo build 失败 / 服务启动失败 / DB 连不上）→ ❌ 阻断
  #
  # 本地复现：
  #   source .env && cargo build --offline \
  #       -p topems-gis -p topems-ehs -p topems-portal -p topems-finance \
  #       -p topems-erp -p topems-hrm -p topems-crm -p topems-pm \
  #       -p topems-scm -p topems-wms -p topems-srm -p topems-pdm \
  #       -p topems-mes -p topems-qms -p topems-ai -p topems-billing \
  #       -p topems-rd -p topems-ticket -p topems-feedback \
  #       -p topems-plugin-registry -p topems-mobile \
  #       -p topems-unified-core -p topems-integration -p topems-master-data \
  #       -p topems-communication -p topems-analytics
  #   SCHEMA_DEFENSE_VERIFY_STRICT=true bash scripts/topems.sh db defense-check-all
  #
  # 依赖：Postgres 16 services 声明 + Rust nightly-2026-07-01 + sqlx
  #       单服务二进制编译 + 启动 + 自检合计 ≤ 2 min，26 服务整体 ≤ 90 min（含缓存命中）。
  # ==========================================================================
  schema-defense-gate:
    name: Schema Defense Gate（26 services · strict mode）
    needs: [changes, rust-lint]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCHEMA_DEFENSE_VERIFY_STRICT: "true"
      SQLX_OFFLINE: "false"
      DATABASE_URL: "postgresql://topems_test:topems_test_secret@localhost:5432/topems_defense"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_defense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topems_test -d topems_defense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-schema-defense-nightly-2026-07-01"

      - name: Install pg extensions + create schemas（4 批 19 schema + public 默认）
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          export PGPASSWORD=topems_test_secret
          for ext in uuid-ossp pg_trgm vector; do
            psql -h localhost -U topems_test -d topems_defense \
              -c "CREATE EXTENSION IF NOT EXISTS \"$ext\";"
          done
          # 19 个非 public schema（billing/ticket/feedback/plugin-registry/unified-core/master-data/communication 共用 public）
          for schema in \
            gis ehs portal finance \
            erp hrm crm pm scm wms srm pdm mes qms \
            ai mobile integration \
            bi rs; do
            psql -h localhost -U topems_test -d topems_defense \
              -c "CREATE SCHEMA IF NOT EXISTS $schema;"
          done

      - name: Prebuild 26 binaries（避免 defense-check-all 内逐个编译超时）
        run: |
          cargo build --offline \
            -p topems-gis \
            -p topems-ehs \
            -p topems-portal \
            -p topems-finance \
            -p topems-erp \
            -p topems-hrm \
            -p topems-crm \
            -p topems-pm \
            -p topems-scm \
            -p topems-wms \
            -p topems-srm \
            -p topems-pdm \
            -p topems-mes \
            -p topems-qms \
            -p topems-ai \
            -p topems-billing \
            -p topems-rd \
            -p topems-ticket \
            -p topems-feedback \
            -p topems-plugin-registry \
            -p topems-mobile \
            -p topems-unified-core \
            -p topems-integration \
            -p topems-master-data \
            -p topems-communication \
            -p topems-analytics

      - name: Run schema defense（26 services · strict，V69.3 + V69.4 四批全覆盖）
        id: defense
        run: |
          set +e
          bash scripts/topems.sh db defense-check-all | tee /tmp/defense-all.log
          RC=${PIPESTATUS[0]}
          set -e

          # 从日志中提取四批汇总行 + 全量汇总行写进 Step Summary
          B1=$(grep -E "第1批.*汇总：通过" /tmp/defense-all.log 2>/dev/null || echo "")
          B2=$(grep -E "第2批.*汇总：通过" /tmp/defense-all.log 2>/dev/null || echo "")
          B3=$(grep -E "第3批.*汇总：通过" /tmp/defense-all.log 2>/dev/null || echo "")
          B4=$(grep -E "第4批.*汇总：通过" /tmp/defense-all.log 2>/dev/null || echo "")
          TOTAL=$(grep -E "全量汇总.*共 2[0-9] 服务" /tmp/defense-all.log 2>/dev/null || echo "")

          extract_counts() {
              local line="$1"
              echo "$line" | grep -oE "通过 [0-9]+" | grep -oE "[0-9]+" || echo 0
          }
          PASS_COUNT=$(extract_counts "$TOTAL")
          WARN_COUNT=$(echo "$TOTAL" | grep -oE "警告 [0-9]+" | grep -oE "[0-9]+" || echo 0)
          FAIL_COUNT=$(echo "$TOTAL" | grep -oE "失败 [0-9]+" | grep -oE "[0-9]+" || echo 0)

          {
            echo "## Schema Defense Gate（26 services · strict）"
            echo ""
            echo "| 批次 | 通过 | 警告 | 失败 | 详情 |"
            echo "|------|------|------|------|------|"
            for batch_line in "$B1" "$B2" "$B3" "$B4"; do
              [ -z "$batch_line" ] && continue
              bp=$(echo "$batch_line" | grep -oE "通过 [0-9]+" | grep -oE "[0-9]+" || echo 0)
              bw=$(echo "$batch_line" | grep -oE "警告 [0-9]+" | grep -oE "[0-9]+" || echo 0)
              bf=$(echo "$batch_line" | grep -oE "失败 [0-9]+" | grep -oE "[0-9]+" || echo 0)
              bname=$(echo "$batch_line" | sed -E 's/.*(第[1-4]批[^（]*).*/\1/' || echo "-")
              echo "| $bname | $bp | $bw | $bf | $batch_line |"
            done
            echo ""
            echo "| 服务 | 状态 | 详情 |"
            echo "|------|------|------|"
            # 解析每个服务的 PASS/WARN/FAIL 染色行，去掉 ANSI 颜色码后转 Markdown
            grep -E "\[✓ PASS\]|\[⚠ WARN\]|\[✗ FAIL\]" /tmp/defense-all.log 2>/dev/null \
              | sed -E 's/\x1B\[[0-9;]*m//g' \
              | sed -E 's/.*\[✓ PASS\] ([^ ]+)  —  (.*)/| \1 | ✅ PASS | \2 |/' \
              | sed -E 's/.*\[⚠ WARN\] ([^ ]+)  —  (.*)/| \1 | ⚠️ WARN | \2 |/' \
              | sed -E 's/.*\[✗ FAIL\] ([^ ]+)  —  (.*)/| \1 | ❌ FAIL | \2 |/'
            echo ""
            echo "### 汇总（全量 26 服务）"
            echo ""
            echo "| 指标 | 值 |"
            echo "|------|----|"
            echo "| 通过 | $PASS_COUNT |"
            echo "| 警告 | $WARN_COUNT |"
            echo "| 失败 | $FAIL_COUNT |"
            echo "| 退出码 | $RC |"
            echo ""
            if [ -n "$TOTAL" ]; then
              echo "> **$TOTAL**"
              echo ""
            fi
            if [ "$RC" -ne 0 ]; then
              echo "> 📘 规范文档: docs/development/backend/database-development.md"
              echo "> 📋 本地复现: \`SCHEMA_DEFENSE_VERIFY_STRICT=true bash scripts/topems.sh db defense-check-all\`"
            fi
          } >> $GITHUB_STEP_SUMMARY

          case "$RC" in
            0)
              echo "✅ Schema Defense: 26 services ALL PASSED ($PASS_COUNT 通过 / $WARN_COUNT 警告 / $FAIL_COUNT 失败)"
              exit 0
              ;;
            1)
              echo "::warning title=Schema Defense::有警告（$WARN_COUNT 服务缺列或尚未接入 TABLE_DEFS），严格模式下阻断合并。本地复现见 Step Summary 命令。"
              echo "❌ Schema Defense: 有警告 $WARN_COUNT · strict 模式阻断"
              exit 1
              ;;
            *)
              echo "::error title=Schema Defense::有错误（$FAIL_COUNT 服务 build/启动失败）。请修复后再提交。"
              echo "❌ Schema Defense: 有错误 $FAIL_COUNT · strict 模式阻断 (exit=$RC)"
              exit 2
              ;;
          esac
