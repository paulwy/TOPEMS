name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-lint-${{ env.RUST_VERSION }}"
          shared-key: "rust-lint"

      - name: Check code format
        run: cargo fmt --check --all

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: rust-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-test-${{ env.RUST_VERSION }}"
          shared-key: "rust-test"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_test; do
            sleep 1
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-only-32chars
          APP_ENV: test
        run: cargo test --workspace --no-fail-fast

      - name: Generate test summary
        if: always()
        run: |
          echo "## Rust Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Rust tests executed successfully." >> $GITHUB_STEP_SUMMARY

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter topems-portal lint
        continue-on-error: false

  design-system-check:
    name: Design System Token Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens package
        run: pnpm --filter @topems/tokens build

      - name: Check token deviation
        run: node apps/web/scripts/check-token-deviation.cjs

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm --filter topems-portal typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck, design-system-check]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm --filter topems-portal test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          COVERAGE_JSON=$(cat apps/web/coverage/coverage-summary.json)
          STATEMENTS=$(echo "$COVERAGE_JSON" | jq -r '.total.statements.pct')
          BRANCHES=$(echo "$COVERAGE_JSON" | jq -r '.total.branches.pct')
          FUNCTIONS=$(echo "$COVERAGE_JSON" | jq -r '.total.functions.pct')
          LINES=$(echo "$COVERAGE_JSON" | jq -r '.total.lines.pct')
          
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          CHECKS_PASSED=true
          
          if (( $(echo "$STATEMENTS >= 60" | bc -l) )); then
            echo "| Statements | $STATEMENTS% | 60% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Statements | $STATEMENTS% | 60% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi
          
          if (( $(echo "$BRANCHES >= 50" | bc -l) )); then
            echo "| Branches | $BRANCHES% | 50% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Branches | $BRANCHES% | 50% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi
          
          if (( $(echo "$FUNCTIONS >= 60" | bc -l) )); then
            echo "| Functions | $FUNCTIONS% | 60% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Functions | $FUNCTIONS% | 60% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi
          
          if (( $(echo "$LINES >= 60" | bc -l) )); then
            echo "| Lines | $LINES% | 60% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lines | $LINES% | 60% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi
          
          if [ "$CHECKS_PASSED" = false ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Coverage thresholds not met!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Build and check bundle size
        run: |
          pnpm --filter topems-portal build
          BUILD_SIZE=$(du -sh dist | cut -f1)
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Size | $BUILD_SIZE |" >> $GITHUB_STEP_SUMMARY

      - name: Generate test summary
        if: always()
        run: |
          echo "## Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All frontend tests executed successfully." >> $GITHUB_STEP_SUMMARY
          echo "Coverage report uploaded as artifact." >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, frontend-lint, frontend-typecheck, frontend-test, design-system-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Lint | ${{ needs.rust-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Tests | ${{ needs.rust-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Type Check | ${{ needs.frontend-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Design System Check | ${{ needs.design-system-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.rust-lint.result }}" == "success" && \
                "${{ needs.rust-test.result }}" == "success" && \
                "${{ needs.frontend-lint.result }}" == "success" && \
                "${{ needs.frontend-typecheck.result }}" == "success" && \
                "${{ needs.frontend-test.result }}" == "success" && \
                "${{ needs.design-system-check.result }}" == "success" ]]; then
            echo "✅ **All quality checks passed!**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "❌ **Some quality checks failed. Please fix the issues before merging.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
