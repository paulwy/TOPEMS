name: CI

# ────────────────────────────────────────────────────────────────────────────
# 触发规则
#
# 1. push 到 main/develop 分支          → 全量 CI
# 2. PR 目标为 main/develop             → 全量 CI（含路径过滤跳过无关变更）
# 3. push v* 标签                       → 发布前验证（CI 全量 + 不取消）
# 4. 每日 02:00 UTC (10:00 北京时间)     → 夜间全量回归
# 5. 手动触发                            → 可指定分支
#
# paths-ignore: 纯文档/配置变更不触发 CI，节省 runner 资源。
#               代码变更（src/, svc/, lib/, packages/）始终触发。
# ────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Nightly 02:00 UTC (10:00 Asia/Shanghai) — 在 E2E (03:00) 之前跑完
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_rust:
        description: 'Skip Rust jobs (faster frontend-only run)'
        required: false
        default: false
        type: boolean

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  CARGO_INCREMENTAL: 1
  # cargo-nextest 配置（更快、并行测试）
  NEXTEST_EXECS: "FIFO"
  # Prevent OOM in Node.js test / coverage processes
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      frontend: ${{ steps.decide.outputs.frontend }}
      docs: ${{ steps.decide.outputs.docs }}
      ci: ${{ steps.decide.outputs.ci }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        # schedule 和 workflow_dispatch 事件没有「变更路径」概念，
        # 跳过路径过滤，由 decide 步骤统一输出 true。
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'lib/**'
              - 'svc/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            frontend:
              - 'apps/web/**'
              - 'apps/desktop/**'
              - 'apps/mobile/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - 'eslint.config.js'
            docs:
              - 'docs/**'
              - '**/*.md'
            ci:
              - '.github/**'

      - name: Decide job execution
        id: decide
        run: |
          # schedule / workflow_dispatch / tag → 全量运行
          if [[ "${{ github.event_name }}" == "schedule" || \
                "${{ github.event_name }}" == "workflow_dispatch" || \
                "${{ github.ref_type }}" == "tag" ]]; then
            echo "rust=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "docs=true" >> $GITHUB_OUTPUT
            echo "ci=true" >> $GITHUB_OUTPUT
          else
            echo "rust=${{ steps.filter.outputs.rust }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> $GITHUB_OUTPUT
            echo "docs=${{ steps.filter.outputs.docs }}" >> $GITHUB_OUTPUT
            echo "ci=${{ steps.filter.outputs.ci }}" >> $GITHUB_OUTPUT
          fi

  rust-lint:
    name: Rust Lint
    needs: changes
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-lint-nightly-2026-07-01"

      - name: Check code format
        run: cargo fmt --check --all

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust Tests
    needs: [changes, rust-lint]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-test-nightly-2026-07-01"

      - name: Cache nextest
        uses: actions/cache@v5
        with:
          path: ~/.cache/nextest
          key: nextest-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: nextest-${{ runner.os }}-

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_test; do
            sleep 1
          done

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Verify sqlx offline cache consistency
        # 仅校验"有 query! 宏且当前代码可编译"的 package 的 .sqlx 缓存与源码是否一致
        # 失败时提示用户本地执行 `./scripts/dev/sqlx-prepare.sh -p <FAIL_PKGS>` 刷新
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
        run: ./scripts/dev/sqlx-prepare.sh --check

      - name: Quick check (quality gate, SQLX_OFFLINE=true)
        # CI 默认完全离线：只用仓库中的 .sqlx/，不需要临时起 DB 做宏检查
        # 这样即便后续 PostgreSQL/Redis 服务延迟，也不会阻断前期质量门禁
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace

      - name: Build tests with nextest
        run: cargo nextest run --workspace --no-run

      - name: Run unit tests with nextest (no database required)
        env:
          APP_ENV: test
        run: cargo nextest run --workspace -p topems-crm -p topems-qms

      - name: Run integration tests with nextest (with database)
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-only-32chars
          APP_ENV: test
        run: cargo nextest run --workspace --test-threads=4

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Run coverage for shared library
        env:
          APP_ENV: test
        run: cargo llvm-cov test -p topems-shared --html --output-dir target/llvm-cov-report

      - name: Run coverage for core services
        env:
          APP_ENV: test
        run: cargo llvm-cov test -p topems-mes -p topems-qms -p topems-erp --html --output-dir target/llvm-cov-report

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rust-coverage
          path: target/llvm-cov-report/
          retention-days: 7

      - name: Check Rust coverage thresholds
        run: |
          cargo llvm-cov report --lcov --output-path target/lcov.info

          TOTAL_COVERAGE=$(cargo llvm-cov report --summary-only | grep "Total" | awk '{print $4}' | tr -d '%')
          SHARED_COVERAGE=$(cargo llvm-cov report --summary-only -p topems-shared | grep "topems-shared" | awk '{print $4}' | tr -d '%')
          MES_COVERAGE=$(cargo llvm-cov report --summary-only -p topems-mes | grep "topems-mes" | awk '{print $4}' | tr -d '%')
          QMS_COVERAGE=$(cargo llvm-cov report --summary-only -p topems-qms | grep "topems-qms" | awk '{print $4}' | tr -d '%')
          ERP_COVERAGE=$(cargo llvm-cov report --summary-only -p topems-erp | grep "topems-erp" | awk '{print $4}' | tr -d '%')

          echo "## Rust Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Coverage | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          CHECKS_PASSED=true

          if (( $(echo "$SHARED_COVERAGE >= 60" | bc -l) )); then
            echo "| topems-shared | ${SHARED_COVERAGE}% | 60% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| topems-shared | ${SHARED_COVERAGE}% | 60% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$MES_COVERAGE >= 50" | bc -l) )); then
            echo "| topems-mes | ${MES_COVERAGE}% | 50% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| topems-mes | ${MES_COVERAGE}% | 50% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$QMS_COVERAGE >= 50" | bc -l) )); then
            echo "| topems-qms | ${QMS_COVERAGE}% | 50% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| topems-qms | ${QMS_COVERAGE}% | 50% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$ERP_COVERAGE >= 50" | bc -l) )); then
            echo "| topems-erp | ${ERP_COVERAGE}% | 50% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| topems-erp | ${ERP_COVERAGE}% | 50% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$CHECKS_PASSED" = false ]; then
            echo "❌ **Rust coverage thresholds not met!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All Rust coverage thresholds met.**" >> $GITHUB_STEP_SUMMARY
          fi

  rust-audit:
    name: Rust Security Audit
    needs: [changes, rust-test]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && !inputs.skip_rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-audit-nightly-2026-07-01"

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit (security scan)
        run: |
          echo "## Rust Security Audit (cargo-audit)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanning Cargo.lock for known Rust Security Advisory (RLSA) vulnerabilities..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # `cargo audit` exits non-zero when known RLSA vulnerabilities are found,
          # failing this job and the downstream quality gate.
          cargo audit
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| cargo audit | ✅ No known vulnerabilities |" >> $GITHUB_STEP_SUMMARY

  frontend-lint:
    name: Frontend Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter topems-portal lint

  design-system-check:
    name: Design System Token Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens package
        run: pnpm --filter @topems/tokens build

      - name: Check token deviation
        run: node apps/web/scripts/check-token-deviation.cjs

  frontend-typecheck:
    name: Frontend Type Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check (tsc --noEmit)
        run: pnpm --filter topems-portal typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend Tests — 9 路并行分片（unit + 8 component shards）
  #
  # 旧方案在单个 job 中运行 `test:coverage`（全量测试 + 覆盖率 + 构建），
  # 导致内存峰值过高、反馈周期长（~12 min）。
  #
  # 新方案将测试拆为 9 个并行 matrix job，每个 job 只运行一个分片：
  #   - unit:    vitest run --project unit          (纯函数/工具类)
  #   - shard-N: vitest run --project component --shard=N/8  (组件/页面)
  #
  # 覆盖率和构建拆为独立 job，与测试并行执行。
  # ──────────────────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests (${{ matrix.name }})
    needs: [changes, frontend-lint, frontend-typecheck, design-system-check]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            cmd: test:unit
          - name: shard-1
            cmd: test:shard:1
          - name: shard-2
            cmd: test:shard:2
          - name: shard-3
            cmd: test:shard:3
          - name: shard-4
            cmd: test:shard:4
          - name: shard-5
            cmd: test:shard:5
          - name: shard-6
            cmd: test:shard:6
          - name: shard-7
            cmd: test:shard:7
          - name: shard-8
            cmd: test:shard:8

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch ESM modules (react-transition-group etc.)
        run: node scripts/patch-react-transition-group.js

      - name: Run tests (${{ matrix.name }})
        run: pnpm --filter topems-portal ${{ matrix.cmd }}

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend Coverage — 独立 job，与分片测试并行
  #
  # 运行全量测试并收集覆盖率。由于测试已修复 OOM 根因（useGlobalSearch mock），
  # 单进程运行稳定。NODE_OPTIONS=--max-old-space-size=4096 防止边缘 OOM。
  # ──────────────────────────────────────────────────────────────────────────
  frontend-coverage:
    name: Frontend Coverage
    needs: [changes, frontend-lint, frontend-typecheck]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch ESM modules
        run: node scripts/patch-react-transition-group.js

      - name: Run tests with coverage
        run: pnpm --filter topems-portal test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 7

      - name: Check coverage thresholds
        run: |
          COVERAGE_JSON=$(cat apps/web/coverage/coverage-summary.json)
          STATEMENTS=$(echo "$COVERAGE_JSON" | jq -r '.total.statements.pct')
          BRANCHES=$(echo "$COVERAGE_JSON" | jq -r '.total.branches.pct')
          FUNCTIONS=$(echo "$COVERAGE_JSON" | jq -r '.total.functions.pct')
          LINES=$(echo "$COVERAGE_JSON" | jq -r '.total.lines.pct')

          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          CHECKS_PASSED=true

          if (( $(echo "$STATEMENTS >= 60" | bc -l) )); then
            echo "| Statements | $STATEMENTS% | 60% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Statements | $STATEMENTS% | 60% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$BRANCHES >= 50" | bc -l) )); then
            echo "| Branches | $BRANCHES% | 50% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Branches | $BRANCHES% | 50% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$FUNCTIONS >= 60" | bc -l) )); then
            echo "| Functions | $FUNCTIONS% | 60% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Functions | $FUNCTIONS% | 60% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if (( $(echo "$LINES >= 60" | bc -l) )); then
            echo "| Lines | $LINES% | 60% | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lines | $LINES% | 60% | ❌ |" >> $GITHUB_STEP_SUMMARY
            CHECKS_PASSED=false
          fi

          if [ "$CHECKS_PASSED" = false ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Coverage thresholds not met!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend Build — 独立 job，与测试并行
  # ──────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Bundle Check
    needs: [changes, frontend-lint, frontend-typecheck]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch ESM modules
        run: node scripts/patch-react-transition-group.js

      - name: Build and check bundle size
        run: |
          pnpm --filter topems-portal build
          cd apps/web
          BUILD_SIZE=$(du -sh dist | cut -f1)
          BUILD_SIZE_KB=$(du -sk dist | cut -f1)

          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Build Size | $BUILD_SIZE | 5.0M | $([ $BUILD_SIZE_KB -lt 5120 ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Chunk Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chunk | Size (KB) | Threshold (KB) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|---------------|--------|" >> $GITHUB_STEP_SUMMARY

          BUNDLE_OK=true
          MAX_CHUNK_KB=500
          MAX_VENDOR_KB=2500

          for f in dist/assets/*.js; do
            [ -f "$f" ] || continue
            CHUNK_NAME=$(basename "$f" .js | sed 's/\.[a-f0-9]*$//')
            CHUNK_SIZE_KB=$(du -k "$f" | cut -f1)

            if echo "$CHUNK_NAME" | grep -q "vendor"; then
              THRESHOLD=$MAX_VENDOR_KB
            else
              THRESHOLD=$MAX_CHUNK_KB
            fi

            if [ $CHUNK_SIZE_KB -gt $THRESHOLD ]; then
              STATUS="❌"
              BUNDLE_OK=false
            else
              STATUS="✅"
            fi

            echo "| $CHUNK_NAME | $CHUNK_SIZE_KB | $THRESHOLD | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$BUNDLE_OK" = false ]; then
            echo "❌ **Bundle size thresholds exceeded! Review chunk sizes above.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All bundle chunks within size budget.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-build
          path: apps/web/dist/
          retention-days: 3

  security-scan:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit (production deps)
        run: pnpm audit --prod --audit-level=high || true

      - name: Check for secrets in code
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ✅ Completed (see logs) |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ✅ No secrets detected |" >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - rust-lint
      - rust-test
      - rust-audit
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-coverage
      - frontend-build
      - design-system-check
      - security-scan
    if: always()
    steps:
      - name: Check all jobs passed or skipped
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Lint | ${{ needs.rust-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Tests | ${{ needs.rust-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Security Audit | ${{ needs.rust-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Type Check | ${{ needs.frontend-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests (9 shards) | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Coverage | ${{ needs.frontend-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build & Bundle | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Design System Check | ${{ needs.design-system-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### PR Review Checklist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] No \`console.log\` or debugger statements left in code" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] No hardcoded API URLs or secrets (use environment variables)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] New components use MUI theme tokens (no hardcoded colors)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] New pages use PageContainerV2 and ListPageTemplate/FormPageTemplate" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] API routes follow \`/api/{service}/v1/*\` format" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Business tables include \`tenant_id\` field" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Tests added for new features (coverage ≥60%)" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] No circular dependencies introduced" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Bundle size did not increase significantly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Treat "skipped" as acceptable (path-filtered jobs); only fail on failure/cancelled.
          RESULTS="${{ needs.rust-lint.result }} ${{ needs.rust-test.result }} ${{ needs.rust-audit.result }} ${{ needs.frontend-lint.result }} ${{ needs.frontend-typecheck.result }} ${{ needs.frontend-test.result }} ${{ needs.frontend-coverage.result }} ${{ needs.frontend-build.result }} ${{ needs.design-system-check.result }} ${{ needs.security-scan.result }}"

          FAILED=false
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=true
              break
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "❌ **Some quality checks failed. Please fix the issues before merging.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All quality checks passed (or skipped due to path filter).**" >> $GITHUB_STEP_SUMMARY
          fi
