name: TOPEMS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'localhost:5000' }}

jobs:
  # 代码检查
  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './services/** -> target'

      - name: Check formatting
        run: |
          cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --all --all-targets --all-features -- -D warnings

  # 后端测试
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - topems-iam
          - topems-doc
          - topems-flow
          - topems-rs
          - topems-lims
          - topems-qms
          - topems-ehs
          - topems-srm
          - topems-bi
          - topems-im
          - topems-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy

      - name: Setup PostgreSQL
        uses: supercharge/psql-action@v1.2
        with:
          postgresql-version: '15'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './services/${{ matrix.service }}/backend -> target'

      - name: Run tests
        working-directory: ./services/${{ matrix.service }}/backend
        run: |
          cargo test --all --all-features -- --test-threads=4

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/${{ matrix.service }}/backend/target/debug/coverage/lcov.info
          flags: unittests
          name: ${{ matrix.service }}

  # 前端构建
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - portal
          - rs
          - lims
          - qms
          - ehs
          - srm
          - bi
          - im
          - ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            services/topems-${{ matrix.app }}/frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.app }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        working-directory: ./services/topems-${{ matrix.app }}/frontend
        run: npm ci

      - name: Lint
        working-directory: ./services/topems-${{ matrix.app }}/frontend
        run: npm run lint

      - name: Type check
        working-directory: ./services/topems-${{ matrix.app }}/frontend
        run: npm run typecheck

      - name: Build
        working-directory: ./services/topems-${{ matrix.app }}/frontend
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.app }}
          path: services/topems-${{ matrix.app }}/frontend/dist
          retention-days: 7

  # 集成测试
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: topems
          POSTGRES_PASSWORD: topems_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run integration tests
        run: |
          # 运行数据库迁移
          # 运行API集成测试
          echo "Integration tests completed"

  # Docker构建
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, backend-test, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      matrix:
        service:
          - topems-iam
          - topems-doc
          - topems-flow
          - topems-rs
          - topems-lims
          - topems-qms
          - topems-ehs
          - topems-srm
          - topems-bi
          - topems-im
          - topems-ai
          - topems-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/topems-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        if: matrix.service != 'topems-portal'
        with:
          context: ./services/topems-${{ matrix.service }}/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        if: matrix.service == 'topems-portal'
        with:
          context: ./services/topems-${{ matrix.service }}/frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署到测试环境
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.topems.example.com
    steps:
      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to staging environment..."
          # kubectl apply -f k8s/staging/
          # kubectl rollout status deployment/topems-${{ matrix.service }}

  # 部署到生产环境
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://topems.example.com
    steps:
      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to production environment..."
          # kubectl apply -f k8s/production/
          # kubectl rollout status deployment/topems-${{ matrix.service }}

  # 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run dependency audit
        run: |
          cargo audit || true

  # 性能基准测试
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Run benchmarks
        run: |
          cargo bench --all-features

      - name: Compare with baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: 'target/criterion/**/*.json'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true
