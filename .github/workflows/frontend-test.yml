name: 前端测试与类型检查

# 触发条件：push 和 pull_request 事件，仅当 apps/web 目录变更时触发
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  frontend-check:
    name: 前端检查（类型 + Lint + 测试）
    runs-on: ubuntu-latest
    steps:
      # 步骤1：检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2：设置 Node.js 环境
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 步骤3：安装 pnpm 包管理器
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      # 步骤4：获取 pnpm 存储目录路径（用于缓存）
      - name: 获取 pnpm 存储目录
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 步骤5：设置 pnpm 缓存
      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-frontend-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-frontend-
            ${{ runner.os }}-pnpm-

      # 步骤6：安装项目依赖
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 步骤7：TypeScript 类型检查
      - name: TypeScript 类型检查
        run: |
          echo "=== 开始 TypeScript 类型检查 ==="
          pnpm --filter topems-portal typecheck
          echo "=== TypeScript 类型检查通过 ==="

      # 步骤8：ESLint 代码检查
      - name: ESLint 代码检查
        run: |
          echo "=== 开始 ESLint 代码检查 ==="
          pnpm --filter topems-portal lint
          echo "=== ESLint 代码检查通过 ==="

      # 步骤9：运行前端单元测试
      - name: 运行单元测试
        run: |
          echo "=== 开始运行单元测试 ==="
          pnpm --filter topems-portal test
          echo "=== 单元测试通过 ==="

      # 步骤10：生成测试覆盖率报告
      - name: 生成测试覆盖率报告
        if: success()
        run: |
          echo "=== 生成测试覆盖率报告 ==="
          pnpm --filter topems-portal test:coverage
          echo "=== 覆盖率报告生成完成 ==="

      # 步骤11：上传覆盖率报告为构建产物
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: apps/web/coverage/
          retention-days: 7

      # 步骤12：生成检查结果总结
      - name: 生成检查结果总结
        if: always()
        run: |
          echo "## 前端检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript 类型检查 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint 代码检查 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**所有前端检查已通过！**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "覆盖率报告已作为构建产物上传，保留 7 天。" >> $GITHUB_STEP_SUMMARY
