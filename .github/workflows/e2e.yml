name: E2E

# End-to-end (Playwright) workflow for TOPEMS.
#
# Triggered:
#   - On push to main / develop
#   - On pull_request targeting main / develop
#   - Manually via workflow_dispatch (with browser selector)
#   - Nightly at 03:00 UTC to catch drift in dependent services
#
# Requires the backend stack to be available. By default the workflow
# boots PostgreSQL + Redis + the Rust services in a sidecar and runs
# the Playwright suite against them.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test against'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
  schedule:
    # Nightly 03:00 UTC (11:00 Asia/Shanghai)
    - cron: '0 3 * * *'

# Cancel superseded E2E runs to save CI minutes (but never cancel nightly).
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  # Defaults for the in-CI backend
  DATABASE_URL: postgres://topems_e2e:topems_e2e_secret@localhost:5432/topems_e2e
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: e2e-jwt-secret-key-for-testing-only-32chars
  APP_ENV: e2e
  BASE_URL: http://localhost:8063
  API_BASE_URL: http://localhost:8080

jobs:
  e2e-smoke:
    name: E2E Smoke (auth + production)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_e2e
          POSTGRES_PASSWORD: topems_e2e_secret
          POSTGRES_DB: topems_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium firefox webkit

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_e2e; do
            sleep 1
          done

      - name: Run E2E tests (smoke)
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CI: 'true'
        run: |
          npx playwright test \
            --project=chromium \
            --reporter=github,html \
            tests/auth.spec.ts \
            tests/production-order.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-smoke
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results-smoke
          path: tests/e2e/test-results/
          retention-days: 7

  e2e-business:
    name: E2E Business (purchase + finance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e-smoke

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_e2e
          POSTGRES_PASSWORD: topems_e2e_secret
          POSTGRES_DB: topems_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests (business flows)
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CI: 'true'
        run: |
          npx playwright test \
            --project=chromium \
            --reporter=github,html \
            tests/purchase-order.spec.ts \
            tests/financial-voucher.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-business
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results-business
          path: tests/e2e/test-results/
          retention-days: 7

  e2e-cross-browser:
    name: E2E Cross-browser (${{ inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: e2e-business
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_e2e
          POSTGRES_PASSWORD: topems_e2e_secret
          POSTGRES_DB: topems_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm install
          if [[ "${{ inputs.browser || 'chromium' }}" == "all" ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps ${{ inputs.browser || 'chromium' }}
          fi

      - name: Run cross-browser E2E
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CI: 'true'
        run: |
          if [[ "${{ inputs.browser || 'chromium' }}" == "all" ]]; then
            npx playwright test --reporter=github,html
          else
            npx playwright test --project=${{ inputs.browser || 'chromium' }} --reporter=github,html
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-crossbrowser
          path: tests/e2e/playwright-report/
          retention-days: 7

  e2e-summary:
    name: E2E Summary
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-business, e2e-cross-browser]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke (auth + production) | ${{ needs.e2e-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Business (purchase + finance) | ${{ needs.e2e-business.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-browser | ${{ needs.e2e-cross-browser.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Playwright HTML reports and test-results are uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
