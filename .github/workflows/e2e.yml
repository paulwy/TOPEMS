name: E2E

# End-to-end (Playwright) workflow for TOPEMS.
#
# Triggered:
#   - On push to main / develop
#   - On pull_request targeting main / develop
#   - Manually via workflow_dispatch (with browser selector)
#   - Nightly at 03:00 UTC to catch drift in dependent services
#
# Requires the backend stack to be available. By default the workflow
# boots PostgreSQL + Redis + the Rust services in a sidecar and runs
# the Playwright suite against them.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test against'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
  schedule:
    # Nightly 03:00 UTC (11:00 Asia/Shanghai)
    - cron: '0 3 * * *'

# Cancel superseded E2E runs to save CI minutes (but never cancel nightly).
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  # Defaults for the in-CI backend
  DATABASE_URL: postgres://topems_e2e:topems_e2e_secret@localhost:5432/topems_e2e
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: e2e-jwt-secret-key-for-testing-only-32chars
  APP_ENV: e2e
  BASE_URL: http://localhost:8063
  API_BASE_URL: http://localhost:8080

jobs:
  e2e-smoke:
    name: E2E Smoke (auth + production)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_e2e
          POSTGRES_PASSWORD: topems_e2e_secret
          POSTGRES_DB: topems_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium firefox webkit

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_e2e; do
            sleep 1
          done

      # ── [2026-10-24 Phase D] Rust 后端启动补齐（此前 e2e 零后端，API 全打 :8080 无服务）──
      # 最小可用口径：setup-rust → 顶层迁移链 sqlx migrate → cargo build topems-server
      # → 模块化单体起于 SERVER_PORT=8080（对齐既有 API_BASE_URL，免改测试侧）→ 健康轮询。
      # 迁移口径确认（2026-10-24 第三批 P2）：全仓唯一迁移源 database/migrations（469 个版本），
      # 无 svc 级 migrations 子目录，下方 "Apply top-level migrations" 即全量重放覆盖。
      # 未覆盖（留 TODO，随后续批次补）：
      #   ①首启超管依赖 unified-core 启动自举（未设 ADMIN_INITIAL_PASSWORD 时弱默认 admin/admin123，
      #     见 svc/unified-core/src/modules/iam/mod.rs:439；e2e 用例 E2E_USERNAME/E2E_PASSWORD 即此口径）。
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-prefix: "e2e-nightly-2026-07-01"

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Apply top-level migrations
        run: sqlx migrate run --source database/migrations --database-url "$DATABASE_URL"

      - name: Build backend (topems-server monolith)
        run: SQLX_OFFLINE=true cargo build -p topems-server

      - name: Start backend on :8080
        # 服务间 SERVICE_URL 统一指向单体自身（复刻 scripts/run_monolith.sh 内嵌模式约定）。
        env:
          SERVER_PORT: "8080"
          DB_MAX_CONNECTIONS: "8"
          SEARCH_PATH: "flow, mobile, rs, erp, public, iam, shared"
          MONOLITH_SERVICE_URL: http://localhost:8080
          CRM_SERVICE_URL: http://localhost:8080
          ERP_SERVICE_URL: http://localhost:8080
          FEEDBACK_SERVICE_URL: http://localhost:8080
          FILE_SERVICE_URL: http://localhost:8080
          FINANCE_SERVICE_URL: http://localhost:8080
          HRM_SERVICE_URL: http://localhost:8080
          IAM_SERVICE_URL: http://localhost:8080
          AI_SERVICE_URL: http://localhost:8080
          BI_SERVICE_URL: http://localhost:8080
          COMMUNICATION_SERVICE_URL: http://localhost:8080
          EHS_SERVICE_URL: http://localhost:8080
          GIS_SERVICE_URL: http://localhost:8080
          INTEGRATION_SERVICE_URL: http://localhost:8080
          LIMS_SERVICE_URL: http://localhost:8080
          MASTER_DATA_SERVICE_URL: http://localhost:8080
          MES_SERVICE_URL: http://localhost:8080
          MOBILE_SERVICE_URL: http://localhost:8080
          PDM_SERVICE_URL: http://localhost:8080
          PM_SERVICE_URL: http://localhost:8080
          PORTAL_SERVICE_URL: http://localhost:8080
          RD_SERVICE_URL: http://localhost:8080
          SCM_SERVICE_URL: http://localhost:8080
          SRM_SERVICE_URL: http://localhost:8080
          DOC_SERVICE_URL: http://localhost:8080
          MONITOR_SERVICE_URL: http://localhost:8080
          NOTIFICATION_SERVICE_URL: http://localhost:8080
          QMS_SERVICE_URL: http://localhost:8080
          SEARCH_SERVICE_URL: http://localhost:8080
          TICKET_SERVICE_URL: http://localhost:8080
          WMS_SERVICE_URL: http://localhost:8080
          WORKFLOW_SERVICE_URL: http://localhost:8080
        run: nohup ./target/debug/topems-server > /tmp/topems-server.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in $(seq 1 72); do
            if curl -sf http://localhost:8080/api/server/health >/dev/null; then
              echo "✅ backend healthy after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "❌ backend not healthy in 360s; log tail:"
          tail -120 /tmp/topems-server.log
          exit 1

      - name: Run E2E tests (smoke)
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CI: 'true'
        run: |
          npx playwright test \
            --project=chromium \
            --reporter=github,html \
            tests/auth.spec.ts \
            tests/production-order.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-smoke
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results-smoke
          path: tests/e2e/test-results/
          retention-days: 7

  e2e-business:
    name: E2E Business (purchase + finance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e-smoke

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_e2e
          POSTGRES_PASSWORD: topems_e2e_secret
          POSTGRES_DB: topems_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      # ── [2026-10-24 Phase D] 同 e2e-smoke：补 Rust 后端于 :8080 ──
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache-prefix: "e2e-nightly-2026-07-01"

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Apply top-level migrations
        run: sqlx migrate run --source database/migrations --database-url "$DATABASE_URL"

      - name: Build backend (topems-server monolith)
        run: SQLX_OFFLINE=true cargo build -p topems-server

      - name: Start backend on :8080
        env:
          SERVER_PORT: "8080"
          DB_MAX_CONNECTIONS: "8"
          SEARCH_PATH: "flow, mobile, rs, erp, public, iam, shared"
          MONOLITH_SERVICE_URL: http://localhost:8080
          CRM_SERVICE_URL: http://localhost:8080
          ERP_SERVICE_URL: http://localhost:8080
          FEEDBACK_SERVICE_URL: http://localhost:8080
          FILE_SERVICE_URL: http://localhost:8080
          FINANCE_SERVICE_URL: http://localhost:8080
          HRM_SERVICE_URL: http://localhost:8080
          IAM_SERVICE_URL: http://localhost:8080
          AI_SERVICE_URL: http://localhost:8080
          BI_SERVICE_URL: http://localhost:8080
          COMMUNICATION_SERVICE_URL: http://localhost:8080
          EHS_SERVICE_URL: http://localhost:8080
          GIS_SERVICE_URL: http://localhost:8080
          INTEGRATION_SERVICE_URL: http://localhost:8080
          LIMS_SERVICE_URL: http://localhost:8080
          MASTER_DATA_SERVICE_URL: http://localhost:8080
          MES_SERVICE_URL: http://localhost:8080
          MOBILE_SERVICE_URL: http://localhost:8080
          PDM_SERVICE_URL: http://localhost:8080
          PM_SERVICE_URL: http://localhost:8080
          PORTAL_SERVICE_URL: http://localhost:8080
          RD_SERVICE_URL: http://localhost:8080
          SCM_SERVICE_URL: http://localhost:8080
          SRM_SERVICE_URL: http://localhost:8080
          DOC_SERVICE_URL: http://localhost:8080
          MONITOR_SERVICE_URL: http://localhost:8080
          NOTIFICATION_SERVICE_URL: http://localhost:8080
          QMS_SERVICE_URL: http://localhost:8080
          SEARCH_SERVICE_URL: http://localhost:8080
          TICKET_SERVICE_URL: http://localhost:8080
          WMS_SERVICE_URL: http://localhost:8080
          WORKFLOW_SERVICE_URL: http://localhost:8080
        run: nohup ./target/debug/topems-server > /tmp/topems-server.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in $(seq 1 72); do
            if curl -sf http://localhost:8080/api/server/health >/dev/null; then
              echo "✅ backend healthy after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "❌ backend not healthy in 360s; log tail:"
          tail -120 /tmp/topems-server.log
          exit 1

      - name: Run E2E tests (business flows)
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CI: 'true'
        run: |
          npx playwright test \
            --project=chromium \
            --reporter=github,html \
            tests/purchase-order.spec.ts \
            tests/financial-voucher.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-business
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results-business
          path: tests/e2e/test-results/
          retention-days: 7

  e2e-cross-browser:
    name: E2E Cross-browser (${{ inputs.browser || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: e2e-business
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_e2e
          POSTGRES_PASSWORD: topems_e2e_secret
          POSTGRES_DB: topems_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm install
          if [[ "${{ inputs.browser || 'chromium' }}" == "all" ]]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps ${{ inputs.browser || 'chromium' }}
          fi

      - name: Run cross-browser E2E
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CI: 'true'
        run: |
          if [[ "${{ inputs.browser || 'chromium' }}" == "all" ]]; then
            npx playwright test --reporter=github,html
          else
            npx playwright test --project=${{ inputs.browser || 'chromium' }} --reporter=github,html
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-crossbrowser
          path: tests/e2e/playwright-report/
          retention-days: 7

  e2e-summary:
    name: E2E Summary
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-business, e2e-cross-browser]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke (auth + production) | ${{ needs.e2e-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Business (purchase + finance) | ${{ needs.e2e-business.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-browser | ${{ needs.e2e-cross-browser.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Playwright HTML reports and test-results are uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
