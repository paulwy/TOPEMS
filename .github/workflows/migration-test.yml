name: Migration Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'svc/**/migrations/**'
      - 'database/migrations/**'
      - 'lib/src/migration*/**'
      - 'scripts/check-migrat*'
      - '.github/workflows/migration-test.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  POSTGRES_VERSION: '16'

jobs:
  migration-up-down-up:
    name: Migration Up-Down-Up Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v5

      - name: Static check — migration naming convention
        run: node scripts/check-migration-names.mjs --strict

      - name: Static check — migration integrity
        run: node scripts/check-migrations.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-01

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "migration-test-nightly-2026-07-01"

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_test; do
            sleep 1
          done

      - name: Find all migration directories
        id: find-migrations
        run: |
          echo "## Migration Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Up | Down | Up (replay) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Find all migration directories
          MIGRATION_DIRS=$(find svc -type d -name "migrations" | sort)
          
          echo "Found migration directories:"
          echo "$MIGRATION_DIRS"

      - name: Run migration tests
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
        run: |
          # Test each service's migrations
          for migration_dir in $(find svc -type d -name "migrations" | sort); do
            service=$(echo "$migration_dir" | cut -d'/' -f2)
            echo "Testing migrations for service: $service"
            
            # Reset database
            PGPASSWORD=topems_test_secret psql -h localhost -U topems_test -d topems_test -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;" || true
            PGPASSWORD=topems_test_secret psql -h localhost -U topems_test -d topems_test -c "DROP SCHEMA IF EXISTS $service CASCADE;" || true
            
            # Create schema
            PGPASSWORD=topems_test_secret psql -h localhost -U topems_test -d topems_test -c "CREATE SCHEMA IF NOT EXISTS $service;" || true
            
            # Test 1: Apply migrations (up)
            if sqlx migrate run --source "$migration_dir" --database-url "$DATABASE_URL"; then
              UP_STATUS="✅"
            else
              UP_STATUS="❌"
              echo "| $service | $UP_STATUS | ⏭️ | ⏭️ | Failed at Up |" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            
            # Test 2: Rollback migrations (down) - revert by re-running from scratch
            PGPASSWORD=topems_test_secret psql -h localhost -U topems_test -d topems_test -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;" || true
            PGPASSWORD=topems_test_secret psql -h localhost -U topems_test -d topems_test -c "DROP SCHEMA IF EXISTS $service CASCADE; CREATE SCHEMA $service;" || true
            
            # Test 3: Re-apply migrations (up replay) - verify idempotency
            if sqlx migrate run --source "$migration_dir" --database-url "$DATABASE_URL"; then
              REPLAY_STATUS="✅"
              OVERALL="✅ Pass"
            else
              REPLAY_STATUS="❌"
              OVERALL="❌ Replay Failed"
            fi
            
            echo "| $service | $UP_STATUS | N/A (revert+replay) | $REPLAY_STATUS | $OVERALL |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Test unified-core multi-tenant migrations
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
        run: |
          echo "### Multi-tenant Migration Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run the unified-core multi-tenant migration
          if sqlx migrate run --source svc/unified-core/migrations --database-url "$DATABASE_URL"; then
            echo "✅ Multi-tenant migrations applied successfully" >> $GITHUB_STEP_SUMMARY
            
            # Verify RLS is enabled on key tables
            RLS_TABLES=$(PGPASSWORD=topems_test_secret psql -h localhost -U topems_test -d topems_test -t -c "
              SELECT tablename 
              FROM pg_tables 
              WHERE schemaname IN ('core', 'hrm', 'crm', 'erp') 
              AND rowsecurity = true
              ORDER BY tablename;
            ")
            
            RLS_COUNT=$(echo "$RLS_TABLES" | wc -l)
            echo "Tables with RLS enabled: $RLS_COUNT" >> $GITHUB_STEP_SUMMARY
            
            # Verify tenant_id column exists
            TENANT_TABLES=$(PGPASSWORD=topems_test_secret psql -h localhost -U topems_test -d topems_test -t -c "
              SELECT COUNT(DISTINCT table_name) 
              FROM information_schema.columns 
              WHERE column_name = 'tenant_id' 
              AND table_schema IN ('core', 'hrm', 'crm', 'erp');
            ")
            echo "Tables with tenant_id column: $TENANT_TABLES" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Multi-tenant migrations failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Generate checksum report
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
        run: |
          echo "### Migration Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          PGPASSWORD=topems_test_secret psql -h localhost -U topems_test -d topems_test -c "
            SELECT version, description, installed_on, success 
            FROM _sqlx_migrations 
            ORDER BY version;
          " >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail on migration issues
        run: |
          # Check if any migrations failed
          if grep -q "❌" $GITHUB_STEP_SUMMARY 2>/dev/null; then
            echo "Migration tests failed!"
            exit 1
          else
            echo "✅ All migration tests passed" >> $GITHUB_STEP_SUMMARY
          fi
