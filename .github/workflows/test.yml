name: Test Suite

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems
          POSTGRES_PASSWORD: topems_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: cargo, rustc, rust-std

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            services/**/target/
            platform/**/backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust unit tests
        run: |
          echo "Running Rust unit tests..."
          for service in services/backend platform/*/backend; do
            if [ -d "$service" ] && [ -f "$service/Cargo.toml" ]; then
              echo "Testing $service"
              cd $service
              cargo test --lib -- --nocapture 2>&1 | tee test_output.log
              if ! grep -q "test result: ok" test_output.log && ! grep -q "running 0" test_output.log; then
                echo "Tests failed in $service"
                exit 1
              fi
              cd - > /dev/null
            fi
          done
        shell: bash

      - name: Setup test database schema
        run: |
          echo "Setting up test database schema..."
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -c "CREATE SCHEMA IF NOT EXISTS rs_test;"
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -c "CREATE TABLE IF NOT EXISTS rs_test.projects (id UUID PRIMARY KEY, name VARCHAR(255) NOT NULL, code VARCHAR(100) NOT NULL, description TEXT, project_type VARCHAR(100) NOT NULL, status VARCHAR(50) NOT NULL DEFAULT 'active', leader VARCHAR(255) NOT NULL, team_members JSONB, start_date TIMESTAMPTZ NOT NULL DEFAULT NOW(), end_date TIMESTAMPTZ, budget DOUBLE PRECISION, progress INTEGER NOT NULL DEFAULT 0, created_by VARCHAR(255) NOT NULL, created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW(), project_config JSONB, benefit_target JSONB, risk_level VARCHAR(50), priority INTEGER, tags TEXT[], parent_id UUID, workspace_id UUID);"
        shell: bash

      - name: Run Rust integration tests (including database tests)
        run: |
          echo "Running Rust integration tests..."
          cd services/topems-rs/backend
          cargo test --test-threads=1 2>&1 | tee test_output.log
          if ! grep -q "test result: ok" test_output.log; then
            echo "Database tests failed!"
            exit 1
          fi
          cd - > /dev/null
        shell: bash

      - name: Run Frontend unit tests
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm test -- --coverage --watchAll=false --passWithNoTests
          fi
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            services/**/target/**/*.log
            platform/**/backend/target/**/*.log
            frontend/coverage/
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems
          POSTGRES_PASSWORD: topems_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup test database schema
        run: |
          echo "Setting up test database schema..."
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -c "CREATE SCHEMA IF NOT EXISTS rs;"
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -c "CREATE SCHEMA IF NOT EXISTS rs_test;"
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -c "CREATE SCHEMA IF NOT EXISTS iam;"
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -f platform/topems-iam/backend/migrations/20260601000000_initial.sql 2>/dev/null || true
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -f services/topems-rs/backend/migrations/20260601000000_projects.sql 2>/dev/null || true
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -f services/topems-rs/backend/migrations/20260601000001_project_phases.sql 2>/dev/null || true
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -f services/topems-rs/backend/migrations/20260601000002_project_milestones.sql 2>/dev/null || true
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -f services/topems-rs/backend/migrations/20260601000003_project_members.sql 2>/dev/null || true
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -f services/topems-rs/backend/migrations/20260604000001_add_project_enhancements.sql 2>/dev/null || true
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -f services/topems-rs/backend/migrations/20260604000002_add_milestone_enhancements.sql 2>/dev/null || true
          PGPASSWORD=topems_secret psql -h localhost -U topems -d topems_test -c "CREATE TABLE IF NOT EXISTS rs_test.projects (id UUID PRIMARY KEY, name VARCHAR(255) NOT NULL, code VARCHAR(100) NOT NULL, description TEXT, project_type VARCHAR(100) NOT NULL, status VARCHAR(50) NOT NULL DEFAULT 'active', leader VARCHAR(255) NOT NULL, team_members JSONB, start_date TIMESTAMPTZ NOT NULL DEFAULT NOW(), end_date TIMESTAMPTZ, budget DOUBLE PRECISION, progress INTEGER NOT NULL DEFAULT 0, created_by VARCHAR(255) NOT NULL, created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW(), project_config JSONB, benefit_target JSONB, risk_level VARCHAR(50), priority INTEGER, tags TEXT[], parent_id UUID, workspace_id UUID);"
        shell: bash

      - name: Build backend services
        run: |
          echo "Building IAM service..."
          cd platform/topems-iam/backend
          cargo build --release
          echo "Building RS service..."
          cd ../../services/topems-rs/backend
          cargo build --release
        shell: bash

      - name: Start IAM service
        run: |
          cd platform/topems-iam/backend
          # JWT_SECRET: 测试密钥,仅用于CI环境,不用于生产环境
          DATABASE_URL=postgres://topems:topems_secret@localhost:5432/topems_test REDIS_URL=redis://localhost:6379 JWT_SECRET=test_jwt_secret_key_for_ci_testing PORT=8002 ./target/release/topems-iam &
          sleep 15
          curl -s http://localhost:8002/api/v1/health || echo "IAM service not ready yet, waiting..."
          sleep 10
          curl -s http://localhost:8002/api/v1/health
        shell: bash
        continue-on-error: true

      - name: Start RS service
        run: |
          cd services/topems-rs/backend
          DATABASE_URL=postgres://topems:topems_secret@localhost:5432/topems_test REDIS_URL=redis://localhost:6379 IAM_URL=http://localhost:8002 PORT=8000 ./target/release/topems-rs &
          sleep 15
          curl -s http://localhost:8000/api/v1/health || echo "RS service not ready yet, waiting..."
          sleep 10
          curl -s http://localhost:8000/api/v1/health
        shell: bash
        continue-on-error: true

      - name: Run integration tests
        run: |
          echo "Running RS integration tests..."
          cd services/topems-rs/backend
          cargo test --test api_tests -- --nocapture 2>&1 | tee integration_test_output.log
          if ! grep -q "test result: ok" integration_test_output.log; then
            echo "Integration tests failed!"
            cat integration_test_output.log
            exit 1
          fi
        shell: bash

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: cargo, rustc, rust-std

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
        with:
          version: latest

      - name: Generate coverage report
        run: |
          echo "Generating code coverage report..."
          cargo tarpaulin --out Xml --out Html --engine llvm
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat cobertura.xml | grep -oP 'line-rate="\K[0-9.]+' | head -1)
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc | cut -d'.' -f1)
          echo "Current coverage: ${COVERAGE_PCT}%"
          
          if [ "$COVERAGE_PCT" -lt 80 ]; then
            echo "Coverage threshold not met! Required: 80%, Current: ${COVERAGE_PCT}%"
            exit 1
          fi
          echo "Coverage threshold met!"
        shell: bash

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run benchmarks
        run: |
          echo "Running performance benchmarks..."
          for service in services/backend platform/*/backend; do
            if [ -d "$service" ] && [ -f "$service/Cargo.toml" ]; then
              echo "Benchmarking $service"
              cd $service
              cargo bench --no-run 2>&1 | tail -10
              cd - > /dev/null
            fi
          done
        shell: bash

      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            **/target/criterion/**/benchmark.json
          retention-days: 30
