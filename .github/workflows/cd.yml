name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.topems.example.com
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: ./binaries

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

      - name: Deploy to dev server
        run: |
          echo "Deploying to development environment..."
          
          # Create deployment directory
          ssh ${{ secrets.DEV_HOST }} "mkdir -p /opt/topems/dev/releases/$(date +%Y%m%d%H%M%S)"
          
          # Copy binaries
          scp -r ./binaries/* ${{ secrets.DEV_HOST }}:/opt/topems/dev/releases/current/
          scp -r ./dist/* ${{ secrets.DEV_HOST }}:/opt/topems/dev/releases/current/frontend/
          
          # Run database migrations
          ssh ${{ secrets.DEV_HOST }} "cd /opt/topems/dev && ./scripts/db_migrate.sh dev"
          
          # Restart services
          ssh ${{ secrets.DEV_HOST }} "cd /opt/topems/dev && ./scripts/deploy.sh restart"
          
          # Health check
          curl -f https://dev.topems.example.com/health || exit 1
          
          echo "Dev deployment completed successfully"
        shell: bash

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "TOPEMS Dev Deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*TOPEMS Dev Deployment*\n*Status:* ${{ job.status }}\n*Commit:* ${{ github.sha }}\n*Environment:* Development"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.topems.example.com
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    needs: deploy-dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: ./binaries

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        run: |
          echo "Deploying to staging environment..."
          
          # Create deployment directory
          ssh ${{ secrets.STAGING_HOST }} "mkdir -p /opt/topems/staging/releases/$(date +%Y%m%d%H%M%S)"
          
          # Copy binaries
          scp -r ./binaries/* ${{ secrets.STAGING_HOST }}:/opt/topems/staging/releases/current/
          scp -r ./dist/* ${{ secrets.STAGING_HOST }}:/opt/topems/staging/releases/current/frontend/
          
          # Run database migrations
          ssh ${{ secrets.STAGING_HOST }} "cd /opt/topems/staging && ./scripts/db_migrate.sh staging"
          
          # Restart services
          ssh ${{ secrets.STAGING_HOST }} "cd /opt/topems/staging && ./scripts/deploy.sh restart"
          
          # Health check
          curl -f https://staging.topems.example.com/health || exit 1
          
          echo "Staging deployment completed successfully"
        shell: bash

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "TOPEMS Staging Deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*TOPEMS Staging Deployment*\n*Status:* ${{ job.status }}\n*Commit:* ${{ github.sha }}\n*Environment:* Staging"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://topems.example.com
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    needs: deploy-staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: ./binaries

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Create backup
        run: |
          ssh ${{ secrets.PRODUCTION_HOST }} "cd /opt/topems/production && ./scripts/rollback.sh backup"
        shell: bash

      - name: Deploy to production server
        run: |
          echo "Deploying to production environment..."
          
          # Create deployment directory
          ssh ${{ secrets.PRODUCTION_HOST }} "mkdir -p /opt/topems/production/releases/$(date +%Y%m%d%H%M%S)"
          
          # Copy binaries
          scp -r ./binaries/* ${{ secrets.PRODUCTION_HOST }}:/opt/topems/production/releases/current/
          scp -r ./dist/* ${{ secrets.PRODUCTION_HOST }}:/opt/topems/production/releases/current/frontend/
          
          # Run database migrations
          ssh ${{ secrets.PRODUCTION_HOST }} "cd /opt/topems/production && ./scripts/db_migrate.sh production"
          
          # Rolling update with health check
          ssh ${{ secrets.PRODUCTION_HOST }} "cd /opt/topems/production && ./scripts/deploy.sh rolling-update"
          
          echo "Production deployment completed successfully"
        shell: bash

      - name: Verify deployment
        run: |
          ssh ${{ secrets.PRODUCTION_HOST }} "cd /opt/topems/production && ./scripts/health_check.sh"
        shell: bash

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "TOPEMS Production Deployment: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*TOPEMS Production Deployment*\n*Status:* ${{ job.status }}\n*Commit:* ${{ github.sha }}\n*Environment:* Production\n*Deployed by:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
