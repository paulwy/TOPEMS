name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: false
        type: choice
        options:
          - all
          - backend
          - frontend
          - topems-doc
          - topems-flow
          - topems-iam
          - topems-lims
          - topems-qms
          - topems-rs
          - topems-ehs
          - topems-srm
          - topems-ai
          - notification-service
          - report-service

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/topems

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
      image_tag: ${{ steps.tags.outputs.image_tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tags
        id: tags
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          else
            TAG_NAME=$(echo $GITHUB_REF | sed 's/[^a-zA-Z0-9]/-/g')
            echo "image_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Determine services to build
        id: services
        run: |
          if [ "${{ github.event.inputs.service }}" == "all" ] || [ -z "${{ github.event.inputs.service }}" ]; then
            echo "services=[\"backend\", \"frontend\", \"topems-doc\", \"topems-flow\", \"topems-iam\", \"topems-lims\", \"topems-qms\", \"topems-rs\", \"topems-ehs\", \"topems-srm\", \"topems-ai\", \"notification-service\", \"report-service\"]" >> $GITHUB_OUTPUT
          else
            echo "services=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT
          fi
        shell: bash

  build-backend:
    name: Build Backend Docker Images
    runs-on: ubuntu-latest
    needs: prepare
    if: contains(needs.prepare.outputs.services, 'backend')
    
    strategy:
      matrix:
        service: [backend, notification-service, report-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
            ${{ secrets.DOCKERHUB_USERNAME }}/topems-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_BUILD_MODE=release

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: prepare
    if: contains(needs.prepare.outputs.services, 'frontend')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
            ${{ secrets.DOCKERHUB_USERNAME }}/topems-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-platform-services:
    name: Build Platform Service Images
    runs-on: ubuntu-latest
    needs: prepare
    if: contains(needs.prepare.outputs.services, 'topems-')
    
    strategy:
      matrix:
        service: [doc, flow, iam, lims, qms, rs, ehs, srm, ai]
        include:
          - service: doc
            folder: topems-doc
          - service: flow
            folder: topems-flow
          - service: iam
            folder: topems-iam
          - service: lims
            folder: topems-lims
          - service: qms
            folder: topems-qms
          - service: rs
            folder: topems-rs
          - service: ehs
            folder: topems-ehs
          - service: srm
            folder: topems-srm
          - service: ai
            folder: topems-ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
            ${{ secrets.DOCKERHUB_USERNAME }}/topems-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push platform image
        uses: docker/build-push-action@v5
        with:
          context: platform/${{ matrix.folder }}/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_BUILD_MODE=release

  build-all-compose:
    name: Build Docker Compose Stack
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-platform-services]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create docker-compose.prod.yml
        run: |
          cat > infrastructure/docker/docker-compose.prod.yml << 'EOF'
          version: '3.8'
          
          services:
            postgres:
              image: postgres:16-alpine
              restart: always
              environment:
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                POSTGRES_DB: ${POSTGRES_DB}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - topems-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
                interval: 10s
                timeout: 5s
                retries: 5
            
            redis:
              image: redis:7-alpine
              restart: always
              volumes:
                - redis_data:/data
              networks:
                - topems-network
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 5s
                retries: 5
            
            backend:
              image: ${REGISTRY}/topems-backend:${IMAGE_TAG}
              restart: always
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              environment:
                DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
                REDIS_URL: redis://redis:6379
              networks:
                - topems-network
            
            frontend:
              image: ${REGISTRY}/topems-frontend:${IMAGE_TAG}
              restart: always
              depends_on:
                - backend
              networks:
                - topems-network
            
            # Additional services...
            
          networks:
            topems-network:
              driver: bridge
          
          volumes:
            postgres_data:
            redis_data:
          EOF
        shell: bash

      - name: Push docker-compose.prod.yml
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add infrastructure/docker/docker-compose.prod.yml
          git diff --cached --exit-code || git commit -m "Update docker-compose.prod.yml [skip ci]"
          git push
        shell: bash

  scan-images:
    name: Scan Docker Images
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/backend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
