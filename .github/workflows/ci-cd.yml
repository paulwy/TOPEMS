name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_docker:
        description: 'Skip Docker build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_PREFIX: topems

jobs:
  # ============================================================================
  # Lint Job
  # ============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}"

      - name: Run cargo fmt
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm --filter topems-portal lint

  # ============================================================================
  # Test Job
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}-test"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_test; do
            sleep 1
          done

      - name: Run Rust tests
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-only-32chars
          APP_ENV: test
        run: cargo test --all -- --test-threads=1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend type check
        run: pnpm --filter topems-portal typecheck

      - name: Run frontend tests
        run: pnpm --filter topems-portal test

  # ============================================================================
  # Build Job
  # ============================================================================
  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(git describe --tags --always)-${GITHUB_SHA:0:8}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}-build"

      - name: Build all Rust services
        run: cargo build --release --all

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend apps
        run: pnpm run build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topems-backend-${{ github.sha }}
          path: target/release/
          retention-days: 7

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topems-frontend-${{ github.sha }}
          path: |
            apps/web/dist/
            apps/core/dist/
          retention-days: 7

  # ============================================================================
  # Docker Build Matrix
  # ============================================================================
  docker-build:
    name: Build Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.skip_docker != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core services
          - service: unified-core
            path: svc/unified-core
            dockerfile: svc/unified-core/Dockerfile
            port: 8000
          - service: erp
            path: svc/erp
            dockerfile: svc/erp/Dockerfile
            port: 8010
          - service: hrm
            path: svc/hrm
            dockerfile: svc/hrm/Dockerfile
            port: 8020
          - service: crm
            path: svc/crm
            dockerfile: svc/crm/Dockerfile
            port: 8029
          - service: pm
            path: svc/pm
            dockerfile: svc/pm/Dockerfile
            port: 8023
          - service: gis
            path: svc/gis
            dockerfile: svc/gis/Dockerfile
            port: 8071
          - service: rs
            path: svc/rs
            dockerfile: svc/rs/Dockerfile
            port: 8053
          - service: scm
            path: svc/scm
            dockerfile: svc/scm/Dockerfile
            port: 8040
          - service: wms
            path: svc/wms
            dockerfile: svc/wms/Dockerfile
            port: 8041
          - service: srm
            path: svc/srm
            dockerfile: svc/srm/Dockerfile
            port: 8042
          - service: mobile
            path: svc/mobile
            dockerfile: svc/mobile/Dockerfile
            port: 8070
          - service: monitor
            path: svc/monitor
            dockerfile: svc/monitor/Dockerfile
            port: 8062
          - service: portal
            path: svc/portal
            dockerfile: svc/portal/Dockerfile
            port: 8063
          - service: ai
            path: svc/ai
            dockerfile: svc/ai/Dockerfile
            port: 8064
          - service: integration
            path: svc/integration
            dockerfile: svc/integration/Dockerfile
            port: 8072
          # Split services (with separate Dockerfiles)
          - service: mes
            path: svc/mes
            dockerfile: svc/mes/Dockerfile
            port: 8030
          - service: pdm
            path: svc/pdm
            dockerfile: svc/pdm/Dockerfile
            port: 8031
          - service: qms
            path: svc/qms
            dockerfile: svc/qms/Dockerfile
            port: 8050
          - service: lims
            path: svc/lims
            dockerfile: svc/lims/Dockerfile
            port: 8051
          - service: ehs
            path: svc/ehs
            dockerfile: svc/ehs/Dockerfile
            port: 8052
          - service: bi
            path: svc/bi
            dockerfile: svc/bi/Dockerfile
            port: 8060
          - service: report
            path: svc/report
            dockerfile: svc/report/Dockerfile
            port: 8061
        exclude:
          # Skip services without separate Dockerfiles (analytics, manufacturing, quality-assurance)
          - service: analytics
          - service: manufacturing
          - service: quality-assurance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional)
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
            RUST_VERSION=${{ env.RUST_VERSION }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 30

  # ============================================================================
  # Build Docker Images for Split Services (mes, pdm, qms, lims, ehs, bi, report)
  # These services have their own repository structure and need special handling
  # ============================================================================
  docker-build-split:
    name: Build Docker Split (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.skip_docker != 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [mes, pdm, qms, lims, ehs, bi, report]
        include:
          - service: mes
            port: 8030
          - service: pdm
            port: 8031
          - service: qms
            port: 8050
          - service: lims
            port: 8051
          - service: ehs
            port: 8052
          - service: bi
            port: 8060
          - service: report
            port: 8061

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: svc/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
            RUST_VERSION=${{ env.RUST_VERSION }}

  # ============================================================================
  # Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, docker-build, docker-build-split]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-backend-${{ github.sha }}
          path: target/release/

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-frontend-${{ github.sha }}
          path: dist/

      - name: Make artifacts executable
        run: chmod +x target/release/*

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging
        run: |
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
          
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} -p ${{ secrets.STAGING_PORT || 22 }} << 'EOF'
            set -e
            mkdir -p /opt/topems/staging/services
            mkdir -p /opt/topems/staging/web
            mkdir -p /opt/topems/staging/core-remote
            
            for service in unified-core ai analytics manufacturing quality-assurance hrm crm pm erp gis rs scm wms mobile monitor portal mes pdm qms lims ehs bi report; do
              sudo systemctl stop topems-${service}-staging 2>/dev/null || true
            done
          EOF
          
          scp -P ${{ secrets.STAGING_PORT || 22 }} target/release/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/services/
          scp -P ${{ secrets.STAGING_PORT || 22 }} -r dist/apps/web/dist/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/web/
          scp -P ${{ secrets.STAGING_PORT || 22 }} -r dist/apps/core/dist/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/core-remote/
          
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} -p ${{ secrets.STAGING_PORT || 22 }} << 'EOF'
            for service in unified-core ai analytics manufacturing quality-assurance hrm crm pm erp gis rs scm wms mobile monitor portal mes pdm qms lims ehs bi report; do
              sudo systemctl start topems-${service}-staging || true
            done
            
            sleep 10
            curl -s http://localhost:8000/health || true
          EOF

      - name: Verify deployment
        run: |
          echo "Staging deployment completed"
          echo "Services should be available at: http://${{ secrets.STAGING_HOST }}:8000/health"

  # ============================================================================
  # Deploy to Production
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, docker-build, docker-build-split]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    concurrency: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-backend-${{ github.sha }}
          path: target/release/

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-frontend-${{ github.sha }}
          path: dist/

      - name: Make artifacts executable
        run: chmod +x target/release/*

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy to production
        run: |
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
          
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} << 'EOF'
            set -e
            
            # Backup current version
            if [[ -d /opt/topems/bin ]]; then
              cp -r /opt/topems/bin /opt/topems/bin.backup.${TIMESTAMP}
            fi
            if [[ -d /opt/topems/web ]]; then
              cp -r /opt/topems/web /opt/topems/web.backup.${TIMESTAMP}
            fi
            
            for service in unified-core ai analytics manufacturing quality-assurance hrm crm pm erp gis rs scm wms mobile monitor portal mes pdm qms lims ehs bi report; do
              sudo systemctl stop topems-${service} 2>/dev/null || true
            done
          EOF
          
          scp -P ${{ secrets.PROD_PORT || 22 }} target/release/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/bin/
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} "rm -rf /opt/topems/web/*"
          scp -P ${{ secrets.PROD_PORT || 22 }} -r dist/apps/web/dist/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/web/
          scp -P ${{ secrets.PROD_PORT || 22 }} -r dist/apps/core/dist/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/core-remote/
          
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} << 'EOF'
            for service in unified-core ai analytics manufacturing quality-assurance hrm crm pm erp gis rs scm wms mobile monitor portal mes pdm qms lims ehs bi report; do
              sudo systemctl start topems-${service} || true
            done
            
            sleep 15
            curl -s https://${{ secrets.PROD_DOMAIN }}/health || true
          EOF

      - name: Verify deployment
        run: |
          echo "Production deployment completed"
          echo "Services should be available at: https://${{ secrets.PROD_DOMAIN }}/health"

  # ============================================================================
  # Notify Deployment
  # ============================================================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "Staging: ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"

      - name: Notify failure
        if: needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Staging: ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"
