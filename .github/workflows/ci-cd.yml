name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_docker:
        description: 'Skip Docker build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_PREFIX: topems

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}"

      - name: Run cargo fmt
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm --filter topems-portal lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}-test"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_test; do
            sleep 1
          done

      - name: Run Rust tests
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-only-32chars
          APP_ENV: test
        run: cargo test --all -- --test-threads=1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend type check
        run: pnpm --filter topems-portal typecheck

      - name: Run frontend tests
        run: pnpm --filter topems-portal test

  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(git describe --tags --always)-${GITHUB_SHA:0:8}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}-build"

      - name: Build all Rust services
        run: cargo build --release --all

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend apps
        run: pnpm run build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topems-backend-${{ github.sha }}
          path: target/release/
          retention-days: 7

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topems-frontend-${{ github.sha }}
          path: |
            apps/web/dist/
            apps/core/dist/
          retention-days: 7

  docker-build:
    name: Build Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.skip_docker != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: unified-core
            path: svc/unified-core
            dockerfile: svc/unified-core/Dockerfile
            port: 8000
          - service: erp
            path: svc/erp
            dockerfile: svc/erp/Dockerfile
            port: 8010
          - service: hrm
            path: svc/hrm
            dockerfile: svc/hrm/Dockerfile
            port: 8020
          - service: crm
            path: svc/crm
            dockerfile: svc/crm/Dockerfile
            port: 8029
          - service: pm
            path: svc/pm
            dockerfile: svc/pm/Dockerfile
            port: 8023
          - service: gis
            path: svc/gis
            dockerfile: svc/gis/Dockerfile
            port: 8071
          - service: rs
            path: svc/rs
            dockerfile: svc/rs/Dockerfile
            port: 8053
          - service: scm
            path: svc/scm
            dockerfile: svc/scm/Dockerfile
            port: 8040
          - service: wms
            path: svc/wms
            dockerfile: svc/wms/Dockerfile
            port: 8041
          - service: srm
            path: svc/srm
            dockerfile: svc/srm/Dockerfile
            port: 8042
          - service: mobile
            path: svc/mobile
            dockerfile: svc/mobile/Dockerfile
            port: 8070
          - service: monitor
            path: svc/monitor
            dockerfile: svc/monitor/Dockerfile
            port: 8062
          - service: portal
            path: svc/portal
            dockerfile: svc/portal/Dockerfile
            port: 8063
          - service: ai
            path: svc/ai
            dockerfile: svc/ai/Dockerfile
            port: 8064
          - service: integration
            path: svc/integration
            dockerfile: svc/integration/Dockerfile
            port: 8072
          - service: mes
            path: svc/mes
            dockerfile: svc/mes/Dockerfile
            port: 8030
          - service: pdm
            path: svc/pdm
            dockerfile: svc/pdm/Dockerfile
            port: 8031
          - service: qms
            path: svc/qms
            dockerfile: svc/qms/Dockerfile
            port: 8050
          - service: lims
            path: svc/lims
            dockerfile: svc/lims/Dockerfile
            port: 8051
          - service: ehs
            path: svc/ehs
            dockerfile: svc/ehs/Dockerfile
            port: 8052


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
            RUST_VERSION=${{ env.RUST_VERSION }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 30

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: ${{ github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') }}
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-backend-${{ github.sha }}
          path: target/release/

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-frontend-${{ github.sha }}
          path: dist/

      - name: Make artifacts executable
        run: chmod +x target/release/*

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging
        run: |
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} -p ${{ secrets.STAGING_PORT || 22 }} << 'EOF'
            set -e
            mkdir -p /opt/topems/staging/services
            mkdir -p /opt/topems/staging/web
            mkdir -p /opt/topems/staging/core-remote

            if [[ -d /opt/topems/staging/services ]]; then
              cp -r /opt/topems/staging/services /opt/topems/staging/services.backup.${TIMESTAMP}
            fi
            if [[ -d /opt/topems/staging/web ]]; then
              cp -r /opt/topems/staging/web /opt/topems/staging/web.backup.${TIMESTAMP}
            fi

            for service in unified-core ai hrm crm pm erp gis rs scm wms srm mobile monitor portal mes pdm qms lims ehs; do
              sudo systemctl stop topems-${service}-staging 2>/dev/null || true
            done
          EOF

          scp -P ${{ secrets.STAGING_PORT || 22 }} target/release/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/services/
          scp -P ${{ secrets.STAGING_PORT || 22 }} -r dist/apps/web/dist/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/web/
          scp -P ${{ secrets.STAGING_PORT || 22 }} -r dist/apps/core/dist/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/core-remote/

          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} -p ${{ secrets.STAGING_PORT || 22 }} << 'EOF'
            for service in unified-core ai hrm crm pm erp gis rs scm wms srm mobile monitor portal mes pdm qms lims ehs; do
              sudo systemctl start topems-${service}-staging || true
            done

            sleep 15

            FAILURE=false
            for port in 8000 8010 8020 8029 8023 8071 8053 8040 8041 8042 8070 8062 8063 8064 8072 8030 8031 8050 8051 8052; do
              if ! curl -s -f -m 5 http://localhost:${port}/health; then
                echo "Service on port ${port} not responding"
                FAILURE=true
              fi
            done

            if [ "$FAILURE" = true ]; then
              echo "Health check failed, rolling back..."
              for service in unified-core ai hrm crm pm erp gis rs scm wms srm mobile monitor portal mes pdm qms lims ehs; do
                sudo systemctl stop topems-${service}-staging 2>/dev/null || true
              done

              LATEST_BACKUP=$(ls -dt /opt/topems/staging/services.backup.* | head -1)
              if [[ -n "$LATEST_BACKUP" ]]; then
                cp -r "$LATEST_BACKUP" /opt/topems/staging/services
              fi

              LATEST_WEB_BACKUP=$(ls -dt /opt/topems/staging/web.backup.* | head -1)
              if [[ -n "$LATEST_WEB_BACKUP" ]]; then
                cp -r "$LATEST_WEB_BACKUP" /opt/topems/staging/web
              fi

              for service in unified-core ai hrm crm pm erp gis rs scm wms srm mobile monitor portal mes pdm qms lims ehs; do
                sudo systemctl start topems-${service}-staging || true
              done
              exit 1
            fi
          EOF

      - name: Verify deployment
        run: |
          echo "Staging deployment completed"
          echo "Services should be available at: http://${{ secrets.STAGING_HOST }}:8000/health"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') }}
    environment: production
    concurrency: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-backend-${{ github.sha }}
          path: target/release/

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-frontend-${{ github.sha }}
          path: dist/

      - name: Make artifacts executable
        run: chmod +x target/release/*

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy to production
        run: |
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} << 'EOF'
            set -e

            if [[ -d /opt/topems/bin ]]; then
              cp -r /opt/topems/bin /opt/topems/bin.backup.${TIMESTAMP}
            fi
            if [[ -d /opt/topems/web ]]; then
              cp -r /opt/topems/web /opt/topems/web.backup.${TIMESTAMP}
            fi

            for service in unified-core ai hrm crm pm erp gis rs scm wms srm mobile monitor portal mes pdm qms lims ehs; do
              sudo systemctl stop topems-${service} 2>/dev/null || true
            done
          EOF

          scp -P ${{ secrets.PROD_PORT || 22 }} target/release/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/bin/
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} "rm -rf /opt/topems/web/*"
          scp -P ${{ secrets.PROD_PORT || 22 }} -r dist/apps/web/dist/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/web/
          scp -P ${{ secrets.PROD_PORT || 22 }} -r dist/apps/core/dist/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/core-remote/

          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} << 'EOF'
            for service in unified-core ai hrm crm pm erp gis rs scm wms srm mobile monitor portal mes pdm qms lims ehs; do
              sudo systemctl start topems-${service} || true
            done

            sleep 30

            FAILURE=false
            for port in 8000 8010 8020 8029 8023 8071 8053 8040 8041 8042 8070 8062 8063 8064 8072 8030 8031 8050 8051 8052; do
              if ! curl -s -f -m 5 http://localhost:${port}/health; then
                echo "Service on port ${port} not responding"
                FAILURE=true
              fi
            done

            if [ "$FAILURE" = true ]; then
              echo "Health check failed, rolling back..."
              for service in unified-core ai hrm crm pm erp gis rs scm wms srm mobile monitor portal mes pdm qms lims ehs; do
                sudo systemctl stop topems-${service} 2>/dev/null || true
              done

              LATEST_BACKUP=$(ls -dt /opt/topems/bin.backup.* | head -1)
              if [[ -n "$LATEST_BACKUP" ]]; then
                cp -r "$LATEST_BACKUP" /opt/topems/bin
              fi

              LATEST_WEB_BACKUP=$(ls -dt /opt/topems/web.backup.* | head -1)
              if [[ -n "$LATEST_WEB_BACKUP" ]]; then
                cp -r "$LATEST_WEB_BACKUP" /opt/topems/web
              fi

              for service in unified-core ai hrm crm pm erp gis rs scm wms srm mobile monitor portal mes pdm qms lims ehs; do
                sudo systemctl start topems-${service} || true
              done
              exit 1
            fi
          EOF

      - name: Verify deployment
        run: |
          echo "Production deployment completed"
          echo "Services should be available at: https://${{ secrets.PROD_DOMAIN }}/health"

  build-desktop:
    name: Build Desktop App
    runs-on: ${{ matrix.os }}
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch') }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}-desktop-${{ matrix.os }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: pnpm --filter topems-desktop build

      - name: Build macOS app with signing
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ${{ secrets.APPLE_CERTIFICATE_PASSWORD }} build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ${{ secrets.APPLE_CERTIFICATE_PASSWORD }} build.keychain
          security import certificate.p12 -k build.keychain -P ${{ secrets.APPLE_CERTIFICATE_PASSWORD }} -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ${{ secrets.APPLE_CERTIFICATE_PASSWORD }} build.keychain
          cd apps/desktop && pnpm tauri build --target universal-apple-darwin

      - name: Build Windows app with signing
        if: matrix.os == 'windows-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          cd apps/desktop && pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: topems-desktop-macos-${{ github.sha }}
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: topems-desktop-windows-${{ github.sha }}
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, build-desktop]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success' || needs.build-desktop.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "Staging: ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"
          echo "Desktop: ${{ needs.build-desktop.result }}"

      - name: Notify failure
        if: needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure' || needs.build-desktop.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Staging: ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"
          echo "Desktop: ${{ needs.build-desktop.result }}"