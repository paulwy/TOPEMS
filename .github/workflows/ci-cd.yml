name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.78.0'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}"

      - name: Run cargo fmt
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy --all --all-targets -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}-test"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U topems_test; do
            sleep 1
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-only-32chars
          APP_ENV: test
        run: cargo test --all -- --test-threads=1

  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-${{ env.RUST_VERSION }}-build"

      - name: Build all services
        run: cargo build --release --all

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared packages
        run: |
          cd packages/shared-types
          npm install --legacy-peer-deps
          npm run build
          cd ../shared-utils
          npm install --legacy-peer-deps
          npm run build

      - name: Build core frontend module
        run: |
          cd apps/core
          npm install --legacy-peer-deps
          npm run build

      - name: Build host frontend
        run: |
          cd apps/web
          npm install --legacy-peer-deps
          npm run build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topems-backend
          path: |
            target/release/unified-core
            target/release/ai
            target/release/analytics
            target/release/manufacturing
            target/release/quality-assurance
            target/release/hrm
            target/release/crm
            target/release/pm
            target/release/erp
            target/release/gis
            target/release/rs
            target/release/scm
            target/release/wms
            target/release/mobile
            target/release/monitor
            target/release/portal
          retention-days: 7

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topems-frontend
          path: |
            apps/web/dist/
            apps/core/dist/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-backend
          path: target/release/

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-frontend
          path: dist/

      - name: Make artifacts executable
        run: chmod +x target/release/*

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging
        run: |
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
          
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} -p ${{ secrets.STAGING_PORT || 22 }} << 'EOF'
            set -e
            mkdir -p /opt/topems/staging/services
            mkdir -p /opt/topems/staging/web
            mkdir -p /opt/topems/staging/core-remote
            
            for service in unified-core ai analytics manufacturing quality-assurance hrm crm pm erp gis rs scm wms mobile monitor portal; do
              sudo systemctl stop topems-${service}-staging 2>/dev/null || true
            done
          EOF
          
          scp -P ${{ secrets.STAGING_PORT || 22 }} target/release/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/services/
          scp -P ${{ secrets.STAGING_PORT || 22 }} -r dist/apps/web/dist/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/web/
          scp -P ${{ secrets.STAGING_PORT || 22 }} -r dist/apps/core/dist/* ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/opt/topems/staging/core-remote/
          
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} -p ${{ secrets.STAGING_PORT || 22 }} << 'EOF'
            for service in unified-core ai analytics manufacturing quality-assurance hrm crm pm erp gis rs scm wms mobile monitor portal; do
              sudo systemctl start topems-${service}-staging
            done
            
            sleep 10
            curl -s http://localhost:8000/health
          EOF

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    concurrency: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-backend
          path: target/release/

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: topems-frontend
          path: dist/

      - name: Make artifacts executable
        run: chmod +x target/release/*

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy to production
        run: |
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
          
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} << 'EOF'
            set -e
            
            cp -r /opt/topems/bin /opt/topems/bin.backup.${TIMESTAMP}
            cp -r /opt/topems/web /opt/topems/web.backup.${TIMESTAMP}
            
            for service in unified-core ai analytics manufacturing quality-assurance hrm crm pm erp gis rs scm wms mobile monitor portal; do
              sudo systemctl stop topems-${service} 2>/dev/null || true
            done
          EOF
          
          scp -P ${{ secrets.PROD_PORT || 22 }} target/release/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/bin/
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} "rm -rf /opt/topems/web/*"
          scp -P ${{ secrets.PROD_PORT || 22 }} -r dist/apps/web/dist/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/web/
          scp -P ${{ secrets.PROD_PORT || 22 }} -r dist/apps/core/dist/* ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/topems/core-remote/
          
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} -p ${{ secrets.PROD_PORT || 22 }} << 'EOF'
            for service in unified-core ai analytics manufacturing quality-assurance hrm crm pm erp gis rs scm wms mobile monitor portal; do
              sudo systemctl start topems-${service}
            done
            
            sleep 15
            curl -s https://${{ secrets.PROD_DOMAIN }}/health
          EOF

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const environment = process.env.ENVIRONMENT || 'unknown';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.workflow_run?.id,
              body: `✅ Deployment successful to ${environment}!`
            });

      - name: Notify failure
        if: needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const environment = process.env.ENVIRONMENT || 'unknown';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.workflow_run?.id,
              body: `❌ Deployment failed to ${environment}!`
            });