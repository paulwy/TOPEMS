name: Code Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files_ignore: |
            **/*.md
            **/*.txt
            **/*.json
            docs/**

      - name: Check API path uniqueness
        run: |
          echo "=== Checking API path uniqueness ==="
          python scripts/check_api_duplicates_ci.py --ci
          echo "=== API path uniqueness check passed ==="

      - name: Check component naming conventions
        run: |
          echo "=== Checking component naming conventions ==="
          python scripts/check_component_naming.py --ci
          echo "=== Component naming conventions check passed ==="

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for console.log statements
        run: |
          echo "=== Checking for console.log statements ==="
          if grep -r "console\.log" apps/web/src/ --include="*.ts" --include="*.tsx" | grep -v ".test." | grep -v ".spec." | grep -v ".stories."; then
            echo "❌ Found console.log statements in source code"
            exit 1
          else
            echo "✅ No console.log statements found"
          fi

      # 防止编译器警告回归：项目近期将 Rust 编译警告从 694 清零，通过在预留模块上
      # 添加 #[allow(dead_code)] 属性实现。此步骤对 svc/ 下 allow(dead_code) 数量
      # 做基线比较，一旦新增 allow 属性导致计数超出基线，则 CI 失败，强制开发者
      # 显式更新基线 (scripts/allow_baseline.txt)，避免警告被静默吞掉。
      - name: Check allow(dead_code) baseline (prevent warning regression)
        run: |
          echo "=== Checking allow(dead_code) baseline ==="
          bash scripts/check_allow_baseline.sh
          echo "=== Allow baseline check passed ==="

      - name: Generate quality check summary
        if: always()
        run: |
          echo "## Code Quality Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Path Uniqueness | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Component Naming Conventions | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Console.log Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Allow(dead_code) Baseline | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All code quality checks passed!**" >> $GITHUB_STEP_SUMMARY