name: 后端测试与编译

# 触发条件：push 和 pull_request 事件，仅当 svc/ 或 lib/ 目录变更时触发
on:
  push:
    branches: [main, develop]
    paths:
      - 'svc/**'
      - 'lib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'svc/**'
      - 'lib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  backend-check:
    name: 后端检查（编译 + Clippy + 测试）
    runs-on: ubuntu-latest

    # 服务容器：PostgreSQL 和 Redis（用于集成测试）
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topems_test
          POSTGRES_PASSWORD: topems_test_secret
          POSTGRES_DB: topems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 步骤1：检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2：安装 Rust 工具链
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      # 步骤3：缓存 Rust 依赖（使用 rust-cache action）
      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-backend-${{ env.RUST_VERSION }}"
          shared-key: "rust-backend"
          cache-all-crates: true

      # 步骤4：安装 PostgreSQL 客户端工具
      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # 步骤5：等待 PostgreSQL 服务就绪
      - name: 等待 PostgreSQL 就绪
        run: |
          until pg_isready -h localhost -p 5432 -U topems_test; do
            sleep 1
          done
          echo "PostgreSQL is ready!"

      # 步骤6：等待 Redis 服务就绪
      - name: 等待 Redis 就绪
        run: |
          until redis-cli -h localhost -p 6379 ping; do
            sleep 1
          done
          echo "Redis is ready!"

      # 步骤7：cargo check 编译检查（快速检查代码是否能编译）
      - name: cargo check 编译检查
        run: |
          echo "=== 开始 cargo check 编译检查 ==="
          cargo check --workspace --all-targets
          echo "=== cargo check 编译检查通过 ==="

      # 步骤8：cargo fmt 代码格式检查
      - name: cargo fmt 代码格式检查
        run: |
          echo "=== 开始 cargo fmt 代码格式检查 ==="
          cargo fmt --check --all
          echo "=== cargo fmt 代码格式检查通过 ==="

      # 步骤9：cargo clippy 代码质量检查
      - name: cargo clippy 代码质量检查
        run: |
          echo "=== 开始 cargo clippy 代码质量检查 ==="
          cargo clippy --workspace --all-targets -- -D warnings
          echo "=== cargo clippy 代码质量检查通过 ==="

      # 步骤10：cargo test 运行测试
      - name: cargo test 运行测试
        env:
          DATABASE_URL: postgres://topems_test:topems_test_secret@localhost:5432/topems_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-jwt-secret-key-for-testing-only-32chars
          APP_ENV: test
        run: |
          echo "=== 开始 cargo test 运行测试 ==="
          cargo test --workspace --no-fail-fast
          echo "=== cargo test 测试通过 ==="

      # 步骤11：生成检查结果总结
      - name: 生成检查结果总结
        if: always()
        run: |
          echo "## 后端检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| cargo check 编译检查 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo fmt 代码格式 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo clippy 代码质量 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo test 单元测试 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**所有后端检查已通过！**" >> $GITHUB_STEP_SUMMARY
