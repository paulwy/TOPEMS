name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每周一 UTC 06:00 运行
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for complete scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Create gitleaks config if not exists
        run: |
          if [ ! -f .gitleaks.toml ]; then
            cat > .gitleaks.toml << 'EOF'
          title = "TOPEMS Gitleaks Config"
          
          [extend]
          useDefault = true
          
          [[rules]]
          id = "topems-jwt-secret"
          description = "JWT Secret"
          regex = '''JWT_SECRET\s*=\s*['"]([^'"]{32,})['"]'''
          tags = ["jwt", "secret"]
          
          [[rules]]
          id = "topems-database-url"
          description = "Database URL with credentials"
          regex = '''postgres://[^:]+:([^@]+)@'''
          tags = ["database", "credentials"]
          
          [[rules]]
          id = "topems-api-key"
          description = "API Key"
          regex = '''(?i)(api[_-]?key|secret[_-]?key)\s*=\s*['"]([a-zA-Z0-9]{32,})['"]'''
          tags = ["api", "key"]
          
          [allowlist]
          description = "Allowed paths"
          paths = [
            '''node_modules/''',
            '''target/''',
            '''dist/''',
            '''\.git/''',
          ]
          
          [[allowlist.regexes]]
          regex = '''test-jwt-secret-key-for-testing-only-32chars'''
          EOF
            echo "Created default .gitleaks.toml"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gitleaks-report
          path: |
            .gitleaks-report.json
            .gitleaks-report.sarif
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## Secret Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks Scan | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report available in artifacts." >> $GITHUB_STEP_SUMMARY

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate summary
        if: always()
        run: |
          echo "## Trivy Filesystem Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Results uploaded to GitHub Security tab." >> $GITHUB_STEP_SUMMARY
