  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: topems-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=topems
      - POSTGRES_PASSWORD=topems_secret
      - POSTGRES_DB=topems
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topems"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - topems-network

  # Redis Cache
  redis:
    image: redis:latest
    container_name: topems-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - topems-network

volumes:
  postgres_data:

networks:
  topems-network:
    driver: bridge
