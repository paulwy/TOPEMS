# TOPEMS Services - Docker Compose for local development
# 端口配置与 config/services.yaml 保持严格一致

services:
  # IAM/Unified Core Service (必须先启动)
  unified-core:
    image: topems/unified-core:latest
    container_name: topems-unified-core
    ports:
      - "8000:8000"
    environment:
      - CORE_PORT=8000
      - RUST_LOG=info
      - DATABASE_URL=postgres://topems:topems_secret@postgres:5432/topems
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - topems-network

  # ERP Service
