pre-commit:
  parallel: true
  commands:
    # [Gate GL] Gitleaks 内容安全第一道（2026-10-24 Phase D 仓库化）
    # 扫暂存区增量（gitleaks protect --staged），命中即阻断提交；
    # 本机未装 gitleaks 时降级 SKIP+WARN（brew install gitleaks），不阻塞团队流。
    # 注：pre-commit 整体 parallel，顺序为视觉排列语义；本钩子不依赖其他钩子产物。
    gitleaks:
      tags: security secrets
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          printf '\033[33m[Gate GL] SKIP\033[0m gitleaks 未安装（brew install gitleaks），暂存区密钥扫描跳过；可手动执行 gitleaks protect --staged .\n'
          exit 0
        fi
        gitleaks protect --staged --redact --verbose .

    # [Gate SC] Shellcheck 回归防线（P1-1 清零后固化）— 暂存变更模式
    # 无 .sh 变更即秒级跳过；有变更必须 0 告警，否则阻断提交
    shellcheck-changed:
      tags: shellcheck
      run: bash scripts/ci/check-shellcheck.sh --changed-only

    # [Gate A] Frontend lint (eslint + prettier)
    frontend-lint:
      tags: frontend lint
      run: bash scripts/ci/frontend-lint.sh
    frontend-typecheck:
      tags: frontend typecheck
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json)$' || true)
        [ -z "$STAGED" ] && exit 0
        pnpm --filter topems-portal typecheck

    # [Gate C] i18n quality (fake-en + mixed-structure)
    i18n-quality:
      tags: frontend i18n
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-i18n.cjs" ]; then
          node scripts/ci/check-i18n.cjs --mode=quality --strict
        fi

    # [Gate D] Glossary TopN consistency
    glossary-verify:
      tags: frontend i18n glossary
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json|csv)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/verify-glossary.cjs" ]; then
          node scripts/ci/verify-glossary.cjs --strict
        fi

    # [Gate E] Hardcoded CJK precise scan
    # 外部脚本避免 lefthook sh -c 内联引号冲突（Windows 兼容）
    hardcoded-precise:
      tags: frontend i18n hardcoded
      run: bash scripts/ci/check-hardcoded-precise.sh

    # [Gate F/G/R] 重型检查（cargo test / clippy）已移至 pre-push hook，
    # 避免 pre-commit 超时（cargo test --workspace 需 3-5min，clippy --all-targets 需 2-3min）。
    # pre-push 已有 cargo-fmt-check + cargo-clippy-workspace，下方补充 cargo-test-workspace。

    # [Gate Contract] 前端契约静态门禁（防「前端封装但后端未挂载」回归）
    # 秒级、零外部依赖（BFF 无需在线）；挂载锚点 svc 豁免（实测锚点登记），
    # 真 404 判定由实跑验收 scripts/dev/contract-smoke-live.py（部署前手动）兜底。
    contract-gate:
      tags: contract backend
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        python3 scripts/dev/contract-gate.py

    # [Gate OA] OpenAPI 契约 ↔ 文档同步（W6-C，2026-11-07 接线）
    # 双门禁：
    #   ① 权威 docs/api/openapi.json 的 live 覆盖（基线 docs/api/openapi-baseline-gaps.json）
    #   ② 聚合 docs/api/openapi-aggregated.json 的计数棘轮（scripts/ci/openapi-aggregated-baseline.json）
    # 存量缺口已冻结进基线（coverage 1861 missing/1075 extra；aggregated 3788/735），
    # 仅当新增路由未同步进文档时阻断；重生成入口: ./scripts/openapi/generate.sh --extract
    openapi-gate:
      tags: contract api openapi
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|^docs/api/openapi|^scripts/openapi/|^scripts/ci/check-openapi|^scripts/dev/extract-live-routes\.py$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-openapi-coverage.cjs
        node scripts/ci/check-openapi-aggregated.cjs

    # [Gate A11Y] aria-label 覆盖率（W6-D，2026-11-07 接线）
    # 存量 47 条 / 17 文件已冻结在 scripts/ci/a11y-baseline.json，
    # 仅阻断「改动文件超出基线」的新增违规（未改动文件的存量不误伤）。
    a11y-changed:
      tags: frontend a11y
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/src/(pages|components)/.*\.tsx$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-a11y.cjs --changed-only --strict --baseline scripts/ci/a11y-baseline.json

    # [Gate DT] Design Token 合规（W6-D，2026-11-07 接线）
    # 存量 42 条 / 18 文件（fixed-px-spacing 37、hardcoded-color 5）已冻结在
    # scripts/ci/design-tokens-baseline.json；仅阻断暂存文件超出基线的新增偏差。
    design-tokens-changed:
      tags: frontend design-tokens
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(apps/web|packages/shared-components)/src/.*\.(ts|tsx|css|scss)$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-design-tokens.cjs --staged --strict --baseline scripts/ci/design-tokens-baseline.json

    # [Gate G] Permission matrix 3-way gate (blocking: R1/R4/R5/R6)
    perm-matrix:
      tags: permission security
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/perm-matrix-toolkit.cjs" ]; then
          node scripts/ci/perm-matrix-toolkit.cjs ci-report
        fi

    # [Gate M] Axum Layer Order Gate (dry-run)
    axum-layer:
      tags: rust axum layer
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|toml|lock)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-axum-layer-order.cjs" ]; then
          node scripts/ci/check-axum-layer-order.cjs
        fi

    # [Gate S] SQLx offline cache integrity (V300: WARN-only → BLOCKING)
    # 历史教训：静态启发式（文件数/脏标记）抓不住"缓存缺查询"（53 个文件也曾全 PASS）。
    # 真正可靠的验证只有离线编译：SQLX_OFFLINE=true cargo check 宏服务，缓存缺失必报错。
    # 触发条件：.sql/.sqlx 变更（V538：纯 .rs 变更不再触发——重型 cargo check 27 包已由
    # pre-push 的 cargo-check-workspace SQLX_OFFLINE 全量兜底）。失败时运行
    # ./scripts/dev/sqlx-prepare.sh 刷新缓存后重提。
    sqlx-cache-freshness:
      tags: rust sqlx cache
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(sql)$|^\.sqlx/' || true)
        [ -z "$STAGED" ] && exit 0
        bash scripts/dev/sqlx-prepare.sh --check || {
          echo "❌ [Gate S] SQLx 离线缓存不完整或不一致，提交已阻断。"
          echo "   请运行: ./scripts/dev/sqlx-prepare.sh"
          echo "   然后: git add .sqlx && git commit"
          exit 1
        }

    # [Gate H] CRM contract consistency
    crm-contract:
      tags: crm contract
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/dev/check-crm-contract.mjs" ]; then
          node scripts/dev/check-crm-contract.mjs
        fi

    # [Gate I] Icon completeness + Page standardization
    icon-page:
      tags: frontend icon page
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-icons.cjs" ]; then
          node scripts/ci/check-icons.cjs --strict
        fi
        if [ -f "scripts/ci/page-audit.cjs" ]; then
          node scripts/ci/page-audit.cjs --diff --strict
        fi

    # [Gate T] 统一错误出口（V517）— 报告模式，不阻断提交
    # 背景：svc 层存量 692 处把原始 SQL/IO 错误回给客户端（307 format! 拼接 +
    #       385 处 <err>.to_string()），按基线逐步清退，故此处只报告不阻断。
    # CI 侧由 error-handling-gate（--changed-only）拦截新增。
    # 决策依据：docs/architecture/unified-error-handling-decision.md
    error-handling:
      tags: rust errors
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-error-handling.cjs" ]; then
          node scripts/ci/check-error-handling.cjs
        fi

    # [Gate V518] 桥接网完备性（B7 收尾：新增错误类型必须有 → TopemsError 桥接）
    bridge-coverage:
      tags: rust errors
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|scripts/ci/check-bridge-coverage.cjs|scripts/ci/bridge-coverage-allowlist.json' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-bridge-coverage.cjs" ]; then
          node scripts/ci/check-bridge-coverage.cjs --changed-only
        fi

    # [Gate R] RLS权限校验
    rls-permissions:
      tags: database rls security
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^scripts/db/|^database/migrations/" || true)
        [ -z "$STAGED" ] && exit 0
        # 本机 DB 使用 .env 中的自定义凭据；脚本内默认值（topems:topems_secret）与本机不一致，
        # 故从 .env 的 MIGRATE_URL 派生 DATABASE_URL（已显式提供时不覆盖）
        if [ -f .env ] && [ -z "${DATABASE_URL:-}" ]; then
          DATABASE_URL=$(sed -nE 's/^MIGRATE_URL=(.*)/\1/p' .env | head -1)
          [ -n "$DATABASE_URL" ] && export DATABASE_URL
        fi
        if [ -f "scripts/ci/check-rls-permissions.cjs" ]; then
          node scripts/ci/check-rls-permissions.cjs
        fi

    # [Gate Q] 配置单一真相源一致性校验（P0-3：services.yaml 权威 ↔ ports.env/Cargo.toml/ports.ts/vite.config/nginx.conf）
    ports-consistency:
      tags: config ports
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(config/ports.env|config/services.yaml|Cargo.toml|apps/web/src/config/ports.ts|apps/web/vite.config.ts|apps/web/nginx.conf|scripts/ci/check-config-sources.cjs)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-config-sources.cjs" ]; then
          node scripts/ci/check-config-sources.cjs --check
        fi

    # [Gate N] Large files check (>1MB) — migrated from husky #1
    # 外部脚本避免 lefthook sh -c 内联引号冲突（Windows 兼容）
    large-files:
      tags: files size
      run: bash scripts/ci/check-large-files.sh

    # [Gate SD] schema_defense 双写列名对拍止血（第三梯队方案C）
    # 触发：schema_defense 定义点或迁移变更时，全量扫描 TABLE_DEFS vs 同文件内联 CREATE 列名集合
    # 首版 WARN 不 block（新脚本先观察，稳定后去 || echo 恢复阻断）
    schema-defense-drift:
      tags: database schema
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*/schema_defense[^/]*\.rs$|^svc/.*/db/schema\.rs$|^svc/.*/models/(mod|schema_defense)\.rs$|^database/migrations/' || true)
        [ -z "$STAGED" ] && exit 0
        python3 scripts/check-schema-defense-drift.py || echo "WARN: schema_defense 双写疑似漂移（暂不阻断，见上方明细；稳定后转硬阻断）"

    # [Gate MIG] 迁移静态校验（命名/顺序/幂等/checksums 自举）
    # 注意：validate.sh 每次运行会重写 database/checksums.txt——命中时请随提交一并 git add
    # [2026-10-23 Phase D] 补入 CI 同款静态两步（ci.yml migration-test job 前置）：
    #   validate.sh 的版本顺序校验在非 STRICT 下仅 WARN，重复版本号本地漏拦（P1-26 即只在 CI 炸）。
    #   check-migrations.mjs 硬拦截重复版本号/非 .sql/改历史文件；check-migration-names.mjs --strict 管命名。
    migration-validate:
      tags: database migrations
      run: |
        set -e
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^database/migrations/.*\.sql$|^database/checksums\.txt$" || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/check-migration-names.mjs --strict
        node scripts/check-migrations.mjs
        bash scripts/migration/validate.sh

    # [Gate MIG-PROD] 定向迁移命名 + 破坏性语句守卫（prod 误跑防线，2026-11-05）
    # 触发：迁移文件 / 本组校验脚本 / 基线变更；无变更秒级跳过。
    # 既有违规由 destructive-sql-baseline.json 记录（仅报告），只有新增/修改文件阻断。
    migration-prod-guard:
      tags: database migrations
      run: |
        set -e
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^database/migrations/.*\.sql$|^database/migration_manifest\.yaml$|^scripts/ci/check-(directed|destructive)-sql\.mjs$|^scripts/ci/destructive-sql-baseline\.json$" || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-directed-migrations.mjs --changed-only
        node scripts/ci/check-destructive-sql.mjs

    # [Gate MIG-ENTRY] prod 迁移入口扫描：禁止脚本硬编码 prod DSN 直接 sqlx migrate run
    # 触发：scripts/** 或 CI workflow 变更；纯消息行/注释行/文档不计。
    prod-migration-entry:
      tags: database deploy
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^scripts/.*\.(sh|mjs|py)$|^\.github/workflows/' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-prod-migration-entry.mjs

    # [Gate MIG-BASE] 基线完整性：资产 sha256 / 锚点合法单调 / 新增迁移版本 > 锚点
    # 触发：迁移、基线或本校验脚本变更；无变更秒级跳过。
    baseline-integrity:
      tags: database migrations
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^database/(migrations|baseline)/|^scripts/ci/check-baseline-integrity\.mjs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-baseline-integrity.mjs --changed-only

    # [Gate O] Sensitive information scan — migrated from husky #2
    sensitive-info:
      tags: security secrets
      run: bash scripts/ci/check-sensitive-info.sh

    # [Gate PASSWD] 硬编码管理员/默认口令常量扫描（代码/配置，测试夹具与文档除外）
    hardcoded-passwords:
      tags: security secrets
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(sh|bash|zsh|ps1|mjs|cjs|js|ts|tsx|jsx|rs|py|toml|yaml|yml|sql)$|\.env' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-hardcoded-passwords.mjs --changed-only

    # [Gate P] API path duplicates check — migrated from husky #4（脚本已迁移 scripts/tools/，由 CI job 执行）
    # NOTE: scripts/tools/check_api_duplicates_ci.py 纯文件扫描（--ci 离线，无需 live DB）。
    # [Gate P] API Gate（check-api 三合一审计：audit+coverage+compare，dry-run 报告不阻断）
    api-gate:
      tags: api rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-api.cjs" ]; then
          node scripts/ci/check-api.cjs --mode=all --dry-run
        else
          printf '\033[33m[Gate P] WARN\033[0m scripts/ci/check-api.cjs not found, skipping api-gate check\n'
          exit 0
        fi

    # [Gate P2] Schema boundary check（Plan v1.0 §4.4 编译时边界 CI 侧强制：
    # 全量扫描 svc 裸 sqlx 查询的 schema.table 引用，跨 schema 违规阻断提交）
    # V531: 走 allowlist 感知脚本（scripts/ci/check-schema-boundary.cjs）——
    # 既有 known_gap 登记在 schema-boundary-allowlist.json，新违规仍阻断。
    boundary-gate:
      tags: boundary rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-schema-boundary.cjs" ]; then
          node scripts/ci/check-schema-boundary.cjs
        else
          printf '\033[33m[Gate P2] WARN\033[0m scripts/ci/check-schema-boundary.cjs not found, skipping boundary-gate\n'
          exit 0
        fi

    # [Gate P2a] Schema boundary PYTHON gate（与 P2 cjs 互补）：
    # cjs 只查【未被宏包裹】的裸 sqlx 调用点（per-file allowlist）；本 python 脚本按
    # 【服务→schema 归属】扫描 ALL SQL 字面量（含 only_own_schema_query! 宏内），并做
    # 无前缀表名归属解析。事实源 scripts/schema_boundary.json。两者都必须绿。
    # 临时跨 schema 条目（unified-core=D1/U1、search=阶段2治理、integration=D3/U3）已在
    # schema_boundary.json 标注 allow_temporary，阶段2 下架后撤销。
    boundary-gate-py:
      tags: boundary rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|^scripts/schema_boundary.*\.json$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/check_schema_boundary.py" ]; then
          python3 scripts/check_schema_boundary.py
        else
          printf '\033[33m[Gate P2a] WARN\033[0m scripts/check_schema_boundary.py not found, skipping boundary-gate-py\n'
          exit 0
        fi

    # [Gate P2b] API boundary check（修复建议⑨，2026-09-09 编码）：
    # 前端 apiClient.<svc> 调用路径（baseURL+path 前 3 段）必须在后端路由注册表中；
    # 预埋零消费进 allowlist（prebuilt），页面在役但后端未实现进 allowlist（known_gap，需实现）
    api-boundary-gate:
      tags: api boundary frontend
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/src/.*\.(ts|tsx)$|^svc/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-api-boundary.cjs" ]; then
          node scripts/ci/check-api-boundary.cjs
        else
          printf '\033[33m[Gate P2b] WARN\033[0m scripts/ci/check-api-boundary.cjs not found, skipping api-boundary-gate\n'
          exit 0
        fi

    # [Gate SP] schema 前缀门禁：模块 SQL 必须显式 schema.table，不依赖 search_path
    # 既存违规按 scripts/ci/schema-prefix-baseline.json 放行；新增文件/新表名阻断。
    schema-prefix:
      tags: database rust schema
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-schema-prefix.mjs --changed-only

    # [Gate SPX] search_path 自设语句门禁：业务代码禁止 SQL 内 SET search_path /
    # set_config('search_path', ...)（作用域统一由 Db 的事务级 SET LOCAL 注入）。
    # 既存违规按 scripts/ci/search-path-baseline.json 放行；新增阻断。
    search-path:
      tags: database rust schema
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^scripts/ci/check-search-path\.mjs$|^scripts/ci/search-path-baseline\.json$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-search-path.mjs --changed-only

    # [Gate PA] 绕过池调用门禁：svc/ 下禁止直接 pool.acquire（白名单带 reason）
    pool-acquire:
      tags: database rust connection
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-pool-acquire.mjs --changed-only

    # [Gate TC] 租户上下文回归门禁（W7 第二步配套）
    # R1 event_handlers 内使用 scope_system/scope_read_system；R2 modules 内直接使用 state.pool。
    # 存量按文件计数冻结在 scripts/ci/tenant-context-baseline.json（2026-11-11：R1 4 / R2 1764），
    # 只拦新增；确属系统通道的调用用 `// tenant-system: <原因>` 登记（见 lib/shared-db/src/schema.rs 模块头）。
    tenant-context:
      tags: database rls tenant
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-tenant-context.cjs --changed-only

    # [Gate Q] Hardcoded CJK in admin module (strict) — migrated from husky #8b
    i18n-hardcode-admin:
      tags: frontend i18n hardcoded
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-i18n.cjs" ]; then
          node scripts/ci/check-i18n.cjs --mode=hardcode --strict
        fi

    # [Gate MCS] Mobile 契约全量实跑回归（方向1固化，117 端点）
    # 触发：mobile 前端契约 / mobile BFF / shared-service-client 变更。
    # 安全边界（2026-11-06，与 Gate WCS 同一口径）：默认只打本机/测试（WEB_SMOKE_ENV=local，8070）；
    #   prod 仓库位/目标进程连 *_prod 默认拒绝；确需 prod 必须 ALLOW_PROD_SMOKE=1 +
    #   PROD_SMOKE_CONFIRM + PROD_SMOKE_REASON + 显式 MOBILE_BASE_URL/JWT_SECRET，且 prod 只跑 GET（不写库）。
    #   fail-closed：目标不可达/缺密钥/漏配开关时明确失败并给出可操作提示，不再静默 SKIP。
    mobile-contract-smoke:
      tags: mobile contract smoke
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(apps/mobile/src/api/|svc/mobile/src/|lib/shared-service-client/src/)' || true)
        [ -z "$STAGED" ] && exit 0
        export WEB_SMOKE_ENV="${WEB_SMOKE_ENV:-local}"
        if python3 scripts/mobile_contract_smoke.py > /tmp/mobile_smoke_precommit.log 2>&1; then
          printf '\033[32m[Gate MCS] PASS\033[0m 目标=%s（日志 /tmp/mobile_smoke_precommit.log）\n' "$WEB_SMOKE_ENV"
          grep -E '^\[mobile-smoke\]|^总计:' /tmp/mobile_smoke_precommit.log | tail -3
        else
          rc=$?
          printf '\033[31m[Gate MCS] BLOCKED (exit %s)\033[0m 目标=%s\n' "$rc" "$WEB_SMOKE_ENV"
          head -8 /tmp/mobile_smoke_precommit.log
          echo "  ..."
          tail -6 /tmp/mobile_smoke_precommit.log
          exit "$rc"
        fi

    # [Gate WCS] Web 前端契约全量实跑回归（portal 契约面）。
    # 触发：web 前端契约 / web BFF(svc/server) / shared-service-client 变更。
    # 安全边界（2026-11-06）：默认只打本机/测试（WEB_SMOKE_ENV=local，loopback）。
    #   prod 仓库位（TOPEMS_INSTANCE=prod 或 .env DATABASE_URL 指向 *_prod）默认拒绝；
    #   确需 prod 必须 ALLOW_PROD_SMOKE=1 + PROD_SMOKE_CONFIRM + PROD_SMOKE_REASON。
    #   fail-closed：目标不可达/缺密钥/漏配开关时明确失败并给出可操作提示，不再静默 SKIP。
    web-contract-smoke:
      tags: web contract smoke
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(apps/web/src/api/|apps/web/src/utils/apiPath.ts|svc/server/src/|lib/shared-service-client/src/)' || true)
        [ -z "$STAGED" ] && exit 0
        export WEB_SMOKE_ENV="${WEB_SMOKE_ENV:-local}"
        if python3 scripts/web_contract_smoke.py > /tmp/web_smoke_precommit.log 2>&1; then
          printf '\033[32m[Gate WCS] PASS\033[0m 目标=%s（日志 /tmp/web_smoke_precommit.log）\n' "$WEB_SMOKE_ENV"
          grep -E '^\[web-smoke\]|^总计:' /tmp/web_smoke_precommit.log | tail -3
        else
          rc=$?
          printf '\033[31m[Gate WCS] BLOCKED (exit %s)\033[0m 目标=%s\n' "$rc" "$WEB_SMOKE_ENV"
          head -8 /tmp/web_smoke_precommit.log
          echo "  ..."
          tail -6 /tmp/web_smoke_precommit.log
          exit "$rc"
        fi

pre-push:
  # V300: parallel:true → false。四个 cargo 命令共享 target/包缓存锁，并行会竞争
  # 导致随机失败（曾实测 cargo-test-workspace 并行失败、串行全绿）。
  # P1-4: sccache 加速——已装时自动启用（跨 check/clippy/test 命令共享编译
  #       产物，冷缓存/全量场景显著提速）；未装时静默跳过，不影响门禁语义。
  parallel: false
  commands:
    # [Gate SC] Shellcheck 全量防线（秒级，置于 cargo 门禁前快速失败）
    # P1-1 清零 195→0 后固化：任何脚本改动带告警，push 直接阻断，
    # 不浪费后续 cargo check/clippy/test 数分钟时间。
    shellcheck-workspace:
      tags: shellcheck
      run: bash scripts/ci/check-shellcheck.sh

    # [Gate B12/U9.5] 配置三方一致性（秒级）：services.yaml ↔ ports.env ↔ nginx map
    # 单一信源原则（V66.2）：任何服务/端口/路由变更导致漂移，push 直接阻断。
    config-consistency:
      tags: config
      run: python3 scripts/dev/check-config-consistency.py

    # [2026-10-29 NEW Gate] 初始化路径防复发（B 类清单更正整改）：
    # 自建 DDL（unified-core init_database）与迁移 DDL 列级对齐校验——任何一侧
    # 改列未同步即阻断（schema_defense/try_init 缺列静默失败的历史根因）。
    # 秒级成本；迁移权威 DDL 为唯一信源（database/migrations + svc/*/migrations）。
    schema-defense-check:
      tags: database migrations
      run: node scripts/migration/check-schema-defense.mjs

    # [2026-11-06 NEW Gate DRIFT] 账本 success=t 但 DDL 未落地的漂移防线：
    # 历史事故：本地/test 的 _sqlx_migrations 声称已执行 20261105140000/160000，
    #           production_orders 实际仍为 integer/numeric，导致 sqlx i64 解码失败；
    #           batch_records 还残留模板误加约束。静态校验看不见这类「记账≠结构」。
    # 判定：database/migration_drift_assertions.json 声明 source 版本 + 期望结构；
    #       仅当目标库该版本 success=t 时才比对实际列/约束/索引，失败列具体漂移项。
    # 触发：仅推送涉及 database/(migrations|baseline|postgres|init)、checksums、
    #       断言清单、scripts/migration 时运行；无关改动秒级 SKIP。
    # 成本：触发时约 0.2-0.5s（3 次 psql 查询，断言清单批量查询）；跳过 <0.1s。
    # 失败：非零退出 + [Gate DRIFT] FAILED + 修复建议；无库/无 psql fail-closed
    #       （可用 MIGRATION_DRIFT_DB_URL 指向 test 库，禁止静默 --no-verify 绕过）。
    ledger-ddl-drift:
      tags: database migrations
      run: bash scripts/ci/check-ledger-ddl-drift.sh

    # [2026-11-06 NEW Gate INSERT] 迁移 INSERT 列序/列数静态防线：
    # 历史事故：20261107000011 的 VALUES 行实际为 (code, resource, action, name, level)，
    #           但派生表别名声明为 (code, name, resource, action, level)，写入后
    #           name/resource/action 三列整体错位（纯语法合法，validate.sh 看不见）。
    # 检查：scripts/migration/check-insert-column-shape.mjs
    #   - INSERT 列清单 vs VALUES 每条元组值数、派生 VALUES 别名数 vs 值数、
    #     INSERT 列清单 vs SELECT 表达式数（确定性结构）；
    #   - core_permissions 列→值组合映射后断言 action/resource 与 code 一致（语义）。
    # 触发：仅推送涉及 database/migrations|baseline、svc/*/migrations、migrations、
    #       本检查脚本时运行；无关改动秒级 SKIP。
    # 成本：触发时静态扫描 613 文件 / 230 条 INSERT 约 0.1s；跳过 <0.1s。
    # 失败：非零退出 + [Gate INSERT] FAILED + 逐条 path:line；无 node fail-closed。
    migration-insert-shape:
      tags: database migrations
      run: bash scripts/ci/check-migration-insert-shape.sh

    # [NEW] cargo check — 增量模式（2026-11-05 修订）：只编译本次 push 变更的 crate。
    # 背景：全量 check 被 utoipa-swagger-ui build.rs 网络下载失败恒阻断 + RUSTFLAGS=-D warnings
    #       使缓存失效 → 每次 push 冷编译且必失败 → 团队长期 --no-verify 绕过门禁。
    # 增量后：无 .rs 变更秒级跳过；变更 crate 独立编译，绕开无关 crate 失败源，门禁恢复可用。
    # V300: SQLX_OFFLINE=true（离线）。.sqlx 缓存完整性由 CI 全量兜底（CI cargo-check job）。
    # [2026-10-02 修订] stale-base 检查并入本命令前置（lefthook 2.1.10 对独立
    #       stale-base-check 按 pushed files 过滤会 skip，而本命令实证必跑）——
    #       旧 base 时先拦截再编译，杜绝"门禁编译旧 base 假报错"。
    cargo-check-workspace:
      tags: rust check
      run: bash scripts/ci/check-stale-base.sh && bash scripts/ci/run-cargo-changed.sh check

    # [V232-P3 NEW Gate J] cargo fmt workspace check — Rust-only
    cargo-fmt-check:
      tags: rust fmt
      run: |
        cargo fmt --all --check

    # [V232-P3 NEW Gate K] cargo clippy — 增量模式（2026-11-05 修订）
    # 与 check 同理：只对本次 push 变更 crate 执行 clippy；无 .rs 变更秒级跳过。
    # V300: 离线模式（SQLX_OFFLINE=true）。CI rust-lint job 全量兜底。
    cargo-clippy-workspace:
      tags: rust clippy
      run: bash scripts/ci/run-cargo-changed.sh clippy
    # [V294 NEW] cargo test workspace — 重型门禁（2026-11-05 修订：默认 SKIP，CI 兜底）
    # 只跑 --lib 单元测试，不跑集成测试（集成测试需要数据库）
    # 2026-11-05：默认跳过（push 秒级放行），显式 LEFTHOOK_RUN_HEAVY=1 时执行；
    # CI（ci.yml test job）承担全量兜底。历史实测串行全量 2304s → 不再阻塞本地 push。
    cargo-test-workspace:
      tags: rust test
      timeout: 3600s
      run: |
        if [ -z "${LEFTHOOK_RUN_HEAVY:-}" ]; then
          printf '\033[33m[Gate T] SKIP\033[0m cargo-test-workspace（重型门禁：LEFTHOOK_RUN_HEAVY=1 时执行；CI 已兜底全量）\n'
          exit 0
        fi
        export SQLX_OFFLINE=true
        export RUST_TEST_THREADS=1
        # 本机 DB/Redis 使用 .env 中的自定义凭据；测试内默认值（topems:topems_secret）与本机不一致，
        # 故从 .env 派生 TEST_DATABASE_URL / REDIS_URL（已显式提供时不覆盖；.env 缺失则回退测试内默认值）
        if [ -f .env ]; then
          if [ -z "${TEST_DATABASE_URL:-}" ]; then TEST_DATABASE_URL=$(sed -nE 's/^MIGRATE_URL=(.*)/\1/p' .env | head -1); fi
          if [ -z "${REDIS_URL:-}" ]; then REDIS_URL=$(sed -nE 's/^REDIS_URL=(.*)/\1/p' .env | head -1); fi
          if [ -n "$TEST_DATABASE_URL" ]; then export TEST_DATABASE_URL; fi
          if [ -n "$REDIS_URL" ]; then export REDIS_URL; fi
        fi
        cargo test --workspace --lib

    # [2026-10-22 NEW Gate DP] 业务域运行态探活（与 contract-gate 静态挂载互补）
    # svc crate utoipa path → BFF GET 全路径 5xx 扫描（缺表/缺列/死锁等运行态缺陷）。
    # 2026-11-05：重型门禁（默认 SKIP，CI/部署机 LEFTHOOK_RUN_HEAVY=1 时执行）；
    # BFF 离线（CI/无运行态）SKIP_WARN 不阻断，手动 bash scripts/dev/domain-probe.sh 复核。
    domain-probe:
      tags: runtime probe
      timeout: 1800s
      run: |
        if [ -z "${LEFTHOOK_RUN_HEAVY:-}" ]; then
          printf '\033[33m[Gate DP] SKIP\033[0m domain-probe（重型门禁：LEFTHOOK_RUN_HEAVY=1 时执行；CI 已兜底）\n'
          exit 0
        fi
        bash scripts/dev/domain-probe.sh

    # [Gate DC] decode 契约扫描（W6-D）：交叉比对 prod 列目录与 Rust 动态解码类型
    # 依赖 /tmp/prod_cols.psv（prod 列目录只读导出）；本仓库工作流约束禁止访问生产库，
    # 缺失时 SKIP 不阻断（脚本本身仅报告、不改退出码）。生成命令见脚本文件头。
    decode-contract:
      tags: database rust contract
      run: |
        if [ ! -f /tmp/prod_cols.psv ]; then
          printf '\033[33m[Gate DC] SKIP\033[0m 缺少 /tmp/prod_cols.psv（需只读导出 prod 列目录；本约束禁止访问生产库）\n'
          exit 0
        fi
        node scripts/ci/check-decode-contract.mjs /tmp/prod_cols.psv
