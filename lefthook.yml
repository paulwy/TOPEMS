pre-commit:
  parallel: true
  commands:
    # [Gate GL] Gitleaks 内容安全第一道（2026-10-24 Phase D 仓库化）
    # 扫暂存区增量（gitleaks protect --staged），命中即阻断提交；
    # 本机未装 gitleaks 时降级 SKIP+WARN（brew install gitleaks），不阻塞团队流。
    # 注：pre-commit 整体 parallel，顺序为视觉排列语义；本钩子不依赖其他钩子产物。
    gitleaks:
      tags: security secrets
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          printf '\033[33m[Gate GL] SKIP\033[0m gitleaks 未安装（brew install gitleaks），暂存区密钥扫描跳过；可手动执行 gitleaks protect --staged .\n'
          exit 0
        fi
        gitleaks protect --staged --redact --verbose .

    # [Gate SC] Shellcheck 回归防线（P1-1 清零后固化）— 暂存变更模式
    # 无 .sh 变更即秒级跳过；有变更必须 0 告警，否则阻断提交
    shellcheck-changed:
      tags: shellcheck
      run: bash scripts/ci/check-shellcheck.sh --changed-only

    # [Gate BP] bash 变量后紧跟中文标点：set -u 下标点字节会被并入变量名，
    # 真实失败原因被掩盖成 unbound variable；shellcheck 不覆盖这一类。
    bash-var-cjk-punct:
      tags: shellcheck
      run: python3 scripts/ci/check-bash-var-cjk-punct.py --changed-only

    # [Gate A] Frontend lint (eslint + prettier)
    frontend-lint:
      tags: frontend lint
      run: bash scripts/ci/frontend-lint.sh
    frontend-typecheck:
      tags: frontend typecheck
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json)$' || true)
        [ -z "$STAGED" ] && exit 0
        pnpm --filter topems-portal typecheck

    # [Gate C] i18n quality (fake-en + mixed-structure)
    i18n-quality:
      tags: frontend i18n
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-i18n.cjs" ]; then
          node scripts/ci/check-i18n.cjs --mode=quality --strict
        fi

    # [Gate D] Glossary TopN consistency
    glossary-verify:
      tags: frontend i18n glossary
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json|csv)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/verify-glossary.cjs" ]; then
          node scripts/ci/verify-glossary.cjs --strict
        fi

    # [Gate E] Hardcoded CJK precise scan
    # 外部脚本避免 lefthook sh -c 内联引号冲突（Windows 兼容）
    hardcoded-precise:
      tags: frontend i18n hardcoded
      run: bash scripts/ci/check-hardcoded-precise.sh

    # [Gate F/G/R] 重型检查分工（2026-11-18 定稿）：
    #   pre-commit  → 只跑秒级静态门禁，不碰 cargo
    #   pre-push    → cargo fmt / check / clippy（增量，分~分钟级）
    #   cargo test  → 不在任何 git 钩子里跑，走手动 / 夜间（run-nightly-gates.sh）
    # 原因：增量 test 也需编译测试依赖，实测一次 push 内 target 涨 4G、磁盘 94% 未编完。

    # [Gate Contract] 前端契约静态门禁（防「前端封装但后端未挂载」回归）
    # 秒级、零外部依赖（BFF 无需在线）；挂载锚点 svc 豁免（实测锚点登记），
    # 真 404 判定由实跑验收 scripts/dev/contract-smoke-live.py（部署前手动）兜底。
    contract-gate:
      tags: contract backend
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        python3 scripts/dev/contract-gate.py

    # [Gate OA] OpenAPI 契约 ↔ 文档同步（W6-C，2026-11-07 接线）
    # 双门禁：
    #   ① 权威 docs/api/openapi.json 的 live 覆盖（基线 docs/api/openapi-baseline-gaps.json）
    #   ② 聚合产物的计数棘轮（基线 scripts/ci/openapi-aggregated-baseline.json）
    # 聚合产物自 2026-11-19 起不再入库（见 docs/quality/openapi-aggregated-artifact-policy-2026-11-19.md），
    # 本地默认 --allow-missing 跳过；CI 由 .github/workflows/openapi-aggregated.yml 先生成再跑同一棘轮。
    # 重生成入口: ./scripts/openapi/generate.sh --extract --output-dir /tmp/openapi
    openapi-gate:
      tags: contract api openapi
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|^docs/api/openapi|^scripts/openapi/|^scripts/ci/check-openapi|^scripts/dev/extract-live-routes\.py$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-openapi-coverage.cjs
        node scripts/ci/check-openapi-aggregated.cjs --allow-missing

    # [Gate A11Y] aria-label 覆盖率（W6-D，2026-11-07 接线）
    # 存量 47 条 / 17 文件已冻结在 scripts/ci/a11y-baseline.json，
    # 仅阻断「改动文件超出基线」的新增违规（未改动文件的存量不误伤）。
    a11y-changed:
      tags: frontend a11y
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/src/(pages|components)/.*\.tsx$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-a11y.cjs --changed-only --strict --baseline scripts/ci/a11y-baseline.json

    # [Gate DT] Design Token 合规（W6-D，2026-11-07 接线）
    # 存量 42 条 / 18 文件（fixed-px-spacing 37、hardcoded-color 5）已冻结在
    # scripts/ci/design-tokens-baseline.json；仅阻断暂存文件超出基线的新增偏差。
    design-tokens-changed:
      tags: frontend design-tokens
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(apps/web|packages/shared-components)/src/.*\.(ts|tsx|css|scss)$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-design-tokens.cjs --staged --strict --baseline scripts/ci/design-tokens-baseline.json

    # [Gate G] Permission matrix 3-way gate (blocking: R1/R4/R5/R6)
    perm-matrix:
      tags: permission security
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/perm-matrix-toolkit.cjs" ]; then
          node scripts/ci/perm-matrix-toolkit.cjs ci-report
        fi

    # [Gate PERM-SEED] 权限码只能经 database/migrations 落库（2026-11-18 防复发）
    # 2026-10-26 生产首次启动由 iam::init_database 运行期自举写入 69 条伞码，迁移链
    # 从未登记 → 空库克隆缺码、gen-permissions 与生产差集 61 条（已由
    # 20261118125000_seed_module_umbrella_permissions.sql 收编）。
    # 暂存含 svc/**/*.rs 时全量扫描；命中 INSERT INTO core_permissions 即阻断。
    perm-seed-guard:
      tags: permission database
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-no-runtime-permission-insert.mjs

    # [Gate M] Axum Layer Order Gate (dry-run)
    axum-layer:
      tags: rust axum layer
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|toml|lock)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-axum-layer-order.cjs" ]; then
          node scripts/ci/check-axum-layer-order.cjs
        fi

    # [Gate RMT] real_module 必须同时挂 tenant_middleware（2026-11-21 B1 回归防线）
    # 背景：analytics_real_module 只挂 auth，BI 写 handler 拿不到 RlsTxnCell → 500。
    # 触发：单体 real_module / 本门禁脚本 / 基线变更；无变更秒级跳过。
    # 既存例外登记 scripts/ci/real-module-tenant-baseline.json（委托挂载 / EHS no_txn）。
    real-module-tenant:
      tags: rust axum tenant
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/server/src/modules/.*_real_module\.rs$|^scripts/ci/check-real-module-tenant-middleware\.mjs$|^scripts/ci/real-module-tenant-baseline\.json$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-real-module-tenant-middleware.mjs

    # [Gate S] SQLx offline cache integrity (V300: WARN-only → BLOCKING)
    # 历史教训：静态启发式（文件数/脏标记）抓不住"缓存缺查询"（53 个文件也曾全 PASS）。
    # 真正可靠的验证只有离线编译：SQLX_OFFLINE=true cargo check 宏服务，缓存缺失必报错。
    # 触发条件：.sql/.sqlx 变更（V538：纯 .rs 变更不再触发——重型 cargo check 27 包已由
    # pre-push 的 cargo-check-workspace SQLX_OFFLINE 全量兜底）。失败时运行
    # ./scripts/dev/sqlx-prepare.sh 刷新缓存后重提。
    # 触发面收窄：只认真正影响 sqlx 缓存的位置（database/、migrations_deferred/、svc/、lib/
    # 下的 .sql 与 .sqlx/）。fixtures/*.sql 是生产结构快照（CI 导入用），不是查询源，
    # 且不会被 include_str!/query_file! 消费，不应触发 cargo check。
    sqlx-cache-freshness:
      tags: rust sqlx cache
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^database/.*\.sql$|^migrations_deferred/.*\.sql$|^svc/.*\.sql$|^lib/.*\.sql$|^\.sqlx/' || true)
        [ -z "$STAGED" ] && exit 0
        bash scripts/dev/sqlx-prepare.sh --check || {
          echo "❌ [Gate S] SQLx 离线缓存不完整或不一致，提交已阻断。"
          echo "   请运行: ./scripts/dev/sqlx-prepare.sh"
          echo "   然后: git add .sqlx && git commit"
          exit 1
        }

    # [Gate TXN-2XX] 请求事务内写入后返回非 2xx（= 中间件回滚，写入被静默丢弃）
    # 触发：任一侧 svc/**/*.rs 变更（B2 起由 scm 扩到全部服务）
    txn-write-non2xx:
      tags: rust rls transaction
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^scripts/ci/check-txn-write-non2xx' || true)
        [ -z "$STAGED" ] && exit 0
        python3 scripts/ci/check-txn-write-non2xx.py --changed-only

    # [Gate POOL-SYSTEM] 禁止「池直连 + TenantScope::system/SystemChannel」同函数并存
    # 池连接无 app.rls_system，系统身份谓词会静默读成 0 行
    pool-direct-system-scope:
      tags: rust rls transaction
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^scripts/ci/check-pool-direct-system-scope' || true)
        [ -z "$STAGED" ] && exit 0
        python3 scripts/ci/check-pool-direct-system-scope.py --changed-only

    # [Gate H] CRM contract consistency
    crm-contract:
      tags: crm contract
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/dev/check-crm-contract.mjs" ]; then
          node scripts/dev/check-crm-contract.mjs
        fi

    # [Gate I] Icon completeness + Page standardization
    icon-page:
      tags: frontend icon page
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-icons.cjs" ]; then
          node scripts/ci/check-icons.cjs --strict
        fi
        if [ -f "scripts/ci/page-audit.cjs" ]; then
          node scripts/ci/page-audit.cjs --diff --strict
        fi

    # [Gate T] 统一错误出口（V517）— 报告模式，不阻断提交
    # 背景：svc 层存量 692 处把原始 SQL/IO 错误回给客户端（307 format! 拼接 +
    #       385 处 <err>.to_string()），按基线逐步清退，故此处只报告不阻断。
    # CI 侧由 error-handling-gate（--changed-only）拦截新增。
    # 决策依据：docs/architecture/unified-error-handling-decision.md
    error-handling:
      tags: rust errors
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-error-handling.cjs" ]; then
          node scripts/ci/check-error-handling.cjs
        fi

    # [Gate V518] 桥接网完备性（B7 收尾：新增错误类型必须有 → TopemsError 桥接）
    bridge-coverage:
      tags: rust errors
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|scripts/ci/check-bridge-coverage.cjs|scripts/ci/bridge-coverage-allowlist.json' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-bridge-coverage.cjs" ]; then
          node scripts/ci/check-bridge-coverage.cjs --changed-only
        fi

    # [Gate R] RLS权限校验
    rls-permissions:
      tags: database rls security
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^scripts/db/|^database/migrations/" || true)
        [ -z "$STAGED" ] && exit 0
        # 不再从 MIGRATE_URL 隐式派生 DATABASE_URL：.env 的 MIGRATE_URL 已指向本地开发库，
        # 生产窗口期由调用方显式注入；脚本自身也会拒绝任何命中生产特征的连接串。
        # 连接解析统一走 scripts/ci/lib/db-target.mjs（诊断：--hook rls-permissions --explain）。
        if [ -f "scripts/ci/check-rls-permissions.cjs" ]; then
          node scripts/ci/check-rls-permissions.cjs
        fi

    # [Gate Q] 配置单一真相源一致性校验（P0-3：services.yaml 权威 ↔ ports.env/Cargo.toml/ports.ts/vite.config/nginx.conf）
    ports-consistency:
      tags: config ports
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(config/ports.env|config/services.yaml|Cargo.toml|apps/web/src/config/ports.ts|apps/web/vite.config.ts|apps/web/nginx.conf|scripts/ci/check-config-sources.cjs)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-config-sources.cjs" ]; then
          node scripts/ci/check-config-sources.cjs --check
        fi

    # [Gate N] Large files check (>1MB) — migrated from husky #1
    # 外部脚本避免 lefthook sh -c 内联引号冲突（Windows 兼容）
    large-files:
      tags: files size
      run: bash scripts/ci/check-large-files.sh

    # [Gate SD] schema_defense 双写列名对拍止血（第三梯队方案C）
    # 触发：schema_defense 定义点或迁移变更时，全量扫描 TABLE_DEFS vs 同文件内联 CREATE 列名集合
    # 首版 WARN 不 block（新脚本先观察，稳定后去 || echo 恢复阻断）
    schema-defense-drift:
      tags: database schema
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*/schema_defense[^/]*\.rs$|^svc/.*/db/schema\.rs$|^svc/.*/models/(mod|schema_defense)\.rs$|^database/migrations/' || true)
        [ -z "$STAGED" ] && exit 0
        python3 scripts/check-schema-defense-drift.py || echo "WARN: schema_defense 双写疑似漂移（暂不阻断，见上方明细；稳定后转硬阻断）"

    # [Gate MIG] 迁移静态校验（命名/顺序/幂等/checksums 自举）
    # 注意：validate.sh 每次运行会重写 database/checksums.txt——命中时请随提交一并 git add
    # [2026-10-23 Phase D] 补入 CI 同款静态两步（ci.yml migration-test job 前置）：
    #   validate.sh 的版本顺序校验在非 STRICT 下仅 WARN，重复版本号本地漏拦（P1-26 即只在 CI 炸）。
    #   check-migrations.mjs 硬拦截重复版本号/非 .sql/改历史文件；check-migration-names.mjs --strict 管命名。
    migration-validate:
      tags: database migrations
      run: |
        set -e
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^database/migrations/.*\.sql$|^database/checksums\.txt$" || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/check-migration-names.mjs --strict
        node scripts/check-migrations.mjs
        bash scripts/migration/validate.sh

    # [Gate MIG-PROD] 定向迁移命名 + 破坏性语句守卫（prod 误跑防线，2026-11-05）
    # 触发：迁移文件 / 本组校验脚本 / 基线变更；无变更秒级跳过。
    # 既有违规由 destructive-sql-baseline.json 记录（仅报告），只有新增/修改文件阻断。
    migration-prod-guard:
      tags: database migrations
      run: |
        set -e
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^database/migrations/.*\.sql$|^database/migration_manifest\.yaml$|^scripts/ci/check-(directed|destructive)-sql\.mjs$|^scripts/ci/destructive-sql-baseline\.json$" || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-directed-migrations.mjs --changed-only
        node scripts/ci/check-destructive-sql.mjs

    # [Gate MIG-ENTRY] prod 迁移入口扫描：禁止脚本硬编码 prod DSN 直接 sqlx migrate run
    # 触发：scripts/** 或 CI workflow 变更；纯消息行/注释行/文档不计。
    prod-migration-entry:
      tags: database deploy
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^scripts/.*\.(sh|mjs|py)$|^\.github/workflows/' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-prod-migration-entry.mjs

    # [Gate MIG-BASE] 基线完整性：资产 sha256 / 锚点合法单调 / 新增迁移版本 > 锚点
    # 触发：迁移、基线或本校验脚本变更；无变更秒级跳过。
    baseline-integrity:
      tags: database migrations
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^database/(migrations|baseline)/|^scripts/ci/check-baseline-integrity\.mjs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-baseline-integrity.mjs --changed-only

    # [Gate O] Sensitive information scan — migrated from husky #2
    sensitive-info:
      tags: security secrets
      run: bash scripts/ci/check-sensitive-info.sh

    # [Gate DSN] 禁止把生产 DSN 写成 DATABASE_URL 默认值（2026-11-18 生产写入事故）
    no-prod-dsn-defaults:
      tags: database security config
      run: bash scripts/ci/check-no-prod-dsn-defaults.sh

    # [Gate PASSWD] 硬编码管理员/默认口令常量扫描（代码/配置，测试夹具与文档除外）
    hardcoded-passwords:
      tags: security secrets
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(sh|bash|zsh|ps1|mjs|cjs|js|ts|tsx|jsx|rs|py|toml|yaml|yml|sql)$|\.env' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-hardcoded-passwords.mjs --changed-only

    # [Gate P] API path duplicates check — migrated from husky #4（脚本已迁移 scripts/tools/，由 CI job 执行）
    # NOTE: scripts/tools/check_api_duplicates_ci.py 纯文件扫描（--ci 离线，无需 live DB）。
    # [Gate P] API Gate（check-api 三合一审计：audit+coverage+compare，真实阻断）
    api-gate:
      tags: api rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-api.cjs" ]; then
          node scripts/ci/check-api.cjs --mode=all
        else
          printf '\033[33m[Gate P] WARN\033[0m scripts/ci/check-api.cjs not found, skipping api-gate check\n'
          exit 0
        fi

    # [Gate PC] 权限码生成块漂移：permissions.ts 的 CORE_PERMISSION_CODES 必须与
    # core_permissions 迁移一致（真源=database/migrations，生成器 scripts/ci/gen-permissions.mjs）
    perm-codegen:
      tags: api permission db
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(database/migrations/.*\.sql|apps/web/src/config/permissions\.ts|scripts/ci/gen-permissions\.mjs)$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/gen-permissions.mjs" ]; then
          node scripts/ci/gen-permissions.mjs --check
        else
          printf '\033[31m[Gate PC] FAILED\033[0m scripts/ci/gen-permissions.mjs 缺失，无法校验权限码生成块\n'
          exit 1
        fi

    # [Gate P2] Schema boundary check（Plan v1.0 §4.4 编译时边界 CI 侧强制：
    # 全量扫描 svc 裸 sqlx 查询的 schema.table 引用，跨 schema 违规阻断提交）
    # V531: 走 allowlist 感知脚本（scripts/ci/check-schema-boundary.cjs）——
    # 既有 known_gap 登记在 schema-boundary-allowlist.json，新违规仍阻断。
    boundary-gate:
      tags: boundary rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-schema-boundary.cjs" ]; then
          node scripts/ci/check-schema-boundary.cjs
        else
          printf '\033[33m[Gate P2] WARN\033[0m scripts/ci/check-schema-boundary.cjs not found, skipping boundary-gate\n'
          exit 0
        fi

    # [Gate P2a] Schema boundary PYTHON gate（与 P2 cjs 互补）：
    # cjs 只查【未被宏包裹】的裸 sqlx 调用点（per-file allowlist）；本 python 脚本按
    # 【服务→schema 归属】扫描 ALL SQL 字面量（含 only_own_schema_query! 宏内），并做
    # 无前缀表名归属解析。事实源 scripts/schema_boundary.json。两者都必须绿。
    # 临时跨 schema 条目（unified-core=D1/U1、search=阶段2治理、integration=D3/U3）已在
    # schema_boundary.json 标注 allow_temporary，阶段2 下架后撤销。
    boundary-gate-py:
      tags: boundary rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|^scripts/schema_boundary.*\.json$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/check_schema_boundary.py" ]; then
          python3 scripts/check_schema_boundary.py
        else
          printf '\033[33m[Gate P2a] WARN\033[0m scripts/check_schema_boundary.py not found, skipping boundary-gate-py\n'
          exit 0
        fi

    # [Gate P2b] API boundary check（修复建议⑨，2026-09-09 编码）：
    # 前端 apiClient.<svc> 调用路径（baseURL+path 前 3 段）必须在后端路由注册表中；
    # 预埋零消费进 allowlist（prebuilt），页面在役但后端未实现进 allowlist（known_gap，需实现）
    api-boundary-gate:
      tags: api boundary frontend
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/src/.*\.(ts|tsx)$|^svc/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-api-boundary.cjs" ]; then
          node scripts/ci/check-api-boundary.cjs
        else
          printf '\033[33m[Gate P2b] WARN\033[0m scripts/ci/check-api-boundary.cjs not found, skipping api-boundary-gate\n'
          exit 0
        fi

    # [Gate SP] schema 前缀门禁：模块 SQL 必须显式 schema.table，不依赖 search_path
    # 既存违规按 scripts/ci/schema-prefix-baseline.json 放行；新增文件/新表名阻断。
    schema-prefix:
      tags: database rust schema
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-schema-prefix.mjs --changed-only

    # [Gate RDDL] 运行期 DDL 只减不增（W2-D1）：服务启动期 CREATE/ALTER/DROP 与
    # TABLE_DEFS 声明数按文件冻结在 scripts/ci/runtime-ddl-baseline.json；
    # 任一项上升即阻断，下降需 --update-baseline 核销。DDL 正确入口是 database/migrations/。
    runtime-ddl:
      tags: database rust schema
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|^scripts/ci/check-runtime-ddl\.mjs$|^scripts/ci/runtime-ddl-baseline\.json$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-runtime-ddl.mjs --changed-only

    # [Gate SPX] search_path 自设语句门禁：业务代码禁止 SQL 内 SET search_path /
    # set_config('search_path', ...)（作用域统一由 Db 的事务级 SET LOCAL 注入）。
    # 既存违规按 scripts/ci/search-path-baseline.json 放行；新增阻断。
    search-path:
      tags: database rust schema
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^scripts/ci/check-search-path\.mjs$|^scripts/ci/search-path-baseline\.json$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-search-path.mjs --changed-only

    # [Gate PA] 绕过池调用门禁：svc/ 下禁止直接 pool.acquire（白名单带 reason）
    pool-acquire:
      tags: database rust connection
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-pool-acquire.mjs --changed-only

    # [Gate RT] 请求事务门禁（§17.2）：bare_txn / own_txn 按服务只减不增
    request-txn:
      tags: database rust transaction
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^scripts/ci/check-request-txn\.mjs$|^scripts/ci/request-txn-baseline\.json$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-request-txn.mjs --changed-only

    # [Gate SA] 作用域 API 门禁（§17.2）：未标记的 scope_for_tenant 与 Db::new 只减不增；
    # 新增调用必须带 `// scope-exempt: <理由>`（事件消费/后台/EHS 无请求事务/WMS 短事务）。
    # 基线 scripts/ci/scope-api-baseline.json，口径见 docs/quality/scope-api-convergence-mapping-2026-11-21.md。
    scope-api:
      tags: database rust transaction
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|^scripts/ci/check-scope-api\.mjs$|^scripts/ci/scope-api-baseline\.json$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-scope-api.mjs --changed-only

    # [Gate ORG] 组织字段口径门禁（W5-C / E4-15）：V69.1 已定 tenant_id/org_id/company_id
    # 三义，organization_id 废弃。存量迁移次数冻结在 org-field-baseline.json，新迁移出现
    # organization_id 或既有文件上升即阻断；下降用 --update-baseline 核销。
    org-field:
      tags: database schema org
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^database/migrations/.*\.sql$|^scripts/ci/check-org-field\.mjs$|^scripts/ci/org-field-baseline\.json$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-org-field.mjs --changed-only

    # [Gate STATUS-CODEGEN] W5-B B3 试点：finance 凭证状态常量必须由 DB ENUM 目录生成。
    # 单一源 docs/database/status-check-catalog.json · public.voucher_status；
    # 改目录/生成物/脚本任一未同步重生成即阻断。
    status-codegen:
      tags: database frontend status
      glob: "{docs/database/status-check-catalog.json,scripts/ci/gen-finance-status.mjs,apps/web/src/components/finance/generated/financeStatus.ts}"
      run: node scripts/ci/gen-finance-status.mjs --check

    # [Gate STATUS-CATALOG] W5-B：DB CHECK 状态目录必须与本地库一致。
    # 新增/修改状态约束后未重生成 docs/database/status-check-catalog.json 即阻断。
    # 默认只校验本次改动迁移涉及的表；解析不到表（或仅改目录）时自动回退全量。
    # 定期全量（建议每周或发布前）：node scripts/ci/dump-status-checks.mjs --check
    # 校验库由 STATUS_CATALOG_DB_URL 指定，与 ledger-ddl-drift 的 MIGRATION_DRIFT_DB_URL 解耦；
    # 连接解析统一走 scripts/ci/lib/db-target.mjs（诊断：--hook status-catalog --explain）。
    status-catalog:
      tags: database status
      glob: "{docs/database/status-check-catalog.json,database/migrations/**,svc/*/migrations/**}"
      run: node scripts/ci/dump-status-checks.mjs --check --changed-only

    # [Gate STATUS-PALETTE] W5-B B20：Rust 状态值必须有前端色板，防止展示退化为灰色。
    # 改色板或盘点产物任一未同步重生成即阻断；新增 Rust 状态未登记色板也会阻断。
    status-palette:
      tags: frontend status
      glob: "{apps/web/src/utils/status.ts,docs/database/status-code-inventory.json}"
      run: node scripts/ci/dump-status-code-inventory.mjs --check --strict-palette

    # [Gate STATUS-ENUM-CONTRACT] 2026-11-24：代码 DB_VALUES ↔ DB CHECK 值集逐条断言。
    # 11 个枚举（finance 5 / master-data 5 / audit_logs）的常量值与契约文件必须一致；
    # 改约束、改常量、改契约任一未同步即阻断。
    status-enum-contract:
      tags: database status rust
      glob: "{docs/database/status-enum-db-contract.json,scripts/ci/check-status-enum-contract.mjs,svc/finance/src/modules/*status*.rs,svc/finance/src/modules/decision_v60.rs,svc/finance/src/modules/risk_v54.rs,svc/finance/src/modules/settlement_v55.rs,svc/finance/src/modules/treasury_v58.rs,svc/master-data/src/modules/disaster_v56.rs,lib/shared-db/src/audit.rs}"
      run: node scripts/ci/check-status-enum-contract.mjs

    # [Gate TWS] 零租户写入源头扫描（2026-11-16 接入，report-only 起步）
    # 扫描 svc/lib/scripts 中「裸零 UUID 当 tenant 写」的疑似点；显式
    # PLATFORM_TENANT_ID / SYSTEM_TENANT_ID 与测试代码在白名单内。
    # 当前只报告不阻断；跑稳一轮后把 `|| true` 去掉并加 --strict 转阻断。
    tenant-write-sources:
      tags: database rls tenant
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(svc|lib|scripts)/.*\.(rs|sql)$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-tenant-write-sources.cjs --changed-only || true

    # [Gate TC] 租户上下文回归门禁（W7 第二步配套）
    # R1 event_handlers 内使用 scope_system/scope_read_system；R2 modules 内直接使用 state.pool。
    # 存量按文件计数冻结在 scripts/ci/tenant-context-baseline.json（2026-11-11：R1 4 / R2 1764），
    # 只拦新增；确属系统通道的调用用 `// tenant-system: <原因>` 登记（见 lib/shared-db/src/schema.rs 模块头）。
    tenant-context:
      tags: database rls tenant
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-tenant-context.cjs --changed-only

    # [Gate Q] Hardcoded CJK in admin module (strict) — migrated from husky #8b
    i18n-hardcode-admin:
      tags: frontend i18n hardcoded
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-i18n.cjs" ]; then
          node scripts/ci/check-i18n.cjs --mode=hardcode --strict
        fi

    # [Gate MCS] Mobile 契约全量实跑回归（方向1固化，114 端点）
    # 触发：mobile 前端契约 / mobile BFF / shared-service-client 变更。
    # 本机实跑：由 scripts/mobile_smoke_precommit.sh 拉起隔离 mobile（topems_test + 独立端口/redis）
    #   并按 MOBILE_BASE_URL 实跑，结束后回收；本机 8070 是否常驻不再影响该门禁。
    # 安全边界（2026-11-06，与 Gate WCS 同一口径）：只打本机/测试（WEB_SMOKE_ENV=local）；
    #   prod 仓库位/目标进程连 *_prod 默认拒绝；确需 prod 必须 ALLOW_PROD_SMOKE=1 +
    #   PROD_SMOKE_CONFIRM + PROD_SMOKE_REASON + 显式 MOBILE_BASE_URL/JWT_SECRET，且 prod 只跑 GET（不写库）。
    #   fail-closed：目标不可达/缺密钥/漏配开关时明确失败并给出可操作提示，不再静默 SKIP。
    mobile-contract-smoke:
      tags: mobile contract smoke
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(apps/mobile/src/api/|svc/mobile/src/|lib/shared-service-client/src/)' || true)
        [ -z "$STAGED" ] && exit 0
        export WEB_SMOKE_ENV="${WEB_SMOKE_ENV:-local}"
        # 本机隔离实跑：scripts/mobile_smoke_precommit.sh 负责拉起/回收隔离 mobile（topems_test），
        # 不再依赖本机 8070 常驻或 LEFTHOOK_EXCLUDE 跳过。
        if bash scripts/mobile_smoke_precommit.sh > /tmp/mobile_smoke_precommit.log 2>&1; then
          printf '\033[32m[Gate MCS] PASS\033[0m 目标=%s（日志 /tmp/mobile_smoke_precommit.log）\n' "$WEB_SMOKE_ENV"
          grep -E '^\[MCS-local\]|^总计:' /tmp/mobile_smoke_precommit.log | tail -4
        else
          rc=$?
          printf '\033[31m[Gate MCS] BLOCKED (exit %s)\033[0m 目标=%s\n' "$rc" "$WEB_SMOKE_ENV"
          tail -20 /tmp/mobile_smoke_precommit.log
          exit "$rc"
        fi

    # [Gate WCS] Web 前端契约全量实跑回归（portal 契约面）。
    # 触发：web 前端契约 / web BFF(svc/server) / shared-service-client 变更。
    # 安全边界（2026-11-06）：默认只打本机/测试（WEB_SMOKE_ENV=local，loopback）。
    #   prod 仓库位（TOPEMS_INSTANCE=prod 或 .env DATABASE_URL 指向 *_prod）默认拒绝；
    #   确需 prod 必须 ALLOW_PROD_SMOKE=1 + PROD_SMOKE_CONFIRM + PROD_SMOKE_REASON。
    #   fail-closed：目标不可达/缺密钥/漏配开关时明确失败并给出可操作提示，不再静默 SKIP。
    # 隔离实跑（2026-11-18）：未显式给 WEB_BFF_URL 时由
    #   scripts/dev/web_smoke_precommit.sh 拉起「测试库 + 独立端口」BFF 再跑，
    #   避免本机 8099 生产实例被目标位守卫判为 *_prod 而必然 BLOCKED；
    #   CI 已自备测试 BFF 时直接设 WEB_BFF_URL 即可跳过拉起。
    web-contract-smoke:
      tags: web contract smoke
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(apps/web/src/api/|apps/web/src/utils/apiPath.ts|svc/server/src/|lib/shared-service-client/src/)' || true)
        [ -z "$STAGED" ] && exit 0
        export WEB_SMOKE_ENV="${WEB_SMOKE_ENV:-local}"
        if [ -n "${WEB_BFF_URL:-}" ]; then
          python3 scripts/web_contract_smoke.py > /tmp/web_smoke_precommit.log 2>&1
        else
          bash scripts/dev/web_smoke_precommit.sh > /tmp/web_smoke_precommit.log 2>&1
        fi
        rc=$?
        if [ "$rc" -eq 0 ]; then
          printf '\033[32m[Gate WCS] PASS\033[0m 目标=%s（日志 /tmp/web_smoke_precommit.log）\n' "$WEB_SMOKE_ENV"
          grep -E '^\[web-smoke\]|^总计:' /tmp/web_smoke_precommit.log | tail -3
        else
          printf '\033[31m[Gate WCS] BLOCKED (exit %s)\033[0m 目标=%s\n' "$rc" "$WEB_SMOKE_ENV"
          head -8 /tmp/web_smoke_precommit.log
          echo "  ..."
          tail -6 /tmp/web_smoke_precommit.log
          exit "$rc"
        fi

pre-push:
  # V300: parallel:true → false。四个 cargo 命令共享 target/包缓存锁，并行会竞争
  # 导致随机失败（曾实测 cargo-test-workspace 并行失败、串行全绿）。
  # P1-4: sccache 加速——已装时自动启用（跨 check/clippy/test 命令共享编译
  #       产物，冷缓存/全量场景显著提速）；未装时静默跳过，不影响门禁语义。
  parallel: false
  commands:
    # [Gate SC] Shellcheck 全量防线（秒级，置于 cargo 门禁前快速失败）
    # P1-1 清零 195→0 后固化：任何脚本改动带告警，push 直接阻断，
    # 不浪费后续 cargo check/clippy/test 数分钟时间。
    shellcheck-workspace:
      tags: shellcheck
      run: bash scripts/ci/check-shellcheck.sh

    # [Gate DOCKER-CTX] Docker 构建上下文 vs Cargo patch 路径（<0.1s）
    # 事故：Cargo.toml [patch.crates-io] rsa = { path = "vendor/rsa" }（Marvin 私有补丁）
    # 是解析期强依赖，但 Dockerfile.server 曾"不 COPY vendor/"（那条注释只针对 swagger-ui
    # 的 zip）。缺 vendor/ 时 cargo 解析即失败，镜像必挂；因 Docker Build workflow 当时
    # 被账号计费卡住从未真正启动，问题长期未暴露。此闸门把两者对齐成静态阻断。
    docker-build-context:
      tags: config docker
      glob: "{Cargo.toml,deploy/docker/**,svc/**/Dockerfile,apps/**/Dockerfile,.dockerignore,scripts/ci/check-docker-build-context.py}"
      run: python3 scripts/ci/check-docker-build-context.py

    # [Gate MWP] 单体/独立部署写门配平：独立部署有 require_module_write 时，
    # 单体 *_real_module.rs 必须同步，防止 W1-3 的只读用户越权写入复现。
    module-write-parity:
      tags: rust config
      glob: "{svc/*/src/main.rs,svc/server/src/modules/*_real_module.rs,scripts/ci/check-module-write-parity.mjs}"
      run: node scripts/ci/check-module-write-parity.mjs

    # [Gate SPE] SEARCH_PATH 环境变量零容忍：禁止读写进程级 SEARCH_PATH
    # 模块作用域必须经 bootstrap_service_with_search_path 显式声明，否则模块化单体内
    # 后 build 的模块会覆盖先 build 的（历史 500 / 读错 schema 根因）。
    search-path-env:
      tags: rust config
      run: node scripts/ci/check-search-path-env.mjs

    # [Gate IGR] 测试 #[ignore] 必须带原因（C1：裸 ignore 半年后没人知道该修还是该删）
    test-ignore-reason:
      tags: rust
      run: node scripts/ci/check-test-ignore-reason.mjs

    # [Gate AUDIT-INV] cargo audit 豁免项的"零暴露"前提机械校验（<0.3s，不调用 cargo）
    # ignore 是人工判断，会腐化：今天"ES 算法零使用"成立，明天加一行 Algorithm::ES256
    # 就失效而门禁仍绿。此闸门把每条豁免的前提（sqlite 未启用 / 无 ECDSA / rsa 仍为
    # vendor 补丁版 / 登记表与 audit.toml 双向一致）变成断言，前提不成立即阻断。
    rust-audit-invariants:
      tags: security
      run: python3 scripts/ci/check-rust-audit-invariants.py

    # [Gate GL-FULL] gitleaks 全历史扫描（2026-11-18 接入；2026-11-19 口径与 CI 对齐）
    # pre-commit 只扫暂存区增量，历史/本地新提交里的密钥只有这里能看见。
    # 存量已冻结在 scripts/ci/gitleaks-baseline.json（脱敏报告：
    # 占位符 / 测试默认口令 / 开发自签证书），新增命中仍阻断。
    #
    # 扫描范围：显式 --log-opts="--remotes"，只扫远端可达 ref（origin/*），
    # 与 CI 干净克隆（fetch-depth: 0，只有 origin 分支）完全一致。
    # 理由：本机保留了历史重写前的本地分支（backup/audit-batch-pre-rebase、
    # feature/v286|v287、feature/merge-iam-admin 等），同一份内容在这些分支上是
    # 重写前的旧 SHA；baseline 登记的却是 origin 侧重写后的 SHA。gitleaks 的
    # 基线指纹含 commit，于是同一内容会被误判成"新增"（实测 36 条假红，全部来自
    # 这些本地分支，本轮 8 条 commit 零命中）。这些重复历史在 CI 上不存在。
    # 注意这是"范围对齐"不是"降低要求"：baseline / 脱敏 / fail-closed /
    # 新增即阻断 全部不变，远端历史上任何新增密钥仍会拦住本次 push。
    # 实测约 40–60s（远端 ref 约 8.9k commits / 1.1GB），fail-closed。
    gitleaks-full:
      tags: security secrets
      run: GITLEAKS_LOG_OPTS="--remotes" bash scripts/ci/check-gitleaks-full.sh

    # [Gate MIG-DRILL] 迁移锚点演练（正式闸门，fail-closed）
    # 从生产基线快照恢复隔离库，只应用 anchor 之后的前向迁移 + 静态校验 + 权限码审计
    # + [5/5] 策略期望快照比对（database/rls_policy_expected.json vs 实测 pg_policies/pg_class）。
    # 仅当本次 push 触及 migrations/baseline/快照/门禁脚本时运行（其余 push 秒级跳过）。
    # 连接：优先 .env TEST_DATABASE_URL 的非特权角色（需 CREATEDB）；模板库
    #   topems_drill_template 预装扩展（bootstrap-migration-drill-template.sh 一次性创建），
    #   因此不再需要 superuser 豁免；脚本自身仍拒绝 superuser/BYPASSRLS 连接。
    # 快照更新：只随迁移一起用
    #   MIGRATION_DRILL_WRITE_POLICY_SNAPSHOT=1 bash scripts/dev/run-migration-drill.sh anchor
    #   生成后 review git diff 再提交；不得为过门禁直接刷新快照。
    # 现状：anchor 20261117235500 上 22 条前向迁移 + 快照比对全绿；
    # 本闸门 fail-closed，不得用 --no-verify 绕过。
    migration-drill-anchor:
      tags: database migrations
      glob: "{database/migrations/**,database/baseline/**,database/rls_policy_expected.json,scripts/ci/check-rls-policy-snapshot.mjs,scripts/ci/check-menu-permission-codes.mjs,scripts/ci/gen-rls-policy-snapshot.mjs,scripts/ci/lib/rls-policy-snapshot.mjs,scripts/ci/lib/db-target.mjs,scripts/dev/run-migration-drill.sh,scripts/migration/apply-forward.sh}"
      run: bash scripts/dev/run-migration-drill.sh anchor

    # [Gate B12/U9.5] 配置三方一致性（秒级）：services.yaml ↔ ports.env ↔ nginx map
    # 单一信源原则（V66.2）：任何服务/端口/路由变更导致漂移，push 直接阻断。
    config-consistency:
      tags: config
      run: python3 scripts/dev/check-config-consistency.py

    # [2026-10-29 NEW Gate] 初始化路径防复发（B 类清单更正整改）：
    # 自建 DDL（unified-core init_database）与迁移 DDL 列级对齐校验——任何一侧
    # 改列未同步即阻断（schema_defense/try_init 缺列静默失败的历史根因）。
    # 秒级成本；迁移权威 DDL 为唯一信源（database/migrations + svc/*/migrations）。
    schema-defense-check:
      tags: database migrations
      run: node scripts/migration/check-schema-defense.mjs

    # [2026-11-06 NEW Gate DRIFT] 账本 success=t 但 DDL 未落地的漂移防线：
    # 历史事故：本地/test 的 _sqlx_migrations 声称已执行 20261105140000/160000，
    #           production_orders 实际仍为 integer/numeric，导致 sqlx i64 解码失败；
    #           batch_records 还残留模板误加约束。静态校验看不见这类「记账≠结构」。
    # 判定：database/migration_drift_assertions.json 声明 source 版本 + 期望结构；
    #       仅当目标库该版本 success=t 时才比对实际列/约束/索引，失败列具体漂移项。
    # 触发：仅推送涉及 database/(migrations|baseline|postgres|init)、checksums、
    #       断言清单、scripts/migration 时运行；无关改动秒级 SKIP。
    # 成本：触发时约 0.2-0.5s（3 次 psql 查询，断言清单批量查询）；跳过 <0.1s。
    # 失败：非零退出 + [Gate DRIFT] FAILED + 修复建议；无库/无 psql fail-closed
    #       （连接解析统一走 scripts/ci/lib/db-target.mjs；诊断 --hook ledger-ddl-drift --explain，
    #        缺库即失败，禁止静默 --no-verify 绕过）。
    ledger-ddl-drift:
      tags: database migrations
      run: bash scripts/ci/check-ledger-ddl-drift.sh

    # [2026-11-15 NEW Gate] manifest 台账漂移：登记 / 磁盘迁移 / checksums.txt 三者不一致即阻断。
    # 秒级（711 文件 SHA-256）；无 glob 过滤，每次 push 全量机械比对。
    manifest-drift:
      tags: database migrations
      run: bash scripts/migration/gen-manifest.sh --check

    # [2026-11-06 NEW Gate INSERT] 迁移 INSERT 列序/列数静态防线：
    # 历史事故：20261107000011 的 VALUES 行实际为 (code, resource, action, name, level)，
    #           但派生表别名声明为 (code, name, resource, action, level)，写入后
    #           name/resource/action 三列整体错位（纯语法合法，validate.sh 看不见）。
    # 检查：scripts/migration/check-insert-column-shape.mjs
    #   - INSERT 列清单 vs VALUES 每条元组值数、派生 VALUES 别名数 vs 值数、
    #     INSERT 列清单 vs SELECT 表达式数（确定性结构）；
    #   - core_permissions 列→值组合映射后断言 action/resource 与 code 一致（语义）。
    # 触发：仅推送涉及 database/migrations|baseline、svc/*/migrations、migrations、
    #       本检查脚本时运行；无关改动秒级 SKIP。
    # 成本：触发时静态扫描 613 文件 / 230 条 INSERT 约 0.1s；跳过 <0.1s。
    # 失败：非零退出 + [Gate INSERT] FAILED + 逐条 path:line；无 node fail-closed。
    migration-insert-shape:
      tags: database migrations
      run: bash scripts/ci/check-migration-insert-shape.sh

    # [NEW] cargo check — 增量模式（2026-11-05 修订）：只编译本次 push 变更的 crate。
    # 背景：全量 check 被 utoipa-swagger-ui build.rs 网络下载失败恒阻断 + RUSTFLAGS=-D warnings
    #       使缓存失效 → 每次 push 冷编译且必失败 → 团队长期 --no-verify 绕过门禁。
    # 增量后：无 .rs 变更秒级跳过；变更 crate 独立编译，绕开无关 crate 失败源，门禁恢复可用。
    # V300: SQLX_OFFLINE=true（离线）。.sqlx 缓存完整性由 CI 全量兜底（CI cargo-check job）。
    # [2026-10-02 修订] stale-base 检查并入本命令前置（lefthook 2.1.10 对独立
    #       stale-base-check 按 pushed files 过滤会 skip，而本命令实证必跑）——
    #       旧 base 时先拦截再编译，杜绝"门禁编译旧 base 假报错"。
    cargo-check-workspace:
      tags: rust check
      run: bash scripts/ci/check-stale-base.sh && bash scripts/ci/run-cargo-changed.sh check

    # [V232-P3 NEW Gate J] cargo fmt workspace check — Rust-only
    cargo-fmt-check:
      tags: rust fmt
      run: |
        cargo fmt --all --check

    # [V232-P3 NEW Gate K] cargo clippy — 增量模式（2026-11-05 修订）
    # 与 check 同理：只对本次 push 变更 crate 执行 clippy；无 .rs 变更秒级跳过。
    # V300: 离线模式（SQLX_OFFLINE=true）。CI rust-lint job 全量兜底。
    cargo-clippy-workspace:
      tags: rust clippy
      run: bash scripts/ci/run-cargo-changed.sh clippy
    # [V294 NEW / 2026-11-14 修订][2026-11-18 修订：移出 push 链路]
    # 只跑 --lib 单元测试，不跑集成测试（集成测试需要数据库）。
    #
    # 2026-11-18 变更原因（实测）：增量 test 仍须为变更 crate 编译测试依赖
    #   （sqlx-postgres/redis/protobuf/prometheus 等），一次 push 内 target 76G→80G、
    #   可用空间降到 12 GiB（94%）仍未编完，7 分钟超时都到不了测试执行阶段。
    #   push 频率远高于全量编译成本，故 test 退出 push 链路：
    #     - push 只跑 fmt / check / clippy（都是增量、秒~分级）
    #     - test 走手动或夜间：见 docs/deploy/parallel-dev-guide.md §3.2
    #
    # 触发方式（任选）：
    #   TOPEMS_PUSH_TEST=1 git push                 # 单次 push 带测试（原语义）
    #   LEFTHOOK_RUN_HEAVY=1 bash scripts/dev/run-nightly-gates.sh   # 全量 --workspace --lib
    #   bash scripts/dev/run-local-gates.sh --rust  # 本地门禁统一入口
    cargo-test-workspace:
      tags: rust test
      timeout: 3600s
      run: |
        if [ -z "${TOPEMS_PUSH_TEST:-}" ]; then
          printf '\033[33m[Gate T] SKIP\033[0m cargo test 已移出 push 链路（push 仍拦截 fmt/check/clippy）。\n'
          printf '  需要测试时：TOPEMS_PUSH_TEST=1 git push  或  bash scripts/dev/run-local-gates.sh --rust\n'
          exit 0
        fi
        export SQLX_OFFLINE=true
        export RUST_TEST_THREADS=1
        # 本机 DB/Redis 使用 .env 中的自定义凭据；测试内默认值（topems:topems_secret）与本机不一致，
        # 故从 .env 派生 TEST_DATABASE_URL / REDIS_URL（已显式提供时不覆盖；缺失则 fail-closed，无内置默认值）
        #
        # [2026-11-12] DATABASE_URL 也必须显式导出：sqlx::test 的 dotenv 从 crate 工作目录向上取
        # 最近一份 .env，被 gitignore 的 crate 级 svc/*/.env 会覆盖根 .env；若其端口不可达或口令陈旧，
        # 全量测试会在 setup 阶段 30s×N 超时报 PoolTimedOut（实测 3 条 ≈92s，单跑 0.3s 通过）。
        # 已存在的环境变量不会被 dotenv 覆盖，从根 .env 派生并导出即可消除这类环境漂移。
        # 测试库 DSN 只认 TEST_DATABASE_URL（进程环境 > .env），**不回退** MIGRATE_URL：
        # .env 的 MIGRATE_URL 通常是 topems_prod（生产库且无 CREATEDB），11-18 事故即由
        # 测试进程继承生产 DSN 造成。缺失即 fail-closed，不猜、不跳。
        TEST_DSN=""
        if [ -f .env ]; then
          TEST_DSN=$(sed -nE 's/^TEST_DATABASE_URL=(.*)/\1/p' .env | head -1)
          if [ -z "${REDIS_URL:-}" ]; then REDIS_URL=$(sed -nE 's/^REDIS_URL=(.*)/\1/p' .env | head -1); fi
        fi
        if [ -z "${TEST_DATABASE_URL:-}" ]; then TEST_DATABASE_URL=$TEST_DSN; fi
        if [ -z "${TEST_DATABASE_URL:-}" ]; then
          printf '\033[31m[Gate T] FAIL\033[0m 未提供 TEST_DATABASE_URL（.env 中也没有）：测试不得回退到 DATABASE_URL / MIGRATE_URL。\n'
          exit 1
        fi
        TEST_DBNAME=$(printf '%s' "$TEST_DATABASE_URL" | sed -E 's#.*/([^/?]+)(\?.*)?$#\1#')
        case "$TEST_DBNAME" in
          *prod*)
            printf '\033[31m[Gate T] FAIL\033[0m TEST_DATABASE_URL 指向疑似生产库（%s），拒绝运行测试（生产零写入）。\n' "$TEST_DBNAME"
            exit 1
            ;;
        esac
        # sqlx::test 读 DATABASE_URL：无条件覆盖为已校验的测试 DSN，
        # 防止调用者 shell 里残留的 DATABASE_URL（可能指向生产）被测试继承。
        if [ -n "${DATABASE_URL:-}" ] && [ "${DATABASE_URL}" != "${TEST_DATABASE_URL}" ]; then
          printf '\033[33m[Gate T] WARN\033[0m 忽略进程内 DATABASE_URL，统一使用 TEST_DATABASE_URL\n'
        fi
        DATABASE_URL=$TEST_DATABASE_URL
        export TEST_DATABASE_URL DATABASE_URL
        if [ -n "${REDIS_URL:-}" ]; then export REDIS_URL; fi
        if [ -n "${LEFTHOOK_RUN_HEAVY:-}" ]; then
          # 全量通道：仅显式 LEFTHOOK_RUN_HEAVY=1 时执行（耗时长）
          source scripts/lib/swagger-ui.sh
          topems_ensure_swagger_ui_archive || exit 1
          cargo test --workspace --lib
        else
          # 增量通道：有 .rs 变更 → 变更 crate 的 --lib 测试必跑；无 .rs 变更 → SKIP
          bash scripts/ci/run-cargo-changed.sh test
        fi

    # [2026-10-22 NEW Gate DP] 业务域运行态探活（与 contract-gate 静态挂载互补）
    # svc crate utoipa path → BFF GET 全路径 5xx 扫描（缺表/缺列/死锁等运行态缺陷）。
    # [2026-11-14 修订] 本 gate 默认 SKIP：它依赖运行中的 BFF 与真实库，CI 无此运行态、未接入；
    # 需部署机手动执行 bash scripts/dev/domain-probe.sh（本地具备 BFF 运行态时可 LEFTHOOK_RUN_HEAVY=1 尝试）。
    # 不再声称“CI 已兜底”——该说法不成立，见 2026-11-14 门禁排查。
    domain-probe:
      tags: runtime probe
      timeout: 1800s
      run: |
        if [ -z "${LEFTHOOK_RUN_HEAVY:-}" ]; then
          printf '\033[33m[Gate DP] SKIP\033[0m domain-probe（需部署机手动执行：bash scripts/dev/domain-probe.sh；CI 未接入）\n'
          exit 0
        fi
        bash scripts/dev/domain-probe.sh

    # [Gate DC] decode 契约扫描（W6-D）：交叉比对列目录与 Rust 动态解码类型
    # 输入优先级：PROD_COLS_CATALOG（显式覆盖，可指向 /tmp）> 仓库快照
    #             scripts/ci/data/prod_cols.psv > /tmp/prod_cols.psv（兼容旧路径）。
    # 快照由 scripts/ci/refresh-prod-cols.sh 只读导出并随仓库提交，不依赖 /tmp 存活。
    # 缺快照：涉及 svc/*/src/modules/**.rs 才 FAIL（报错含恢复/刷新方法）；否则 SKIP。
    # 陈旧判定：快照超过 max_age_days（默认 7）或账本 max 与当前不一致 → WARN 放行。
    # 账本比对仅在提供 PROD_COLS_LEDGER_MAX 或 PROD_COLS_LEDGER_DB_URL 时执行（不默认连库）。
    decode-contract:
      tags: database rust contract
      run: |
        SNAPSHOT="scripts/ci/data/prod_cols.psv"
        META_DEFAULT="scripts/ci/data/prod_cols.meta.json"
        if [ -n "${PROD_COLS_CATALOG:-}" ]; then
          CATALOG="$PROD_COLS_CATALOG"
          META="${PROD_COLS_META:-$(dirname "$CATALOG")/prod_cols.meta.json}"
        elif [ -f "$SNAPSHOT" ]; then
          CATALOG="$SNAPSHOT"
          META="${PROD_COLS_META:-$META_DEFAULT}"
        elif [ -f /tmp/prod_cols.psv ]; then
          CATALOG="/tmp/prod_cols.psv"
          META="${PROD_COLS_META:-/tmp/prod_cols.meta.json}"
        else
          CATALOG=""
          META=""
        fi

        if [ -z "$CATALOG" ] || [ ! -f "$CATALOG" ]; then
          BASE="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git merge-base '@{upstream}' HEAD 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            printf '\033[31m[Gate DC] FAILED\033[0m 无法确定变更基线（origin/main、@{upstream} 均不可用），解码契约无法判定。\n'
            printf '  修复：先执行 git fetch origin 确保 origin/main 存在，再重跑；不要用 --no-verify 绕过。\n'
            exit 1
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^svc/[^/]+/src/modules/.*\.rs$'; then
            if [ -n "${PROD_COLS_CATALOG:-}" ]; then
              printf '\033[31m[Gate DC] FAILED\033[0m 本次变更涉及 svc/*/src/modules/**.rs，但指定列目录不存在（PROD_COLS_CATALOG=%s）。\n' "$PROD_COLS_CATALOG"
            else
              printf '\033[31m[Gate DC] FAILED\033[0m 本次变更涉及 svc/*/src/modules/**.rs，但列目录快照不存在（%s 与 /tmp/prod_cols.psv 均缺失）。\n' "$SNAPSHOT"
            fi
            printf '  修复：git checkout -- %s %s 恢复仓库快照；或 bash scripts/ci/refresh-prod-cols.sh 只读重导（不需要生产写权限）。\n' "$SNAPSHOT" "$META_DEFAULT"
            printf '  不要用 --no-verify 绕过；若本次未改动态解码，请把无关的 modules/*.rs 变更拆出。\n'
            exit 1
          fi
          printf '\033[33m[Gate DC] SKIP\033[0m 列目录快照缺失，但本次变更不涉及 svc/*/src/modules/**.rs（无需解码契约校验）\n'
          exit 0
        fi

        # 陈旧判定：只 WARN，不阻断（缺文件才 FAIL）
        AGE_DAYS=""
        SNAP_LEDGER=""
        if [ -f "$META" ]; then
          AGE_DAYS="$(node -e 'try{const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const t=Date.parse(m.exported_at);if(Number.isFinite(t))process.stdout.write(String(Math.floor((Date.now()-t)/86400000)))}catch(e){}' "$META" 2>/dev/null || true)"
          SNAP_LEDGER="$(node -e 'try{const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.ledger_max||""))}catch(e){}' "$META" 2>/dev/null || true)"
        fi
        MAX_AGE="${PROD_COLS_MAX_AGE_DAYS:-7}"
        if [ -n "$AGE_DAYS" ] && [ "$AGE_DAYS" -gt "$MAX_AGE" ] 2>/dev/null; then
          printf '\033[33m[Gate DC] WARN\033[0m 列目录快照已 %s 天未刷新（阈值 %s 天，导出时间见 %s）。\n' "$AGE_DAYS" "$MAX_AGE" "$META"
          printf '  建议：合并前或每周执行 bash scripts/ci/refresh-prod-cols.sh 并提交快照；本 gate 继续放行，不阻断。\n'
        elif [ -z "$AGE_DAYS" ]; then
          printf '\033[33m[Gate DC] WARN\033[0m 无法读取快照时效（%s 缺失或 exported_at 非法），继续扫描。\n' "$META"
        fi
        CURRENT_LEDGER="${PROD_COLS_LEDGER_MAX:-}"
        if [ -z "$CURRENT_LEDGER" ] && [ -n "${PROD_COLS_LEDGER_DB_URL:-}" ] && command -v psql >/dev/null 2>&1; then
          CURRENT_LEDGER="$(PGOPTIONS='-c default_transaction_read_only=on' psql "$PROD_COLS_LEDGER_DB_URL" -tA -c 'SELECT COALESCE(max(version)::TEXT, 0) FROM _sqlx_migrations' 2>/dev/null | tr -d '[:space:]' || true)"
        fi
        if [ -n "$CURRENT_LEDGER" ] && [ -n "$SNAP_LEDGER" ] && [ "$CURRENT_LEDGER" != "$SNAP_LEDGER" ]; then
          printf '\033[33m[Gate DC] WARN\033[0m 快照账本 max=%s 与当前=%s 不一致，快照可能滞后。\n' "$SNAP_LEDGER" "$CURRENT_LEDGER"
          printf '  建议：执行 bash scripts/ci/refresh-prod-cols.sh 刷新快照；本 gate 继续放行，不阻断。\n'
        fi

        if ! command -v node >/dev/null 2>&1; then
          printf '\033[31m[Gate DC] FAILED\033[0m 未找到 node（缺少运行环境，不允许静默跳过）。\n'
          printf '  修复：安装 Node.js（brew install node）或确认 PATH 包含 node。\n'
          exit 1
        fi
        node scripts/ci/check-decode-contract.mjs "$CATALOG"
        printf '\033[32m[Gate DC] OK\033[0m 已用 %s 完成解码契约扫描（report-only；high 命中需人工复核）。\n' "$CATALOG"

    # [Gate FM] 前端 mock 兜底门禁：生产路径禁止 API 失败回退假数据
    # 存量债务按 scripts/ci/frontend-mock-fallback-baseline.json 放行；新增阻断、陈旧必核销。
    frontend-mock-fallback:
      tags: frontend
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/src/.*\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        node scripts/ci/check-frontend-mock-fallback.mjs
