pre-commit:
  parallel: true
  commands:
    # [Gate A] Frontend lint (eslint + prettier)
    frontend-lint:
      tags: frontend lint
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/src/.*\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        cd apps/web
        npx eslint $(echo "$STAGED" | sed 's|^apps/web/||') --fix
        npx prettier --write $(echo "$STAGED" | sed 's|^apps/web/||')
        cd "$(git rev-parse --show-toplevel)"
        # git 2.50: tracked files under an ignored dir return exit 1 on `git add <path>`.
        # STAGED paths all come from the index (tracked/staged), so -f only re-stages
        # their modifications and never introduces new ignored files.
        git add -f $STAGED

    # [Gate B] Frontend typecheck (tsc --noEmit)
    frontend-typecheck:
      tags: frontend typecheck
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json)$' || true)
        [ -z "$STAGED" ] && exit 0
        pnpm --filter topems-portal typecheck

    # [Gate C] i18n quality (fake-en + mixed-structure)
    i18n-quality:
      tags: frontend i18n
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-i18n.cjs" ]; then
          node scripts/ci/check-i18n.cjs --mode=quality --strict
        fi

    # [Gate D] Glossary TopN consistency
    glossary-verify:
      tags: frontend i18n glossary
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json|csv)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/verify-glossary.cjs" ]; then
          node scripts/ci/verify-glossary.cjs --strict
        fi

    # [Gate E] Hardcoded CJK precise scan
    # 外部脚本避免 lefthook sh -c 内联引号冲突（Windows 兼容）
    hardcoded-precise:
      tags: frontend i18n hardcoded
      run: bash scripts/ci/check-hardcoded-precise.sh

    # [Gate F/G/R] 重型检查（cargo test / clippy）已移至 pre-push hook，
    # 避免 pre-commit 超时（cargo test --workspace 需 3-5min，clippy --all-targets 需 2-3min）。
    # pre-push 已有 cargo-fmt-check + cargo-clippy-workspace，下方补充 cargo-test-workspace。

    # [Gate G] Permission matrix 3-way gate (dry-run)
    perm-matrix:
      tags: permission security
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/perm-matrix-toolkit.cjs" ]; then
          node scripts/ci/perm-matrix-toolkit.cjs ci-report --dry-run
        fi

    # [Gate M] Axum Layer Order Gate (dry-run)
    axum-layer:
      tags: rust axum layer
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|toml|lock)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-axum-layer-order.cjs" ]; then
          node scripts/ci/check-axum-layer-order.cjs
        fi

    # [Gate S] SQLx offline cache freshness (dry-run · WARN only, never blocks commit)
    # Triggers on .rs / .sql changes or any .sqlx/ cache edit so authors remember
    # to commit regenerated .sqlx/query-*.json alongside SQL/migration changes.
    sqlx-cache-freshness:
      tags: rust sqlx cache
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|sql)$|^\.sqlx/' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-sqlx-cache-freshness.cjs" ]; then
          node scripts/ci/check-sqlx-cache-freshness.cjs
        fi

    # [Gate H] CRM contract consistency
    crm-contract:
      tags: crm contract
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/dev/check-crm-contract.mjs" ]; then
          node scripts/dev/check-crm-contract.mjs
        fi

    # [Gate I] Icon completeness + Page standardization
    icon-page:
      tags: frontend icon page
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-icons.cjs" ]; then
          node scripts/ci/check-icons.cjs --strict
        fi
        if [ -f "scripts/ci/page-audit.cjs" ]; then
          node scripts/ci/page-audit.cjs --diff --strict
        fi

    # [Gate N] Large files check (>1MB) — migrated from husky #1
    # 外部脚本避免 lefthook sh -c 内联引号冲突（Windows 兼容）
    large-files:
      tags: files size
      run: bash scripts/ci/check-large-files.sh

    # [Gate O] Sensitive information scan — migrated from husky #2
    sensitive-info:
      tags: security secrets
      run: bash scripts/ci/check-sensitive-info.sh

    # [Gate P] API path duplicates check — migrated from husky #4
    # NOTE: scripts/check_api_duplicates_ci.py is known to require a live DB.
    # [Gate P] API Gate（check-api 三合一审计：audit+coverage+compare，dry-run 报告不阻断）
    api-gate:
      tags: api rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-api.cjs" ]; then
          node scripts/ci/check-api.cjs --mode=all --dry-run
        else
          printf '\033[33m[Gate P] WARN\033[0m scripts/ci/check-api.cjs not found, skipping api-gate check\n'
          exit 0
        fi

    # [Gate P2] Schema boundary check（Plan v1.0 §4.4 编译时边界 CI 侧强制：
    # 全量扫描 svc 裸 sqlx 查询的 schema.table 引用，跨 schema 违规阻断提交）
    boundary-gate:
      tags: boundary rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/check-boundary.cjs" ]; then
          node scripts/check-boundary.cjs
        else
          printf '\033[33m[Gate P2] WARN\033[0m scripts/check-boundary.cjs not found, skipping boundary-gate\n'
          exit 0
        fi

    # [Gate P2b] API boundary check（修复建议⑨，2026-09-09 编码）：
    # 前端 apiClient.<svc> 调用路径（baseURL+path 前 3 段）必须在后端路由注册表中；
    # 预埋零消费进 allowlist（prebuilt），页面在役但后端未实现进 allowlist（known_gap，需实现）
    api-boundary-gate:
      tags: api boundary frontend
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/src/.*\.(ts|tsx)$|^svc/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-api-boundary.cjs" ]; then
          node scripts/ci/check-api-boundary.cjs
        else
          printf '\033[33m[Gate P2b] WARN\033[0m scripts/ci/check-api-boundary.cjs not found, skipping api-boundary-gate\n'
          exit 0
        fi

    # [Gate Q] Hardcoded CJK in admin module (strict) — migrated from husky #8b
    i18n-hardcode-admin:
      tags: frontend i18n hardcoded
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-i18n.cjs" ]; then
          node scripts/ci/check-i18n.cjs --mode=hardcode --strict
        fi

pre-push:
  parallel: true
  commands:
    # [V232-P3 NEW Gate J] cargo fmt workspace check — Rust-only
    cargo-fmt-check:
      tags: rust fmt
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|toml|lock)$' || true)
        [ -z "$STAGED" ] && exit 0
        cargo fmt --all --check

    # [V232-P3 NEW Gate K] cargo clippy workspace — Rust-only
    cargo-clippy-workspace:
      tags: rust clippy
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|toml|lock)$' || true)
        [ -z "$STAGED" ] && exit 0
        cargo clippy --workspace --all-targets -- -D warnings

    # [V294 NEW] cargo test workspace — Rust-only（从 pre-commit 移入，避免提交超时）
    cargo-test-workspace:
      tags: rust test
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|toml|lock)$' || true)
        [ -z "$STAGED" ] && exit 0
        cargo test --workspace
