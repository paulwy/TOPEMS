pre-commit:
  parallel: true
  commands:
    # [Gate SC] Shellcheck 回归防线（P1-1 清零后固化）— 暂存变更模式
    # 无 .sh 变更即秒级跳过；有变更必须 0 告警，否则阻断提交
    shellcheck-changed:
      tags: shellcheck
      run: bash scripts/ci/check-shellcheck.sh --changed-only

    # [Gate A] Frontend lint (eslint + prettier)
    frontend-lint:
      tags: frontend lint
      run: bash scripts/ci/frontend-lint.sh
    frontend-typecheck:
      tags: frontend typecheck
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json)$' || true)
        [ -z "$STAGED" ] && exit 0
        pnpm --filter topems-portal typecheck

    # [Gate C] i18n quality (fake-en + mixed-structure)
    i18n-quality:
      tags: frontend i18n
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-i18n.cjs" ]; then
          node scripts/ci/check-i18n.cjs --mode=quality --strict
        fi

    # [Gate D] Glossary TopN consistency
    glossary-verify:
      tags: frontend i18n glossary
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/.*\.(ts|tsx|js|jsx|cjs|mjs|json|csv)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/verify-glossary.cjs" ]; then
          node scripts/ci/verify-glossary.cjs --strict
        fi

    # [Gate E] Hardcoded CJK precise scan
    # 外部脚本避免 lefthook sh -c 内联引号冲突（Windows 兼容）
    hardcoded-precise:
      tags: frontend i18n hardcoded
      run: bash scripts/ci/check-hardcoded-precise.sh

    # [Gate F/G/R] 重型检查（cargo test / clippy）已移至 pre-push hook，
    # 避免 pre-commit 超时（cargo test --workspace 需 3-5min，clippy --all-targets 需 2-3min）。
    # pre-push 已有 cargo-fmt-check + cargo-clippy-workspace，下方补充 cargo-test-workspace。

    # [Gate G] Permission matrix 3-way gate (dry-run)
    perm-matrix:
      tags: permission security
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/perm-matrix-toolkit.cjs" ]; then
          node scripts/ci/perm-matrix-toolkit.cjs ci-report --dry-run
        fi

    # [Gate M] Axum Layer Order Gate (dry-run)
    axum-layer:
      tags: rust axum layer
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|toml|lock)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-axum-layer-order.cjs" ]; then
          node scripts/ci/check-axum-layer-order.cjs
        fi

    # [Gate S] SQLx offline cache integrity (V300: WARN-only → BLOCKING)
    # 历史教训：静态启发式（文件数/脏标记）抓不住"缓存缺查询"（53 个文件也曾全 PASS）。
    # 真正可靠的验证只有离线编译：SQLX_OFFLINE=true cargo check 宏服务，缓存缺失必报错。
    # 触发条件：.sql/.sqlx 变更（V538：纯 .rs 变更不再触发——重型 cargo check 27 包已由
    # pre-push 的 cargo-check-workspace SQLX_OFFLINE 全量兜底）。失败时运行
    # ./scripts/dev/sqlx-prepare.sh 刷新缓存后重提。
    sqlx-cache-freshness:
      tags: rust sqlx cache
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(sql)$|^\.sqlx/' || true)
        [ -z "$STAGED" ] && exit 0
        bash scripts/dev/sqlx-prepare.sh --check || {
          echo "❌ [Gate S] SQLx 离线缓存不完整或不一致，提交已阻断。"
          echo "   请运行: ./scripts/dev/sqlx-prepare.sh"
          echo "   然后: git add .sqlx && git commit"
          exit 1
        }

    # [Gate H] CRM contract consistency
    crm-contract:
      tags: crm contract
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(rs|ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/dev/check-crm-contract.mjs" ]; then
          node scripts/dev/check-crm-contract.mjs
        fi

    # [Gate I] Icon completeness + Page standardization
    icon-page:
      tags: frontend icon page
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-icons.cjs" ]; then
          node scripts/ci/check-icons.cjs --strict
        fi
        if [ -f "scripts/ci/page-audit.cjs" ]; then
          node scripts/ci/page-audit.cjs --diff --strict
        fi

    # [Gate T] 统一错误出口（V517）— 报告模式，不阻断提交
    # 背景：svc 层存量 692 处把原始 SQL/IO 错误回给客户端（307 format! 拼接 +
    #       385 处 <err>.to_string()），按基线逐步清退，故此处只报告不阻断。
    # CI 侧由 error-handling-gate（--changed-only）拦截新增。
    # 决策依据：docs/architecture/unified-error-handling-decision.md
    error-handling:
      tags: rust errors
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-error-handling.cjs" ]; then
          node scripts/ci/check-error-handling.cjs
        fi

    # [Gate V518] 桥接网完备性（B7 收尾：新增错误类型必须有 → TopemsError 桥接）
    bridge-coverage:
      tags: rust errors
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|scripts/ci/check-bridge-coverage.cjs|scripts/ci/bridge-coverage-allowlist.json' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-bridge-coverage.cjs" ]; then
          node scripts/ci/check-bridge-coverage.cjs --changed-only
        fi

    # [Gate R] RLS权限校验
    rls-permissions:
      tags: database rls security
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^scripts/db/|^database/migrations/" || true)
        [ -z "$STAGED" ] && exit 0
        # 本机 DB 使用 .env 中的自定义凭据；脚本内默认值（topems:topems_secret）与本机不一致，
        # 故从 .env 的 MIGRATE_URL 派生 DATABASE_URL（已显式提供时不覆盖）
        if [ -f .env ] && [ -z "${DATABASE_URL:-}" ]; then
          DATABASE_URL=$(sed -nE 's/^MIGRATE_URL=(.*)/\1/p' .env | head -1)
          [ -n "$DATABASE_URL" ] && export DATABASE_URL
        fi
        if [ -f "scripts/ci/check-rls-permissions.cjs" ]; then
          node scripts/ci/check-rls-permissions.cjs
        fi

    # [Gate Q] 配置单一真相源一致性校验（P0-3：services.yaml 权威 ↔ ports.env/Cargo.toml/ports.ts/vite.config/nginx.conf）
    ports-consistency:
      tags: config ports
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^(config/ports.env|config/services.yaml|Cargo.toml|apps/web/src/config/ports.ts|apps/web/vite.config.ts|apps/web/nginx.conf|scripts/ci/check-config-sources.cjs)$" || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-config-sources.cjs" ]; then
          node scripts/ci/check-config-sources.cjs --check
        fi

    # [Gate N] Large files check (>1MB) — migrated from husky #1
    # 外部脚本避免 lefthook sh -c 内联引号冲突（Windows 兼容）
    large-files:
      tags: files size
      run: bash scripts/ci/check-large-files.sh

    # [Gate SD] schema_defense 双写列名对拍止血（第三梯队方案C）
    # 触发：schema_defense 定义点或迁移变更时，全量扫描 TABLE_DEFS vs 同文件内联 CREATE 列名集合
    # 首版 WARN 不 block（新脚本先观察，稳定后去 || echo 恢复阻断）
    schema-defense-drift:
      tags: database schema
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*/schema_defense[^/]*\.rs$|^svc/.*/db/schema\.rs$|^svc/.*/models/(mod|schema_defense)\.rs$|^database/migrations/' || true)
        [ -z "$STAGED" ] && exit 0
        python3 scripts/check-schema-defense-drift.py || echo "WARN: schema_defense 双写疑似漂移（暂不阻断，见上方明细；稳定后转硬阻断）"

    # [Gate MIG] 迁移静态校验（命名/顺序/幂等/checksums 自举）
    # 注意：validate.sh 每次运行会重写 database/checksums.txt——命中时请随提交一并 git add
    migration-validate:
      tags: database migrations
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^database/migrations/.*\.sql$|^database/checksums\.txt$" || true)
        [ -z "$STAGED" ] && exit 0
        bash scripts/migration/validate.sh

    # [Gate O] Sensitive information scan — migrated from husky #2
    sensitive-info:
      tags: security secrets
      run: bash scripts/ci/check-sensitive-info.sh

    # [Gate P] API path duplicates check — migrated from husky #4（脚本已迁移 scripts/tools/，由 CI job 执行）
    # NOTE: scripts/tools/check_api_duplicates_ci.py 纯文件扫描（--ci 离线，无需 live DB）。
    # [Gate P] API Gate（check-api 三合一审计：audit+coverage+compare，dry-run 报告不阻断）
    api-gate:
      tags: api rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-api.cjs" ]; then
          node scripts/ci/check-api.cjs --mode=all --dry-run
        else
          printf '\033[33m[Gate P] WARN\033[0m scripts/ci/check-api.cjs not found, skipping api-gate check\n'
          exit 0
        fi

    # [Gate P2] Schema boundary check（Plan v1.0 §4.4 编译时边界 CI 侧强制：
    # 全量扫描 svc 裸 sqlx 查询的 schema.table 引用，跨 schema 违规阻断提交）
    # V531: 走 allowlist 感知脚本（scripts/ci/check-schema-boundary.cjs）——
    # 既有 known_gap 登记在 schema-boundary-allowlist.json，新违规仍阻断。
    boundary-gate:
      tags: boundary rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-schema-boundary.cjs" ]; then
          node scripts/ci/check-schema-boundary.cjs
        else
          printf '\033[33m[Gate P2] WARN\033[0m scripts/ci/check-schema-boundary.cjs not found, skipping boundary-gate\n'
          exit 0
        fi

    # [Gate P2a] Schema boundary PYTHON gate（与 P2 cjs 互补）：
    # cjs 只查【未被宏包裹】的裸 sqlx 调用点（per-file allowlist）；本 python 脚本按
    # 【服务→schema 归属】扫描 ALL SQL 字面量（含 only_own_schema_query! 宏内），并做
    # 无前缀表名归属解析。事实源 scripts/schema_boundary.json。两者都必须绿。
    # 临时跨 schema 条目（unified-core=D1/U1、search=阶段2治理、integration=D3/U3）已在
    # schema_boundary.json 标注 allow_temporary，阶段2 下架后撤销。
    boundary-gate-py:
      tags: boundary rust
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^svc/.*\.rs$|^lib/.*\.rs$|^scripts/schema_boundary.*\.json$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/check_schema_boundary.py" ]; then
          python3 scripts/check_schema_boundary.py
        else
          printf '\033[33m[Gate P2a] WARN\033[0m scripts/check_schema_boundary.py not found, skipping boundary-gate-py\n'
          exit 0
        fi

    # [Gate P2b] API boundary check（修复建议⑨，2026-09-09 编码）：
    # 前端 apiClient.<svc> 调用路径（baseURL+path 前 3 段）必须在后端路由注册表中；
    # 预埋零消费进 allowlist（prebuilt），页面在役但后端未实现进 allowlist（known_gap，需实现）
    api-boundary-gate:
      tags: api boundary frontend
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^apps/web/src/.*\.(ts|tsx)$|^svc/.*\.rs$' || true)
        if [ -z "$STAGED" ]; then
          exit 0
        fi
        if [ -f "scripts/ci/check-api-boundary.cjs" ]; then
          node scripts/ci/check-api-boundary.cjs
        else
          printf '\033[33m[Gate P2b] WARN\033[0m scripts/ci/check-api-boundary.cjs not found, skipping api-boundary-gate\n'
          exit 0
        fi

    # [Gate Q] Hardcoded CJK in admin module (strict) — migrated from husky #8b
    i18n-hardcode-admin:
      tags: frontend i18n hardcoded
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '\.(ts|tsx)$' || true)
        [ -z "$STAGED" ] && exit 0
        if [ -f "scripts/ci/check-i18n.cjs" ]; then
          node scripts/ci/check-i18n.cjs --mode=hardcode --strict
        fi

    # [Gate MCS] Mobile 契约全量实跑回归（方向1固化，117 端点）
    # 触发：mobile 前端契约 / mobile BFF / shared-service-client 变更。
    # mobile 服务(8070)在线才执行（离线秒级跳过并提示，避免破坏无服务开发流）；
    # 有 FAIL 阻断提交，日志落 /tmp/mobile_smoke_precommit.log。
    mobile-contract-smoke:
      tags: mobile contract smoke
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(apps/mobile/src/api/|svc/mobile/src/|lib/shared-service-client/src/)' || true)
        [ -z "$STAGED" ] && exit 0
        if ! lsof -iTCP:8070 -sTCP:LISTEN >/dev/null 2>&1; then
          printf '\033[33m[Gate MCS] SKIP\033[0m mobile 服务(8070)未运行，契约回归可手动执行 python3 scripts/mobile_contract_smoke.py\n'
          exit 0
        fi
        if python3 scripts/mobile_contract_smoke.py > /tmp/mobile_smoke_precommit.log 2>&1; then
          printf '\033[32m[Gate MCS] PASS\033[0m 117 端点契约实跑回归全绿\n'
        else
          printf '\033[31m[Gate MCS] FAIL\033[0m 见 /tmp/mobile_smoke_precommit.log 末尾 FAIL 行；若为未重启到新二进制，请重启 mobile 后重提\n'
          exit 1
        fi

    # [Gate WCS] Web 前端契约全量实跑回归（portal 契约面，4152 端点）。
    # 触发：web 前端契约 / web BFF(svc/server) / shared-service-client 变更。
    # BFF 服务(8099)在线才执行（离线秒级跳过并提示，避免破坏无服务开发流）；
    # 已知 39 项前端双前缀缺口已在脚本内豁免（docs/web_contract_gap_list.md 单一事实源），
    # 新增 FAIL 照常阻断；日志落 /tmp/web_smoke_precommit.log。
    web-contract-smoke:
      tags: web contract smoke
      run: |
        STAGED=$(git diff --cached --name-only --diff-filter=ACM | grep -E '^(apps/web/src/api/|apps/web/src/utils/apiPath.ts|svc/server/src/|lib/shared-service-client/src/)' || true)
        [ -z "$STAGED" ] && exit 0
        if ! lsof -iTCP:8099 -sTCP:LISTEN >/dev/null 2>&1; then
          printf '\033[33m[Gate WCS] SKIP\033[0m BFF 服务(8099)未运行，契约回归可手动执行 python3 scripts/web_contract_smoke.py\n'
          exit 0
        fi
        if python3 scripts/web_contract_smoke.py > /tmp/web_smoke_precommit.log 2>&1; then
          printf '\033[32m[Gate WCS] PASS\033[0m web 契约实跑回归全绿（4152 端点，已知双前缀 39 项豁免）\n'
        else
          printf '\033[31m[Gate WCS] FAIL\033[0m 见 /tmp/web_smoke_precommit.log 末尾 FAIL 行；若为未重启到新二进制，请重启 BFF 后重提\n'
          exit 1
        fi

pre-push:
  # V300: parallel:true → false。四个 cargo 命令共享 target/包缓存锁，并行会竞争
  # 导致随机失败（曾实测 cargo-test-workspace 并行失败、串行全绿）。
  # P1-4: sccache 加速——已装时自动启用（跨 check/clippy/test 命令共享编译
  #       产物，冷缓存/全量场景显著提速）；未装时静默跳过，不影响门禁语义。
  parallel: false
  commands:
    # [Gate SC] Shellcheck 全量防线（秒级，置于 cargo 门禁前快速失败）
    # P1-1 清零 195→0 后固化：任何脚本改动带告警，push 直接阻断，
    # 不浪费后续 cargo check/clippy/test 数分钟时间。
    shellcheck-workspace:
      tags: shellcheck
      run: bash scripts/ci/check-shellcheck.sh

    # [Gate B12/U9.5] 配置三方一致性（秒级）：services.yaml ↔ ports.env ↔ nginx map
    # 单一信源原则（V66.2）：任何服务/端口/路由变更导致漂移，push 直接阻断。
    config-consistency:
      tags: config
      run: python3 scripts/dev/check-config-consistency.py

    # [NEW] cargo check workspace — 确保代码编译通过（DB schema 和代码同步）
    # V300: SQLX_OFFLINE=false（在线）→ true（离线）。pre-push 是缓存完整性的最后本地防线：
    #       根 .sqlx 缺任何宏查询，离线编译必然失败，push 被阻断，杜绝"本地能过、CI/新环境必炸"。
    # [2026-10-02] 内联逻辑移入 run-cargo-check.sh：失败时按来源归类
    #       （错误文件 ⊆ base → 提示先同步，勿修不属于本次提交的错误）。
    # [2026-10-02 修订] stale-base 检查并入本命令前置（lefthook 2.1.10 对独立
    #       stale-base-check 按 pushed files 过滤会 skip，而本命令实证必跑）——
    #       旧 base 时先拦截再编译，杜绝"门禁编译旧 base 假报错"。
    cargo-check-workspace:
      tags: rust check
      run: bash scripts/ci/check-stale-base.sh && bash scripts/ci/run-cargo-check.sh

    # [V232-P3 NEW Gate J] cargo fmt workspace check — Rust-only
    cargo-fmt-check:
      tags: rust fmt
      run: |
        cargo fmt --all --check

    # [V232-P3 NEW Gate K] cargo clippy workspace — Rust-only
    # 只把 correctness 级别的错误当错误，其他 warning 就好
    # V300: 离线模式（SQLX_OFFLINE=true）——同时验证 .sqlx 缓存完整性
    cargo-clippy-workspace:
      tags: rust clippy
      run: |
        export SQLX_OFFLINE=true
        command -v sccache >/dev/null && export RUSTC_WRAPPER=sccache || true
        cargo clippy --workspace --all-targets -- -D clippy::correctness
    # [V294 NEW] cargo test workspace — Rust-only（从 pre-commit 移入，避免提交超时）
    # 只跑 --lib 单元测试，不跑集成测试（集成测试需要数据库）
    # V300: 离线模式（SQLX_OFFLINE=true）——同时验证 .sqlx 缓存完整性
    # [2026-09-30] 加 timeout=600s：全量正常约 305s，10min 余量充足；
    # 防止测试偶发挂起（如 shared_event Redis 连接 hang）时 pre-push 无限等待
    # （lefthook timeout 默认 ns，必须带单位 s/m）
    # [2026-09-30 修订] 600s 曾偶发超时（sccache 冷缓存/本机负载时全量可达 10min+）：
    # 上调至 900s（15min），同时保留对"测试挂起"的兜底（挂起>15min 仍会阻断）。
    # [2026-10-03 修订] Windows 全量 lib 测试串行实测 2304s/并行 2895s 均超 900s，
    # 且 rd 共享库 TRUNCATE 竞态已由测试内全局锁解决 → 显式 RUST_TEST_THREADS=1
    # （串行稳定，规避任何潜在跨 crate 竞态）并放宽 timeout 至 3600s。
    cargo-test-workspace:
      tags: rust test
      timeout: 3600s
      run: |
        export SQLX_OFFLINE=true
        export RUST_TEST_THREADS=1
        command -v sccache >/dev/null && export RUSTC_WRAPPER=sccache || true
        # 本机 DB/Redis 使用 .env 中的自定义凭据；测试内默认值（topems:topems_secret）与本机不一致，
        # 故从 .env 派生 TEST_DATABASE_URL / REDIS_URL（已显式提供时不覆盖；.env 缺失则回退测试内默认值）
        if [ -f .env ]; then
          if [ -z "${TEST_DATABASE_URL:-}" ]; then TEST_DATABASE_URL=$(sed -nE 's/^MIGRATE_URL=(.*)/\1/p' .env | head -1); fi
          if [ -z "${REDIS_URL:-}" ]; then REDIS_URL=$(sed -nE 's/^REDIS_URL=(.*)/\1/p' .env | head -1); fi
          if [ -n "$TEST_DATABASE_URL" ]; then export TEST_DATABASE_URL; fi
          if [ -n "$REDIS_URL" ]; then export REDIS_URL; fi
        fi
        cargo test --workspace --lib
