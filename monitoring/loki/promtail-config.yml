server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*log

  - job_name: topems-erp
    static_configs:
      - targets:
          - localhost
        labels:
          job: topems-erp
          __path__: /app/logs/erp/*.log

  - job_name: topems-hrm
    static_configs:
      - targets:
          - localhost
        labels:
          job: topems-hrm
          __path__: /app/logs/hrm/*.log

  - job_name: topems-lims
    static_configs:
      - targets:
          - localhost
        labels:
          job: topems-lims
          __path__: /app/logs/lims/*.log

  - job_name: topems-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: topems-services
          __path__: /app/logs/*.log
