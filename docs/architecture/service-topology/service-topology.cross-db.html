<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TopEMS 服务调用拓扑（跨库标记）</title>
<style>
html,body{margin:0;padding:0;background:#f7f8fa;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:18px;color:#1a1b1c;margin:8px 0 4px}
.sub{font-size:12px;color:#6b7280;margin-bottom:12px}
.chart{width:100%;height:680px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#374151;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.same{width:26px;height:0;border-top:2px solid #909399;display:inline-block}
.cross{width:26px;height:0;border-top:2px dashed #d64541;display:inline-block}
.stat{font-size:13px;color:#374151;margin:8px 0}
.stat b{color:#d64541}
.no-echarts{display:none;padding:30px;text-align:center;color:#6b7280}
</style></head>
<body><div class="wrap">
<h1>TopEMS 服务调用拓扑（物理库拆分叠加）</h1>
<div class="sub">边方向 = 调用方 → 被调用方。跨库边（红色虚线）= 拆分后需走服务 API / 集成事件的调用；实线 = 拆分后同库直连。</div>
<div class="stat">设计依赖 36 条边：<b>跨库 31 条</b>（86%）/ 同库 5 条。跨库边均为服务 API 调用（service token），拆分后无需额外改造；真正待治理为数据级直连与预案 3 项。</div>
<div class="legend">
  <span><i class="same"></i>同库（拆分后直连 SQL）</span>
  <span><i class="cross"></i>跨库（拆分后走 API/事件）</span>
</div>
<div class="chart" id="chart"></div>
<div class="no-echarts" id="fallback">ECharts 未加载（需联网 CDN）。跨库清单见 cross-db-calls.md。</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
(function(){
  var el=document.getElementById('chart');
  if(!window.echarts){document.getElementById('fallback').style.display='block';el.style.display='none';return;}
  var option={
    backgroundColor:'transparent',
    title:{text:'服务调用拓扑（跨库标记）',left:'center',top:0,textStyle:{fontSize:15,fontWeight:600,color:'#1a1b1c'}},
    tooltip:{trigger:'item',triggerOn:'click',renderMode:'richText',confine:true,
      formatter:function(p){
        if(!p||!p.dataType)return '';
        if(p.dataType==='edge'){
          var tag=p.data.lineStyle&&p.data.lineStyle.type==='dashed'?'[跨库] ':'[同库] ';
          return tag+p.data.source+' → '+p.data.target;
        }
        return p.name;
      }},
    legend:{top:30,type:'scroll',itemWidth:14,itemHeight:8,textStyle:{color:'#6b7280',fontSize:11}},
    series:[{type:'graph',layout:'force',roam:true,force:{repulsion:420,edgeLength:110},
      categories:[{ name:"调用方服务" },
    { name:"被调用平台服务" },
    { name:"模块化单体模块" }],
      data:[{ id:"erp-service", name:"erp-service", category:"调用方服务", symbolSize:34 },
    { id:"wms-service", name:"wms-service", category:"被调用平台服务", symbolSize:34 },
    { id:"finance-service", name:"finance-service", category:"调用方服务", symbolSize:34 },
    { id:"hrm-service", name:"hrm-service", category:"被调用平台服务", symbolSize:34 },
    { id:"crm-service", name:"crm-service", category:"调用方服务", symbolSize:34 },
    { id:"workflow-service", name:"workflow-service", category:"被调用平台服务", symbolSize:34 },
    { id:"mobile-service", name:"mobile-service", category:"调用方服务", symbolSize:34 },
    { id:"mes-service", name:"mes-service", category:"被调用平台服务", symbolSize:34 },
    { id:"qms-service", name:"qms-service", category:"调用方服务", symbolSize:34 },
    { id:"notification-service", name:"notification-service", category:"被调用平台服务", symbolSize:34 },
    { id:"srm-service", name:"srm-service", category:"调用方服务", symbolSize:34 },
    { id:"pm-service", name:"pm-service", category:"调用方服务", symbolSize:34 },
    { id:"ehs-service", name:"ehs-service", category:"调用方服务", symbolSize:34 },
    { id:"portal-service", name:"portal-service", category:"调用方服务", symbolSize:34 },
    { id:"monitor-service", name:"monitor-service", category:"被调用平台服务", symbolSize:34 },
    { id:"iam-service", name:"iam-service", category:"被调用平台服务", symbolSize:34 },
    { id:"server-erp-module", name:"server-erp-module", category:"模块化单体模块", symbolSize:26 },
    { id:"server-crm-module", name:"server-crm-module", category:"模块化单体模块", symbolSize:26 },
    { id:"server-pm-module", name:"server-pm-module", category:"模块化单体模块", symbolSize:26 },
    { id:"server-qms-module", name:"server-qms-module", category:"模块化单体模块", symbolSize:26 },
    { id:"server-finance-module", name:"server-finance-module", category:"模块化单体模块", symbolSize:26 },
    { id:"server-srm-module", name:"server-srm-module", category:"模块化单体模块", symbolSize:26 },
    { id:"server-ehs-module", name:"server-ehs-module", category:"模块化单体模块", symbolSize:26 }],
      links:[{ source:"erp-service", target:"wms-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"erp-service", target:"finance-service", value:1 },
    { source:"erp-service", target:"hrm-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"crm-service", target:"erp-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"crm-service", target:"wms-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"crm-service", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"mobile-service", target:"wms-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"mobile-service", target:"mes-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"mobile-service", target:"qms-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"mobile-service", target:"hrm-service", value:1 },
    { source:"mobile-service", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"mobile-service", target:"notification-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"srm-service", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"qms-service", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"pm-service", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"finance-service", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"ehs-service", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"portal-service", target:"notification-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"portal-service", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"portal-service", target:"mes-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"portal-service", target:"monitor-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"portal-service", target:"iam-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"portal-service", target:"hrm-service", value:1 },
    { source:"portal-service", target:"erp-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"portal-service", target:"crm-service", value:1 },
    { source:"portal-service", target:"finance-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-erp-module", target:"hrm-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-erp-module", target:"finance-service", value:1 },
    { source:"server-crm-module", target:"erp-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-crm-module", target:"wms-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-crm-module", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-pm-module", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-qms-module", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-finance-module", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-srm-module", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } },
    { source:"server-ehs-module", target:"workflow-service", value:1, lineStyle:{ color:"#d64541", width:2, type:"dashed" } }],
      lineStyle:{color:'source',curveness:0.12,opacity:0.75},
      edgeSymbol:['none','arrow'],edgeSymbolSize:[0,9],
      label:{show:true,position:'right',color:'#374151',fontSize:11,
        formatter:function(p){return p.name.replace('-service','').replace('-module','(m)');}},
      emphasis:{focus:'adjacency',lineStyle:{width:6}}
    }]
  };
  var chart=echarts.init(el);chart.setOption(option);
  window.addEventListener('resize',function(){chart.resize();});
})();
</script>
</body></html>
