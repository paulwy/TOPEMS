paths:
  /api/core/iam/auth/login:
    post:
      tags:
        - "auth"
      summary: "用户登录"
      description: "通过用户名和密码获取JWT令牌"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "admin"
                password:
                  type: string
                  example: "admin123"
              required:
                - username
                - password
      responses:
        "200":
          description: "登录成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIs..."
                      expires_at:
                        type: string
                        format: date-time
                        example: "2026-06-24T10:00:00Z"
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: "认证失败"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/core/iam/auth/logout:
    post:
      tags:
        - "auth"
      summary: "用户登出"
      description: "使当前令牌失效"
      responses:
        "200":
          description: "登出成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/core/iam/auth/refresh:
    post:
      tags:
        - "auth"
      summary: "刷新令牌"
      description: "使用刷新令牌获取新的访问令牌"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
                - refresh_token
      responses:
        "200":
          description: "刷新成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expires_at:
                        type: string
                        format: date-time

  /api/core/iam/users:
    get:
      tags:
        - "users"
      summary: "获取用户列表"
      description: "分页获取系统用户列表"
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
          description: "页码"
        - name: page_size
          in: query
          type: integer
          default: 20
          description: "每页数量"
        - name: search
          in: query
          type: string
          description: "搜索关键词"
      responses:
        "200":
          description: "获取成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"

    post:
      tags:
        - "users"
      summary: "创建用户"
      description: "创建新的系统用户"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "newuser"
                password:
                  type: string
                  example: "password123"
                email:
                  type: string
                  example: "newuser@topems.com"
                full_name:
                  type: string
                  example: "新用户"
                is_active:
                  type: boolean
                  example: true
              required:
                - username
                - password
      responses:
        "201":
          description: "创建成功"
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "创建成功"
                  data:
                    $ref: "#/components/schemas/User"

  /api/core/iam/users/{id}:
    get:
      tags:
        - "users"
      summary: "获取用户详情"
      description: "获取指定用户的详细信息"
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
          description: "用户ID"
