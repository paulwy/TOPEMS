openapi: 3.0.3
info:
  title: TOPEMS DSH AI 业务智能 API
  description: |
    TOPEMS DSH（Data-Driven Service Hub）AI 业务智能模块 API 规范。
    
    包含：
    - 业务 Copilot：面向特定业务模块的智能对话
    - 智能表单：表单定义、验证、自动填充
    - 文档智能：文档解析、摘要、搜索、生成
    - AI 治理仪表盘：治理监控、风险评估、合规检查
    
    版本历史：
    - 1.0.0 (2024-01-01): 初始版本
  version: 1.0.0
  contact:
    name: TOPEMS AI Team
    email: ai-team@topems.com
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api/ai
    description: 开发环境
  - url: https://api.topems.com/api/ai
    description: 生产环境
tags:
  - name: Business Copilot
    description: 业务 Copilot 智能对话 API
  - name: Smart Forms
    description: 智能表单 API
  - name: Document Intelligence
    description: 文档智能 API
  - name: Governance Dashboard
    description: AI 治理仪表盘 API
paths:
  /copilot/sessions:
    post:
      tags: [Business Copilot]
      summary: 创建会话
      description: 创建新的业务 Copilot 会话
      operationId: createCopilotSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: 会话创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /copilot/sessions/{session_id}:
    get:
      tags: [Business Copilot]
      summary: 获取会话信息
      description: 获取指定会话的详细信息
      operationId: getCopilotSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 会话信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotSession'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Business Copilot]
      summary: 删除会话
      description: 删除指定会话
      operationId: deleteCopilotSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'
  /copilot/chat:
    post:
      tags: [Business Copilot]
      summary: 发送消息
      description: 向业务 Copilot 发送消息并获取响应
      operationId: sendCopilotMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotRequest'
      responses:
        '200':
          description: Copilot 响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /copilot/intent:
    post:
      tags: [Business Copilot]
      summary: 识别意图
      description: 识别用户输入的意图类型
      operationId: recognizeIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: 用户输入文本
                module:
                  $ref: '#/components/schemas/BusinessModuleType'
      responses:
        '200':
          description: 意图识别结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRecognitionResult'
  /copilot/modules:
    get:
      tags: [Business Copilot]
      summary: 获取所有业务模块配置
      description: 获取所有业务模块的配置列表
      operationId: getAllModuleConfigs
      responses:
        '200':
          description: 业务模块配置列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessModuleConfig'
  /copilot/modules/{module}:
    get:
      tags: [Business Copilot]
      summary: 获取业务模块配置
      description: 获取指定业务模块的配置信息
      operationId: getModuleConfig
      parameters:
        - name: module
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BusinessModuleType'
      responses:
        '200':
          description: 业务模块配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessModuleConfig'
        '404':
          $ref: '#/components/responses/NotFound'
  /copilot/modules/{module}/faq:
    get:
      tags: [Business Copilot]
      summary: 搜索 FAQ
      description: 搜索指定业务模块的常见问题
      operationId: searchFAQ
      parameters:
        - name: module
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BusinessModuleType'
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
      responses:
        '200':
          description: FAQ 搜索结果
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FAQItem'
  /forms:
    get:
      tags: [Smart Forms]
      summary: 获取所有表单定义
      description: 获取所有表单定义列表，可按分类筛选
      operationId: getAllFormDefinitions
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: 表单分类筛选
      responses:
        '200':
          description: 表单定义列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormDefinition'
  /forms/{form_id}:
    get:
      tags: [Smart Forms]
      summary: 获取表单定义
      description: 获取指定表单的定义信息
      operationId: getFormDefinition
      parameters:
        - $ref: '#/components/parameters/FormId'
      responses:
        '200':
          description: 表单定义
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
  /forms/{form_id}/validate:
    post:
      tags: [Smart Forms]
      summary: 验证表单数据
      description: 验证表单数据是否符合定义的规则
      operationId: validateForm
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: true
                  description: 表单数据键值对
      responses:
        '200':
          description: 验证结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormValidationResult'
  /forms/{form_id}/auto-fill:
    post:
      tags: [Smart Forms]
      summary: 自动填充表单
      description: 基于上下文数据自动填充表单字段
      operationId: autoFillForm
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              properties:
                context:
                  type: object
                  additionalProperties: true
                  description: 上下文数据
      responses:
        '200':
          description: 自动填充结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormData'
  /forms/{form_id}/generate:
    post:
      tags: [Smart Forms]
      summary: 从自然语言生成表单
      description: 从自然语言描述中提取表单数据
      operationId: generateFormFromText
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: 自然语言描述
      responses:
        '200':
          description: 生成的表单数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormData'
  /forms/{form_id}/submit:
    post:
      tags: [Smart Forms]
      summary: 提交表单
      description: 提交表单数据进行审批或处理
      operationId: submitForm
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: true
                record_id:
                  type: string
                  description: 已有记录 ID（更新时使用）
      responses:
        '200':
          description: 提交结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormData'
  /forms/{form_id}/draft:
    post:
      tags: [Smart Forms]
      summary: 保存表单草稿
      description: 保存表单数据为草稿
      operationId: saveFormDraft
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: true
                record_id:
                  type: string
      responses:
        '200':
          description: 草稿保存结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormData'
  /documents:
    get:
      tags: [Document Intelligence]
      summary: 获取文档列表
      description: 获取文档列表，支持分页和筛选
      operationId: listDocuments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: document_type
          in: query
          schema:
            $ref: '#/components/schemas/DocumentType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DocumentProcessingStatus'
      responses:
        '200':
          description: 文档列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentInfo'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
    post:
      tags: [Document Intelligence]
      summary: 上传文档
      description: 上传文档进行处理
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 文档文件
                metadata:
                  type: string
                  description: JSON 字符串，包含额外元数据
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfo'
        '413':
          description: 文件过大
  /documents/{document_id}:
    get:
      tags: [Document Intelligence]
      summary: 获取文档信息
      description: 获取文档的基本信息和元数据
      operationId: getDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 文档信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfo'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Document Intelligence]
      summary: 删除文档
      description: 删除指定文档
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 删除成功
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{document_id}/parse:
    post:
      tags: [Document Intelligence]
      summary: 解析文档
      description: 解析文档内容，提取文本、表格、图片和结构信息
      operationId: parseDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 解析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentParseResult'
  /documents/{document_id}/summary:
    get:
      tags: [Document Intelligence]
      summary: 获取文档摘要
      description: 获取已生成的文档摘要
      operationId: getDocumentSummary
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/SummaryType'
      responses:
        '200':
          description: 文档摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
    post:
      tags: [Document Intelligence]
      summary: 生成文档摘要
      description: 生成文档的摘要内容
      operationId: generateDocumentSummary
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                summary_type:
                  $ref: '#/components/schemas/SummaryType'
      responses:
        '200':
          description: 生成的摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
  /documents/{document_id}/search:
    get:
      tags: [Document Intelligence]
      summary: 搜索文档内容
      description: 在文档内容中搜索关键词
      operationId: searchDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    line_number:
                      type: integer
                    content:
                      type: string
                    match_count:
                      type: integer
  /documents/{document_id}/download:
    get:
      tags: [Document Intelligence]
      summary: 下载文档
      description: 下载文档文件
      operationId: downloadDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: 文档文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /documents/generate:
    post:
      tags: [Document Intelligence]
      summary: 生成文档
      description: 从结构化内容生成文档
      operationId: generateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentGenerationRequest'
      responses:
        '200':
          description: 生成的文档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfo'
  /governance/dashboard:
    get:
      tags: [Governance Dashboard]
      summary: 获取治理仪表盘数据
      description: 获取完整的治理仪表盘数据
      operationId: getGovernanceDashboard
      parameters:
        - name: time_range
          in: query
          schema:
            $ref: '#/components/schemas/TimeRange'
            default: 24h
      responses:
        '200':
          description: 治理仪表盘数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceDashboardData'
  /governance/score:
    get:
      tags: [Governance Dashboard]
      summary: 获取治理评分
      description: 获取总体治理评分和各维度分解
      operationId: getGovernanceScore
      parameters:
        - name: time_range
          in: query
          schema:
            $ref: '#/components/schemas/TimeRange'
      responses:
        '200':
          description: 治理评分
          content:
            application/json:
              schema:
                type: object
                properties:
                  overall_score:
                    type: number
                  governance_level:
                    $ref: '#/components/schemas/GovernanceLevel'
                  breakdown:
                    type: object
                    properties:
                      security:
                        type: number
                      compliance:
                        type: number
                      cost:
                        type: number
                      performance:
                        type: number
                      reliability:
                        type: number
  /governance/risk:
    get:
      tags: [Governance Dashboard]
      summary: 获取风险评估
      description: 获取详细的风险评估信息
      operationId: getRiskAssessment
      parameters:
        - name: time_range
          in: query
          schema:
            $ref: '#/components/schemas/TimeRange'
      responses:
        '200':
          description: 风险评估
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessment'
  /governance/compliance:
    get:
      tags: [Governance Dashboard]
      summary: 获取合规状态
      description: 获取合规检查状态
      operationId: getComplianceStatus
      parameters:
        - name: framework
          in: query
          schema:
            type: string
          description: 合规框架名称
      responses:
        '200':
          description: 合规状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceStatus'
  /governance/cost:
    get:
      tags: [Governance Dashboard]
      summary: 获取成本分析
      description: 获取成本分析数据
      operationId: getCostAnalysis
      parameters:
        - name: time_range
          in: query
          schema:
            $ref: '#/components/schemas/TimeRange'
      responses:
        '200':
          description: 成本分析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostAnalysis'
  /governance/performance:
    get:
      tags: [Governance Dashboard]
      summary: 获取性能指标
      description: 获取性能监控指标
      operationId: getPerformanceMetrics
      parameters:
        - name: time_range
          in: query
          schema:
            $ref: '#/components/schemas/TimeRange'
      responses:
        '200':
          description: 性能指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceMetrics'
  /governance/security-events:
    get:
      tags: [Governance Dashboard]
      summary: 获取安全事件
      description: 获取安全事件列表
      operationId: getSecurityEvents
      parameters:
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/RiskLevel'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 安全事件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityEventSummary'
                  total:
                    type: integer
    post:
      tags: [Governance Dashboard]
      summary: 记录安全事件
      description: 记录新的安全事件
      operationId: recordSecurityEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, severity, description]
              properties:
                event_type:
                  type: string
                severity:
                  $ref: '#/components/schemas/RiskLevel'
                description:
                  type: string
                affected_resource:
                  type: string
                status:
                  type: string
      responses:
        '201':
          description: 事件记录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityEventSummary'
  /governance/audit:
    get:
      tags: [Governance Dashboard]
      summary: 获取审计日志摘要
      description: 获取审计日志的统计摘要
      operationId: getAuditSummary
      parameters:
        - name: time_range
          in: query
          schema:
            $ref: '#/components/schemas/TimeRange'
      responses:
        '200':
          description: 审计日志摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSummary'
  /governance/trends:
    get:
      tags: [Governance Dashboard]
      summary: 获取趋势数据
      description: 获取时间序列趋势数据
      operationId: getTrends
      parameters:
        - name: time_range
          in: query
          schema:
            $ref: '#/components/schemas/TimeRange'
            default: 24h
        - name: metrics
          in: query
          schema:
            type: string
          description: 逗号分隔的指标列表
      responses:
        '200':
          description: 趋势数据
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrendDataPoint'
  /governance/recommendations:
    get:
      tags: [Governance Dashboard]
      summary: 获取建议和改进项
      description: 获取系统生成的优化建议
      operationId: getRecommendations
      parameters:
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/RecommendationPriority'
      responses:
        '200':
          description: 建议列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'
  /governance/refresh:
    post:
      tags: [Governance Dashboard]
      summary: 刷新仪表盘缓存
      description: 清除并刷新仪表盘数据缓存
      operationId: refreshDashboardCache
      responses:
        '200':
          description: 刷新成功
  /governance/export:
    get:
      tags: [Governance Dashboard]
      summary: 导出治理报告
      description: 导出治理报告为指定格式
      operationId: exportGovernanceReport
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [pdf, excel, json]
        - name: time_range
          in: query
          schema:
            $ref: '#/components/schemas/TimeRange'
      responses:
        '200':
          description: 报告文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 认证令牌
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 会话 ID
    FormId:
      name: form_id
      in: path
      required: true
      schema:
        type: string
      description: 表单 ID
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 文档 ID
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
