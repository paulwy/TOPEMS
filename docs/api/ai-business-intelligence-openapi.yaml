      required: [generated_at, time_range, overall_score, governance_level, key_metrics, risk_assessment, compliance_status, cost_analysis, performance_metrics, security_events, audit_summary, trends, recommendations]
      properties:
        generated_at:
          type: string
          format: date-time
        time_range:
          $ref: '#/components/schemas/TimeRange'
        overall_score:
          type: number
          format: float
        governance_level:
          $ref: '#/components/schemas/GovernanceLevel'
        key_metrics:
          $ref: '#/components/schemas/KeyMetrics'
        risk_assessment:
          $ref: '#/components/schemas/RiskAssessment'
        compliance_status:
          $ref: '#/components/schemas/ComplianceStatus'
        cost_analysis:
          $ref: '#/components/schemas/CostAnalysis'
        performance_metrics:
          $ref: '#/components/schemas/PerformanceMetrics'
        security_events:
          type: array
          items:
            $ref: '#/components/schemas/SecurityEventSummary'
        audit_summary:
          $ref: '#/components/schemas/AuditSummary'
        trends:
          type: array
          items:
            $ref: '#/components/schemas/TrendDataPoint'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
security:
  - bearerAuth: []
