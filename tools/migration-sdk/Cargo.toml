[package]
name = "topems-migration-sdk"
version = "0.1.0"
edition = "2021"
resolver = "2"
description = "TOPEMS Migration SDK - 插件数据库迁移工具"
license = "MIT"

[dependencies]
# 数据库 - 仅使用 postgres 特性避免 sqlite 冲突
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "derive"] }
tokio = { workspace = true, features = ["full"] }

# Redis 分布式锁
redis = { workspace = true, features = ["tokio-comp"] }

# 序列化
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# 日志
tracing.workspace = true

# UUID
uuid = { workspace = true, features = ["v4", "serde"] }

# 时间
chrono = { workspace = true, features = ["serde"] }

# 错误处理
thiserror.workspace = true

# 异步
async-trait.workspace = true

# 哈希
sha2.workspace = true
hex.workspace = true

# OpenAPI 文档骨架（V71 A1）
utoipa.workspace = true

[dev-dependencies]
