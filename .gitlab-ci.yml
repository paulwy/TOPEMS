image: docker:24-dind

services:
  - docker:24-dind

stages:
  - code-quality
  - build
  - test
  - security
  - docker-build
  - deploy
  - notify

variables:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: registry.gitlab.com
  IMAGE_PREFIX: $CI_PROJECT_PATH

before_script:
  - export PATH=$PATH:/usr/local/cargo/bin
  - which cargo || true

code-quality:rust:
  stage: code-quality
  image: rust:1.76
  before_script:
    - cargo install cargo-sort
    - cargo install cargo-checksum
  script:
    - echo "Running Rust code quality checks..."
    - for service in services/backend platform/*/backend; do
        if [ -d "$service" ] && [ -f "$service/Cargo.toml" ]; then
          echo "Checking $service";
          cd $service;
          cargo fmt --all -- --check || { echo "Formatting issues found"; exit 1; };
          cargo clippy --all-targets --all-features -- -D warnings || { echo "Clippy issues found"; exit 1; };
          cd -;
        fi;
      done
  allow_failure: false
  only:
    - main
    - develop
    - merge_requests
    - tags

code-quality:frontend:
  stage: code-quality
  image: node:20
  before_script:
    - npm install -g prettier eslint
  script:
    - echo "Running frontend code quality checks..."
    - |
      if [ -f "frontend/package.json" ]; then
        cd frontend
        npx prettier --check "src/**/*.{ts,tsx}" || { echo "Formatting issues found"; exit 1; }
        npx eslint "src/**/*.{ts,tsx}" || { echo "ESLint issues found"; exit 1; }
        cd ..
      fi
  allow_failure: false
  only:
    - main
    - develop
    - merge_requests
    - tags

build:backend:
  stage: build
  image: rust:1.76
  parallel:
    matrix:
      - SERVICE: [backend, notification-service, report-service]
  script:
    - echo "Building Rust backend service: $SERVICE"
    - cd services/$SERVICE
    - cargo build --release
    - mv target/release/$SERVICE /builds/$SERVICE
    - cd ../..
  artifacts:
    paths:
      - /builds/*
    expire_in: 1 week
  only:
    - main
    - develop
    - merge_requests
    - tags

build:platform:
  stage: build
  image: rust:1.76
  parallel:
    matrix:
      - SERVICE: [topems-doc, topems-flow, topems-iam, topems-lims, topems-qms, topems-rs, topems-ehs, topems-srm, topems-ai]
  script:
    - echo "Building platform service: $SERVICE"
    - cd platform/$SERVICE/backend
    - cargo build --release
    - mv target/release/$SERVICE /builds/$SERVICE
    - cd ../../..
  artifacts:
    paths:
      - /builds/*
    expire_in: 1 week
  only:
    - main
    - develop
    - merge_requests
    - tags

build:frontend:
  stage: build
  image: node:20
  script:
    - |
      if [ -f "frontend/package.json" ]; then
        cd frontend
        npm ci
        npm run build
        mv dist /builds/frontend-dist
        cd ..
      fi
  artifacts:
    paths:
      - /builds/frontend-dist
    expire_in: 1 week
  only:
    - main
    - develop
    - merge_requests
    - tags

test:unit:
  stage: test
  image: rust:1.76
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: topems_test
    POSTGRES_USER: topems
    POSTGRES_PASSWORD: topems_secret
    DATABASE_URL: postgres://topems:topems_secret@postgres:5432/topems_test
    REDIS_URL: redis://redis:6379
  script:
    - echo "Running unit tests..."
    - for service in services/backend platform/*/backend; do
        if [ -d "$service" ] && [ -f "$service/Cargo.toml" ]; then
          echo "Testing $service";
          cd $service;
          cargo test --lib || { echo "Tests failed"; exit 1; };
          cd -;
        fi;
      done
  coverage: '/(?i)total.*?(\d+\.?\d*)%/'
  only:
    - main
    - develop
    - merge_requests
    - tags

test:integration:
  stage: test
  image: rust:1.76
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: topems_test
    POSTGRES_USER: topems
    POSTGRES_PASSWORD: topems_secret
    DATABASE_URL: postgres://topems:topems_secret@postgres:5432/topems_test
    REDIS_URL: redis://redis:6379
  script:
    - echo "Installing dependencies..."
    - apt-get update && apt-get install -y postgresql-client curl
    
    - echo "Setting up test database schema..."
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE SCHEMA IF NOT EXISTS rs;"
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE SCHEMA IF NOT EXISTS rs_test;"
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE SCHEMA IF NOT EXISTS iam;"
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f platform/topems-iam/backend/migrations/20260601000000_initial.sql 2>/dev/null || true
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f services/topems-rs/backend/migrations/20260601000000_projects.sql 2>/dev/null || true
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f services/topems-rs/backend/migrations/20260601000001_project_phases.sql 2>/dev/null || true
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f services/topems-rs/backend/migrations/20260601000002_project_milestones.sql 2>/dev/null || true
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f services/topems-rs/backend/migrations/20260601000003_project_members.sql 2>/dev/null || true
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f services/topems-rs/backend/migrations/20260604000001_add_project_enhancements.sql 2>/dev/null || true
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f services/topems-rs/backend/migrations/20260604000002_add_milestone_enhancements.sql 2>/dev/null || true
    
    - echo "Building IAM service..."
    - cd platform/topems-iam/backend
    - cargo build --release
    
    - echo "Building RS service..."
    - cd ../../services/topems-rs/backend
    - cargo build --release
    
    - echo "Starting IAM service..."
    # JWT_SECRET: 测试密钥,仅用于CI环境,不用于生产环境
    - DATABASE_URL=postgres://topems:topems_secret@postgres:5432/topems_test REDIS_URL=redis://redis:6379 JWT_SECRET=test_jwt_secret_key_for_ci_testing PORT=8000 ./target/release/topems-iam &
    - sleep 15
    - curl -s http://localhost:8000/api/v1/health || (sleep 10 && curl -s http://localhost:8000/api/v1/health)
    
    - echo "Starting RS service..."
    - DATABASE_URL=postgres://topems:topems_secret@postgres:5432/topems_test REDIS_URL=redis://redis:6379 IAM_URL=http://localhost:8000 PORT=8020 ./target/release/topems-rs &
    - sleep 15
    - curl -s http://localhost:8000/api/v1/health || (sleep 10 && curl -s http://localhost:8000/api/v1/health)
    
    - echo "Running integration tests..."
    - cargo test --test api_tests -- --nocapture || { echo "API integration tests failed"; exit 1; }
    - cargo test --test project_relation_tests -- --nocapture || { echo "Project relation integration tests failed"; exit 1; }
  only:
    - main
    - develop
    - merge_requests

test:database:
  stage: test
  image: rust:1.76
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: topems_test
    POSTGRES_USER: topems
    POSTGRES_PASSWORD: topems_secret
    DATABASE_URL: postgres://topems:topems_secret@postgres:5432/topems_test
  script:
    - echo "Setting up test database schema..."
    - apt-get update && apt-get install -y postgresql-client
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE SCHEMA IF NOT EXISTS rs_test;"
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE TABLE IF NOT EXISTS rs_test.projects (id UUID PRIMARY KEY, name VARCHAR(255) NOT NULL, code VARCHAR(100) NOT NULL, description TEXT, project_type VARCHAR(100) NOT NULL, status VARCHAR(50) NOT NULL DEFAULT 'active', leader VARCHAR(255) NOT NULL, team_members JSONB, start_date TIMESTAMPTZ NOT NULL DEFAULT NOW(), end_date TIMESTAMPTZ, budget DOUBLE PRECISION, progress INTEGER NOT NULL DEFAULT 0, created_by VARCHAR(255) NOT NULL, created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW(), project_config JSONB, benefit_target JSONB, risk_level VARCHAR(50), priority INTEGER, tags TEXT[], parent_id UUID, workspace_id UUID);"
    
    - echo "Running database tests for topems-rs..."
    - cd services/topems-rs/backend
    - cargo test --test-threads=1 || { echo "Database tests failed"; exit 1; }
  only:
    - main
    - develop
    - merge_requests
    - tags

test:frontend:
  stage: test
  image: node:20
  script:
    - |
      if [ -f "frontend/package.json" ]; then
        cd frontend
        npm ci
        npm test -- --coverage --watchAll=false || { echo "Frontend tests failed"; exit 1; }
        cd ..
      fi
  coverage: '/(?i)All files.*?\s+(\d+\.?\d+)\s/'
  only:
    - main
    - develop
    - merge_requests
    - tags

test:e2e:
  stage: test
  image: node:20
  services:
    - docker:24-dind
  before_script:
    - npx playwright install --with-deps chromium
  script:
    - docker-compose -f infrastructure/docker/docker-compose.yml up -d
    - sleep 15
    - npx playwright test
    - docker-compose -f infrastructure/docker/docker-compose.yml down
  allow_failure: true
  only:
    - main
    - develop
    - tags

security:audit:
  stage: security
  image: rust:1.76
  script:
    - cargo install cargo-audit || true
    - for service in services/backend platform/*/backend; do
        if [ -d "$service" ] && [ -f "$service/Cargo.toml" ]; then
          cd $service;
          cargo audit || echo "Security audit issues found";
          cd -;
        fi;
      done
  allow_failure: true
  only:
    - main
    - develop
    - tags

security:trivy:
  stage: security
  before_script:
    - export TRIVY_VERSION=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep -oP '"tag_name": "\K[^"]+')
    - wget --no-verbose https://github.com/aquasecurity/trivy/releases/download/$TRIVY_VERSION/trivy_$TRIVY_VERSION_Linux-64bit.tar.gz -O /tmp/trivy.tar.gz
    - tar -xzf /tmp/trivy.tar.gz -C /tmp
    - rm /tmp/trivy.tar.gz
  script:
    - /tmp/trivy image --exit-code 1 --severity HIGH,CRITICAL $REGISTRY/$IMAGE_PREFIX-backend:$CI_COMMIT_SHORT_SHA || true
  allow_failure: true
  only:
    - main
    - develop
    - tags

docker:build-backend:
  stage: docker-build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - echo "Building backend Docker images..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - |
      for service in backend notification-service report-service; do
        docker build -t $REGISTRY/$IMAGE_PREFIX-$service:$CI_COMMIT_SHORT_SHA \
                     -t $REGISTRY/$IMAGE_PREFIX-$service:latest \
                     -f services/$service/Dockerfile \
                     services/$service/
        docker push $REGISTRY/$IMAGE_PREFIX-$service:$CI_COMMIT_SHORT_SHA
        docker push $REGISTRY/$IMAGE_PREFIX-$service:latest
      done
  only:
    - main
    - develop
    - tags

docker:build-platform:
  stage: docker-build
  image: docker:24
  services:
    - docker:24-dind
  parallel:
    matrix:
      - SERVICE: [topems-doc, topems-flow, topems-iam, topems-lims, topems-qms, topems-rs, topems-ehs, topems-srm, topems-ai]
  script:
    - echo "Building platform service Docker image: $SERVICE"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - docker build -t $REGISTRY/$IMAGE_PREFIX-$SERVICE:$CI_COMMIT_SHORT_SHA \
                   -t $REGISTRY/$IMAGE_PREFIX-$SERVICE:latest \
                   -f platform/$SERVICE/backend/Dockerfile \
                   platform/$SERVICE/backend/
    - docker push $REGISTRY/$IMAGE_PREFIX-$SERVICE:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/$IMAGE_PREFIX-$SERVICE:latest
  only:
    - main
    - develop
    - tags

docker:build-frontend:
  stage: docker-build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - echo "Building frontend Docker image..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY
    - docker build -t $REGISTRY/$IMAGE_PREFIX-frontend:$CI_COMMIT_SHORT_SHA \
                   -t $REGISTRY/$IMAGE_PREFIX-frontend:latest \
                   -f frontend/Dockerfile \
                   frontend/
    - docker push $REGISTRY/$IMAGE_PREFIX-frontend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY/$IMAGE_PREFIX-frontend:latest
  only:
    - main
    - develop
    - tags

deploy:dev:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "Deploying to development environment..."
    - |
      ssh -o StrictHostKeyChecking=no $DEV_USER@$DEV_HOST "
        mkdir -p /opt/topems/dev/releases/$(date +%Y%m%d%H%M%S)
        cd /opt/topems/dev
        ./scripts/db_migrate.sh dev
        ./scripts/deploy.sh restart
        ./scripts/health_check.sh
      "
    - echo "Dev deployment completed"
  environment:
    name: development
    url: https://dev.topems.example.com
  only:
    - develop
  when: automatic

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "Deploying to staging environment..."
    - |
      ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "
        mkdir -p /opt/topems/staging/releases/$(date +%Y%m%d%H%M%S)
        cd /opt/topems/staging
        ./scripts/db_migrate.sh staging
        ./scripts/deploy.sh restart
        ./scripts/health_check.sh
      "
    - echo "Staging deployment completed"
  environment:
    name: staging
    url: https://staging.topems.example.com
  only:
    - main
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "Deploying to production environment..."
    - |
      ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "
        cd /opt/topems/production
        ./scripts/rollback.sh backup
        mkdir -p releases/$(date +%Y%m%d%H%M%S)
        ./scripts/db_migrate.sh production
        ./scripts/deploy.sh rolling-update
        ./scripts/health_check.sh
      "
    - echo "Production deployment completed"
  environment:
    name: production
    url: https://topems.example.com
  only:
    - tags
  when: manual

notify:slack:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        ENVIRONMENT="Production"
      elif [ "$CI_COMMIT_BRANCH" == "develop" ]; then
        ENVIRONMENT="Development"
      else
        ENVIRONMENT=$CI_COMMIT_BRANCH
      fi
      
      if [ "$CI_JOB_STATUS" == "success" ]; then
        STATUS="✅ Success"
      else
        STATUS="❌ Failed"
      fi
      
      curl -X POST $SLACK_WEBHOOK_URL \
        -H 'Content-Type: application/json' \
        -d "{
          \"text\": \"$STATUS TOPEMS CI/CD Pipeline\",
          \"attachments\": [{
            \"color\": \"$CI_JOB_STATUS\",
            \"fields\": [
              {\"title\": \"Environment\", \"value\": \"$ENVIRONMENT\", \"short\": true},
              {\"title\": \"Branch\", \"value\": \"$CI_COMMIT_BRANCH\", \"short\": true},
              {\"title\": \"Commit\", \"value\": \"$CI_COMMIT_SHORT_SHA\", \"short\": true},
              {\"title\": \"Author\", \"value\": \"$CI_COMMIT_AUTHOR\", \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"$CI_PIPELINE_URL\", \"short\": false}
            ]
          }]
        }"
  only:
    - main
    - develop
    - tags
  when: always
