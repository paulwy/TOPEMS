# ==============================================================================
# 生产环境 Docker Compose 配置
# ==============================================================================
#
# 【重要】部署前必须设置以下环境变量：
#   - JWT_SECRET: JWT 令牌签名密钥（必须设置为强密码）
#   - REFRESH_SECRET: Refresh Token 签名密钥（必须设置为强密码）
#   - DB_USER: 数据库用户名
#   - DB_PASSWORD: 数据库密码（必须设置为强密码）
#   - DB_NAME: 数据库名称
#
# 建议使用 .env 文件或环境变量管理工具设置这些变量。
# 切勿在版本控制系统中提交包含敏感信息的 .env 文件。
# ==============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: topems-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-topems}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-topems_secret}
      POSTGRES_DB: ${DB_NAME:-topems}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    networks:
      - topems-network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-topems}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: topems-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis-data-prod:/data
    networks:
      - topems-network
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 核心平台服务
  iam-service:
    image: topems-iam-service:latest
    container_name: topems-iam-prod
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${DB_USER:-topems}:${DB_PASSWORD:-topems_secret}@postgres:5432/${DB_NAME:-topems}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8000
      RUST_LOG: info
    networks:
      - topems-network
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  doc-service:
