# cargo audit 忽略登记（TOPEMS）
# 每条必须附理由；新增 ignore 需同步更新 docs/security/audit-ignore-registry.md
#
# RUSTSEC-2023-0071（rsa 0.9.x，Marvin Attack）
# 忽略理由：
#   1. 上游 RustCrypto/RSA 至今无修复版本（RUSTSEC patched=[]，2026-09-12 复核），
#      无法通过升级消除；
#   2. 本项目经 jsonwebtoken（rust_crypto 后端）使用 rsa 仅用于 JWT RS/PS 算法
#      签名验证（SigningKey/BlindedSigningKey/Pkcs1v15Sign/Pss），解密路径零调用，
#      而 Marvin Attack 仅影响 PKCS#1 v1.5 解密（RSAES-PKCS1-v1_5）计时侧信道，
#      实际利用面为空；
#   3. 已引入私有补丁（[patch.crates-io] rsa = path vendor/rsa，manifest 版本 0.9.10）：
#      移植上游 PR #702 implicit rejection 缓解——解密 padding 无效时返回 KDF 派生
#      伪随机消息而非错误，消除错误区分计时侧信道，为未来误用解密路径提供防御。
#      [P3-9 2026-10-24] 版本注释口径校准：vendor/rsa/Cargo.toml 实际声明 0.9.10
#      （上游 0.9.10 + PR #702 补丁），此前误写 0.9.11。
#
# RUSTSEC-2026-0253（lru 0.16.4，informational unsound）
# 忽略理由：经 async-graphql 传递锁定本版；触发需 catch_unwind + panic 落在 Drop 路径，
# 本仓无此用法（2026-10-07 快照比对确认仅 1 条 informational）；随 async-graphql 升级滚动消除。
#
# RUSTSEC-2026-0387（crypto-bigint 0.5.5，常数时间操作计时差异）
# 忽略理由：
#   1. 引入链 jsonwebtoken → p256/ecdsa/elliptic-curve → crypto-bigint 0.5，修复需
#      jsonwebtoken 11.x 大版本升级（10→11 有 API breaking）；
#   2. 本项目 JWT 仅用 RS256（rsa，已 vendor 补丁）/ HS256（HMAC）/ None 算法，
#      ES256/ES384（p256/p384 路径）零调用——该链仅作为 rust_crypto feature 编译依赖
#      存在，运行时不被触达，实际利用面为空；
#   3. 2026-10-28 复核：lib/shared-auth/src/auth.rs 无任何 ES 算法使用。
#      待未来启用 ES 算法或 jsonwebtoken 生态滚动升级时消除。
[advisories]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0253", "RUSTSEC-2026-0387"]
