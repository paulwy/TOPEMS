[build]
target-dir = "target"

[test]
# 默认测试配置
runner = "cargo-nextest run"
# 使用 cargo-nextest 作为测试运行器，提供更好的测试体验

[profile.release]
opt-level = 3
debug = false
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true
split-debuginfo = "unpacked"

[features]
# 覆盖率相关特性
coverage = ["instrument-coverage"]