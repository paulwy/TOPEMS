# TOPEMS 项目专属 Cargo 配置
#
# 三层性能加速：
#   1. sccache 全局缓存（跨 workspace/跨版本复用编译产物）
#   2. 稀疏注册中心（sparse protocol）：index 下载速度提升 5–10×
#   3. cargo-nextest 并行测试运行：测试速度 2–5×
#
# 注：[profile.*] 以工作区 Cargo.toml 为准（release: opt-level=3 + lto=thin + codegen-units=16；
#   dev: opt-level=1 + codegen-units=256），本文件仅兜底默认值。

[build]
target-dir = "target"
# sccache 编译缓存：跨 workspace / 跨版本 / 跨分支复用，典型命中命中率 40–70%
rustc-wrapper = "sccache"
# 抑制第三方依赖（zookeeper v0.8.0）的未来兼容性警告
# zookeeper 0.8.0 为最新版本，使用了未来 Rust 将拒绝的语法，无法通过升级解决
rustflags = ["-A", "future_incompatible"]

[registries.crates-io]
# 稀疏注册中心：替代旧式 git-based index，增量 crates.io 索引更新快 5–10×
protocol = "sparse"

[net]
# 网络不稳定时 3 次重试（指数退避），避免因单次网络抖动导致整次构建失败
retry = 3

[env]
# 编译库一致性治理（2026-09-01）：编译期 sqlx 宏默认走离线缓存（.sqlx/query-*.json），
# 不连接 DATABASE_URL（本机 localhost:5432 被 Homebrew postgres 占用，schema 落后于容器库）。
# - 编译默认：SQLX_OFFLINE=true，避免"关系不存在"编译错（analytics_* 等新表只在容器库）
# - 覆盖方式：需要连库（如 `cargo sqlx prepare` 更新离线缓存）时，显式 `SQLX_OFFLINE=false cargo ...`
#   （force=false，显式环境变量优先）
SQLX_OFFLINE = "true"

[test]
# cargo-nextest：2–5× 测试执行速度，测试报告友好
runner = "cargo-nextest run"

[profile.release]
# 与 workspace Cargo.toml 保持一致（兜底）
#   体积/性能/编译时间均衡：thin LTO + codegen-units=16 并行
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
strip = true

[profile.dev]
# 兜底：workspace Cargo.toml 中 opt-level=1 + debug=1 + strip="symbols" + codegen-units=256 为准
opt-level = 1
debug = 1
strip = "symbols"

[profile.test]
opt-level = 1
debug = 1

[features]
coverage = ["instrument-coverage"]

# 注册中心镜像（国内环境可启用；USTC 镜像支持 sparse protocol）
# 注释说明：如需启用，请取消下一节注释；或在 ~/.cargo/config.toml 中配置。
# [source.crates-io]
# replace-with = "ustc"
#
# [source.ustc]
# registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
