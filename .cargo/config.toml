[build]
target-dir = "target"
rustc-wrapper = "sccache"

[test]
runner = "cargo-nextest run"

[profile.release]
opt-level = 3
debug = false
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true
split-debuginfo = "unpacked"

[features]
coverage = ["instrument-coverage"]