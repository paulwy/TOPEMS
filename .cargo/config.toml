# TOPEMS 项目专属 Cargo 配置
#
# 三层性能加速：
#   1. sccache 全局缓存（跨 workspace/跨版本复用编译产物）
#   2. 稀疏注册中心（sparse protocol）：index 下载速度提升 5–10×
#   3. cargo-nextest 并行测试运行：测试速度 2–5×
#
# 注：[profile.*] 以工作区 Cargo.toml 为准（release: opt-level=3 + lto=thin + codegen-units=16；
#   dev: opt-level=1 + codegen-units=256），本文件仅兜底默认值。

[build]
# 相对路径（相对本文件所在目录的父目录，即仓库根）：无论从 workspace 根还是
# svc/*、lib/* 子目录构建，产物统一落在根 target/，避免 13 个嵌套 target 各自
# 重复编译同一批依赖（此前占磁盘 ~332MB 且拖慢构建）。
# 注意：勿写成硬编码绝对路径——2026-10-01 曾误配为他人机器路径
# /Users/xingzhai/TOPEMS/target，导致本机构建目标目录失效（cargo metadata 解析到
# 不存在的路径，target/ 不再更新）。相对路径自动随机器/仓库位置解析，跨机器可移植。
target-dir = "target"
# [2026-10-02] rustc-wrapper=sccache 已移除：sccache 0.16/0.17 与 rustc 1.95.0 不兼容
# （spawn/编译 exit 254，全 workspace 构建失败）。本机改为直编（稍慢但稳定）；
# 恢复前请先验证 sccache 与当前工具链兼容再重新启用。pre-push 门禁脚本仍会
# 自行设置 RUSTC_WRAPPER=sccache，其行为不受本配置影响。
# 抑制第三方依赖（zookeeper v0.8.0）的未来兼容性警告
# zookeeper 0.8.0 为最新版本，使用了未来 Rust 将拒绝的语法，无法通过升级解决
rustflags = ["-A", "future_incompatible"]

[registries.crates-io]
# 稀疏注册中心：替代旧式 git-based index，增量 crates.io 索引更新快 5–10×
protocol = "sparse"

[net]
# 网络不稳定时 3 次重试（指数退避），避免因单次网络抖动导致整次构建失败
retry = 3

[env]
# 编译库一致性治理（2026-09-01）：编译期 sqlx 宏默认走离线缓存（.sqlx/query-*.json），
# 不连接 DATABASE_URL（本机 localhost:5432 被 Homebrew postgres 占用，schema 落后于容器库）。
# - 编译默认：SQLX_OFFLINE=true，避免"关系不存在"编译错（analytics_* 等新表只在容器库）
# - 覆盖方式：需要连库（如 `cargo sqlx prepare` 更新离线缓存）时，显式 `SQLX_OFFLINE=false cargo ...`
#   必须显式 force=false，否则 shell 的显式环境变量会被本项覆盖（实测简写行为）。
SQLX_OFFLINE = { value = "true", force = false }
# [2026-10-24] Homebrew rust 1.95.0 的 std 为 macOS 26 构建，而 rustc 默认部署目标
# 为 11.0 → test 二进制链接报 "ld: symbol(s) not found for architecture arm64"。
# 对齐本机运行时（macOS 26）；Linux 构建不受影响，CI 为 Linux 无此语义。
MACOSX_DEPLOYMENT_TARGET = "26.0"

[test]
# cargo-nextest：2–5× 测试执行速度，测试报告友好
runner = "cargo-nextest run"

[profile.release]
# 与 workspace Cargo.toml 保持一致（兜底）
#   体积/性能/编译时间均衡：thin LTO + codegen-units=16 并行
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
strip = true

[profile.dev]
# 兜底：workspace Cargo.toml 中 opt-level=1 + debug=1 + codegen-units=256 为准
# [2026-11-17] 显式 strip="none"：旧配置 strip="symbols" 会同时作用于 proc-macro
# 的 dylib，在 rustc 1.95 + macOS 26/27 上产出 "mis-aligned LINKEDIT string pool" 的
# 非法 Mach-O，导致默认 cargo check 找不到 *_derive crate。
# 注意：仅从 Cargo.toml 移除不够——$CARGO_HOME/config.toml 亦可能设置 dev strip，
# 这里显式写 "none" 才能覆盖全局兜底，保证新克隆开箱即用。release 不受影响。
strip = "none"
opt-level = 1
debug = 1

[profile.test]
opt-level = 1
debug = 1

[features]
coverage = ["instrument-coverage"]

# 注册中心镜像（国内环境可启用；USTC 镜像支持 sparse protocol）
# 注释说明：如需启用，请取消下一节注释；或在 ~/.cargo/config.toml 中配置。
# [source.crates-io]
# replace-with = "ustc"
#
# [source.ustc]
# registry = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"
