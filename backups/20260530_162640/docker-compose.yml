    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  qms:
    build:
      context: ../services/topems-qms/backend
      dockerfile: Dockerfile
    container_name: topems-qms
    environment:
