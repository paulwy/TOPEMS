services:
  postgres:
    image: postgres:latest
    container_name: topems-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topems_secret}
      POSTGRES_DB: ${POSTGRES_DB:-topems}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - topems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topems} -d ${POSTGRES_DB:-topems}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: ${RESTART_POLICY:-unless-stopped}

  redis:
    image: redis:latest
    container_name: topems-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - topems-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: ${RESTART_POLICY:-unless-stopped}

  iam:
    build:
      context: ../platform/topems-iam/backend
      dockerfile: Dockerfile
    container_name: topems-iam
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-topems-jwt-secret-key-change-in-production}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - SERVICE_PORT=8002
    ports:
      - "${IAM_PORT:-8002}:8002"
    volumes:
      - iam_logs:/app/logs
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  doc:
    build:
      context: ../platform/topems-doc/backend
      dockerfile: Dockerfile
    container_name: topems-doc
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-topems-jwt-secret-key-change-in-production}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-104857600}
      - SERVICE_PORT=8001
    ports:
      - "${DOC_PORT:-8001}:8001"
    volumes:
      - doc_uploads:/app/uploads
      - doc_logs:/app/logs
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  ai:
    build:
      context: ..
      dockerfile: services/topems-ai/backend/Dockerfile
    container_name: topems-ai
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-topems-jwt-secret-key-change-in-production}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - SERVICE_PORT=8003
    ports:
      - "${AI_PORT:-8003}:8003"
    volumes:
      - ai_models:/app/models
      - ai_logs:/app/logs
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  flow:
