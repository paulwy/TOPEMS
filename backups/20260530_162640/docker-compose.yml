  erp:
    build:
      context: ../services/topems-erp/backend
      dockerfile: Dockerfile
    container_name: topems-erp
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-topems-jwt-secret-key-change-in-production}
      - REFRESH_SECRET=${REFRESH_SECRET:-topems-refresh-secret-change-in-production}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - IAM_SERVICE_URL=http://iam:8002
      - SERVICE_PORT=8009
    ports:
      - "${ERP_PORT:-8009}:8009"
    volumes:
      - erp_data:/app/data
      - erp_logs:/app/logs
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  mes:
    build:
      context: ../services/topems-mes/backend
      dockerfile: Dockerfile
    container_name: topems-mes
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-topems-jwt-secret-key-change-in-production}
      - REFRESH_SECRET=${REFRESH_SECRET:-topems-refresh-secret-change-in-production}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - SERVICE_PORT=8014
    ports:
      - "${MES_PORT:-8014}:8014"
    volumes:
      - mes_data:/app/data
