      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  bi:
    build:
      context: ../services/topems-bi/backend
      dockerfile: Dockerfile
    container_name: topems-bi
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-topems-jwt-secret-key-change-in-production}
      - REFRESH_SECRET=${REFRESH_SECRET:-topems-refresh-secret-change-in-production}
      - TOKEN_EXPIRY_HOURS=${TOKEN_EXPIRY_HOURS:-24}
      - SERVICE_PORT=8011
    ports:
      - "${BI_PORT:-8011}:8011"
    volumes:
      - bi_data:/app/data
      - bi_logs:/app/logs
    networks:
      - topems-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  gis:
    build:
      context: ..
      dockerfile: services/topems-gis/backend/Dockerfile
    container_name: topems-gis
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-topems-jwt-secret-key-change-in-production}
      - PORT=8017
    ports:
      - "${GIS_PORT:-8017}:8017"
    volumes:
      - gis_data:/app/data
      - gis_logs:/app/logs
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8017/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  portal:
    build:
      context: ../services/topems-portal/backend
      dockerfile: Dockerfile
    container_name: topems-portal
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - JWT_SECRET=${JWT_SECRET:-topems-jwt-secret-key-change-in-production}
      - REFRESH_SECRET=${REFRESH_SECRET:-topems-refresh-secret-change-in-production}
      - TOKEN_EXPIRY_HOURS=${TOKEN_EXPIRY_HOURS:-24}
      - SERVICE_PORT=8020
    ports:
      - "${PORTAL_PORT:-8020}:8020"
    volumes:
      - portal_logs:/app/logs
    networks:
      - topems-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: topems-frontend
    environment:
      - VITE_API_BASE_URL=http://nginx:80
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - frontend_logs:/var/log/nginx
    networks:
      - topems-network
    depends_on:
      - iam
      - doc
      - ai
      - flow
      - rs
      - lims
      - qms
      - ehs
      - erp
      - mes
      - wms
      - bi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: ${RESTART_POLICY:-unless-stopped}

  nginx:
    image: nginx:latest
    container_name: topems-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    networks:
      - topems-network
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: ${RESTART_POLICY:-unless-stopped}

networks:
  topems-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  iam_logs:
    driver: local
  doc_uploads:
    driver: local
  doc_logs:
    driver: local
  ai_models:
    driver: local
  ai_logs:
    driver: local
  flow_logs:
    driver: local
  rs_data:
    driver: local
  rs_logs:
    driver: local
  lims_data:
    driver: local
  lims_logs:
    driver: local
  qms_data:
    driver: local
  qms_logs:
    driver: local
  ehs_data:
    driver: local
  ehs_logs:
    driver: local
  erp_data:
    driver: local
  erp_logs:
    driver: local
  mes_data:
    driver: local
  mes_logs:
    driver: local
  wms_data:
    driver: local
  wms_logs:
    driver: local
  bi_data:
    driver: local
  bi_logs:
    driver: local
  gis_data:
    driver: local
  gis_logs:
    driver: local
  portal_logs:
    driver: local
  frontend_logs:
    driver: local
  nginx_logs:
    driver: local
  nginx_cache:
    driver: local
