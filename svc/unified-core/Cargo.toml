[package]
name = "unified-core-service"
version.workspace = true
edition = "2021"
authors.workspace = true
description = "TOPEMS Unified Core Platform - IAM + Doc + Flow + File + Communication + Tenant + Billing + AI"

[dependencies]
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
dotenv.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
thiserror.workspace = true
sqlx = { workspace = true, features = ["rust_decimal"] }
topems-shared = { path = "../../lib" }
axum-prometheus.workspace = true
prometheus.workspace = true
anyhow.workspace = true
tower = { workspace = true }
tower-cookies = { workspace = true }
tower-util = { workspace = true }
rust_decimal = { workspace = true, features = ["db-postgres"] }
futures-util.workspace = true
bcrypt.workspace = true
sha2 = "0.10"
url.workspace = true
reqwest.workspace = true
lettre.workspace = true
handlebars.workspace = true
dashmap.workspace = true
lazy_static = "1"
regex.workspace = true
migration-sdk = { path = "../migration-sdk" }

rand = "0.8"

[[bin]]
name = "unified-core-service"
path = "src/main.rs"
