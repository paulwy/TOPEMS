[package]
name = "topems-unified-core"
version.workspace = true
edition = "2021"
authors.workspace = true
description = "TOPEMS Unified Core Platform - IAM + Doc + Flow + File + Communication + Tenant + Billing + AI"

[dependencies]
topems-shared = { path = "../../lib" }
topems-shared-event = { path = "../../lib/shared-event" }
topems-shared-core = { path = "../../lib/shared-core" }
topems-shared-auth = { path = "../../lib/shared-auth" }
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
dotenv.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
thiserror.workspace = true
sqlx = { workspace = true, features = ["rust_decimal"] }
topems-shared-bootstrap = { path = "../../lib/shared-bootstrap" }
utoipa.workspace = true
axum-prometheus.workspace = true
prometheus.workspace = true
anyhow.workspace = true

rust_decimal = { workspace = true, features = ["db-postgres"] }
futures-util.workspace = true
bcrypt.workspace = true
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
base64 = "0.22"
url.workspace = true
reqwest.workspace = true
lettre.workspace = true
handlebars.workspace = true
dashmap.workspace = true
lazy_static = "1"
regex.workspace = true

rand = "0.8"

[[bin]]
name = "topems-unified-core"
path = "src/main.rs"
