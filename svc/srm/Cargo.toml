[package]
name = "topems-srm"
version = "1.0.0"
edition = "2021"
authors = ["TOPEMS Team"]
description = "TOPEMS Supplier Relationship Management System"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
anyhow = "1"
thiserror = "2"
topems-shared = { path = "../../lib" }
topems-shared-bootstrap = { path = "../../lib/shared-bootstrap" }
topems-shared-event = { path = "../../lib/shared-event" }
topems-shared-service-client = { path = "../../lib/shared-service-client" }
bigdecimal = { version = "0.4", features = ["serde"] }
axum-prometheus = "0.8"
prometheus = "0.13"
utoipa = "4"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"
