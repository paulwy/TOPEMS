[package]
name = "topems-srm"
version = "1.0.0"
edition = "2021"
authors = ["TOPEMS Team"]
description = "TOPEMS Supplier Relationship Management System"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
tracing = "0.1"
anyhow = "1"
thiserror = "2"
topems-shared = { workspace = true }
topems-shared-bootstrap = { workspace = true }
topems-shared-event = { workspace = true }
topems-shared-core = { workspace = true }
topems-shared-auth = { workspace = true }
topems-shared-db = { workspace = true }
topems-shared-boundary = { path = "../../lib/shared-boundary" }

topems-shared-service-client = { workspace = true }
bigdecimal = { version = "0.4", features = ["serde"] }
prometheus = "0.13"
utoipa = "4"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
