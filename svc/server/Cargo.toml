[package]
name = "topems-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "TOPEMS 模块化单体统一入口服务（P0 架构优化）"

[dependencies]
topems-shared = { workspace = true }
topems-shared-core = { workspace = true }
topems-shared-bootstrap = { workspace = true }
topems-shared-event = { workspace = true }
topems-shared-observability = { workspace = true }
topems-shared-service-client = { workspace = true }
topems-shared-auth = { workspace = true }
topems-shared-db = { workspace = true }
# 真实业务服务（Phase B3 接入，feature 控制避免默认全量编译）
topems-finance = { path = "../finance", optional = true }
topems-erp = { path = "../erp", optional = true }
topems-qms = { path = "../qms", optional = true }
topems-crm = { path = "../crm", optional = true }
topems-hrm = { path = "../hrm", optional = true }
topems-scm = { path = "../scm", optional = true }
topems-wms = { path = "../wms", optional = true }
# [V2026.08 已合并] topems-aps 已合并至 mes（aps_scheduling/aps_compat），aps 能力由 module-mes 承载
topems-pm = { path = "../pm", optional = true }
topems-mes = { path = "../mes", optional = true }
topems-ehs = { path = "../ehs", optional = true }
topems-lims = { path = "../lims", optional = true }
topems-tms = { path = "../tms", optional = true }
topems-ticket = { path = "../ticket", optional = true }
topems-rd = { path = "../rd", optional = true }
topems-srm = { path = "../srm", optional = true }
topems-gis = { path = "../gis", optional = true }
topems-portal = { path = "../portal", optional = true }
topems-master-data = { path = "../master-data", optional = true }
topems-analytics = { path = "../analytics", optional = true }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenv.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
prometheus.workspace = true

# ================================================
# 模块化单体 Feature Flags（与根 Cargo.toml 对齐）
# 详见 docs/architecture/modular-monolith-design.md
# ================================================
[features]
default = [
    "module-core",
    "module-erp",
    "module-finance",
    "module-qms",
    "module-crm",
    "module-hrm",
    "module-scm",
    "module-wms",
    # [V2026.08 已合并] module-aps 已移除（aps 合并至 mes，由 module-mes 承载）
    "module-pm",
    "module-mes",
    "module-ehs",
    "module-lims",
    "module-ticket",
    "module-rd",
    "module-srm",
    # [2026-08-31] module-advanced 已挂真实 master-data，加回 default；analytics 同组后续接入
    "module-advanced",
    # [2026-09-08] portal 嵌入模块化单体（embedded::build_router 统一组装链）
    "module-portal",
    # [边界治理] module-ai 仍为幽灵 feature（无 real_module），从 default 移除；待 ai 真实接入后再启用
]
module-core = []
# 真实业务服务接入：finance 模块（Phase B3）
module-finance = ["dep:topems-finance"]
# 真实业务服务接入：erp 模块（Phase B3 扩展）
module-erp = ["dep:topems-erp"]
# 真实业务服务接入：qms 模块（Phase B3 扩展）
module-qms = ["dep:topems-qms"]
# 真实业务服务接入：crm 模块（Phase B3 扩展）
module-crm = ["dep:topems-crm"]
# 真实业务服务接入：hrm 模块（Phase B3 扩展）
module-hrm = ["dep:topems-hrm"]
# 真实业务服务接入：scm 模块（Phase B3 扩展）
module-scm = ["dep:topems-scm"]
# 真实业务服务接入：wms 模块（Phase B3 扩展）
module-wms = ["dep:topems-wms"]
# [V2026.08 已合并] module-aps 已移除（aps 合并至 mes，由 module-mes 承载）
# 真实业务服务接入：pm 模块（Phase B3 扩展）
module-pm = ["dep:topems-pm"]
# 真实业务服务接入：mes 模块（Phase B3 扩展）
module-mes = ["dep:topems-mes"]
# 真实业务服务接入：ehs 模块（Phase B3 扩展）
module-ehs = ["dep:topems-ehs"]
# 真实业务服务接入：lims 模块（Phase B3 扩展）
module-lims = ["dep:topems-lims"]
# 真实业务服务接入：tms 模块（P3 feature flag，默认不启用，按客户需求裁剪）
module-tms = ["dep:topems-tms"]
# 真实业务服务接入：ticket 模块（核心业务域，默认启用）
module-ticket = ["dep:topems-ticket"]
# 真实业务服务接入：rd 模块（研发管理，默认启用）
module-rd = ["dep:topems-rd"]
# 真实业务服务接入：srm 模块（供应商关系，默认启用）
module-srm = ["dep:topems-srm"]
# 真实业务服务接入：gis 模块（P3 feature flag，默认不启用，按客户需求裁剪）
module-gis = ["dep:topems-gis"]
# 真实业务服务接入：portal 模块（[2026-09-08] 已实现嵌入——lib 侧 embedded::build_router
# 统一组装链，独立部署 main.rs 与 server 嵌入共用同一实现，默认启用）
module-portal = ["dep:topems-portal"]
# 订阅管理模块（P5 商业化支撑，默认不启用，按客户需求启用）
module-subscription = []
# advanced 组真实接入：master-data + analytics（2026-09-01 挂载）
module-advanced = ["dep:topems-master-data", "dep:topems-analytics"]
module-ai = []
# 私有化部署模式（进程内 trait 调用）
private-deployment = []
# SaaS 模式（HTTP 服务间调用）
saas-deployment = []

[[bin]]
name = "topems-server"
path = "src/main.rs"

[lints]
workspace = true
