code: mdm
name: 主数据管理
version: 1.0.0
description: MDM 主数据管理服务，包含质量闭环、自动修复、数据治理 AI
plugin_type: business

deployment:
  type: standalone
  port: 8090
  base_path: /api/master

permissions:
  - code: mdm:quality:read
    name: 查看质量检查
    resource_type: quality_check
    action: read
  - code: mdm:quality:write
    name: 管理质量规则
    resource_type: quality_rule
    action: write
  - code: mdm:quality:execute
    name: 执行质量检查
    resource_type: quality_check
    action: execute
  - code: mdm:autofix:execute
    name: 执行自动修复
    resource_type: auto_fix
    action: execute
  - code: mdm:autofix:read
    name: 查看修复历史
    resource_type: fix_history
    action: read
  - code: mdm:governance:read
    name: 查看治理建议
    resource_type: governance_suggestion
    action: read
  - code: mdm:governance:approve
    name: 批准治理建议
    resource_type: governance_suggestion
    action: approve
  - code: mdm:dashboard:read
    name: 查看质量仪表盘
    resource_type: dashboard
    action: read

dependencies: []