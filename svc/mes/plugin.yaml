code: mes
name: 生产执行系统
version: 1.0.0
description: MES 生产执行系统，包含生产工单、生产工艺、生产记录、设备管理、工位管理等模块
author: TOPEMS
category: Manufacturing
plugin_type: business

runtime:
  port: 8030
  health_endpoint: /health
  base_path: /api/mfg

permissions:
  - code: mes:production_order:read
    name: 查看生产工单
    description: 查看生产工单
  - code: mes:production_order:write
    name: 管理生产工单
    description: 创建和更新生产工单
  - code: mes:production_order:start
    name: 启动生产工单
    description: 启动生产工单执行
  - code: mes:production_order:complete
    name: 完成生产工单
    description: 完成生产工单
  - code: mes:production_order:cancel
    name: 取消生产工单
    description: 取消生产工单
  - code: mes:process:read
    name: 查看生产工艺
    description: 查看生产工艺
