author: TOPEMS
category: Collaboration
code: feedback
name: 反馈服务
description: 反馈服务 - 用户反馈收集、处理、回复管理
version: 1.0.0
plugin_type: service
dependencies: []
deployment: {}
runtime:
  port: 8087
  health_endpoint: /health
  base_path: /api/feedback
permissions:
  - code: feedback:read
    name: 查看反馈
    description: 查看用户反馈列表和详情
  - code: feedback:write
    name: 提交反馈
    description: 提交用户反馈
  - code: feedback:reply
    name: 回复反馈
    description: 回复用户反馈
  - code: feedback:admin
    name: 反馈管理
    description: 反馈分类和配置管理
