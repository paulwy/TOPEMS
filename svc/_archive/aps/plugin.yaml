author: TOPEMS
category: Manufacturing
code: aps
name: 高级计划与排程
description: APS 高级计划与排程系统，包含生产计划、排程管理、产能管理、物料计划、需求预测等模块
version: 1.0.0
plugin_type: business
dependencies: []
deployment:
  type: standalone
  port: 8074
  base_path: /api/aps
runtime: {}
permissions:
  # 生产计划
  - code: aps:read
    name: 查看生产计划
    resource_type: production_plan
    action: read
  - code: aps:write
    name: 管理生产计划
    resource_type: production_plan
    action: write
  - code: aps:approve
    name: 审批生产计划
    resource_type: production_plan
    action: approve
  # 排程管理
  - code: aps:read
    name: 查看排程
    resource_type: schedule
    action: read
  - code: aps:write
    name: 管理排程
    resource_type: schedule
    action: write
  - code: aps:approve
    name: 审批排程
    resource_type: schedule
    action: approve
  # 产能管理
  - code: aps:read
    name: 查看产能
    resource_type: capacity
    action: read
  - code: aps:write
    name: 管理产能
    resource_type: capacity
    action: write
  - code: aps:approve
    name: 审批产能
    resource_type: capacity
    action: approve
  # 物料计划
  - code: aps:read
    name: 查看物料计划
    resource_type: material_plan
    action: read
  - code: aps:write
    name: 管理物料计划
    resource_type: material_plan
    action: write
  - code: aps:approve
    name: 审批物料计划
    resource_type: material_plan
    action: approve
  # 需求预测
  - code: aps:read
    name: 查看需求预测
    resource_type: forecast
    action: read
  - code: aps:write
    name: 管理需求预测
    resource_type: forecast
    action: write
  - code: aps:approve
    name: 审批需求预测
    resource_type: forecast
    action: approve
