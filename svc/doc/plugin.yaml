code: doc
name: 文档管理服务
version: 1.0.0
description: 文档管理服务 - 文档存储、模板管理、文件夹管理、文档发布
author: TOPEMS
category: Document
plugin_type: service

runtime:
  port: 8071
  health_endpoint: /health
  base_path: /api/doc

permissions:
  - code: doc:read
    name: 文档查看
    description: 查看文档内容
  - code: doc:write
    name: 文档编辑
    description: 创建和编辑文档
  - code: doc:delete
    name: 文档删除
    description: 删除文档
  - code: doc:publish
    name: 文档发布
    description: 发布文档
  - code: doc:template:read
    name: 模板查看
    description: 查看文档模板
  - code: doc:template:write
    name: 模板管理
    description: 创建和管理文档模板
  - code: doc:folder:read
    name: 文件夹查看
    description: 查看文件夹
  - code: doc:folder:write
    name: 文件夹管理
    description: 创建和管理文件夹