code: "mobile"
name: "移动端服务"
version: "1.0.0"
description: "Mobile 移动端服务 - 离线同步、扫码、设备管理"
category: "System"
plugin_type: "business"

deployment:
  port: 8056
  base_path: /api/mobile

permissions:
  - code: "mobile:device:register"
    name: "注册设备"
    resource_type: "device"
    action: "write"
  - code: "mobile:device:manage"
    name: "管理设备"
    resource_type: "device"
    action: "write"
  - code: "mobile:offline:sync"
    name: "离线同步"
    resource_type: "offline"
    action: "write"
  - code: "mobile:offline:read"
    name: "查看离线数据"
    resource_type: "offline"
    action: "read"
  - code: "mobile:scan:barcode"
    name: "扫码"
    resource_type: "scan"
    action: "write"
  - code: "mobile:scan:qrcode"
    name: "二维码扫描"
    resource_type: "scan"
    action: "write"
  - code: "mobile:scan:ocr"
    name: "图像识别"
    resource_type: "scan"
    action: "write"
  - code: "mobile:notification:read"
    name: "查看通知"
    resource_type: "notification"
    action: "read"
  - code: "mobile:notification:write"
    name: "管理通知"
    resource_type: "notification"
    action: "write"
  - code: "mobile:task:read"
    name: "查看任务"
    resource_type: "task"
    action: "read"
  - code: "mobile:task:write"
    name: "管理任务"
    resource_type: "task"
    action: "write"
