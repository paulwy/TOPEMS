author: TOPEMS Team
category: Quality
code: qms
name: 质量管理体系
description: QMS 质量管理体系系统，包含质量计划、来料检验（IQC）、过程检验（IPQC）、成品检验（FQC）、不合格品管理、纠正预防措施（CAPA）、质量追溯、供应商质量管理等模块
version: 1.0.0
icon: task_alt
plugin_type: business
dependencies:
  - unified-core
  - erp
  - mes
runtime:
  port: 8050
  health_endpoint: /health
  base_path: /api/qms
deployment: {}
permissions:
  - code: qms:read
    name: QMS 查询
    description: 查询质量管理数据
  - code: qms:write
    name: QMS 录入
    description: 录入质量检查/纠正措施等数据
  - code: qms:admin
    name: QMS 管理
    description: QMS 模块管理权限
