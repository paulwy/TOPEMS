[package]
name = "topems-scm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TOPEMS-SCM 供应链管理系统"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
sqlx = { workspace = true }
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
anyhow.workspace = true
topems-shared-bootstrap = { workspace = true }
topems-shared-event = { workspace = true }
topems-shared-core = { workspace = true }
topems-shared-auth = { workspace = true }
utoipa.workspace = true
prometheus.workspace = true

topems-shared-db = { workspace = true }
topems-shared-boundary = { path = "../../lib/shared-boundary" }

[[bin]]
name = "topems-scm"
path = "src/main.rs"

[features]
http_endpoint_tests = []
[lints.rust]
unknown_lints = "allow"
renamed_and_removed_lints = "allow"
dead_code = "allow"

