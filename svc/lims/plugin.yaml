author: TOPEMS
category: Quality
code: lims
name: 实验室信息管理
description: LIMS 实验室信息管理系统，包含样品管理、检测任务管理、仪器管理、试剂管理、标准曲线、检测报告、质量控制、数据追溯等模块
version: 1.0.0
plugin_type: business
dependencies:
  - unified-core
  - qms
runtime:
  port: 8051
  health_endpoint: /health
  base_path: /api/lims
deployment: {}
permissions:
  - code: lims:read
    name: LIMS 查询
    description: 查询实验室检测数据
  - code: lims:write
    name: LIMS 录入
    description: 录入样品/检测结果等数据
  - code: lims:admin
    name: LIMS 管理
    description: LIMS 模块管理权限
