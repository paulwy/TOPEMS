[package]
name = "topems-file"
version = "0.1.0"
edition = "2021"
authors = ["TOPEMS Team"]
description = "TOPEMS Unified File Service"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx.workspace = true

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"
axum-error = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Middleware
tower-layer = "0.3"

# Utilities
bytes = "1"
mime = "0.3"
mime_guess = "2"
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
md5 = "0.7"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Shared library
topems-shared = { path = "../../lib" }

# Prometheus metrics
axum-prometheus = "0.8"
prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "topems-file"
path = "src/main.rs"
