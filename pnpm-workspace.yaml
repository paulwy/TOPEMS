packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/integration'
allowBuilds:
  canvas: true
  core-js-pure: true
  cwebp-bin: set this to true or false
  esbuild: true
  gifsicle: true
  jpegtran-bin: set this to true or false
  mozjpeg: true
  optipng-bin: set this to true or false
  pngquant-bin: true
  puppeteer: true
  unrs-resolver: true
