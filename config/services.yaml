# TOPEMS 服务配置
# 与 plugin-architecture-design.md 保持严格一致
# 版本: v6.1

# ================================================
# 端口分配规则 (Port Allocation Rules)
# ================================================
# 1. 范围: 8000-8079 业务服务，5432/6379/11434/3000/8080 基础设施
# 2. 策略: 按业务域分组，每 10 个端口预留一个域段
# 3. 编号: 域内从 X0 开始顺序递增（如 8030, 8031, ...）
# 4. 首位即主服务: 段首 (X0) 分配给该域的核心服务
# 5. 虚拟服务: 由 unified-core 内部模块提供的服务（iam/doc/flow/file）共用 8000，通过 URL 路径区分
# 6. 权威源: 本文件 + config/ports.env + 各服务 main.rs 中的实际端口
# 7. 同步: 任何端口变更必须同步到 services.conf, ports.env, docker-compose, vite.config.ts, .env
# 8. 8080 端口: 仅 docker/saas 部署模式下的 API 网关使用；本地开发 dashboard 路由走各服务自身端口
#
# 段位速查:
#   8000-8009 核心 (Core)         8050-8059 质量/研发 (Q/RD)
#   8010-8019 经营管理 (ERP)      8060-8069 数据分析/门户 (Analytics)
#   8020-8029 协同办公 (Collab)   8070-8079 基础设施 (Infra)
#   8030-8039 生产制造 (Mfg)      3000/5432/6379/8080/11434 基础设施
#   8040-8049 供应链 (SCM)        8082-8088 扩展服务 (Extension)
# ================================================

service_groups:
  # 核心服务 (8000-8009)
  core:
    - name: iam
      port: 8000
      env_var: CORE_PORT
      description: 统一核心服务 (IAM + Doc + Flow + File + Communication + Monitor)
      status: implemented
      dependencies: []
      service_dir: unified-core

  # 经营管理服务 (8010-8019)
  erp:
    - name: erp
      port: 8010
      env_var: ERP_PORT
      description: 企业资源计划
      status: implemented
      dependencies: [unified-core]

    - name: finance
      port: 8011
      env_var: FINANCE_PORT
      description: 财务管理服务
      status: implemented
      dependencies: [unified-core, erp]
      service_dir: finance

    - name: ai
      port: 8013
      env_var: AI_PORT
      description: AI智能服务
      status: implemented
      dependencies: [unified-core]
      service_dir: ai

  # 协同办公服务 (8020-8029)
  collaboration:
    - name: hrm
      port: 8020
      env_var: HRM_PORT
      description: 人力资源管理
      status: implemented
      dependencies: [unified-core]

    - name: pm
      port: 8023
      env_var: PM_PORT
      description: 项目管理服务
      status: implemented
      dependencies: [unified-core]

    - name: crm
      port: 8029
      env_var: CRM_PORT
      description: 客户关系管理
      status: implemented
      dependencies: [unified-core]

  # 生产制造服务 (8030-8039)
  manufacturing:
    - name: mes
      port: 8030
      env_var: MES_PORT
      description: 生产执行系统
      status: implemented
      dependencies: [unified-core]
      service_dir: mes

    - name: pdm
      port: 8031
      env_var: PDM_PORT
      description: 产品数据管理
      status: implemented
      dependencies: [unified-core, mes]
      service_dir: pdm

  # 供应链服务 (8040-8049)
  supply-chain:
    - name: scm
      port: 8040
      env_var: SCM_PORT
      description: 供应链管理
      status: implemented
      dependencies: [unified-core]

    - name: wms
      port: 8041
      env_var: WMS_PORT
      description: 仓储管理
      status: implemented
      dependencies: [unified-core, scm]

    - name: srm
      port: 8042
      env_var: SRM_PORT
      description: 供应商管理
      status: implemented
      dependencies: [unified-core, scm]

  # 质量/研发服务 (8050-8059)
  quality-rd:
    - name: qms
      port: 8050
      env_var: QMS_PORT
      description: 质量管理
      status: implemented
      dependencies: [unified-core, erp, mes]
      service_dir: qms

    - name: lims
      port: 8051
      env_var: LIMS_PORT
      description: 实验室信息管理
      status: implemented
      dependencies: [unified-core, qms]
      service_dir: lims

    - name: ehs
      port: 8052
      env_var: EHS_PORT
      description: 环境健康安全
      status: implemented
      dependencies: [unified-core, mes, qms]
      service_dir: ehs

    - name: rd
      port: 8053
      env_var: RD_PORT
      description: 研发管理
      status: implemented
      dependencies: [unified-core, pm, mes]

  # 数据分析/门户服务 (8060-8069)
  # NOTE: report 功能已整合到 analytics (bi) 服务中 (2026-07)
  analytics:
    - name: bi
      port: 8060
      env_var: BI_PORT
      description: 商业智能（含原 report 报表功能）
      status: implemented
      dependencies: [unified-core]
      service_dir: analytics

    - name: portal
      port: 8063
      env_var: PORTAL_PORT
      description: 企业门户
      status: implemented
      dependencies: [unified-core]

  # 基础设施服务 (8070-8079)
  infrastructure:
    - name: mobile
      port: 8070
      env_var: MOBILE_PORT
      description: 移动服务
      status: implemented
      dependencies: [unified-core]

    - name: gis
      port: 8071
      env_var: GIS_PORT
      description: 地理信息服务
      status: implemented
      dependencies: [unified-core, mes]

    - name: integration
      port: 8072
      env_var: INTEGRATION_PORT
      description: 集成服务
      status: implemented
      dependencies: [unified-core]

  # 主数据服务 (8090)
  master-data:
    - name: master-data
      port: 8090
      env_var: MASTER_DATA_PORT
      description: 主数据管理服务
      status: implemented
      dependencies: [unified-core]
      service_dir: master-data

  # 扩展服务 (8084-8089，从 unified-core 外迁为独立进程)
  extension:
    - name: communication
      port: 8084
      env_var: COMMUNICATION_PORT
      description: 通讯服务（邮件/通知/IM，从 unified-core 外迁）
      status: implemented
      dependencies: [unified-core]
      service_dir: communication

    - name: billing
      port: 8085
      env_var: BILLING_PORT
      description: 计费服务
      status: implemented
      dependencies: [unified-core]
      service_dir: billing

    - name: ticket
      port: 8086
      env_var: TICKET_PORT
      description: 工单服务
      status: implemented
      dependencies: [unified-core]
      service_dir: ticket

    - name: feedback
      port: 8087
      env_var: FEEDBACK_PORT
      description: 反馈服务
      status: implemented
      dependencies: [unified-core]
      service_dir: feedback

    - name: search
      port: 8082
      env_var: SEARCH_PORT
      description: 搜索服务（全文搜索）
      status: implemented
      dependencies: [unified-core]
      service_dir: search

    - name: lowcode
      port: 8088
      env_var: LOWCODE_PORT
      description: 低代码平台（占位，后端尚未立项）
      status: reserved
      dependencies: [unified-core]
      service_dir: lowcode

# 虚拟服务（由 unified-core 内部模块提供，不独立启动）
# 注意：iam 已作为独立服务条目存在于 service_groups.core（service_dir: unified-core）
# 注意：mail/im/notification 已外迁到 communication 独立服务（端口 8084），unified-core 内保留模块兼容
virtual_services:
  - name: flow
    port: 8000
    env_var: FLOW_PORT
    description: 工作流引擎 (由 unified-core 提供)
    provider: unified-core

  - name: file
    port: 8000
    env_var: FILE_PORT
    description: 文件存储服务 (由 unified-core 提供)
    provider: unified-core

  - name: doc
    port: 8000
    env_var: DOC_PORT
    description: 文档管理服务 (由 unified-core 提供，虚拟服务)
    provider: unified-core

  - name: monitor
    port: 8000
    env_var: MONITOR_PORT
    description: 系统监控服务 (由 unified-core 提供，虚拟服务)
    provider: unified-core

  - name: automation
    port: 8000
    env_var: AUTOMATION_PORT
    description: 自动化编排（由 unified-core 提供，虚拟服务，路由 /api/core/automation）
    provider: unified-core
    status: planned

# 特殊端口配置
special_ports:
  api_gateway:
    port: 8080
    env_var: GATEWAY_PORT
    description: API网关
    status: reserved
    deployment_modes: [docker, saas]

  frontend:
    port: 3000
    env_var: WEB_PORT
    description: Web应用
    status: implemented
    deployment_modes: [local, docker, saas]

  postgres:
    port: 5432
    env_var: POSTGRES_PORT
    description: 数据库
    deployment_modes: [local, docker, saas]

  redis:
    port: 6379
    env_var: REDIS_PORT
    description: 缓存
    deployment_modes: [local, docker, saas]

  ollama:
    port: 11434
    env_var: OLLAMA_PORT
    description: AI模型服务
    deployment_modes: [local, docker, saas]

# 服务模块分组 (用于 start-module 命令)
# V66.1：extension 分组增加；all 组补齐 6 外迁扩展服务
module_groups:
  core:
    - iam

  erp:
    - erp
    - finance
    - ai

  collaboration:
    - hrm
    - pm
    - crm

  manufacturing:
    - mes
    - pdm

  supply-chain:
    - scm
    - wms
    - srm

  quality-rd:
    - qms
    - lims
    - ehs
    - rd

  plm:
    - pdm
    - rd

  analytics:
    - bi
    - portal
    # V66.1：cross-reference — 搜索为 BI dashboard 提供全文检索支撑
    - search

  infrastructure:
    - mobile
    - gis
    - integration
    # V66.1：cross-reference — lowcode 属于基础设施平台层
    - lowcode

  collaboration:
    - hrm
    - pm
    - crm
    # V66.1：cross-reference — communication（mail/im/notification）为协同办公提供通讯底座
    - communication
    # V66.1：cross-reference — ticket/feedback 为协同办公提供工单/反馈闭环
    - ticket
    - feedback

  erp:
    - erp
    - finance
    - ai
    # V66.1：cross-reference — billing 计费挂入经营管理域
    - billing

  master-data:
    - master-data

  # V66.1：扩展服务（从 unified-core 外迁为独立进程）
  extension:
    - search
    - communication
    - billing
    - ticket
    - feedback
    - lowcode

  # 全量启动清单（22 + 6 extension = 28 项；iam 代表 unified-core:8000）
  all:
    - iam
    # 扩展服务（V66 外迁，端口 8082/8084-8088）
    - search
    - communication
    - billing
    - ticket
    - feedback
    - lowcode
    # 经营管理（8010-8019）
    - erp
    - finance
    - ai
    # 协同办公（8020-8029）
    - hrm
    - pm
    - crm
    # 生产制造（8030-8039）
    - mes
    - pdm
    # 供应链（8040-8049）
    - scm
    - wms
    - srm
    # 质量/研发（8050-8059）
    - qms
    - lims
    - ehs
    - rd
    # 数据分析/门户（8060-8069）
    - bi
    - portal
    # 基础设施（8070-8079）
    - mobile
    - gis
    - integration
    # 主数据（8090）
    - master-data
