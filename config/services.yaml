# TOPEMS 服务配置 (v6.2 / V66.2)
# 与 plugin-architecture-design.md 保持严格一致
# V66.2 Shared Bootstrap V2 覆盖率：28/28 = 100%
#   bootstrap_mode: A = 标准 build_application（10 个）
#                   B = stateful + build_application（11 个）
#                   C = Application { router, port, name } 重建（7 个）

# ================================================
# 端口分配规则 (Port Allocation Rules)
# ================================================
# 1. 范围: 8000-8079 业务服务，5432/6379/11434/3000/8080 基础设施
# 2. 策略: 按业务域分组，每 10 个端口预留一个域段
# 3. 编号: 域内从 X0 开始顺序递增（如 8030, 8031, ...）
# 4. 首位即主服务: 段首 (X0) 分配给该域的核心服务
# 5. 虚拟服务: 由 unified-core 内部模块提供的服务（iam/doc/flow/file）共用 8000，通过 URL 路径区分
# 6. 权威源: 本文件 + config/ports.env + 各服务 main.rs 中的实际端口
# 7. 同步: 任何端口变更必须同步到 services.conf, ports.env, docker-compose, vite.config.ts, .env
# 8. 8080 端口: 仅 docker/saas 部署模式下的 API 网关使用；本地开发 dashboard 路由走各服务自身端口
#
# 段位速查:
#   8000-8009 核心 (Core)         8050-8059 质量/研发 (Q/RD)
#   8010-8019 经营管理 (ERP)      8060-8069 数据分析/门户 (Analytics)
#   8020-8029 协同办公 (Collab)   8070-8079 基础设施 (Infra)
#   8030-8039 生产制造 (Mfg)      3000/5432/6379/8080/11434 基础设施
#   8040-8049 供应链 (SCM)        8082-8088 扩展服务 (Extension)
# ================================================

service_groups:
  # 核心服务 (8000-8009)
  core:
    - name: iam
      port: 8000
      env_var: CORE_PORT
      description: 统一核心服务 (IAM + Doc + Flow + File + Communication + Monitor)
      status: implemented
      bootstrap_mode: C  # Shared Bootstrap V2 Pattern: Application { router, port, name } 自建（WS/后台任务/自定义中间件）
      dependencies: []
      service_dir: unified-core

  # 经营管理服务 (8010-8019)
  erp:
    - name: erp
      port: 8010
      env_var: ERP_PORT
      description: 企业资源计划
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（自定义 AppState）
      dependencies: [unified-core]

    - name: finance
      port: 8011
      env_var: FINANCE_PORT
      description: 财务管理服务
      status: implemented
      bootstrap_mode: A  # Shared Bootstrap V2 Pattern: 标准 build_application（无自定义 state）
      dependencies: [unified-core, erp]
      service_dir: finance

    - name: ai
      port: 8013
      env_var: AI_PORT
      description: AI智能服务
      status: implemented
      bootstrap_mode: C  # Shared Bootstrap V2 Pattern: Application 重建（Embedding/Ollama 客户端 state + 自定义 WS/后台任务）
      dependencies: [unified-core]
      service_dir: ai

  # 协同办公服务 (8020-8029)
  collaboration:
    - name: hrm
      port: 8020
      env_var: HRM_PORT
      description: 人力资源管理
      status: implemented
      bootstrap_mode: A  # Shared Bootstrap V2 Pattern: 标准 build_application（无自定义 state）
      dependencies: [unified-core]

    - name: pm
      port: 8023
      env_var: PM_PORT
      description: 项目管理服务
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（自定义 state）
      dependencies: [unified-core]

    - name: crm
      port: 8029
      env_var: CRM_PORT
      description: 客户关系管理
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（缓存/租户 state）
      dependencies: [unified-core]

  # 生产制造服务 (8030-8039)
  manufacturing:
    - name: mes
      port: 8030
      env_var: MES_PORT
      description: 生产执行系统
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（MES/MRP state）
      dependencies: [unified-core]
      service_dir: mes

    - name: pdm
      port: 8031
      env_var: PDM_PORT
      description: 产品数据管理
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（BOM/工艺 state）
      dependencies: [unified-core, mes]
      service_dir: pdm

  # 供应链服务 (8040-8049)
  supply-chain:
    - name: scm
      port: 8040
      env_var: SCM_PORT
      description: 供应链管理
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（SCM 状态）
      dependencies: [unified-core]

    - name: wms
      port: 8041
      env_var: WMS_PORT
      description: 仓储管理
      status: implemented
      bootstrap_mode: A  # Shared Bootstrap V2 Pattern: 标准 build_application（无自定义 state）
      dependencies: [unified-core, scm]

    - name: srm
      port: 8042
      env_var: SRM_PORT
      description: 供应商管理
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（VSR/询比价 state）
      dependencies: [unified-core, scm]

  # 质量/研发服务 (8050-8059)
  quality-rd:
    - name: qms
      port: 8050
      env_var: QMS_PORT
      description: 质量管理
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（检验/偏差 state）
      dependencies: [unified-core, erp, mes]
      service_dir: qms

    - name: lims
      port: 8051
      env_var: LIMS_PORT
      description: 实验室信息管理
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（样品/数据 state）
      dependencies: [unified-core, qms]
      service_dir: lims

    - name: ehs
      port: 8052
      env_var: EHS_PORT
      description: 环境健康安全
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（危化/事件 state）
      dependencies: [unified-core, mes, qms]
      service_dir: ehs

    - name: rd
      port: 8053
      env_var: RD_PORT
      description: 研发管理
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（PLM/实验 state）
      dependencies: [unified-core, pm, mes]

  # 数据分析/门户服务 (8060-8069)
  # NOTE: report 功能已整合到 analytics (bi) 服务中 (2026-07)
  analytics:
    - name: bi
      port: 8060
      env_var: BI_PORT
      description: 商业智能（含原 report 报表功能）
      status: implemented
      bootstrap_mode: C  # Shared Bootstrap V2 Pattern: Application 重建（自定义 Prometheus/调度器 state）
      dependencies: [unified-core]
      service_dir: analytics

    - name: portal
      port: 8063
      env_var: PORTAL_PORT
      description: 企业门户
      status: implemented
      bootstrap_mode: C  # Shared Bootstrap V2 Pattern: Application 重建（GraphQL WS + CookieManager + 事件总线模拟器）
      dependencies: [unified-core]

  # 基础设施服务 (8070-8079)
  infrastructure:
    - name: mobile
      port: 8070
      env_var: MOBILE_PORT
      description: 移动服务
      status: implemented
      bootstrap_mode: C  # Shared Bootstrap V2 Pattern: Application 重建（8字段 AppState + 6 服务客户端 + 自定义全栈中间件）
      dependencies: [unified-core]

    - name: gis
      port: 8071
      env_var: GIS_PORT
      description: 地理信息服务
      status: implemented
      bootstrap_mode: C  # Shared Bootstrap V2 Pattern: Application 重建（WebSocket Manager + 自定义 Prometheus Gauge）
      dependencies: [unified-core, mes]

    - name: integration
      port: 8072
      env_var: INTEGRATION_PORT
      description: 集成服务
      status: implemented
      bootstrap_mode: C  # Shared Bootstrap V2 Pattern: Application 重建（Webhook/Scheduler 后台任务）
      dependencies: [unified-core]

    # V68.1 拆分服务 (8095-8096，从 unified-core 迁移至独立进程)
    - name: monitor
      port: 8095
      env_var: MONITOR_PORT
      description: 系统监控服务（V68.1 A2.1 从 unified-core 拆分）
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（指标采集 state）
      dependencies: [unified-core]
      service_dir: monitor

    - name: plugin-registry
      port: 8096
      env_var: PLUGIN_REGISTRY_PORT
      description: 插件注册与管理服务（V68.1 A2.2 从 unified-core 拆分）
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（插件状态 state）
      dependencies: [unified-core]
      service_dir: plugin-registry

  # 主数据服务 (8090)
  master-data:
    - name: master-data
      port: 8090
      env_var: MASTER_DATA_PORT
      description: 主数据管理服务
      status: implemented
      bootstrap_mode: A  # Shared Bootstrap V2 Pattern: 标准 build_application（无自定义 state）
      dependencies: [unified-core]
      service_dir: master-data

  # 扩展服务 (8084-8089，从 unified-core 外迁为独立进程)
  extension:
    - name: communication
      port: 8084
      env_var: COMMUNICATION_PORT
      description: 通讯服务（邮件/通知/IM，从 unified-core 外迁）
      status: implemented
      bootstrap_mode: A  # Shared Bootstrap V2 Pattern: 标准 build_application（无自定义 state）
      dependencies: [unified-core]
      service_dir: communication

    - name: ticket
      port: 8086
      env_var: TICKET_PORT
      description: 工单服务
      status: implemented
      bootstrap_mode: A  # Shared Bootstrap V2 Pattern: 标准 build_application（无自定义 state）
      dependencies: [unified-core]
      service_dir: ticket

    # [V2026.08 已合并] feedback 服务已合并至 ticket（customer_feedback 类型），原端口 8087 停用
    # 代码归档见 svc/_archive/feedback/，兼容路由 /api/feedback 已指向 ticket 服务

    - name: search
      port: 8082
      env_var: SEARCH_PORT
      description: 搜索服务（全文搜索）
      status: implemented
      bootstrap_mode: A  # Shared Bootstrap V2 Pattern: 标准 build_application（无自定义 state）
      dependencies: [unified-core]
      service_dir: search

    # [V2026.08 已移除] lowcode 空壳占位服务（后端尚未立项，所有handler返回501）
    # 代码归档见 docs/archive/，如未来立项可恢复

  # 物流服务 (8073-8074，V284 补全至单一信源)
  # 注：plugin.yaml 中 tms/aps 原 port 为 8042/8043，与 srm 8042 冲突，改用 8070-8079 段空闲端口
  logistics:
    - name: tms
      port: 8073
      env_var: TMS_PORT
      description: 运输管理
      status: implemented
      bootstrap_mode: B  # Shared Bootstrap V2 Pattern: stateful + build_application（车辆/运单 state）
      dependencies: []
      service_dir: tms

    # [V2026.08 已合并] aps 服务已合并至 mes（aps_scheduling/aps_compat 模块，/api/aps 兼容层由 mes 提供），代码归档 svc/_archive/aps
    # - name: aps
    #   port: 8074
    #   env_var: APS_PORT
    #   description: 高级计划与排程
    #   status: implemented
    #   bootstrap_mode: B
    #   dependencies: []
    #   service_dir: aps

# 虚拟服务（由 unified-core 内部模块提供，不独立启动）
# 注意：iam 已作为独立服务条目存在于 service_groups.core（service_dir: unified-core）
# 注意：mail/im/notification 已外迁到 communication 独立服务（端口 8084），unified-core 内保留模块兼容
# 注意：monitor 已于 V68.1 迁移至独立服务（端口 8095），不再作为虚拟服务
virtual_services:
  - name: flow
    port: 8000
    env_var: FLOW_PORT
    description: 工作流引擎 (由 unified-core 提供)
    provider: unified-core

  - name: file
    port: 8000
    env_var: FILE_PORT
    description: 文件存储服务 (由 unified-core 提供)
    provider: unified-core

  - name: doc
    port: 8000
    env_var: DOC_PORT
    description: 文档管理服务 (由 unified-core 提供，虚拟服务)
    provider: unified-core

  - name: automation
    port: 8000
    env_var: AUTOMATION_PORT
    description: 自动化编排（由 unified-core 提供，虚拟服务，路由 /api/core/automation）
    provider: unified-core
    status: planned

# 特殊端口配置
special_ports:
  api_gateway:
    port: 8080
    env_var: GATEWAY_PORT
    description: API网关
    status: reserved
    deployment_modes: [docker, saas]

  frontend:
    port: 3000
    env_var: WEB_PORT
    description: Web应用
    status: implemented
    deployment_modes: [local, docker, saas]

  postgres:
    port: 5432
    env_var: POSTGRES_PORT
    description: 数据库
    deployment_modes: [local, docker, saas]

  redis:
    port: 6379
    env_var: REDIS_PORT
    description: 缓存
    deployment_modes: [local, docker, saas]

  ollama:
    port: 11434
    env_var: OLLAMA_PORT
    description: AI模型服务
    deployment_modes: [local, docker, saas]

# 服务模块分组 (用于 start-module 命令)
# V66.1：extension 分组增加；all 组补齐 6 外迁扩展服务
module_groups:
  core:
    - iam

  manufacturing:
    - mes
    - pdm

  supply-chain:
    - scm
    - wms
    - srm

  quality-rd:
    - qms
    - lims
    - ehs
    - rd

  plm:
    - pdm
    - rd

  analytics:
    - bi
    - portal
    # V66.1：cross-reference — 搜索为 BI dashboard 提供全文检索支撑
    - search

  infrastructure:
    - mobile
    - gis
    - integration
    # [V2026.08 已移除] lowcode 空壳占位服务

  collaboration:
    - hrm
    - pm
    - crm
    # V66.1：cross-reference — communication（mail/im/notification）为协同办公提供通讯底座
    - communication
    # V66.1：cross-reference — ticket 为协同办公提供工单/反馈闭环（feedback 已合并至 ticket）
    - ticket

  erp:
    - erp
    - finance
    - ai

  master-data:
    - master-data

  # V66.1：扩展服务（从 unified-core 外迁为独立进程）
  extension:
    - search
    - communication
    - ticket
    # [V2026.08 已合并] feedback 已合并至 ticket
    # [V2026.08 已移除] lowcode 空壳占位服务

  # 物流服务（V284 补全 tms/aps 至单一信源）
  logistics:
    - tms
    - aps

  # 全量启动清单（22 + 6 extension + 2 logistics = 30 项；iam 代表 unified-core:8000）
  all:
    - iam
    # 扩展服务（V66 外迁，端口 8082/8084-8088）
    - search
    - communication
    - ticket
    # [V2026.08 已合并] feedback 已合并至 ticket
    # [V2026.08 已移除] lowcode 空壳占位服务
    # 经营管理（8010-8019）
    - erp
    - finance
    - ai
    # 协同办公（8020-8029）
    - hrm
    - pm
    - crm
    # 生产制造（8030-8039）
    - mes
    - pdm
    # 供应链（8040-8049）
    - scm
    - wms
    - srm
    # 质量/研发（8050-8059）
    - qms
    - lims
    - ehs
    - rd
    # 数据分析/门户（8060-8069）
    - bi
    - portal
    # 基础设施（8070-8079）
    - mobile
    - gis
    - integration
    # 主数据（8090）
    - master-data
    # 物流服务（8073-8074，V284 补全）
    - tms
    - aps
