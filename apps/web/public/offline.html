<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOPEMS - 离线模式</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 20px;
    }
    
    .offline-container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }
    
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ffffff;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
    }
    
    .offline-features {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      text-align: left;
    }
    
    .offline-features h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 16px;
      color: #ffffff;
    }
    
    .offline-features ul {
      list-style: none;
    }
    
    .offline-features li {
      padding: 10px 0;
      padding-left: 28px;
      position: relative;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .offline-features li:last-child {
      border-bottom: none;
    }
    
    .offline-features li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background: rgba(34, 197, 94, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    
    .offline-features li::after {
      content: '✓';
      position: absolute;
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #22c55e;
    }
    
    .retry-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border: none;
      color: white;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
    
    .last-sync {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    @media (max-width: 480px) {
      .offline-icon {
        width: 100px;
        height: 100px;
        font-size: 50px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      p {
        font-size: 14px;
      }
      
      .offline-features {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    
    <h1>离线模式</h1>
    
    <p>当前网络连接不可用。您仍可以访问已缓存的内容和执行离线操作。</p>
    
    <div class="offline-features">
      <h3>离线可用功能</h3>
      <ul>
        <li>查看已缓存的业务数据</li>
        <li>浏览历史记录</li>
        <li>执行本地操作（联网后自动同步）</li>
        <li>查看已下载的文档和图片</li>
        <li>访问系统设置</li>
      </ul>
    </div>
    
    <button class="retry-btn" id="retryBtn">
      <span>重新连接</span>
    </button>
    
    <div class="last-sync" id="lastSync">
      上次同步：刚刚
    </div>
  </div>
  
  <script>
    const retryBtn = document.getElementById('retryBtn');
    const lastSync = document.getElementById('lastSync');
    
    function updateLastSync() {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
      lastSync.textContent = `上次同步：${timeStr}`;
    }
    
    updateLastSync();
    
    retryBtn.addEventListener('click', () => {
      retryBtn.innerHTML = '<span class="spinner"></span><span>正在连接...</span>';
      
      fetch('/api/health').then((response) => {
        if (response.ok) {
          location.reload();
        } else {
          throw new Error('连接失败');
        }
      }).catch(() => {
        setTimeout(() => {
          retryBtn.innerHTML = '<span>重新连接</span>';
          updateLastSync();
        }, 2000);
      });
    });
    
    setInterval(() => {
      if (navigator.onLine) {
        location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
