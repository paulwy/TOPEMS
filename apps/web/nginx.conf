events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ========== API 上游（P0-3 双轨合一：唯一对外入口 = 模块化单体 BFF :8099） ==========
    # 原 per-service upstream（unified_core 8000 / erp 8010 / … / plugin-registry 8096）
    # 及其 $request_uri 前缀 map 已关闭：全部 /api/* 由 topems-server(:8099)
    # 内嵌约 30 个服务适配器统一路由（web_contract_smoke 全量依赖此 BFF 面）。
    # 注：单行 `{ server localhost:8099 … }` 以保持与校验器
    # scripts/ci/check-config-sources.cjs（upstream 端口一致性 F 段）解析兼容。
    upstream server_service { server localhost:8099 max_fails=3 fail_timeout=30s; keepalive 32; }

    server {
        listen 3000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Handle SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ========== 统一 API 代理（P0-3：直代 BFF :8099，未知路由由 BFF catch-all 返回 404） ==========
        location /api/ {
            proxy_pass http://server_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect off;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }
}
