events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ========== API 上游（端口表与 deploy/nginx/topems.conf 一致，host 网络模式） ==========
    # 说明：镜像独立部署时各后端服务监听宿主端口（与项目既有 host 网络拓扑一致）；
    #       若部署在 compose/k8s 网络内，应改用服务名（参考 deploy/docker/nginx/nginx.conf）
    upstream unified_core_service      { server localhost:8000 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream erp_service               { server localhost:8010 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream hrm_service               { server localhost:8020 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream pm_service                { server localhost:8023 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream crm_service               { server localhost:8029 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream mes_service               { server localhost:8030 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream pdm_service               { server localhost:8031 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream scm_service               { server localhost:8040 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream wms_service               { server localhost:8041 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream srm_service               { server localhost:8042 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream qms_service               { server localhost:8050 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream lims_service              { server localhost:8051 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream ehs_service               { server localhost:8052 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream rd_service                { server localhost:8053 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream bi_service                { server localhost:8060 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream portal_service            { server localhost:8063 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream mobile_service            { server localhost:8070 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream gis_service               { server localhost:8071 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream integration_service       { server localhost:8072 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream tms_service               { server localhost:8073 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream search_service            { server localhost:8082 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream communication_service     { server localhost:8084 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream ticket_service            { server localhost:8086 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream master_data_service       { server localhost:8090 max_fails=3 fail_timeout=30s; keepalive 32; }
    upstream plugin_registry_service   { server localhost:8096 max_fails=3 fail_timeout=30s; keepalive 32; }

    # ========== URI 前缀 → upstream 路由表（与 deploy/nginx/topems.conf 同步维护） ==========
    # 前端所有 API 走同源相对路径 /api/{svc}（apps/web/src/config/runtime.ts 默认值），
    # 未匹配的 /api/* 返回 404
    map $request_uri $api_upstream {
        default "";
        # unified-core 虚拟服务（含 doc/monitor 已合并模块）
        ~^/api/(core|doc|monitor)/          unified_core_service;
        # bi 服务（含 analytics/report 别名）
        ~^/api/(bi|analytics|report)/       bi_service;
        # 独立业务服务
        ~^/api/erp/                         erp_service;
        ~^/api/finance/                     finance_service;
        ~^/api/ai/                          ai_service;
        ~^/api/hrm/                         hrm_service;
        ~^/api/pm/                          pm_service;
        ~^/api/crm/                         crm_service;
        ~^/api/mes/                         mes_service;
        ~^/api/aps/                         mes_service;   # [V2026.08] aps 已合并至 mes（兼容层）
        ~^/api/pdm/                         pdm_service;
        ~^/api/scm/                         scm_service;
        ~^/api/wms/                         wms_service;
        ~^/api/srm/                         srm_service;
        ~^/api/qms/                         qms_service;
        ~^/api/lims/                        lims_service;
        ~^/api/ehs/                         ehs_service;
        ~^/api/rd/                          rd_service;
        ~^/api/portal/                      portal_service;
        ~^/api/mobile/                      mobile_service;
        ~^/api/gis/                         gis_service;
        ~^/api/integration/                 integration_service;
        ~^/api/tms/                         tms_service;
        # 外迁独立服务
        ~^/api/search/                      search_service;
        ~^/api/communication/               communication_service;
        ~^/api/ticket/                      ticket_service;
        ~^/api/feedback/                    ticket_service;  # [V2026.08] feedback→ticket 兼容路由
        ~^/api/master-data/                 master_data_service;
        ~^/api/plugin/                      plugin_registry_service;
    }

    server {
        listen 3000;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Handle SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ========== 统一 API 代理（map 驱动，转发完整 URI） ==========
        location /api/ {
            if ($api_upstream = "") { return 404; }
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect off;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }
}
