[package]
name = "topems-desktop"
version = "1.0.0"
description = "TOPEMS Enterprise Management System Desktop Application"
authors = ["TOPEMS Team"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[dependencies]
tauri = { version = "2.0", features = ["shell-open", "dialog-open", "system-tray", "updater"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-log = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = "2.0"