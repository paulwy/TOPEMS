[package]
name = "topems-desktop"
version = "1.0.0"
description = "TOPEMS Enterprise Management System Desktop Application"
authors = ["TOPEMS Team"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
