[package]
name = "topems-desktop"
version = "5.14.0"
description = "TOPEMS Enterprise Management System Desktop Application"
authors = ["TOPEMS Team"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-stronghold = "2"
lazy_static = "1.4"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
directories = "5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
wiremock = "0.6"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
