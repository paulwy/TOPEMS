[package]
name = "topems-shared"
version = "0.1.0"
edition = "2021"
description = "Shared library for TOPEMS microservices"
authors = ["TOPEMS Team"]

[dependencies]
envy = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
axum = "0.8"
async-trait = "0.1"
jsonwebtoken = "9.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.11", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "time", "chrono"] }
md5 = "0.7"
redis = { version = "0.24", features = ["tokio-comp"] }
regex = "1.10"
url = "2.5"
urlencoding = "2.1"
futures-util = "0.3"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
tempdir = "0.3"
