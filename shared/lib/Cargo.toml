[package]
name = "topems-shared"
version = "0.1.0"
edition = "2021"
description = "Shared library for TOPEMS microservices"
authors = ["TOPEMS Team"]

[dependencies]
envy = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
axum = "0.8"
async-trait = "0.1"
jsonwebtoken = "9.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
