<!-- TOPEMS HRM Shell - Shared Partial -->
<!-- Included by all HRM pages: dashboard, employees, org, etc. -->
<!-- Expects <link> to colors_and_type.css in parent <head> -->

<!-- ============================== -->
<!-- HEADER NAVIGATION BAR          -->
<!-- ============================== -->
<header
  id="topems-header"
  class="sticky top-0 z-50 w-full shadow-sm"
  style="height:56px; background:var(--color-surface); border-bottom:1px solid var(--color-border); box-shadow:var(--shadow-sm);"
>
  <div class="flex items-center justify-between h-full px-4 lg:px-6 max-w-[1800px] mx-auto">
    <!-- Left: Mobile Hamburger + Logo + Brand Name -->
    <div class="flex items-center gap-3">
      <!-- Mobile Menu Toggle (visible < lg) -->
      <button
        id="mobile-menu-btn"
        class="lg:hidden flex items-center justify-center rounded-md transition-colors duration-150"
        style="width:36px; height:36px; color:var(--color-text-secondary);"
        aria-label="打开菜单"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div
        class="flex items-center justify-center text-white font-bold"
        style="width:36px; height:36px; border-radius:var(--radius-md); background:var(--gradient-brand); font-size:var(--font-size-xl); font-family:var(--font-sans);"
        aria-label="TOPEMS Logo"
      >T</div>
      <span
        class="text-lg font-bold select-none"
        style="font-family:var(--font-sans); font-weight:var(--font-weight-bold); background:var(--gradient-brand); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;"
      >TOPEMS</span>
      <!-- Module Badge -->
      <span
        class="hidden sm:inline-flex px-2 py-0.5 text-xs font-semibold rounded-md"
        style="background:var(--gradient-module-hrm); color:#ffffff; font-family:var(--font-sans);"
      >HRM</span>
    </div>

    <!-- Center: Navigation Links (hidden < md) -->
    <nav class="hidden md:flex items-center gap-1" id="header-nav">
      <a
        href="#"
        class="relative flex items-center px-4 py-2 text-sm font-medium transition-colors duration-150 rounded-md header-nav-link"
        style="color:var(--color-primary); font-family:var(--font-sans); font-weight:var(--font-weight-medium);"
        data-nav="dashboard"
      >
        HRM 仪表盘
        <span class="absolute bottom-0 left-2 right-2 h-0.5 rounded-full" style="background:var(--color-primary);"></span>
      </a>
      <a
        href="#"
        class="relative flex items-center px-4 py-2 text-sm font-medium transition-colors duration-150 rounded-md header-nav-link"
        style="color:var(--color-text-secondary); font-family:var(--font-sans); font-weight:var(--font-weight-medium);"
        data-nav="employees"
      >
        员工管理
      </a>
      <a
        href="#"
        class="relative flex items-center px-4 py-2 text-sm font-medium transition-colors duration-150 rounded-md header-nav-link"
        style="color:var(--color-text-secondary); font-family:var(--font-sans); font-weight:var(--font-weight-medium);"
        data-nav="reports"
      >
        HR 报表
      </a>
    </nav>

    <!-- Right: Search (icon only on mobile) + Actions -->
    <div class="flex items-center gap-2">
      <!-- Search Bar (hidden < md) -->
      <div class="hidden md:flex items-center rounded-md transition-colors duration-150" style="border:1px solid var(--color-border); background:var(--color-surface-light);">
        <div class="flex items-center justify-center px-3" style="color:var(--color-text-muted);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <input
          type="text"
          placeholder="搜索员工..."
          class="py-1.5 pr-3 text-sm outline-none bg-transparent"
          style="color:var(--color-text-primary); font-family:var(--font-sans); width:180px;"
        />
      </div>
      <!-- Mobile Search Icon (visible < md) -->
      <button
        class="md:hidden flex items-center justify-center rounded-md transition-colors duration-150"
        style="width:36px; height:36px; color:var(--color-text-secondary);"
        aria-label="搜索"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>

      <!-- Notification Bell -->
      <button
        class="relative flex items-center justify-center transition-colors duration-150 rounded-md"
        style="width:36px; height:36px; color:var(--color-text-secondary);"
        aria-label="通知"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="absolute top-1 right-1 w-2 h-2 rounded-full" style="background:var(--state-error);"></span>
      </button>

      <!-- Theme Toggle -->
      <button
        class="flex items-center justify-center transition-colors duration-150 rounded-md"
        style="width:36px; height:36px; color:var(--color-text-secondary);"
        aria-label="切换主题"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>

      <!-- User Avatar -->
      <button
        class="flex items-center justify-center text-sm font-semibold text-white rounded-full"
        style="width:34px; height:34px; background:var(--gradient-brand); font-family:var(--font-sans);"
        aria-label="用户菜单"
      >张</button>
    </div>
  </div>
</header>

<style>
  /* Header nav link hover */
  .header-nav-link:hover {
    background: var(--color-surface-light);
  }

  /* Sidebar nav item hover */
  .sidebar-nav-item:hover {
    background: var(--color-surface-light);
    color: var(--color-text-primary) !important;
  }

  /* Sidebar nav item active */
  .sidebar-nav-item.active,
  .sidebar-nav-item[data-active="true"] {
    border-left: 2px solid var(--color-primary);
    background: color-mix(in srgb, var(--color-primary) 5%, transparent);
    color: var(--color-primary) !important;
  }

  /* Header nav active indicator */
  .header-nav-link.active::after,
  .header-nav-link[data-active="true"]::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 8px;
    right: 8px;
    height: 2px;
    border-radius: 9999px;
    background: var(--color-primary);
  }

  /* Active nav link text color */
  .header-nav-link.active,
  .header-nav-link[data-active="true"] {
    color: var(--color-primary) !important;
  }

  /* Footer links hover */
  #topems-footer a:hover {
    color: var(--color-primary) !important;
  }

  /* Sidebar collapsed state (desktop) */
  #topems-sidebar.collapsed {
    width: 64px !important;
  }
  #topems-sidebar.collapsed .sidebar-nav-item span,
  #topems-sidebar.collapsed .sidebar-nav-item svg + span,
  #topems-sidebar.collapsed [data-user-info] {
    display: none;
  }
  #topems-sidebar.collapsed .sidebar-nav-item {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
  }

  /* Custom scrollbar for sidebar */
  #sidebar-nav::-webkit-scrollbar {
    width: 4px;
  }
  #sidebar-nav::-webkit-scrollbar-thumb {
    background: var(--color-border);
    border-radius: 9999px;
  }
  #sidebar-nav::-webkit-scrollbar-track {
    background: transparent;
  }

  /* Mobile sidebar open state */
  #topems-sidebar.sidebar-open {
    transform: translateX(0) !important;
  }
  #sidebar-overlay.overlay-visible {
    display: block !important;
    opacity: 1 !important;
  }
</style>

<!-- ============================== -->
<!-- SHELL-LEVEL INLINE SCRIPTS     -->
<!-- ============================== -->
<script>
(function() {
  'use strict';

  // ---- Mobile Sidebar Toggle ----
  var mobileMenuBtn = document.getElementById('mobile-menu-btn');
  var mobileCloseBtn = document.getElementById('mobile-menu-close-btn');
  var sidebar = document.getElementById('topems-sidebar');
  var overlay = document.getElementById('sidebar-overlay');

  function openMobileSidebar() {
    if (sidebar && overlay) {
      sidebar.classList.add('sidebar-open');
      overlay.classList.add('overlay-visible');
      document.body.style.overflow = 'hidden';
    }
  }
  function closeMobileSidebar() {
    if (sidebar && overlay) {
      sidebar.classList.remove('sidebar-open');
      overlay.classList.remove('overlay-visible');
      document.body.style.overflow = '';
    }
  }

  if (mobileMenuBtn) { mobileMenuBtn.addEventListener('click', openMobileSidebar); }
  if (mobileCloseBtn) { mobileCloseBtn.addEventListener('click', closeMobileSidebar); }
  if (overlay) { overlay.addEventListener('click', closeMobileSidebar); }

  // ---- Sidebar collapse toggle (desktop) ----
  var collapseBtn = document.getElementById('sidebar-collapse-btn');
  if (collapseBtn && sidebar) {
    collapseBtn.addEventListener('click', function() {
      sidebar.classList.toggle('collapsed');
      var isCollapsed = sidebar.classList.contains('collapsed');
      collapseBtn.querySelector('span').textContent = isCollapsed ? '展开菜单' : '收起菜单';
      collapseBtn.querySelector('svg').style.transform = isCollapsed ? 'rotate(180deg)' : '';
    });
  }

  // ---- Header nav active state management ----
  var headerLinks = document.querySelectorAll('.header-nav-link');
  headerLinks.forEach(function(link) {
    link.addEventListener('click', function(e) {
      headerLinks.forEach(function(l) {
        l.classList.remove('active');
        l.removeAttribute('data-active');
        l.style.color = 'var(--color-text-secondary)';
        var indicator = l.querySelector('span');
        if (indicator && indicator.classList.contains('h-0\\.5')) {
          indicator.style.display = 'none';
        }
      });
      this.classList.add('active');
      this.setAttribute('data-active', 'true');
      this.style.color = 'var(--color-primary)';
    });
  });

  // ---- Sidebar nav active state management ----
  var sidebarLinks = document.querySelectorAll('.sidebar-nav-item');
  sidebarLinks.forEach(function(link) {
    link.addEventListener('click', function(e) {
      sidebarLinks.forEach(function(l) {
        l.classList.remove('active');
        l.removeAttribute('data-active');
        l.style.color = 'var(--color-text-secondary)';
        l.style.borderLeftColor = 'transparent';
        l.style.background = 'transparent';
      });
      this.classList.add('active');
      this.setAttribute('data-active', 'true');
      this.style.color = 'var(--color-primary)';
      this.style.borderLeftColor = 'var(--color-primary)';
      this.style.background = 'color-mix(in srgb, var(--color-primary) 5%, transparent)';
      // Close mobile sidebar after selecting a menu item
      closeMobileSidebar();
    });
  });
})();
</script>
