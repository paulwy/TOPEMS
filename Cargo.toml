[workspace]
members = [
    "lib",
    "svc/file",
    "svc/iam",
    "svc/doc",
    "svc/flow",
    "svc/ai",
    "svc/erp",
    "svc/hrm",
    "svc/crm",
    "svc/lims",
    "svc/pm",
    "svc/pdm",
    "svc/qms",
    "svc/rs",
    "svc/scm",
    "svc/srm",
    "svc/wms",
    "svc/ehs",
    "svc/gis",
    "svc/im",
    "svc/mail",
    "svc/mes",
    "svc/portal",
    "svc/notification",
    "svc/report",
    "svc/bi",
    "svc/integration",
    "svc/mobile",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TOPEMS Team"]

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

axum-prometheus = "0.8"
prometheus = "0.13"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
bcrypt = "0.15"
reqwest = { version = "0.12", features = ["json"] }
utoipa = "4"
utoipa-swagger-ui = { version = "4", features = ["axum"] }
csv = "1"
once_cell = "1.19"
dashmap = "6"
futures = "0.3"
jsonwebtoken = "9.0"
lazy_static = "1"
regex = "1"
tokio-test = "0.4"

async-trait = "0.1"
axum-test = "18"
bigdecimal = { version = "0.4", features = ["serde"] }
bytes = "1"
futures-util = "0.3"
http = "1"
lopdf = "0.34"
md5 = "0.7"
mime = "0.3"
mime_guess = "2"
pdf-extract = "0.7"
rust_decimal = { version = "1", features = ["serde"] }
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
tempfile = "3.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower-cookies = "0.11"
tower-util = "0.1"
walkdir = "2"
libc = "0.2"

[patch.crates-io]