# ================================================
# Shared Library Sub-crates (A4.2 去门面化迁移)
# ================================================
# topems-shared 主 crate 及其子 crate，支持服务直接依赖而非经由 topems_shared:: 门面
# Cargo workspace.dependencies 键名使用连字符版本（crate 名的实际格式）
# 服务中可使用连字符或下划线引用，Cargo 会自动归一化
topems-shared = { path = "lib" }
topems-shared-core = { path = "lib/shared-core" }
topems-shared-db = { path = "lib/shared-db" }
topems-shared-auth = { path = "lib/shared-auth" }
topems-shared-service-client = { path = "lib/shared-service-client" }
topems-shared-event = { path = "lib/shared-event" }
topems-shared-observability = { path = "lib/shared-observability" }
topems-shared-ai = { path = "lib/shared-ai" }
topems-shared-bootstrap = { path = "lib/shared-bootstrap" }
topems-shared-boundary = { path = "lib/shared-boundary" }

# GraphQL BFF 聚合层（V33.0 Portal BFF Phase 3）
async-graphql = { version = "7", features = ["tokio", "chrono", "uuid", "dataloader", "apollo_persisted_queries"] }
async-graphql-axum = "7"
cron = "0.12"
job_scheduler_ng = "2.0"
lettre = { version = "0.11", features = ["default", "smtp-transport", "tokio1-native-tls"] }
handlebars = { version = "5", features = ["dir_source"] }

mockall = "0.11"


[patch.crates-io]

[profile.release]
# 性能优先：相比 "z"，二进制仅大 ~5% 但服务端吞吐量提升 10~25%
opt-level = 3
# 薄 LTO：90% 的全 LTO 收益，编译速度提升 ~3×
lto = "thin"
# 多 codegen-units 并行编译，开发体验显著提升
codegen-units = 16
# 保留 strip 去除符号表以控制体积
strip = true
# 保留默认 unwind：线上 panic 时仍可栈回溯，避免 SIGABRT 黑盒
# panic = "abort"
# 保留默认 incremental：CI cache 命中时可复用增量编译
# incremental = false
#
# > 体积极限模式（CI 正式发布专用，编译 +60~120% 时间）：
# >   lto = "fat"
# >   codegen-units = 1

[profile.dev]
# 开发模式用 opt-level=1：比默认 0 快 1.5~3×，同时保留调试符号
opt-level = 1
# 开启增量编译（Rust 默认 true，这里显式声明）
incremental = true
# 仅保留行号表：比 debug=2 节省 70%+ 符号体积，仍可 backtrace
debug = 1
# 去除私有符号表：不影响 panic backtrace，rlib 体积再减 30~50%
strip = "symbols"
# 代码生成并行（多核机器加速）
codegen-units = 256
# dev 模式跳过 LTO（节省增量编译时间）
lto = false