[workspace]
members = [
    # [桌面应用] 排除在工作区外，独立构建
    "lib",
    # [共享库子 crate] topems-shared 按功能域拆分的子 crate
    "lib/shared-core",
    "lib/shared-db",
    "lib/shared-auth",
    "lib/shared-service-client",
    "lib/shared-event",
    "lib/shared-observability",
    "lib/shared-ai",
    "lib/shared-bootstrap",
    "lib/shared-mcp",
    "lib/shared-dsh",
    "lib/shared-boundary",
    # [示例] 按需引入示例；默认排除以加速 workspace grep 与增量编译
    # "examples/minimal-service",
    # [模块化单体] 统一入口服务（P0 架构优化，详见 docs/architecture/modular-monolith-design.md）
    "svc/server",
    # ================================================
    # 7 个核心模块组（V2026.08 模块化单体分组）
    # 分组定义见 docs/architecture/modular-monolith-design.md
    # core     ：平台核心（unified-core/monitor/plugin-registry/search/
    #             communication/integration/portal/mobile/ticket）
    # erp      ：企业资源（erp/scm/srm/pm/pdm）
    # finance  ：财务（finance/billing）
    # crm      ：客户关系（crm）
    # wms      ：仓储制造（wms/tms/mes/qms/ehs/lims/gis/rd）
    # advanced ：高级数据（master-data/analytics）
    # ai       ：智能（ai）
    # ================================================
    # [模块组: core] 统一核心平台 (IAM + Doc + Flow + File + Communication + Monitor)
    "svc/unified-core",
    "svc/monitor",
    "svc/plugin-registry",
    "svc/search",
    "svc/communication",
    "svc/integration",
    "svc/portal",
    "svc/mobile",
    "svc/ticket",
    "svc/hrm",
    # [模块组: erp] 企业资源
    "svc/erp",
    "svc/scm",
    "svc/srm",
    "svc/pm",
    "svc/pdm",
    # [模块组: finance] 财务
    "svc/finance",
    # [模块组: crm] 客户关系
    "svc/crm",
    # [模块组: wms] 仓储制造
    "svc/wms",
    "svc/tms",
    "svc/mes",
    # [V2026.08 已合并] svc/aps 已合并至 mes（aps_scheduling/aps_compat 模块，/api/aps 兼容层由 mes 提供），代码归档 svc/_archive/aps
    "svc/qms",
    "svc/ehs",
    "svc/lims",
    "svc/gis",
    "svc/rd",
    # [模块组: advanced] 高级数据
    "svc/master-data",
    "svc/analytics",
    # [模块组: ai] 智能
    "svc/ai",
    # [SDK] 默认排除（迁移工具一次性脚本，非业务常驻）
    "tools/migration-sdk",
    # [V2026.08 已合并] feedback 服务已合并至 ticket（customer_feedback 类型）
    # [V2026.08 已移除] lowcode 空壳占位服务（后端尚未立项，所有handler返回501）
    # 代码归档见 docs/archive/，如未来立项可恢复
]
exclude = [
    "apps/desktop/src-tauri",
]
resolver = "2"

# ================================================
# 模块化单体分组（P0 架构优化）
# 注意：虚拟 workspace 不允许 [features]，模块组 feature flags
# 定义在 svc/server/Cargo.toml（topems-server 统一入口）。
# 分组定义详见 docs/architecture/modular-monolith-design.md
# 7 个核心模块组：core / erp / finance / crm / wms / advanced / ai
# 部署模式：private-deployment（进程内 trait）/ saas-deployment（HTTP）
# ================================================

# ================================================
# V66.2 Shared Bootstrap V2 覆盖率：28/28 (100%)
# ================================================
# 28 工作区业务服务全部使用以下统一启动 API：
#   ServiceConfig → bootstrap_service → build_application → run
#   三种模式拆分：
#     A. 标准 build_application (8): search,ticket,
#                                    communication,billing,master-data,
#                                    hrm,finance,wms
#     B. stateful + build_application (11): qms,ehs,pdm,lims,erp,crm,
#                                          srm,scm,mes,pm,rd
#     C. Application 重建 (7): analytics,unified-core,integration,gis,portal,ai,mobile
# ================================================

# ================================================
# [已废弃服务 - 保留代码供参考，不参与构建]
# ================================================
# svc/manufacturing    → svc/mes + svc/pdm（已拆分独立部署）
# svc/quality-assurance → svc/qms + svc/lims + svc/ehs（已拆分独立部署）
# svc/bi               → svc/analytics（已整合到 analytics 统一服务，2026-06）
# svc/report           → svc/analytics（已整合到 analytics 统一服务，2026-07）
# svc/config-center    → 功能已整合到 etcd + unified-core 配置管理
# svc/shared           → 功能已整合到 lib/topems_shared
# svc/user-service     → 功能已整合到 unified-core/iam/user（用户管理由 /api/core/iam/users 提供，2026-07）
#                        原服务使用 .merge()+硬编码全路径（/api/users/users）非统一模式，且端口 8060 与 BI 冲突
# svc/monitor          → 功能已整合到 unified-core/modules/monitor（2026-07）
#                        告警、指标、SLO、健康检查路由由 /api/core/monitor/* 提供
# svc/doc              → 功能已整合到 unified-core/modules/doc（2026-07）
#                        文档、模板、文件夹管理由 /api/core/doc/* 提供
# ================================================

[workspace.package]
version = "0.1.0"
