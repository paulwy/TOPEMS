[workspace]
members = [
    "lib",
    # [核心平台] 统一核心平台
    "svc/unified-core",      # IAM + Doc + Flow + File + Communication
    # [SDK] 共享工具库
    "svc/migration-sdk",     # 数据库迁移SDK
    # [独立服务] 业务模块（插件式架构）
    "svc/ai",
    "svc/erp",
    "svc/hrm",
    "svc/crm",
    "svc/pm",
    "svc/portal",
    "svc/rs",
    "svc/scm",
    "svc/srm",
    "svc/wms",
    "svc/gis",
    "svc/integration",
    "svc/mobile",
    "svc/monitor",
    # [生产制造]
    "svc/mes",
    "svc/pdm",
    # [质量与研发]
    "svc/qms",
    "svc/lims",
    "svc/ehs",
    # [财务与文档]
    "svc/finance",
    "svc/doc",
    # [数据分析]
    "svc/analytics",
]
resolver = "2"

# ================================================
# [已废弃服务 - 保留代码供参考，不参与构建]
# ================================================
# svc/manufacturing    → svc/mes + svc/pdm（已拆分独立部署）
# svc/quality-assurance → svc/qms + svc/lims + svc/ehs（已拆分独立部署）
# svc/bi               → svc/analytics（已整合到 analytics 统一服务，2026-06）
# svc/report           → svc/analytics（已整合到 analytics 统一服务，2026-07）
# svc/config-center    → 功能已整合到 etcd + unified-core 配置管理
# svc/shared           → 功能已整合到 lib/topems_shared
# ================================================

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TOPEMS Team"]

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "timeout", "compression-br"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "bigdecimal", "rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
bigdecimal = { version = "0.4", features = ["serde"] }

axum-prometheus = "0.8"
prometheus = "0.13"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
bcrypt = "0.15"
reqwest = { version = "0.12", features = ["json"] }
utoipa = "4"
utoipa-swagger-ui = { version = "4", features = ["axum"] }
csv = "1"
once_cell = "1.19"
zip = "0.6"
dashmap = "6"
futures = "0.3"
jsonwebtoken = "9.0"
lazy_static = "1"
regex = "1"
tokio-test = "0.4"

async-trait = "0.1"
axum-test = "18"
bytes = "1"
futures-util = "0.3"
http = "1"
lopdf = "0.34"
md5 = "0.7"
mime = "0.3"
mime_guess = "2"
pdf-extract = "0.7"
rust_decimal = { version = "1", features = ["serde"] }
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
tempfile = "3.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower-cookies = "0.11"
tower-util = "0.1"
walkdir = "2"
libc = "0.2"
cron = "0.12"
job_scheduler_ng = "2.0"
lettre = { version = "0.11", features = ["default", "smtp-transport", "tokio1-native-tls"] }
handlebars = { version = "5", features = ["dir_source"] }

mockall = { version = "0.11", features = ["nightly"] }


[patch.crates-io]