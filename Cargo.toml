[workspace]
members = [
    # [桌面应用] 排除在工作区外，独立构建
    "lib",
    # [共享库子 crate] topems-shared 按功能域拆分的子 crate
    "lib/shared-core",
    "lib/shared-db",
    "lib/shared-auth",
    "lib/shared-service-client",
    "lib/shared-event",
    "lib/shared-observability",
    "lib/shared-ai",
    "lib/shared-bootstrap",
    # [示例] 按需引入示例；默认排除以加速 workspace grep 与增量编译
    # "examples/minimal-service",
    # [核心平台] 统一核心平台 (IAM + Doc + Flow + File + Communication + Monitor)
    "svc/unified-core",
    # [SDK] 默认排除（迁移工具一次性脚本，非业务常驻）
    # "tools/migration-sdk",
    # [独立服务] 业务模块（插件式架构）
    "svc/ai",
    "svc/erp",
    "svc/hrm",
    "svc/crm",
    "svc/pm",
    "svc/portal",
    "svc/rd",
    "svc/scm",
    "svc/srm",
    "svc/wms",
    "svc/gis",
    "svc/integration",
    "svc/mobile",
    # [生产制造]
    "svc/mes",
    "svc/pdm",
    # [质量与研发]
    "svc/qms",
    "svc/lims",
    "svc/ehs",
    # [财务与文档]
    "svc/finance",
    # [数据分析]
    "svc/analytics",
    # [主数据管理]
    "svc/master-data",
    # [统一核心模块独立]
    "svc/billing",
    "svc/ticket",
    "svc/feedback",
    "svc/search",
    "svc/communication",
    # [V66.1 占位服务] lowcode 后端占位模板（功能待立项）
    "svc/lowcode",
]
exclude = [
    "apps/desktop/src-tauri",
]
resolver = "2"

# ================================================
# [已废弃服务 - 保留代码供参考，不参与构建]
# ================================================
# svc/manufacturing    → svc/mes + svc/pdm（已拆分独立部署）
# svc/quality-assurance → svc/qms + svc/lims + svc/ehs（已拆分独立部署）
# svc/bi               → svc/analytics（已整合到 analytics 统一服务，2026-06）
# svc/report           → svc/analytics（已整合到 analytics 统一服务，2026-07）
# svc/config-center    → 功能已整合到 etcd + unified-core 配置管理
# svc/shared           → 功能已整合到 lib/topems_shared
# svc/user-service     → 功能已整合到 unified-core/iam/user（用户管理由 /api/core/iam/users 提供，2026-07）
#                        原服务使用 .merge()+硬编码全路径（/api/users/users）非统一模式，且端口 8060 与 BI 冲突
# svc/monitor          → 功能已整合到 unified-core/modules/monitor（2026-07）
#                        告警、指标、SLO、健康检查路由由 /api/core/monitor/* 提供
# svc/doc              → 功能已整合到 unified-core/modules/doc（2026-07）
#                        文档、模板、文件夹管理由 /api/core/doc/* 提供
# ================================================

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TOPEMS Team"]

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart", "ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "timeout", "compression-br"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "bigdecimal", "rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
bigdecimal = { version = "0.4", features = ["serde"] }

axum-prometheus = "0.8"
prometheus = "0.13"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
bcrypt = "0.15"
reqwest = { version = "0.12", features = ["json"] }
utoipa = "=4.2.3"
# 注：utoipa-swagger-ui（Swagger UI 页面）已从 workspace 移除（原版本 4.x 硬依赖 axum 0.6，与项目 axum 0.8 冲突）
# erp/pm/rd 3 服务原引用了 workspace utoipa-swagger-ui 但均未在代码中实际 import（Grep 0 命中），属于冗余依赖
# 未来如需本地 Swagger UI 调试，可单独引入 utoipa v5 + utoipa-swagger-ui v9（匹配 axum 0.8）
csv = "1"
once_cell = "1.19"
zip = "0.6"
dashmap = "6"
futures = "0.3"
jsonwebtoken = "9.0"
lazy_static = "1"
regex = "1"
tokio-test = "0.4"

async-trait = "0.1"
axum-test = "21"
bytes = "1"
futures-util = "0.3"
http = "1"
lopdf = "0.34"
md5 = "0.7"
url = "2"
mime = "0.3"
mime_guess = "2"
pdf-extract = "0.7"
rust_decimal = { version = "1", features = ["serde"] }
rand = "0.8"

# Force tonic version to avoid axum 0.6 conflict
tonic = "0.14"
socket2 = { version = "0.5", features = ["all"] }
tempfile = "3.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower-cookies = "0.11"
tower-util = "0.1"
walkdir = "2"
moka = { version = "0.12", features = ["future", "sync"] }

# GraphQL BFF 聚合层（V33.0 Portal BFF Phase 3）
async-graphql = { version = "7", features = ["tokio", "chrono", "uuid", "dataloader", "apollo_persisted_queries"] }
async-graphql-axum = "7"
libc = "0.2"
cron = "0.12"
job_scheduler_ng = "2.0"
lettre = { version = "0.11", features = ["default", "smtp-transport", "tokio1-native-tls"] }
handlebars = { version = "5", features = ["dir_source"] }

mockall = "0.11"


[patch.crates-io]

[profile.release]
# 性能优先：相比 "z"，二进制仅大 ~5% 但服务端吞吐量提升 10~25%
opt-level = 3
# 薄 LTO：90% 的全 LTO 收益，编译速度提升 ~3×
lto = "thin"
# 多 codegen-units 并行编译，开发体验显著提升
codegen-units = 16
# 保留 strip 去除符号表以控制体积
strip = true
# 保留默认 unwind：线上 panic 时仍可栈回溯，避免 SIGABRT 黑盒
# panic = "abort"
# 保留默认 incremental：CI cache 命中时可复用增量编译
# incremental = false
#
# > 体积极限模式（CI 正式发布专用，编译 +60~120% 时间）：
# >   lto = "fat"
# >   codegen-units = 1

[profile.dev]
# 开发模式用 opt-level=1：比默认 0 快 1.5~3×，同时保留调试符号
opt-level = 1
# 开启增量编译（Rust 默认 true，这里显式声明）
incremental = true
# 保留 debug info（debugger/backtrace 友好）
debug = 1
# 代码生成并行（多核机器加速）
codegen-units = 256
# dev 模式跳过 LTO（节省增量编译时间）
lto = false