# TOPEMS 统一服务配置文件
# 格式: 服务名 服务路径 二进制名 端口
#
# 服务拆分说明 (Phase 8):
# - unified-core → doc, ai (独立服务)
# - manufacturing → mes, pdm (独立服务)
# - quality-assurance → qms, lims, ehs (独立服务)
# - analytics → bi, report (独立服务)
#
# 核心服务 (必须先启动): iam (unified-core)
#
# 端口信息来源于各服务的实际运行端口（与 config/services.yaml 保持一致）
# 二进制名来源于各服务的 Cargo.toml
# 端口分配规则:
#   8000-8009 核心服务 (Core)
#   8010-8019 经营管理 (ERP)
#   8020-8029 协同办公 (Collab)
#   8030-8039 生产制造 (Mfg)
#   8040-8049 供应链 (SCM)
#   8050-8059 质量/研发 (Q/RD)
#   8060-8069 数据分析/门户 (Analytics)
#   8070-8079 基础设施 (Infra)
# 最后更新: 2026-07-20

# 平台核心服务 (unified-core 包含 iam, flow, file, communication)
iam         svc/unified-core       unified-core-service        8000
pm          svc/pm                 topems-pm                   8023
erp         svc/erp                topems-erp                  8010
finance     svc/finance            topems-finance              8011
doc         svc/doc                topems-doc                  8012
ai          svc/ai                 topems-ai                   8013
hrm         svc/hrm                topems-hrm                  8020
crm         svc/crm                topems-crm                  8029

# 生产制造服务
mes         svc/mes                topems-mes                  8030
pdm         svc/pdm                topems-pdm                  8031

# 供应链服务
scm         svc/scm                topems-scm                  8040
wms         svc/wms                topems-wms                  8041
srm         svc/srm                topems-srm                  8042

# 质量/研发服务
qms         svc/qms                topems-qms                  8050
lims        svc/lims               topems-lims                 8051
ehs         svc/ehs                topems-ehs                  8052
rd          svc/rd                 topems-rd                   8053

# 数据分析/门户服务
# NOTE: report 功能已整合到 bi 服务(analytics-service)中，不再需要单独端口
bi          svc/analytics          analytics-service           8060
monitor     svc/monitor            topems-monitor              8062
portal      svc/portal             topems-portal               8063

# 基础设施服务
mobile      svc/mobile             topems-mobile               8070
gis         svc/gis                topems-gis                  8071
integration svc/integration        topems-integration          8072

# 核心服务列表 (必须先启动)
CORE_SERVICES=iam
