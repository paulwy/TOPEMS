<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 测试</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body>
    <h1>TOPEMS API 测试页面</h1>
    <button onclick="testLogin()">测试登录</button>
    <div id="result"></div>

    <script>
        const IAM_URL = 'http://localhost:8002';
        const DOC_URL = 'http://localhost:8001';

        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>正在测试...</p>';

            try {
                // 测试 IAM 服务
                const response = await axios.post(`${IAM_URL}/api/v1/auth/login`, {
                    username: 'admin',
                    password: 'Admin123'
                });

                resultDiv.innerHTML = `
                    <h2>✅ IAM 登录成功!</h2>
                    <pre>${JSON.stringify(response.data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2>❌ IAM 登录失败</h2>
                    <p>错误: ${error.message}</p>
                    <p>状态码: ${error.response?.status}</p>
                    <pre>${JSON.stringify(error.response?.data, null, 2)}</pre>
                `;
            }
        }
    </script>
</body>
</html>
