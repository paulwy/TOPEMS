services:
  postgres:
    image: postgres:latest
    platform: linux/amd64
    pull_policy: never
    container_name: topems-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topems_secret}
      POSTGRES_DB: ${POSTGRES_DB:-topems}
      PGDATA: /var/lib/postgresql/data/postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topems}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - topems-network

  redis:
    image: redis:latest
    platform: linux/amd64
    pull_policy: never
    container_name: topems-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-topems_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-topems_redis_secret}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-topems_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - topems-network

  iam:
    build:
      context: ../..
      dockerfile: svc/iam/Dockerfile
    container_name: topems-iam
    environment:
      SERVER_PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      REDIS_URL: redis://:${REDIS_PASSWORD:-topems_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-topems-jwt-secret-key-must-be-at-least-32-characters-long-for-hs256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - topems-network
    profiles:
      - backend

  notification:
    build:
      context: ../..
      dockerfile: svc/notification/Dockerfile
    container_name: topems-notification
    environment:
      SERVER_PORT: 8002
      DATABASE_URL: postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      REDIS_URL: redis://:${REDIS_PASSWORD:-topems_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-topems-jwt-secret-key-must-be-at-least-32-characters-long-for-hs256}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      iam:
        condition: service_started
    networks:
      - topems-network
    profiles:
      - backend

  pm:
    build:
      context: ../..
      dockerfile: svc/pm/Dockerfile
    container_name: topems-pm
    environment:
      SERVER_PORT: 8001
      DATABASE_URL: postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      JWT_SECRET: ${JWT_SECRET:-topems-jwt-secret-key-must-be-at-least-32-characters-long-for-hs256}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      iam:
        condition: service_started
    networks:
      - topems-network
    profiles:
      - backend

  portal:
    build:
      context: ../..
      dockerfile: svc/portal/Dockerfile
    container_name: topems-portal
    environment:
      SERVER_PORT: 8003
      DATABASE_URL: postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      JWT_SECRET: ${JWT_SECRET:-topems-jwt-secret-key-must-be-at-least-32-characters-long-for-hs256}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      iam:
        condition: service_started
    networks:
      - topems-network
    profiles:
      - backend

  flow:
    build:
      context: ../..
      dockerfile: svc/flow/Dockerfile
    container_name: topems-flow
    environment:
      SERVER_PORT: 8004
      DATABASE_URL: postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      REDIS_URL: redis://:${REDIS_PASSWORD:-topems_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-topems-jwt-secret-key-must-be-at-least-32-characters-long-for-hs256}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      iam:
        condition: service_started
    networks:
      - topems-network
    profiles:
      - backend

  erp:
    build:
      context: ../..
      dockerfile: svc/erp/Dockerfile
    container_name: topems-erp
    environment:
      SERVER_PORT: 8010
      DATABASE_URL: postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      JWT_SECRET: ${JWT_SECRET:-topems-jwt-secret-key-must-be-at-least-32-characters-long-for-hs256}
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      iam:
        condition: service_started
    networks:
      - topems-network
    profiles:
      - backend

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: topems-web
    environment:
      VITE_IAM_SERVICE_URL: http://localhost:8000
      VITE_PM_SERVICE_URL: http://localhost:8001
      VITE_NOTIFICATION_SERVICE_URL: http://localhost:8002
      VITE_PORTAL_SERVICE_URL: http://localhost:8003
      VITE_FLOW_SERVICE_URL: http://localhost:8004
      VITE_ERP_SERVICE_URL: http://localhost:8010
    ports:
      - "3000:3000"
    depends_on:
      iam:
        condition: service_started
    networks:
      - topems-network
    profiles:
      - frontend

volumes:
  postgres_data:
  redis_data:

networks:
  topems-network:
    driver: bridge