# TOPEMS Docker Compose 配置
# 仅用于基础设施服务（数据库、缓存）
# 业务服务请使用 scripts/deploy.sh 本地部署

version: '3.8'

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: topems-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topems_secret}
      POSTGRES_DB: ${POSTGRES_DB:-topems}
      PGDATA: /var/lib/postgresql/data/postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topems}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - topems-network

  redis:
    image: redis:7
    platform: linux/amd64
    container_name: topems-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-topems_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-topems_redis_secret}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-topems_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - topems-network

networks:
  topems-network:
    driver: bridge