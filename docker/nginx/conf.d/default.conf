http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream iam-service {
        server iam-service:8000;
        keepalive 64;
    }

    upstream doc-service {
        server doc-service:8001;
        keepalive 64;
    }

    upstream pm-service {
        server pm-service:8002;
        keepalive 64;
    }

    upstream notification-service {
        server notification-service:8003;
        keepalive 64;
    }

    upstream integration-service {
        server integration-service:8004;
        keepalive 64;
    }

    upstream portal-service {
        server portal-service:8005;
        keepalive 64;
    }

    upstream flow-service {
        server flow-service:8006;
        keepalive 64;
    }

    upstream erp-service {
        server erp-service:8010;
        keepalive 64;
    }

    upstream hrm-service {
        server hrm-service:8011;
        keepalive 64;
    }

    upstream crm-service {
        server crm-service:8012;
        keepalive 64;
    }

    upstream ai-service {
        server ai-service:8013;
        keepalive 64;
    }

    upstream rs-service {
