# TOPEMS Development Docker Compose Configuration
# 用于开发环境的配置

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: topems-postgres-dev
    environment:
      POSTGRES_USER: topems_dev
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: topems_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - topems-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topems_dev -d topems_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: topems-redis-dev
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - topems-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  iam:
    build:
      context: ../services/topems-iam/backend
      dockerfile: Dockerfile
    container_name: topems-iam-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - JWT_SECRET=dev-jwt-secret-key
      - JWT_EXPIRATION_HOURS=24
      - SERVICE_PORT=8002
    ports:
      - "8002:8002"
    volumes:
      - ../services/topems-iam/backend:/app
      - iam_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  doc:
    build:
      context: ../platform/topems-doc/backend
      dockerfile: Dockerfile
    container_name: topems-doc-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=104857600
      - SERVICE_PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - ../platform/topems-doc/backend:/app
      - doc_dev_uploads:/app/uploads
      - doc_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai:
    build:
      context: ../services/topems-ai/backend
      dockerfile: Dockerfile
    container_name: topems-ai-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - RAG_CHUNK_SIZE=500
      - RAG_CHUNK_OVERLAP=50
      - SERVICE_PORT=8003
    ports:
      - "8003:8003"
    volumes:
      - ../services/topems-ai/backend:/app
      - ai_dev_models:/app/models
      - ai_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  flow:
    build:
      context: ../platform/topems-flow/backend
      dockerfile: Dockerfile
    container_name: topems-flow-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - SERVICE_PORT=8004
    ports:
      - "8004:8004"
    volumes:
      - ../platform/topems-flow/backend:/app
      - flow_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      iam:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rs:
    build:
      context: ../services/topems-rs/backend
      dockerfile: Dockerfile
    container_name: topems-rs-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - SERVICE_PORT=8005
    ports:
      - "8005:8005"
    volumes:
      - ../services/topems-rs/backend:/app
      - rs_dev_data:/app/data
      - rs_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lims:
    build:
      context: ../services/topems-lims/backend
      dockerfile: Dockerfile
    container_name: topems-lims-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - SERVICE_PORT=8006
    ports:
      - "8006:8006"
    volumes:
      - ../services/topems-lims/backend:/app
      - lims_dev_data:/app/data
      - lims_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qms:
    build:
      context: ../services/topems-qms/backend
      dockerfile: Dockerfile
    container_name: topems-qms-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - SERVICE_PORT=8007
    ports:
      - "8007:8007"
    volumes:
      - ../services/topems-qms/backend:/app
      - qms_dev_data:/app/data
      - qms_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ehs:
    build:
      context: ../services/topems-ehs/backend
      dockerfile: Dockerfile
    container_name: topems-ehs-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - SERVICE_PORT=8008
    ports:
      - "8008:8008"
    volumes:
      - ../services/topems-ehs/backend:/app
      - ehs_dev_data:/app/data
      - ehs_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  srm:
    build:
      context: ../services/topems-srm/backend
      dockerfile: Dockerfile
    container_name: topems-srm-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - SERVICE_PORT=8009
    ports:
      - "8009:8009"
    volumes:
      - ../services/topems-srm/backend:/app
      - srm_dev_data:/app/data
      - srm_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pdm:
    build:
      context: ../services/topems-pdm/backend
      dockerfile: Dockerfile
    container_name: topems-pdm-dev
    environment:
      - DATABASE_URL=postgres://topems_dev:dev_password@postgres:5432/topems_dev
      - RUST_LOG=debug
      - SERVICE_PORT=8010
    ports:
      - "8010:8010"
    volumes:
      - ../services/topems-pdm/backend:/app
      - pdm_dev_data:/app/data
      - pdm_dev_logs:/app/logs
    networks:
      - topems-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: topems-frontend-dev
    environment:
      - VITE_API_BASE_URL=http://localhost
      - NODE_ENV=development
    ports:
      - "3000:80"
    volumes:
      - ../frontend/src:/app/src:ro
      - frontend_dev_logs:/var/log/nginx
    networks:
      - topems-dev-network
    depends_on:
      - iam
      - doc
      - ai
      - flow
      - rs
      - lims
      - qms
      - ehs
      - srm
      - pdm
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    container_name: topems-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_dev_logs:/var/log/nginx
      - nginx_dev_cache:/var/cache/nginx
    networks:
      - topems-dev-network
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  topems-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  postgres_dev_data:
  redis_dev_data:
  iam_dev_logs:
  doc_dev_uploads:
  doc_dev_logs:
  ai_dev_models:
  ai_dev_logs:
  flow_dev_logs:
  rs_dev_data:
  rs_dev_logs:
  lims_dev_data:
  lims_dev_logs:
  qms_dev_data:
  qms_dev_logs:
  ehs_dev_data:
  ehs_dev_logs:
  srm_dev_data:
  srm_dev_logs:
  pdm_dev_data:
  pdm_dev_logs:
  frontend_dev_logs:
  nginx_dev_logs:
  nginx_dev_cache:
