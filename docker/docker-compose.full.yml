        condition: service_started
    restart: unless-stopped

  topems-gis:
    build:
      context: ./svc/gis
      dockerfile: Dockerfile
    container_name: topems-gis
    environment:
      <<: *common-env
      DATABASE_URL: postgres://topems:topems_secret@postgres:5432/topems
    ports:
