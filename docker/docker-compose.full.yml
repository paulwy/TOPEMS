    environment:
      <<: *common-env
    ports:
      - "8030:8030"
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  topems-network:
    driver: bridge
