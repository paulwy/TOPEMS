  # ==================== 项目与服务管理 ====================

  topems-pm:
    build:
      context: ./svc/pm
      dockerfile: Dockerfile
    container_name: topems-pm
    environment:
      <<: *common-env
      SEARCH_PATH: pm, shared, public
    ports:
      - "8023:8023"
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
      topems-iam:
        condition: service_started
    restart: unless-stopped

  topems-rs:
    build:
      context: ./svc/rs
      dockerfile: Dockerfile
    container_name: topems-rs
    environment:
      <<: *common-env
      SEARCH_PATH: rs, shared, public
    ports:
      - "8015:8015"
    networks:
