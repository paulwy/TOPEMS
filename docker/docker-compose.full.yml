      dockerfile: Dockerfile
    container_name: topems-ai
    environment:
      <<: *common-env
      DATABASE_URL: postgres://topems:topems_secret@postgres:5432/topems
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "8062:8062"
    volumes:
      - ./docs:/app/docs:ro
    networks:
