# TOPEMS 完整部署配置
# 包含所有微服务的Docker Compose配置

version: '3.8'

x-common-env: &common-env
  RUST_LOG: info
  RUST_BACKTRACE: 1
  DATABASE_URL: postgres://topems:topems_secret@postgres:5432/topems
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-topems-production-jwt-secret-change-in-production}
  IAM_SERVICE_URL: http://topems-iam:8000
  SEARCH_PATH: ${SEARCH_PATH:-public}
  # 部署模式配置
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-on-premise}
  MULTI_TENANT_ENABLED: ${MULTI_TENANT_ENABLED:-false}
  DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
  QUOTA_ENABLED: ${QUOTA_ENABLED:-false}
  BILLING_ENABLED: ${BILLING_ENABLED:-false}
  TENANT_MANAGEMENT: ${TENANT_MANAGEMENT:-false}

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:
  # ==================== 基础设施服务 ====================

  postgres:
    image: postgres:15-alpine
    container_name: topems-postgres
    environment:
      POSTGRES_USER: topems
      POSTGRES_PASSWORD: topems_secret
      POSTGRES_DB: topems
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - topems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topems -d topems"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: topems-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - topems-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: topems-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - topems-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: topems-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - topems-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # ==================== 核心服务 ====================

  topems-iam:
    build:
      context: ./svc/iam
      dockerfile: Dockerfile
    container_name: topems-iam
    environment:
      <<: *common-env
      PORT: 8000
      DATABASE_URL: postgres://topems:topems_secret@postgres:5432/topems
    ports:
      - "8000:8000"
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  topems-erp:
    build:
      context: ./svc/erp
      dockerfile: Dockerfile
    container_name: topems-erp
    environment:
      <<: *common-env
      SEARCH_PATH: erp, shared, public
    ports:
      - "8010:8010"
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
      topems-iam:
        condition: service_started
    restart: unless-stopped

  topems-hrm:
    build:
      context: ./svc/hrm
      dockerfile: Dockerfile
    container_name: topems-hrm
    environment:
      <<: *common-env
      SEARCH_PATH: hrm, shared, public
    ports:
      - "8020:8020"
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
      topems-iam:
        condition: service_started
    restart: unless-stopped

  topems-crm:
    build:
      context: ./svc/crm
      dockerfile: Dockerfile
    container_name: topems-crm
    environment:
      <<: *common-env
      SEARCH_PATH: crm, shared, public
    ports:
      - "8029:8029"
    networks:
      - topems-network
    depends_on:
      postgres:
        condition: service_healthy
      topems-iam:
        condition: service_started
    restart: unless-stopped

  # ==================== 供应链服务 ====================

  topems-scm:
