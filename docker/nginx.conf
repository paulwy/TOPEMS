user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream unified-core {
        server topems-unified-core:8000;
    }

    upstream erp {
        server topems-erp:8010;
    }

    upstream hrm {
        server topems-hrm:8020;
    }

    upstream pm {
        server topems-pm:8023;
    }

    upstream crm {
        server topems-crm:8029;
    }

    upstream mes {
        server topems-mes:8030;
    }

    upstream pdm {
        server topems-pdm:8031;
    }

    upstream scm {
        server topems-scm:8040;
    }

    upstream wms {
        server topems-wms:8041;
    }

    upstream srm {
        server topems-srm:8042;
    }

    upstream qms {
        server topems-qms:8050;
    }

    upstream lims {
        server topems-lims:8051;
    }

    upstream ehs {
        server topems-ehs:8052;
    }

    upstream rs {
        server topems-rs:8053;
    }

    upstream bi {
        server topems-bi:8060;
    }

    upstream report {
        server topems-report:8061;
    }

    upstream monitor {
        server topems-monitor:8062;
    }

    upstream portal {
        server topems-portal:8063;
    }

    upstream ai {
        server topems-ai:8064;
    }

    upstream mobile {
        server topems-mobile:8070;
    }

    upstream gis {
        server topems-gis:8071;
    }

    upstream integration {
        server topems-integration:8072;
    }

    upstream finance {
        server topems-finance:8011;
    }

    upstream doc {
        server topems-doc:8012;
    }

    upstream analytics {
        server topems-bi:8060;
    }

    upstream rd {
        server topems-rs:8053;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/core/ {
            proxy_pass http://unified-core/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Group1: IAM/Flow/File/Comm/Im/Notification/Master/Migration/Help 全部走 /api/core/*
        # 下面的 /api/core/ location 块已经处理，不再单独拆开 /api/{iam,flow,file,comm}
        # 旧路径 /api/iam/auth/* 会走顶层 legacy rewrite 到 /api/core/iam/*（由下面正则处理）

        location /api/pm/ {
            proxy_pass http://pm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/integration/ {
            proxy_pass http://integration/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/portal/ {
            proxy_pass http://portal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/erp/ {
            proxy_pass http://erp/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/hrm/ {
            proxy_pass http://hrm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/crm/ {
            proxy_pass http://crm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/rs/ {
            proxy_pass http://rs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/lims/ {
            proxy_pass http://lims/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/pdm/ {
            proxy_pass http://pdm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/mes/ {
            proxy_pass http://mes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/qms/ {
            proxy_pass http://qms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ehs/ {
            proxy_pass http://ehs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/scm/ {
            proxy_pass http://scm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/srm/ {
            proxy_pass http://srm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/wms/ {
            proxy_pass http://wms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/gis/ {
            proxy_pass http://gis/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/bi/ {
            proxy_pass http://bi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/report/ {
            proxy_pass http://report/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/monitor/ {
            proxy_pass http://monitor/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ai/ {
            proxy_pass http://ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/mobile/ {
            proxy_pass http://mobile/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/finance/ {
            proxy_pass http://finance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/doc/ {
            proxy_pass http://doc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/rd/ {
            proxy_pass http://rd/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/analytics/ {
            proxy_pass http://analytics/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====== 注意：Group1 / Group2 service 级 /v1 不做 Nginx rewrite ======
        # 改由各服务的 Rust 中间件 (group1/group2_route_compat_middleware) 负责：
        # - 对 /v1 路径加 Deprecation/Warning 响应头和 WARN 日志（标记弃用）
        # - 对新路径 (无 /v1) 透明重写回内部硬编码的 /v1 前缀（实现双轨）
        # 如果这里提前 strip v1，会让后端"不知道"请求走了旧路径，无法打弃用头

        # ========== 顶层 /api/v1/* legacy rewrite ==========
        location ~ ^/api/v1/(auth|users|roles|permissions|logout|sessions|security-settings|password-policy|reset-password|forgot-password|set-new-password)/(.*)$ {
            rewrite ^/api/v1/(.*)$ /api/core/iam/$1 last;
        }
        location ~ ^/api/v1/(employees|departments|contracts|attendance|leave|payroll|performance|recruitment|training|salary-adjustments|setup)/(.*)$ {
            rewrite ^/api/v1/(.*)$ /api/hrm/$1 last;
        }
        location ~ ^/api/v1/erp/(.*)$ {
            rewrite ^/api/v1/erp/(.*)$ /api/erp/$1 last;
        }
        location ~ ^/api/v1/crm/(.*)$ {
            rewrite ^/api/v1/crm/(.*)$ /api/crm/$1 last;
        }
        location ~ ^/api/v1/documents/(.*)$ {
            rewrite ^/api/v1/documents/(.*)$ /api/doc/$1 last;
        }
        location ~ ^/api/v1/ai/(.*)$ {
            rewrite ^/api/v1/ai/(.*)$ /api/ai/$1 last;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}