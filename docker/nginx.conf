user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream unified-core {
        server topems-unified-core:8000;
    }

    upstream erp {
        server topems-erp:8010;
    }

    upstream hrm {
        server topems-hrm:8020;
    }

    upstream pm {
        server topems-pm:8023;
    }

    upstream crm {
        server topems-crm:8029;
    }

    upstream mes {
        server topems-mes:8030;
    }

    upstream pdm {
        server topems-pdm:8031;
    }

    upstream scm {
        server topems-scm:8040;
    }

    upstream wms {
        server topems-wms:8041;
    }

    upstream srm {
        server topems-srm:8042;
    }

    upstream qms {
        server topems-qms:8050;
    }

    upstream lims {
        server topems-lims:8051;
    }

    upstream ehs {
        server topems-ehs:8052;
    }

    upstream rs {
        server topems-rs:8053;
    }

    upstream bi {
        server topems-bi:8060;
    }

    upstream report {
        server topems-report:8061;
    }

    upstream monitor {
        server topems-monitor:8062;
    }

    upstream portal {
        server topems-portal:8063;
    }

    upstream ai {
        server topems-ai:8064;
    }

    upstream mobile {
        server topems-mobile:8070;
    }

    upstream gis {
        server topems-gis:8071;
    }

    upstream integration {
        server topems-integration:8072;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/core/ {
            proxy_pass http://unified-core/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/iam/ {
            proxy_pass http://unified-core/api/iam/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/doc/ {
            proxy_pass http://unified-core/api/doc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/flow/ {
            proxy_pass http://unified-core/api/flow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/file/ {
