# TOPEMS 本地开发数据库配置
# 仅用于启动 PostgreSQL 和 Redis，后端服务在本地运行

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:latest
    platform: linux/amd64
    pull_policy: never
    container_name: topems-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topems_secret}
      POSTGRES_DB: ${POSTGRES_DB:-topems}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topems} -d ${POSTGRES_DB:-topems}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:latest
    platform: linux/amd64
    pull_policy: never
    container_name: topems-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
