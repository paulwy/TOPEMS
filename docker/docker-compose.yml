  # ================================================
  # 基础设施服务
  # ================================================
  mobile:
    build:
      context: ../svc/mobile
      dockerfile: Dockerfile
    container_name: topems-mobile
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - MOBILE_PORT=8070
      - CORE_URL=http://unified-core:8000
      - CONSUL_URL=http://consul:8500
    ports:
      - "${MOBILE_PORT:-8070}:8070"
    volumes:
      - ../svc/mobile:/app
    networks:
      - topems-network
    depends_on:
      consul:
        condition: service_healthy
      unified-core:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  gis:
    build:
      context: ../svc/gis
      dockerfile: Dockerfile
    container_name: topems-gis
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - GIS_PORT=8071
      - CORE_URL=http://unified-core:8000
      - CONSUL_URL=http://consul:8500
      - MES_URL=http://mes:8030
    ports:
      - "${GIS_PORT:-8071}:8071"
    volumes:
      - ../svc/gis:/app
    networks:
      - topems-network
    depends_on:
      consul:
        condition: service_healthy
      unified-core:
        condition: service_healthy
      mes:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8071/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  integration:
    build:
      context: ../svc/integration
      dockerfile: Dockerfile
    container_name: topems-integration
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - INTEGRATION_PORT=8072
      - CORE_URL=http://unified-core:8000
      - CONSUL_URL=http://consul:8500
    ports:
      - "${INTEGRATION_PORT:-8072}:8072"
    volumes:
      - ../svc/integration:/app
    networks:
      - topems-network
    depends_on:
      consul:
        condition: service_healthy
      unified-core:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8072/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ================================================
  # API网关
  # ================================================
  nginx:
    image: nginx:latest
    container_name: topems-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../apps/web/dist:/usr/share/nginx/html:ro
    networks:
      - topems-network
    depends_on:
      consul:
        condition: service_healthy
      unified-core:
        condition: service_healthy
      erp:
        condition: service_healthy
      hrm:
        condition: service_healthy
      pm:
        condition: service_healthy
      crm:
        condition: service_healthy
      mes:
        condition: service_healthy
      pdm:
        condition: service_healthy
      scm:
        condition: service_healthy
      wms:
        condition: service_healthy
      srm:
        condition: service_healthy
      qms:
        condition: service_healthy
      lims:
        condition: service_healthy
      ehs:
        condition: service_healthy
      rs:
        condition: service_healthy
      bi:
        condition: service_healthy
      report:
        condition: service_healthy
      monitor:
        condition: service_healthy
      portal:
        condition: service_healthy
      ai:
        condition: service_healthy
      mobile:
        condition: service_healthy
      gis:
        condition: service_healthy
      integration:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ================================================
  # 链路追踪系统
  # ================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: topems-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    volumes:
      - jaeger_data:/var/lib/jaeger
    networks:
      - topems-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14268/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ================================================
  # 监控系统
  # ================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: topems-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - topems-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: topems-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - topems-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  topems-network:
    driver: bridge
