# TOPEMS Docker Compose 配置
# 用于开发和生产环境的数据库基础设施、API网关和监控系统
# 版本: v5.0 - 与 plugin-architecture-design.md 端口规范同步

version: '3.8'

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  grafana_data:
  prometheus_data:
  consul_data:
  jaeger_data:

services:
  postgres:
    image: postgres:latest
    container_name: topems-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topems_secret}
      POSTGRES_DB: ${POSTGRES_DB:-topems}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - topems-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topems} -d ${POSTGRES_DB:-topems}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: topems-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - topems-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    container_name: topems-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-topems}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-topems_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - topems-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ================================================
  # 服务注册与发现
  # ================================================
  consul:
    image: consul:latest
    container_name: topems-consul
    ports:
      - "${CONSUL_HTTP_PORT:-8500}:8500"
      - "${CONSUL_DNS_PORT:-8600}:8600/udp"
    volumes:
      - consul_data:/consul/data
      - ./consul:/consul/config
    networks:
      - topems-network
    command: >
      agent -server -ui
      -bootstrap-expect=1
      -data-dir=/consul/data
      -config-dir=/consul/config
      -bind=0.0.0.0
      -client=0.0.0.0
      -log-level=info
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ================================================
  # 核心平台服务
  # ================================================
  unified-core:
    build:
      context: ../svc/unified-core
      dockerfile: Dockerfile
    container_name: topems-unified-core
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - CORE_PORT=8000
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-topems}:${RABBITMQ_PASSWORD:-topems_secret}@rabbitmq:5672/%2f
      - CONSUL_URL=http://consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - TRACING_SAMPLING_RATIO=1.0
    ports:
      - "${CORE_PORT:-8000}:8000"
    volumes:
      - ../svc/unified-core:/app
    networks:
      - topems-network
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ================================================
  # 经营管理服务
  # ================================================
  erp:
    build:
      context: ../svc/erp
      dockerfile: Dockerfile
    container_name: topems-erp
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - ERP_PORT=8010
      - CORE_URL=http://unified-core:8000
      - CONSUL_URL=http://consul:8500
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-topems}:${RABBITMQ_PASSWORD:-topems_secret}@rabbitmq:5672/%2f
    ports:
      - "${ERP_PORT:-8010}:8010"
    volumes:
      - ../svc/erp:/app
    networks:
      - topems-network
    depends_on:
      consul:
        condition: service_healthy
      unified-core:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
