      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ================================================
  # 协同办公服务
  # ================================================
  hrm:
    build:
      context: ../svc/hrm
      dockerfile: Dockerfile
    container_name: topems-hrm
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-topems}:${POSTGRES_PASSWORD:-topems_secret}@postgres:5432/${POSTGRES_DB:-topems}
      - HRM_PORT=8020
      - CORE_URL=http://unified-core:8000
      - CONSUL_URL=http://consul:8500
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-topems}:${RABBITMQ_PASSWORD:-topems_secret}@rabbitmq:5672/%2f
    ports:
