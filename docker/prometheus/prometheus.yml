global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'topems-rs'
    static_configs:
      - targets: ['rs-service:8000']

  - job_name: 'topems-iam'
    static_configs:
      - targets: ['iam-service:8002']

  - job_name: 'topems-mail'
    static_configs:
      - targets: ['mail-service:8027']
