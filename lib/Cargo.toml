[package]
name = "topems-shared"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared library for TOPEMS microservices"

[features]
default = ["full"]
full = [
    "database",
    "auth",
    "service-client",
    "event",
    "observability",
    "ai",
    "cache",
    "business-utils",
    "infra",
]

# 核心基础模块（始终启用）
# - error, response, validation, config, health, id, api_version, api, api_security
# - cors, layers, logging, feature_flag, hrm, crud, metrics

# 数据库相关
database = []

# 认证与权限
auth = ["database"]

# 服务客户端
service-client = []

# 事件驱动
event = []

# 可观测性
observability = []

# AI 相关
ai = ["embedding", "vector-store", "ai-client", "ollama-client"]
embedding = ["database"]
vector-store = ["embedding"]
ai-client = []
ollama-client = ["ai-client"]

# 缓存
cache = []

# 业务工具
business-utils = ["auth", "database"]

# 基础设施
infra = []

[dependencies]
topems-shared-core = { path = "shared-core" }
topems-shared-db = { path = "shared-db" }
topems-shared-auth = { path = "shared-auth" }
topems-shared-event = { path = "shared-event" }
topems-shared-service-client = { path = "shared-service-client" }
topems-shared-ai = { path = "shared-ai" }
topems-shared-observability = { path = "shared-observability" }
topems-shared-bootstrap = { path = "shared-bootstrap" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
axum.workspace = true
async-trait.workspace = true
jsonwebtoken.workspace = true
chrono.workspace = true
uuid.workspace = true
sqlx.workspace = true
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }

http.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
