[package]
name = "topems-shared"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Shared library for TOPEMS microservices"

[features]
default = ["full"]
full = [
    "database",
    "auth",
    "service-client",
    "event",
    "observability",
    "ai",
    "cache",
    "business-utils",
    "infra",
    "grpc",
]

# 核心基础模块（始终启用）
# - error, response, validation, config, health, id, api_version, api, api_security
# - cors, layers, logging, feature_flag, hrm, crud, metrics

# 数据库相关
database = []

# 认证与权限
auth = ["database"]

# 服务客户端
service-client = []

# 事件驱动
event = []

# 可观测性
observability = []

# AI 相关
ai = ["embedding", "vector-store", "ai-client", "ollama-client"]
embedding = ["database"]
vector-store = ["embedding"]
ai-client = []
ollama-client = ["ai-client"]

# 缓存
cache = []

# 业务工具
business-utils = ["auth", "database"]

# 基础设施
infra = []

# V24.0 模块 C: gRPC 微服务基础特性开关
# 启用后激活 tonic/prost 依赖与 grpc 模块；服务可基于此构建 gRPC server/client
grpc = ["topems-shared-core/grpc"]

[dependencies]
topems-shared-core = { path = "shared-core" }
topems-shared-db = { path = "shared-db" }
topems-shared-auth = { path = "shared-auth" }
topems-shared-event = { path = "shared-event" }
topems-shared-service-client = { path = "shared-service-client" }
topems-shared-ai = { path = "shared-ai" }
topems-shared-observability = { path = "shared-observability" }
topems-shared-bootstrap = { path = "shared-bootstrap" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
axum.workspace = true
async-trait = "0.1"
jsonwebtoken.workspace = true
chrono.workspace = true
uuid.workspace = true
sqlx.workspace = true
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }


# gRPC 微服务基础（V24.0 模块 C）
# tonic 工作区已锁定 0.14，与 axum 0.8 兼容
http = "1"

[dev-dependencies]
tempdir = "0.3"

[build-dependencies]
tonic-build = "0.14"
prost-build = "0.13"

[lints]
workspace = true
