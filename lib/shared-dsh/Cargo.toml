[package]
name = "topems-shared-dsh"
version = "0.1.0"
edition = "2021"
description = "TOPEMS 共享 DSH（Domain-Specific Helpers）类型库 - 通用 Tool、Resource、Prompt 类型定义"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
