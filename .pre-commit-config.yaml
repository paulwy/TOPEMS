# ============================================================================
# ⚠️  注意：本项目主要使用 lefthook 管理 Git hooks（见 lefthook.yml）
# ============================================================================
# lefthook 在 package.json 的 prepare 脚本中自动安装，是项目的首选工具。
# 本文件（pre-commit）作为备选方案保留，需手动安装：
#   pip install pre-commit && pre-commit install
#
# 两者功能有重叠（large-files、sensitive-info 等已在 lefthook.yml 中配置）。
# 新贡献者请优先使用 lefthook，无需额外安装 Python 工具。
# ============================================================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        description: "Trim trailing whitespace"
      - id: end-of-file-fixer
        description: "Ensure files end with a newline"
      - id: check-yaml
        description: "Check YAML files for syntax errors"
      - id: check-json
        description: "Check JSON files for syntax errors"
      - id: check-merge-conflict
        description: "Check for unresolved merge conflicts"
      - id: detect-private-key
        description: "Detect private keys in commits"
      - id: check-case-conflict
        description: "Check for files with case conflicts"
      - id: check-executables-have-shebangs
        description: "Check that executables have shebangs"
      - id: check-shebang-scripts-are-executable
        description: "Check that scripts with shebangs are executable"
      - id: check-added-large-files
        args: ["--maxkb", "500"]
        exclude: |
          (?x)^(
            database/postgres_data/|
            pnpm-lock.yaml
          )$
        description: "Check for large files (>500KB)"

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        description: "Python code formatting"
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        description: "Python linting"
        additional_dependencies: [flake8-isort]

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.0b1
    hooks:
      - id: isort
        description: "Python import sorting"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        description: "YAML linting"
        args: ["-c", ".yamllint"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.6.4
    hooks:
      - id: actionlint
        description: "GitHub Actions workflow linting"

