repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        description: "Trim trailing whitespace"
      - id: end-of-file-fixer
        description: "Ensure files end with a newline"
      - id: check-yaml
        description: "Check YAML files for syntax errors"
      - id: check-json
        description: "Check JSON files for syntax errors"
      - id: check-merge-conflict
        description: "Check for unresolved merge conflicts"
      - id: detect-private-key
        description: "Detect private keys in commits"
      - id: check-case-conflict
        description: "Check for files with case conflicts"
      - id: check-executables-have-shebangs
        description: "Check that executables have shebangs"
      - id: check-shebang-scripts-are-executable
        description: "Check that scripts with shebangs are executable"
      - id: check-added-large-files
        args: ["--maxkb", "500"]
        exclude: |
          (?x)^(
            database/postgres_data/|
            pnpm-lock.yaml
          )$
        description: "Check for large files (>500KB)"

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        description: "Python code formatting"
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        description: "Python linting"
        additional_dependencies: [flake8-isort]

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.0b1
    hooks:
      - id: isort
        description: "Python import sorting"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        description: "YAML linting"
        args: ["-c", ".yamllint"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.6.4
    hooks:
      - id: actionlint
        description: "GitHub Actions workflow linting"

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        files: \.rs$
        pass_filenames: true
        description: "Rust code formatting"

      - id: forbid-bak-files
        name: Forbid backup artifacts
        entry: bash -c 'echo "Forbidden backup files detected: $@"; exit 1' --
        language: system
        files: '(.*\.bak|apps/web/FAIL|split_notification.*\.py)$'
        description: "Prevent .bak / FAIL / debug scripts from being committed"

      - id: check-todo-md-health
        name: Check TODO.md health score accuracy
        entry: bash -c 'if grep -q "100/100" TODO.md; then echo "TODO.md claims 100/100 health score - update to actual value"; exit 1; fi' --
        language: system
        files: TODO.md$
        pass_filenames: true
        description: "Prevent outdated self-reported health scores"

