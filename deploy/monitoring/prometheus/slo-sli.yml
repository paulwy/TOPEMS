groups:
  - name: slo-sli.rules
    rules:
      - record: job:http_requests_total:rate5m
        expr: sum by (job, status_code) (rate(http_requests_total[5m]))

      - record: job:http_requests_success:rate5m
        expr: sum by (job) (rate(http_requests_total{status_code=~"2.."}[5m]))

      - record: job:http_requests_total:rate5m
        expr: sum by (job) (rate(http_requests_total[5m]))

      - record: job:http_request_error_rate:ratio5m
        expr: 1 - (job:http_requests_success:rate5m / job:http_requests_total:rate5m)

      - record: job:http_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

      - record: job:http_request_duration_seconds:p99
        expr: histogram_quantile(0.99, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

      - record: job:db_query_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (job, le) (rate(db_query_duration_seconds_bucket[5m])))

      - record: job:service_call_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (job, le) (rate(service_call_duration_seconds_bucket[5m])))

      - record: job:redis_operation_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (job, le) (rate(redis_operation_duration_seconds_bucket[5m])))

      - record: job:rabbitmq_publish_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (job, le) (rate(rabbitmq_publish_duration_seconds_bucket[5m])))

      - record: job:availability:ratio1h
        expr: avg_over_time(job:http_request_error_rate:ratio5m[1h])

      - record: job:latency:p95:1h
        expr: avg_over_time(job:http_request_duration_seconds:p95[1h])

      - record: job:latency:p99:1h
        expr: avg_over_time(job:http_request_duration_seconds:p99[1h])

      - record: job:slo_availability:burn_rate
        expr: (1 - job:availability:ratio1h) / (1 - 0.999)

      - record: job:slo_latency_p95:burn_rate
        expr: job:latency:p95:1h / 0.5

      - record: job:slo_latency_p99:burn_rate
        expr: job:latency:p99:1h / 1.0