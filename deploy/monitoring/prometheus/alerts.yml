# TOPEMS Prometheus Alert Rules - Optimized
# 告警级别: P0(紧急) / P1(重要) / P2(一般) / P3(提示)

groups:
  - name: topems_service_health
    rules:
      # P0 - 服务宕机 (紧急)
      - alert: ServiceDownP0
        expr: up{job=~"topems-.*"} == 0
        for: 1m
        labels:
          severity: P0
          priority: "0"
          category: service
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] 服务 {{ $labels.job }} 不可用"
          description: "服务 {{ $labels.job }} 在 {{ $labels.instance }} 上已停止运行超过1分钟"
          runbook: "https://docs.topems.com/runbooks/service-down"
          impact: "核心业务可能中断"

      # P1 - 服务错误率高 (重要)
      - alert: ServiceHighErrorRateP1
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job) > 0.05
        for: 2m
        labels:
          severity: P1
          priority: "1"
          category: service
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] 服务 {{ $labels.job }} 错误率过高"
          description: "服务 {{ $labels.job }} 错误率超过5% (当前: {{ $value | humanizePercentage }})"
          runbook: "https://docs.topems.com/runbooks/high-error-rate"
          impact: "用户体验受影响"

      # P0 - 服务错误率严重 (紧急)
      - alert: ServiceCriticalErrorRateP0
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job) > 0.10
        for: 1m
        labels:
          severity: P0
          priority: "0"
          category: service
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] 服务 {{ $labels.job }} 发生严重错误"
          description: "服务 {{ $labels.job }} 错误率超过10% (当前: {{ $value | humanizePercentage }})"
          runbook: "https://docs.topems.com/runbooks/critical-error-rate"
          impact: "核心业务严重受影响"

      # P2 - 服务响应时间过长 (一般)
      - alert: ServiceHighLatencyP2
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 0.5
        for: 3m
        labels:
          severity: P2
          priority: "2"
          category: service
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] 服务 {{ $labels.job }} 响应时间过长"
          description: "服务 {{ $labels.job }} P95响应时间超过500ms (当前: {{ $value | humanizeDuration }})"
          runbook: "https://docs.topems.com/runbooks/high-latency"
          impact: "用户体验轻微下降"

      # P1 - 服务响应时间严重超时 (重要)
      - alert: ServiceHighLatencyP1
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 2
        for: 2m
        labels:
          severity: P1
          priority: "1"
          category: service
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] 服务 {{ $labels.job }} 响应时间过长"
          description: "服务 {{ $labels.job }} P95响应时间超过2秒 (当前: {{ $value | humanizeDuration }})"
          runbook: "https://docs.topems.com/runbooks/high-latency"
          impact: "用户体验明显下降"

      # P0 - 服务响应时间严重超时 (紧急)
      - alert: ServiceCriticalLatencyP0
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 5
        for: 1m
        labels:
          severity: P0
          priority: "0"
          category: service
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] 服务 {{ $labels.job }} 响应时间严重超时"
          description: "服务 {{ $labels.job }} P95响应时间超过5秒 (当前: {{ $value | humanizeDuration }})"
          runbook: "https://docs.topems.com/runbooks/critical-latency"
          impact: "服务基本不可用"

      # P3 - 服务QPS过低 (提示)
      - alert: ServiceLowQPSP3
        expr: sum(rate(http_requests_total[5m])) by (job) < 1
        for: 10m
        labels:
          severity: P3
          priority: "3"
          category: service
          team: devops
          escalation: "false"
        annotations:
          summary: "[P3] 服务 {{ $labels.job }} 请求量过低"
          description: "服务 {{ $labels.job }} QPS低于1，可能存在异常"
          runbook: "https://docs.topems.com/runbooks/low-qps"
          impact: "可能存在流量异常"

      # P2 - 服务QPS过高 (一般)
      - alert: ServiceHighQPSP2
        expr: sum(rate(http_requests_total[5m])) by (job) > 1000
        for: 5m
        labels:
          severity: P2
          priority: "2"
          category: service
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] 服务 {{ $labels.job }} 请求量过高"
          description: "服务 {{ $labels.job }} QPS超过1000"
          runbook: "https://docs.topems.com/runbooks/high-qps"
          impact: "可能需要扩容"

  - name: topems_database
    rules:
      # P2 - 数据库连接池使用率高 (一般)
      - alert: DatabasePoolHighP2
        expr: sum(pg_stat_activity_count{datname="topems"}) / pg_settings_max_connections > 0.7
        for: 5m
        labels:
          severity: P2
          priority: "2"
          category: database
          team: dba
          escalation: "false"
        annotations:
          summary: "[P2] PostgreSQL连接池使用率偏高"
          description: "连接池使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/db-connection-pool"
          impact: "性能可能受影响"

      # P1 - 数据库连接池使用率高 (重要)
      - alert: DatabasePoolHighP1
        expr: sum(pg_stat_activity_count{datname="topems"}) / pg_settings_max_connections > 0.85
        for: 3m
        labels:
          severity: P1
          priority: "1"
          category: database
          team: dba
          escalation: "true"
        annotations:
          summary: "[P1] PostgreSQL连接池使用率过高"
          description: "连接池使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/db-connection-pool"
          impact: "可能影响业务"

      # P0 - 数据库连接池即将耗尽 (紧急)
      - alert: DatabasePoolCriticalP0
        expr: sum(pg_stat_activity_count{datname="topems"}) / pg_settings_max_connections > 0.95
        for: 1m
        labels:
          severity: P0
          priority: "0"
          category: database
          team: dba
          escalation: "true"
        annotations:
          summary: "[P0] PostgreSQL连接池即将耗尽"
          description: "连接池使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/db-connection-pool-critical"
          impact: "数据库连接即将耗尽，业务将中断"

      # P2 - 慢查询 (一般)
      - alert: DatabaseSlowQueriesP2
        expr: rate(pg_stat_statements_total_time[5m]) > 30
        for: 5m
        labels:
          severity: P2
          priority: "2"
          category: database
          team: dba
          escalation: "false"
        annotations:
          summary: "[P2] 慢查询告警"
          description: "查询执行时间累计超过30秒/分钟"
          runbook: "https://docs.topems.com/runbooks/slow-queries"
          impact: "性能可能下降"

      # P1 - 慢查询严重 (重要)
      - alert: DatabaseSlowQueriesP1
        expr: rate(pg_stat_statements_total_time[5m]) > 60
        for: 3m
        labels:
          severity: P1
          priority: "1"
          category: database
          team: dba
          escalation: "true"
        annotations:
          summary: "[P1] 慢查询告警严重"
          description: "查询执行时间累计超过60秒/分钟"
          runbook: "https://docs.topems.com/runbooks/slow-queries"
          impact: "性能明显下降"

      # P1 - 数据库锁等待 (重要)
      - alert: DatabaseLockWaitP1
        expr: sum(rate(pg_stat_activity_waiting[5m])) > 3
        for: 2m
        labels:
          severity: P1
          priority: "1"
          category: database
          team: dba
          escalation: "true"
        annotations:
          summary: "[P1] 数据库锁等待过多"
          description: "锁等待数量: {{ $value }}"
          runbook: "https://docs.topems.com/runbooks/db-lock-wait"
          impact: "事务处理延迟"

      # P0 - 数据库锁等待严重 (紧急)
      - alert: DatabaseLockWaitCriticalP0
        expr: sum(rate(pg_stat_activity_waiting[5m])) > 10
        for: 1m
        labels:
          severity: P0
          priority: "0"
          category: database
          team: dba
          escalation: "true"
        annotations:
          summary: "[P0] 数据库锁等待严重"
          description: "锁等待数量: {{ $value }}"
          runbook: "https://docs.topems.com/runbooks/db-lock-wait-critical"
          impact: "数据库可能死锁"

  - name: topems_redis
    rules:
      # P2 - Redis内存使用率高 (一般)
      - alert: RedisHighMemoryP2
        expr: redis_used_memory / redis_maxmemory > 0.7
        for: 5m
        labels:
          severity: P2
          priority: "2"
          category: cache
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] Redis内存使用率偏高"
          description: "内存使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/redis-memory"
          impact: "可能触发内存淘汰"

      # P1 - Redis内存使用率高 (重要)
      - alert: RedisHighMemoryP1
        expr: redis_used_memory / redis_maxmemory > 0.85
        for: 3m
        labels:
          severity: P1
          priority: "1"
          category: cache
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] Redis内存使用率过高"
          description: "内存使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/redis-memory"
          impact: "频繁内存淘汰"

      # P0 - Redis内存即将耗尽 (紧急)
      - alert: RedisCriticalMemoryP0
        expr: redis_used_memory / redis_maxmemory > 0.95
        for: 1m
        labels:
          severity: P0
          priority: "0"
          category: cache
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] Redis内存即将耗尽"
          description: "内存使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/redis-memory-critical"
          impact: "写入将失败"

      # P2 - Redis连接数多 (一般)
      - alert: RedisHighConnectionsP2
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: P2
          priority: "2"
          category: cache
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] Redis连接数偏多"
          description: "连接数: {{ $value }}"
          runbook: "https://docs.topems.com/runbooks/redis-connections"
          impact: "接近连接上限"

      # P1 - Redis连接数过多 (重要)
      - alert: RedisHighConnectionsP1
        expr: redis_connected_clients > 500
        for: 3m
        labels:
          severity: P1
          priority: "1"
          category: cache
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] Redis连接数过多"
          description: "连接数: {{ $value }}"
          runbook: "https://docs.topems.com/runbooks/redis-connections"
          impact: "可能达到连接上限"

      # P3 - Redis慢命令 (提示)
      - alert: RedisSlowCommandsP3
        expr: rate(redis_slowlog_length[5m]) > 5
        for: 5m
        labels:
          severity: P3
          priority: "3"
          category: cache
          team: devops
          escalation: "false"
        annotations:
          summary: "[P3] Redis慢命令偏多"
          description: "慢命令数量: {{ $value }}"
          runbook: "https://docs.topems.com/runbooks/redis-slow-commands"
          impact: "性能轻微下降"

  - name: topems_rabbitmq
    rules:
      # P2 - RabbitMQ队列消息积压 (一般)
      - alert: RabbitMQQueueDepthP2
        expr: rabbitmq_queue_messages > 500
        for: 5m
        labels:
          severity: P2
          priority: "2"
          category: messaging
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] RabbitMQ队列消息积压"
          description: "队列 {{ $labels.queue }} 消息数: {{ $value }}"
          runbook: "https://docs.topems.com/runbooks/rabbitmq-queue-depth"
          impact: "消息处理延迟"

      # P1 - RabbitMQ队列消息严重积压 (重要)
      - alert: RabbitMQQueueDepthP1
        expr: rabbitmq_queue_messages > 2000
        for: 3m
        labels:
          severity: P1
          priority: "1"
          category: messaging
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] RabbitMQ队列消息严重积压"
          description: "队列 {{ $labels.queue }} 消息数: {{ $value }}"
          runbook: "https://docs.topems.com/runbooks/rabbitmq-queue-depth"
          impact: "业务处理严重延迟"

      # P0 - RabbitMQ队列没有消费者 (紧急)
      - alert: RabbitMQNoConsumersP0
        expr: rabbitmq_queue_consumers == 0
        for: 2m
        labels:
          severity: P0
          priority: "0"
          category: messaging
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] RabbitMQ队列没有消费者"
          description: "队列 {{ $labels.queue }} 没有活跃消费者"
          runbook: "https://docs.topems.com/runbooks/rabbitmq-no-consumers"
          impact: "消息将无法处理"

  - name: topems_system_resources
    rules:
      # P2 - CPU使用率偏高 (一般)
      - alert: CPUUsageHighP2
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 70
        for: 10m
        labels:
          severity: P2
          priority: "2"
          category: system
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] CPU使用率偏高"
          description: "实例 {{ $labels.instance }} CPU使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/cpu-high"
          impact: "系统负载偏高"

      # P1 - CPU使用率高 (重要)
      - alert: CPUUsageHighP1
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: P1
          priority: "1"
          category: system
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] CPU使用率过高"
          description: "实例 {{ $labels.instance }} CPU使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/cpu-high"
          impact: "系统响应变慢"

      # P0 - CPU使用率严重过高 (紧急)
      - alert: CPUUsageCriticalP0
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: P0
          priority: "0"
          category: system
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] CPU使用率严重过高"
          description: "实例 {{ $labels.instance }} CPU使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/cpu-critical"
          impact: "系统基本无响应"

      # P2 - 内存使用率偏高 (一般)
      - alert: MemoryUsageHighP2
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 70
        for: 10m
        labels:
          severity: P2
          priority: "2"
          category: system
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] 内存使用率偏高"
          description: "实例 {{ $labels.instance }} 内存使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/memory-high"
          impact: "内存压力较大"

      # P1 - 内存使用率高 (重要)
      - alert: MemoryUsageHighP1
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: P1
          priority: "1"
          category: system
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] 内存使用率过高"
          description: "实例 {{ $labels.instance }} 内存使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/memory-high"
          impact: "可能触发OOM"

      # P0 - 内存使用率严重过高 (紧急)
      - alert: MemoryUsageCriticalP0
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 95
        for: 2m
        labels:
          severity: P0
          priority: "0"
          category: system
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] 内存使用率严重过高"
          description: "实例 {{ $labels.instance }} 内存使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/memory-critical"
          impact: "即将OOM"

      # P2 - 磁盘使用率偏高 (一般)
      - alert: DiskUsageHighP2
        expr: 100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) > 75
        for: 10m
        labels:
          severity: P2
          priority: "2"
          category: system
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] 磁盘使用率偏高"
          description: "实例 {{ $labels.instance }} 磁盘使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/disk-high"
          impact: "磁盘空间紧张"

      # P1 - 磁盘使用率高 (重要)
      - alert: DiskUsageHighP1
        expr: 100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) > 85
        for: 5m
        labels:
          severity: P1
          priority: "1"
          category: system
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] 磁盘使用率过高"
          description: "实例 {{ $labels.instance }} 磁盘使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/disk-high"
          impact: "可能影响写入"

      # P0 - 磁盘使用率严重过高 (紧急)
      - alert: DiskUsageCriticalP0
        expr: 100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) > 95
        for: 2m
        labels:
          severity: P0
          priority: "0"
          category: system
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] 磁盘使用率严重过高"
          description: "实例 {{ $labels.instance }} 磁盘使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/disk-critical"
          impact: "磁盘即将写满"

  - name: topems_container
    rules:
      # P3 - 容器重启 (提示)
      - alert: ContainerRestartP3
        expr: rate(kube_pod_container_status_restarts_total[1h]) > 0
        for: 5m
        labels:
          severity: P3
          priority: "3"
          category: container
          team: devops
          escalation: "false"
        annotations:
          summary: "[P3] 容器发生重启"
          description: "容器 {{ $labels.container }} 在Pod {{ $labels.pod }} 中发生重启"
          runbook: "https://docs.topems.com/runbooks/container-restart"
          impact: "服务可能短暂中断"

      # P1 - 容器CPU使用率高 (重要)
      - alert: ContainerHighCPUP1
        expr: rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota * container_spec_cpu_period > 0.8
        for: 5m
        labels:
          severity: P1
          priority: "1"
          category: container
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] 容器CPU使用率过高"
          description: "容器 {{ $labels.name }} CPU使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/container-cpu-high"
          impact: "容器性能受限"

      # P1 - 容器内存使用率高 (重要)
      - alert: ContainerHighMemoryP1
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: P1
          priority: "1"
          category: container
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] 容器内存使用率过高"
          description: "容器 {{ $labels.name }} 内存使用率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/container-memory-high"
          impact: "可能触发OOM"

  - name: topems_backup
    rules:
      # P0 - 备份失败 (紧急)
      - alert: BackupFailedP0
        expr: backup_last_run_status == 0
        for: 1m
        labels:
          severity: P0
          priority: "0"
          category: backup
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] 备份任务失败"
          description: "备份任务 {{ $labels.job }} 执行失败"
          runbook: "https://docs.topems.com/runbooks/backup-failed"
          impact: "数据存在丢失风险"

      # P1 - 备份未执行 (重要)
      - alert: BackupNotRunningP1
        expr: time() - backup_last_run_timestamp > 86400 * 1
        for: 1h
        labels:
          severity: P1
          priority: "1"
          category: backup
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] 备份任务未执行"
          description: "备份任务已超过24小时未执行"
          runbook: "https://docs.topems.com/runbooks/backup-not-running"
          impact: "数据备份不及时"

  - name: topems_certificate
    rules:
      # P2 - TLS证书即将过期 (一般)
      - alert: TlsCertExpiringSoonP2
        expr: probe_ssl_cert_not_after - time() < 86400 * 30
        for: 1h
        labels:
          severity: P2
          priority: "2"
          category: security
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] TLS证书即将过期"
          description: "实例 {{ $labels.instance }} 证书将在 {{ $value | humanizeDuration }} 后过期"
          runbook: "https://docs.topems.com/runbooks/tls-cert-expiring"
          impact: "需要安排更新"

      # P1 - TLS证书即将过期 (重要)
      - alert: TlsCertExpiringSoonP1
        expr: probe_ssl_cert_not_after - time() < 86400 * 7
        for: 1h
        labels:
          severity: P1
          priority: "1"
          category: security
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] TLS证书即将过期"
          description: "实例 {{ $labels.instance }} 证书将在 {{ $value | humanizeDuration }} 后过期"
          runbook: "https://docs.topems.com/runbooks/tls-cert-expiring"
          impact: "请尽快更新"

      # P0 - TLS证书已过期 (紧急)
      - alert: TlsCertExpiredP0
        expr: probe_ssl_cert_not_after - time() < 0
        for: 5m
        labels:
          severity: P0
          priority: "0"
          category: security
          team: devops
          escalation: "true"
        annotations:
          summary: "[P0] TLS证书已过期"
          description: "实例 {{ $labels.instance }} 证书已过期，请立即更新"
          runbook: "https://docs.topems.com/runbooks/tls-cert-expired"
          impact: "HTTPS访问将受影响"

  - name: topems_network
    rules:
      # P2 - 网络接口错误 (一般)
      - alert: NetworkInterfaceErrorsP2
        expr: rate(node_network_receive_errors[5m]) + rate(node_network_transmit_errors[5m]) > 5
        for: 5m
        labels:
          severity: P2
          priority: "2"
          category: network
          team: devops
          escalation: "false"
        annotations:
          summary: "[P2] 网络接口错误偏多"
          description: "实例 {{ $labels.instance }} 网络错误率: {{ $value }}/s"
          runbook: "https://docs.topems.com/runbooks/network-errors"
          impact: "网络质量下降"

      # P1 - 网络接口错误严重 (重要)
      - alert: NetworkInterfaceErrorsP1
        expr: rate(node_network_receive_errors[5m]) + rate(node_network_transmit_errors[5m]) > 20
        for: 3m
        labels:
          severity: P1
          priority: "1"
          category: network
          team: devops
          escalation: "true"
        annotations:
          summary: "[P1] 网络接口错误严重"
          description: "实例 {{ $labels.instance }} 网络错误率: {{ $value }}/s"
          runbook: "https://docs.topems.com/runbooks/network-errors"
          impact: "网络通信受影响"

  - name: topems_business_services
    rules:
      # P2 - ERP服务响应时间过长 (一般)
      - alert: ErpHighLatencyP2
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~"topems-erp.*"}[5m])) by (le)) > 0.8
        for: 3m
        labels:
          severity: P2
          priority: "2"
          category: business
          team: erp-team
          escalation: "false"
        annotations:
          summary: "[P2] ERP服务响应时间过长"
          description: "ERP服务P95延迟超过800ms"
          runbook: "https://docs.topems.com/runbooks/erp-latency"
          impact: "ERP操作响应变慢"

      # P1 - ERP服务错误率高 (重要)
      - alert: ErpHighErrorRateP1
        expr: sum(rate(http_requests_total{job=~"topems-erp.*", status_code=~"5.."}[5m])) by (job) / sum(rate(http_requests_total{job=~"topems-erp.*"}[5m])) by (job) > 0.03
        for: 2m
        labels:
          severity: P1
          priority: "1"
          category: business
          team: erp-team
          escalation: "true"
        annotations:
          summary: "[P1] ERP服务错误率过高"
          description: "ERP服务错误率: {{ $value | humanizePercentage }}"
          runbook: "https://docs.topems.com/runbooks/erp-error-rate"
          impact: "财务业务受影响"

      # P2 - MES服务响应时间过长 (一般)
      - alert: MesHighLatencyP2
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~"topems-mes.*"}[5m])) by (le)) > 1.5
        for: 3m
        labels:
          severity: P2
          priority: "2"
          category: business
          team: mes-team
          escalation: "false"
        annotations:
          summary: "[P2] MES服务响应时间过长"
          description: "MES服务P95延迟超过1.5秒"
          runbook: "https://docs.topems.com/runbooks/mes-latency"
          impact: "生产执行系统响应变慢"

      # P2 - HRM服务响应时间过长 (一般)
      - alert: HrmHighLatencyP2
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~"topems-hrm.*"}[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: P2
          priority: "2"
          category: business
          team: hrm-team
          escalation: "false"
        annotations:
          summary: "[P2] HRM服务响应时间过长"
          description: "HRM服务P95延迟超过500ms"
          runbook: "https://docs.topems.com/runbooks/hrm-latency"
          impact: "人事系统响应变慢"
