[server]
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[security]
admin_user = admin
admin_password = admin

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[paths]
provisioning = /etc/grafana/provisioning
