# Portal Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: topems
  labels:
    app: portal
    suite: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
        suite: analytics
    spec:
      containers:
      - name: portal
        image: topems/portal:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8063
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: PORTAL_PORT
          value: "8063"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8063
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8063
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: portal-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8063
    targetPort: 8063
  selector:
    app: portal