# LIMS Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lims
  namespace: topems
  labels:
    app: lims
    suite: quality
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lims
  template:
    metadata:
      labels:
        app: lims
        suite: quality
    spec:
      containers:
      - name: lims
        image: topems/lims:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8051
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: LIMS_PORT
          value: "8051"
        - name: QMS_URL
          value: "http://qms-service:8050"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8051
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8051
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lims-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8051
    targetPort: 8051
  selector:
    app: lims
