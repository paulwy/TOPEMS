# Unified Core Service - Kubernetes Deployment and Service
# 包含: IAM + Doc + Flow + File + Communication + Tenant + Billing + AI + Monitor
# 配置项: 模块级故障隔离(P0-3) + Prometheus监控(P0-4) + OpenAPI文档(P0-1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-core
  namespace: topems
  labels:
    app: unified-core
    suite: core
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unified-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: unified-core
        suite: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
    spec:
      containers:
      - name: unified-core
        image: topems/unified-core:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: CORE_PORT
          value: "8000"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        # P0-3: 模块级故障隔离配置
        - name: MODULE_IAM_ENABLED
          value: "true"
        - name: MODULE_IAM_MAX_CONNECTIONS
          value: "20"
        - name: MODULE_IAM_RATE_LIMIT
          value: "100"
        - name: MODULE_FLOW_ENABLED
          value: "true"
        - name: MODULE_FLOW_MAX_CONNECTIONS
          value: "30"
        - name: MODULE_FLOW_RATE_LIMIT
          value: "200"
        - name: MODULE_FILE_ENABLED
          value: "true"
        - name: MODULE_FILE_MAX_CONNECTIONS
          value: "15"
        - name: MODULE_FILE_RATE_LIMIT
          value: "50"
        - name: MODULE_DOC_ENABLED
          value: "true"
        - name: MODULE_DOC_MAX_CONNECTIONS
          value: "15"
        - name: MODULE_DOC_RATE_LIMIT
          value: "50"
        - name: MODULE_MAIL_ENABLED
          value: "true"
        - name: MODULE_MAIL_MAX_CONNECTIONS
          value: "10"
        - name: MODULE_MAIL_RATE_LIMIT
          value: "20"
        - name: MODULE_IM_ENABLED
          value: "true"
        - name: MODULE_IM_MAX_CONNECTIONS
          value: "10"
        - name: MODULE_IM_RATE_LIMIT
          value: "100"
        - name: MODULE_NOTIFICATION_ENABLED
          value: "true"
        - name: MODULE_NOTIFICATION_MAX_CONNECTIONS
          value: "10"
        - name: MODULE_NOTIFICATION_RATE_LIMIT
          value: "100"
        - name: MODULE_MONITOR_ENABLED
          value: "true"
        - name: MODULE_MONITOR_MAX_CONNECTIONS
          value: "5"
        - name: MODULE_MONITOR_RATE_LIMIT
          value: "100"
        # P0-4: Prometheus 监控配置
        - name: METRICS_ENABLED
          value: "true"
        - name: METRICS_PATH
          value: "/metrics"
        # P0-1: OpenAPI 文档配置
        - name: OPENAPI_ENABLED
          value: "true"
        - name: OPENAPI_PATH
          value: "/swagger-ui"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: topems-unified-core
  namespace: topems
  labels:
    app: unified-core
    suite: core
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: unified-core
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unified-core-hpa
  namespace: topems
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unified-core
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75