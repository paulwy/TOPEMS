# Analytics Service - Kubernetes Deployment and Service
# 注：原 bi + report 服务已整合为统一的 analytics 服务（2026-06/07）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: topems
  labels:
    app: analytics
    suite: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
        suite: analytics
    spec:
      containers:
      - name: analytics
        image: topems/analytics:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8060
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: ANALYTICS_PORT
          value: "8060"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8060
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8060
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: topems-analytics
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8060
    targetPort: 8060
  selector:
    app: analytics
