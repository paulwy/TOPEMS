# Mobile Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile
  namespace: topems
  labels:
    app: mobile
    suite: infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mobile
  template:
    metadata:
      labels:
        app: mobile
        suite: infrastructure
    spec:
      containers:
      - name: mobile
        image: topems/mobile:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8070
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: MOBILE_PORT
          value: "8070"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8070
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8070
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8070
    targetPort: 8070
  selector:
    app: mobile