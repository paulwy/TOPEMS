# SCM Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm
  namespace: topems
  labels:
    app: scm
    suite: supply-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scm
  template:
    metadata:
      labels:
        app: scm
        suite: supply-chain
    spec:
      containers:
      - name: scm
        image: topems/scm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8040
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: SCM_PORT
          value: "8040"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        - name: ERP_URL
          value: "http://erp-service:8010"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8040
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8040
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scm-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8040
    targetPort: 8040
  selector:
    app: scm