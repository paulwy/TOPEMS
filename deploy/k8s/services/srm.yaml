# SRM Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srm
  namespace: topems
  labels:
    app: srm
    suite: supply-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: srm
  template:
    metadata:
      labels:
        app: srm
        suite: supply-chain
    spec:
      containers:
      - name: srm
        image: topems/srm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8042
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: SRM_PORT
          value: "8042"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        - name: SCM_URL
          value: "http://scm-service:8040"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8042
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8042
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: srm-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8042
    targetPort: 8042
  selector:
    app: srm