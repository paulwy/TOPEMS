# ERP Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp
  namespace: topems
  labels:
    app: erp
    suite: management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp
  template:
    metadata:
      labels:
        app: erp
        suite: management
    spec:
      containers:
      - name: erp
        image: topems/erp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8010
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: ERP_PORT
          value: "8010"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: erp-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8010
    targetPort: 8010
  selector:
    app: erp