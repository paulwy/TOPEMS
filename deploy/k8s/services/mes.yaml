# MES Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mes
  namespace: topems
  labels:
    app: mes
    suite: manufacturing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mes
  template:
    metadata:
      labels:
        app: mes
        suite: manufacturing
    spec:
      containers:
      - name: mes
        image: topems/mes:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8030
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: MES_PORT
          value: "8030"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8030
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8030
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mes-service
  namespace: topems
  labels:
    app: mes
spec:
  type: ClusterIP
  ports:
  - port: 8030
    targetPort: 8030
    name: http
  selector:
    app: mes
