# CRM Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm
  namespace: topems
  labels:
    app: crm
    suite: management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm
  template:
    metadata:
      labels:
        app: crm
        suite: management
    spec:
      containers:
      - name: crm
        image: topems/crm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8029
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: CRM_PORT
          value: "8029"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8029
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8029
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crm-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8029
    targetPort: 8029
  selector:
    app: crm