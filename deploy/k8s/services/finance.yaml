# Finance Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance
  namespace: topems
  labels:
    app: finance
    suite: management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finance
  template:
    metadata:
      labels:
        app: finance
        suite: management
    spec:
      containers:
      - name: finance
        image: topems/finance:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8011
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: FINANCE_PORT
          value: "8011"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8011
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8011
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finance-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8011
    targetPort: 8011
  selector:
    app: finance
