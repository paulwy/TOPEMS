# GIS Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis
  namespace: topems
  labels:
    app: gis
    suite: infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gis
  template:
    metadata:
      labels:
        app: gis
        suite: infrastructure
    spec:
      containers:
      - name: gis
        image: topems/gis:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8071
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: GIS_PORT
          value: "8071"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        - name: MES_URL
          value: "http://mes-service:8030"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8071
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8071
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gis-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8071
    targetPort: 8071
  selector:
    app: gis