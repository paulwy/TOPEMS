# TOPEMS GIS Service Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topems-gis
  namespace: topems
  labels:
    app: topems-gis
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: topems-gis
  template:
    metadata:
      labels:
        app: topems-gis
        tier: backend
    spec:
      containers:
        - name: gis
          image: topems-gis:latest
          ports:
            - containerPort: 8071
              name: http
          env:
            - name: RUST_LOG
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: topems-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: topems-secrets
                  key: jwt-secret
            - name: IAM_SERVICE_URL
              value: "http://unified-core-service:8000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8071
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8071
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: topems-gis
  namespace: topems
spec:
  type: ClusterIP
  ports:
    - port: 8071
      targetPort: 8071
      protocol: TCP
      name: http
  selector:
    app: topems-gis
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: topems-gis-hpa
  namespace: topems
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: topems-gis
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
