# WMS Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wms
  namespace: topems
  labels:
    app: wms
    suite: supply-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wms
  template:
    metadata:
      labels:
        app: wms
        suite: supply-chain
    spec:
      containers:
      - name: wms
        image: topems/wms:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8041
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: WMS_PORT
          value: "8041"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        - name: SCM_URL
          value: "http://scm-service:8040"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8041
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8041
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: wms-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8041
    targetPort: 8041
  selector:
    app: wms