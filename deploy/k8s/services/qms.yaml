# QMS Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qms
  namespace: topems
  labels:
    app: qms
    suite: quality
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qms
  template:
    metadata:
      labels:
        app: qms
        suite: quality
    spec:
      containers:
      - name: qms
        image: topems/qms:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8050
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: QMS_PORT
          value: "8050"
        - name: ERP_URL
          value: "http://erp-service:8010"
        - name: MES_URL
          value: "http://mes-service:8030"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8050
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8050
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: qms-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8050
    targetPort: 8050
  selector:
    app: qms
