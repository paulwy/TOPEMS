# TOPEMS ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: topems-config
  namespace: topems
data:
  # 容器内必须监听全部网卡：Service/Pod 探针与集群互访才会命中
  # （宿主/裸机默认回环 127.0.0.1，见 deploy/README.md「监听地址口径」）
  BIND_ADDR: "0.0.0.0"
  # Database
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "topems"
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # Core
  CORE_URL: "http://topems-unified-core:8000"
  # Service Ports
  FINANCE_PORT: "8011"
  AI_PORT: "8013"
  MES_PORT: "8030"
  PDM_PORT: "8031"
  QMS_PORT: "8050"
  LIMS_PORT: "8051"
  EHS_PORT: "8052"
  BI_PORT: "8060"
  # Logging
  RUST_LOG: "info"
  # V13.0 Plugin Architecture
  PLUGIN_AUTO_REGISTER: "true"
  PLUGIN_REGISTER_URL: "http://topems-unified-core:8000/api/core/plugin/dev/plugins"
  SERVICE_HEARTBEAT_INTERVAL: "30"
  PLUGIN_HEARTBEAT_TIMEOUT: "90"
---
# TOPEMS Secrets (Base64 encoded)
# Note: In production, use external secrets manager
apiVersion: v1
kind: Secret
metadata:
  name: topems-secrets
  namespace: topems
type: Opaque
stringData:
  POSTGRES_USER: "topems"
  # ⚠️ 部署前必须替换为真实强密码（kubectl create secret generic topems-db --from-literal=POSTGRES_PASSWORD=<强密码>，
  #    并同步更新下方 DATABASE_URL 与 deployment 注入）；示例值会导致数据库口令公开，禁止直接部署
  POSTGRES_PASSWORD: "CHANGE_ME_DEPLOY_SECRET"
  DATABASE_URL: "postgres://topems_app:CHANGE_ME_DEPLOY_SECRET@postgres-service:5432/topems"
  REDIS_URL: "redis://redis-service:6379"
  # V13.0 Plugin Registration Token (CHANGE IN PRODUCTION!)
  # Generate with: openssl rand -hex 32
  PLUGIN_REGISTRATION_TOKEN: "CHANGE_ME_TO_A_SECURE_RANDOM_TOKEN"
