user www-data;
worker_processes auto;
pid /run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========== 网关防护（P2-2 补强） ==========
    # API 限流：按客户端 IP，默认 10r/s、burst 20（防刷；正常用户不受影响）
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    # 单 IP 并发连接限制（防连接耗尽 / 慢速攻击）
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    # 熔断/失败转移：5xx 与超时计入失败并尝试下一个 upstream（配合 upstream max_fails 被动健康检查）
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;
    gzip_disable "MSIE [1-6]\.";
    # 优先发送 vite-plugin-compression 预生成的 .gz 文件，避免运行时重复压缩
    gzip_static on;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;
    # 优先发送预生成的 .br 文件
    brotli_static on;

    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 75s;
    keepalive_requests 100;
    send_timeout 30s;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    server_tokens off;

    # ========== upstream 定义（P0-3 双轨合一：唯一对外入口 = 模块化单体 BFF :8099） ==========
    # 原 per-service upstream（unified-core 8000 / hrm 8020 / … / plugin-registry 8096）
    # 及其 $request_uri 前缀 map 已关闭；全部 /api/* 由 topems-server(:8099) 内嵌
    # 约 30 个服务适配器统一路由（原 /health、/metrics 亦由该 BFF 直接暴露）。
    upstream server_service {
        ip_hash;
        server localhost:8099 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # ========== map: URI 前缀 → upstream 路由表（P0-3 已移除） ==========
    # 原 `map $request_uri $api_upstream {...}` 前缀直连独立服务规则随双轨合一关闭；
    # /api/* 不再按前缀分发，统一由 location /api/ 直代 server_service(:8099)。
    # legacy /v1 rewrite（下方 server 块内）rewrite 后仍落到 /api/ → server_service。

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_trusted_certificate /etc/nginx/certs/chain.pem;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' https:; worker-src 'self' blob:; prefetch-src 'self';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            root /var/www/topems/web;
            try_files $uri $uri/ /index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' https:; worker-src 'self' blob:; prefetch-src 'self';" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location /assets/ {
            root /var/www/topems/web;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header ETag "";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
        }

        # ========== 统一 API 代理（P0-3：直代 BFF :8099，未知路由由 BFF catch-all 返回 404） ==========
        # P2-2：限流（api_per_ip） + 单 IP 连接限制，保护后端服务
        location /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass http://server_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect off;
        }

        # ========== WebSocket 反代（BFF WS 接线 W1：/ws/* → server_service(:8099)） ==========
        # 前端 useWebSocket 直连 /ws/core；unified-core 提供 /ws/core/notifications、/ws/core/im、
        # /ws/healthz（非 Upgrade 自测端点）与 /ws/{module}/{feature}（模块白名单）。
        # 保持长连接语义：Upgrade/Connection 头透传 + 60s 读超时（心跳 30s 内即可续命）。
        location /ws/ {
            proxy_pass http://server_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_redirect off;
        }

        location /health {
            proxy_pass http://server_service/health;
            access_log off;
        }

        location /metrics {
            proxy_pass http://server_service/metrics;
            access_log off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/topems/web;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
