user www-data;
worker_processes auto;
pid /run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========== 网关防护（P2-2 补强） ==========
    # API 限流：按客户端 IP，默认 10r/s、burst 20（防刷；正常用户不受影响）
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    # 单 IP 并发连接限制（防连接耗尽 / 慢速攻击）
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    # 熔断/失败转移：5xx 与超时计入失败并尝试下一个 upstream（配合 upstream max_fails 被动健康检查）
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;
    gzip_disable "MSIE [1-6]\.";
    # 优先发送 vite-plugin-compression 预生成的 .gz 文件，避免运行时重复压缩
    gzip_static on;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;
    # 优先发送预生成的 .br 文件
    brotli_static on;

    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 75s;
    keepalive_requests 100;
    send_timeout 30s;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    server_tokens off;

    # ========== upstream 定义 ==========
    upstream unified_core_service {
        ip_hash;
        server localhost:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }
    upstream hrm_service { ip_hash; server localhost:8020 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream erp_service { ip_hash; server localhost:8010 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream crm_service { ip_hash; server localhost:8029 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream ai_service { ip_hash; server localhost:8013 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream finance_service { ip_hash; server localhost:8011 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream scm_service { ip_hash; server localhost:8040 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream wms_service { ip_hash; server localhost:8041 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream srm_service { ip_hash; server localhost:8042 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream rd_service { ip_hash; server localhost:8053 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream bi_service { ip_hash; server localhost:8060 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream pm_service { ip_hash; server localhost:8023 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream mes_service { ip_hash; server localhost:8030 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream pdm_service { ip_hash; server localhost:8031 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream qms_service { ip_hash; server localhost:8050 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream lims_service { ip_hash; server localhost:8051 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream ehs_service { ip_hash; server localhost:8052 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream portal_service { ip_hash; server localhost:8063 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream mobile_service { ip_hash; server localhost:8070 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream gis_service { ip_hash; server localhost:8071 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream integration_service { ip_hash; server localhost:8072 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream tms_service { ip_hash; server localhost:8073 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream search_service { ip_hash; server localhost:8082 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream communication_service { ip_hash; server localhost:8084 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream ticket_service { ip_hash; server localhost:8086 max_fails=3 fail_timeout=30s; keepalive 64; }
    # [V2026.08 已合并] feedback 服务已合并至 ticket（customer_feedback 类型），原端口 8087 停用
    # [V2026.08 已移除] lowcode 空壳占位服务（原端口 8088）
    upstream master_data_service { ip_hash; server localhost:8090 max_fails=3 fail_timeout=30s; keepalive 64; }
    upstream plugin_registry_service { ip_hash; server localhost:8096 max_fails=3 fail_timeout=30s; keepalive 64; }

    # ========== map: URI 前缀 → upstream 名称 ==========
    # 将 /api/xxx/ 路径映射到对应的 upstream，统一 proxy_pass，消除 30+ 重复 location 块
    map $request_uri $api_upstream {
        default "";
        # unified-core 虚拟服务（含 doc/monitor 已合并模块）
        ~^/api/(core|doc|monitor)/          unified_core_service;
        # bi 服务（含 analytics/report 别名）
        ~^/api/(bi|analytics|report)/       bi_service;
        # 独立业务服务
        ~^/api/erp/                         erp_service;
        ~^/api/finance/                     finance_service;
        ~^/api/ai/                          ai_service;
        ~^/api/hrm/                         hrm_service;
        ~^/api/pm/                          pm_service;
        ~^/api/crm/                         crm_service;
        ~^/api/mes/                         mes_service;
        # [V2026.08 已合并] aps 服务已合并至 mes（/api/aps 兼容层由 mes 提供），代理到 mes_service
        ~^/api/aps/                         mes_service;
        ~^/api/pdm/                         pdm_service;
        ~^/api/scm/                         scm_service;
        ~^/api/wms/                         wms_service;
        ~^/api/srm/                         srm_service;
        ~^/api/qms/                         qms_service;
        ~^/api/lims/                        lims_service;
        ~^/api/ehs/                         ehs_service;
        ~^/api/rd/                          rd_service;
        ~^/api/portal/                      portal_service;
        ~^/api/mobile/                      mobile_service;
        ~^/api/gis/                         gis_service;
        ~^/api/integration/                 integration_service;
        ~^/api/tms/                         tms_service;
        # 外迁独立服务（8082-8090）
        ~^/api/search/                      search_service;
        ~^/api/communication/               communication_service;
        ~^/api/ticket/                      ticket_service;
        ~^/api/feedback/                    ticket_service;  # [V2026.08 已合并] feedback→ticket 兼容路由
        # [V2026.08 已移除] lowcode 空壳占位服务
        ~^/api/master-data/                 master_data_service;
        # [P0-5] 插件注册服务（plugin-registry, 8096）
        ~^/api/plugin/                      plugin_registry_service;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_trusted_certificate /etc/nginx/certs/chain.pem;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' https:; worker-src 'self' blob:; prefetch-src 'self';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            root /var/www/topems/web;
            try_files $uri $uri/ /index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /assets/ {
            root /var/www/topems/web;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header ETag "";
        }

        # ========== 统一 API 代理（map 驱动，消除 30+ 重复 location 块） ==========
        # 路由表由 http 块中的 map $request_uri $api_upstream 定义
        # 未匹配的 /api/* 路径返回 404
        # P2-2：限流（api_per_ip） + 单 IP 连接限制，保护后端服务
        location /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            limit_conn conn_per_ip 20;
            if ($api_upstream = "") { return 404; }
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect off;
        }

        # ========== Group1/2 service 级 /v1 legacy rewrite（/api/{core/,}{svc}/v1/* → /api/{core/,}{svc}/*） ==========
        location ~ ^/api/core/(iam|flow|file|mail|im|notification|master|migration|comm|help)/v1/(.*)$ {
            rewrite ^/api/core/([^/]+)/v1/(.*)$ /api/core/$1/$2 last;
        }
        location ~ ^/api/(erp|finance|ai|hrm|pm|crm|mes|pdm|scm|wms|srm|qms|lims|ehs|rd|bi|analytics|report|portal|mobile|gis|integration|tms|search|communication|ticket|feedback|master-data)/v1/(.*)$ {
            rewrite ^/api/([^/]+)/v1/(.*)$ /api/$1/$2 last;
        }

        # ========== 旧 /api/v1/* 兼容（过渡至少 1 个大版本） ==========
        location ~ ^/api/v1/(auth|users|roles|permissions|logout|sessions|security-settings|password-policy|reset-password|forgot-password|set-new-password)/(.*)$ {
            rewrite ^/api/v1/(.*)$ /api/core/iam/$1 last;
        }
        location ~ ^/api/v1/(employees|departments|contracts|attendance|leave|payroll|performance|recruitment|training|salary-adjustments|setup)/(.*)$ {
            rewrite ^/api/v1/(.*)$ /api/hrm/$1 last;
        }
        location ~ ^/api/v1/erp/(.*)$ {
            rewrite ^/api/v1/erp/(.*)$ /api/erp/$1 last;
        }
        location ~ ^/api/v1/crm/(.*)$ {
            rewrite ^/api/v1/crm/(.*)$ /api/crm/$1 last;
        }
        location ~ ^/api/v1/documents/(.*)$ {
            rewrite ^/api/v1/documents/(.*)$ /api/doc/$1 last;
        }
        location ~ ^/api/v1/ai/(.*)$ {
            rewrite ^/api/v1/ai/(.*)$ /api/ai/$1 last;
        }
        location ~ ^/api/v1/health/(.*)$ {
            rewrite ^/api/v1/health/(.*)$ /health/$1 last;
        }

        location /health {
            proxy_pass http://unified_core_service/health;
            access_log off;
        }

        location /metrics {
            proxy_pass http://unified_core_service/metrics;
            access_log off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/topems/web;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }
    }
}
