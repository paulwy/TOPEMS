# ============================================================================
# TOPEMS macOS 生产 nginx HTTP server 模板
# 对应生产机 /opt/homebrew/etc/nginx/servers/topems.conf
#
# 占位符（部署前按环境替换）：
#   __TOPEMS_HOME__     应用根目录（生产：/Users/<user>/topems，含 nginx/logs、nginx/certs）
#   __TOPEMS_WEB_ROOT__ 前端静态目录（生产：<repo>/dist/current）
#
# 日志策略：server 级 access_log 开启且使用 topems_safe（不含 query string）；
# /health、/metrics 保持 access_log off。
# ============================================================================
server {
    listen       80;
    server_name  _;
    access_log   __TOPEMS_HOME__/nginx/logs/access.log topems_safe;

    root   __TOPEMS_WEB_ROOT__;
    index  index.html;

    # 安全响应头（server 级，对静态页与 /api 反代都生效）
    # HSTS 只对 443 有意义；本机由 cloudflared 终结 TLS，经 CF 边缘下发后浏览器按 https 生效。
    # 6 个月，暂不加 includeSubDomains / preload（回滚代价低，确认全子域强制 HTTPS 后再加）。
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API 反代到 Rust 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # 探活 / 指标（直连 BFF，勿落 SPA fallback）
    location = /health {
        proxy_pass http://127.0.0.1:8099/health;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:8099/metrics;
        access_log off;
    }

    # Swagger（如启用）
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8099;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    # 注意：nginx 的 add_header 不跨层继承 —— 本 location 自带 add_header 后，
    # server 级安全头不再生效，必须在此重复声明。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
