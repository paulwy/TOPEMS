        healthCheck:
          path: "/health"
          interval: "10s"
          timeout: "3s"

    svc-hrm:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://hrm:8020"
        healthCheck:
          path: "/health"
          interval: "10s"
          timeout: "3s"

    svc-pm:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://pm:8023"
        healthCheck:
          path: "/health"
          interval: "10s"
          timeout: "3s"

    svc-crm:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://crm:8029"
        healthCheck:
          path: "/health"
          interval: "10s"
          timeout: "3s"

    svc-mes:
