      priority: 100

    # /api/aps → mes aps_compat 兼容层（原 aps 服务已归档，2026-09-02）
    router-aps:
      rule: "PathPrefix(`/api/aps`)"
      entryPoints:
        - web
        - api  # API 网关入口（8080）
      service: svc-aps
      middlewares:
        - default-chain
      priority: 100

    # ===== 静态资源路由（fallback 到 nginx）=====
    # 最低优先级，兜底处理所有非 /api/* 请求，转发到 nginx 静态资源服务
    router-static:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
        - api  # API 网关入口（8080）
      service: svc-nginx
      middlewares:
        - gzip-compress
        - cors-headers
      priority: 1

  # ================================================
  # 中间件定义
  # ================================================
  middlewares:
    # ----- 默认中间件链（统一应用到所有路由）-----
    # 顺序: cors → rate-limit → jwt-auth → retry
    # request-id 注入口：traefik v3.0.4 插件 ABI 过老 + 原插件源 404，社区替代（jeroentrappers/traefik-plugin-request-id）
    # 仅 1 commit 无 release tag 且面向 v3.5+；应用层 unified-core 已有 request_id 中间件覆盖追踪关联，
    # 待 traefik 升级 v3.5+ 后按 catalog 模式接入
    default-chain:
      chain:
        middlewares:
          - cors-headers
          - rate-limit
          - jwt-auth
          - retry

    # ----- JWT 认证（forwardAuth 到 unified-core 验证）-----
    jwt-auth:
      forwardAuth:
        address: "http://unified-core:8000/api/core/iam/auth/verify"
        authResponseHeaders:
          - X-Auth-User-Id
          - X-Auth-Username
          - X-Auth-Roles
          - X-Auth-Tenant
          - X-Auth-Permissions
          - X-Auth-Token-Exp
        trustForwardHeader: true

    # ----- 全局限流（每秒 100 请求，突发 200）-----
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: "1s"

    # ----- CORS 头处理 -----
    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "*"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "PATCH"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "*"
        accessControlExposeHeaders:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
        accessControlAllowCredentials: true

    # ----- Gzip 压缩 -----
    gzip-compress:
      compress: {}

    # ----- 重试（最多 3 次）-----
    retry:
      retry:
        attempts: 3
        initialInterval: "100ms"

    # ----- 租户头部转发 -----
    tenant-header:
      headers:
        customRequestHeaders:
          X-Tenant-Id: "default"
        customResponseHeaders:
          X-Tenant-Resolved: "true"

    # ----- 各服务路径前缀剥离（保持与 nginx 行为一致）-----

  # ================================================
  # 后端服务定义（含健康检查）
  # ================================================
  services:
