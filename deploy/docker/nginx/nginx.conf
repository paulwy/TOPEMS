user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream unified-core {
        server topems-unified-core:8000;
    }

    upstream erp {
        server topems-erp:8010;
    }

    upstream hrm {
        server topems-hrm:8020;
    }

    upstream pm {
        server topems-pm:8023;
    }

    upstream crm {
        server topems-crm:8029;
    }

    upstream mes {
        server topems-mes:8030;
    }

    upstream pdm {
        server topems-pdm:8031;
    }

    upstream scm {
        server topems-scm:8040;
    }

    upstream wms {
        server topems-wms:8041;
    }

    upstream srm {
        server topems-srm:8042;
    }

    upstream qms {
        server topems-qms:8050;
    }

    upstream lims {
        server topems-lims:8051;
    }

    upstream ehs {
        server topems-ehs:8052;
    }

    upstream bi {
        server topems-bi:8060;
    }

    upstream portal {
        server topems-portal:8063;
    }

    upstream ai {
        server topems-ai:8013;
    }

    upstream mobile {
        server topems-mobile:8070;
    }

    upstream gis {
        server topems-gis:8071;
    }

    upstream integration {
        server topems-integration:8072;
    }

    upstream finance {
        server topems-finance:8011;
    }

    upstream analytics {
        server topems-bi:8060;
    }

    upstream rd {
        server topems-rd:8053;
    }

    # 扩展服务 (外迁微服务)
    upstream search {
        server topems-search:8082;
    }

    upstream communication {
        server topems-communication:8084;
    }

    upstream billing {
        server topems-billing:8085;
    }

    upstream ticket {
        server topems-ticket:8086;
    }

    # [V2026.08 已合并] feedback 服务已合并至 ticket（customer_feedback 类型），原端口 8087 停用

    # [V2026.08 已移除] lowcode 空壳占位服务

    upstream master-data {
        server topems-master-data:8090;
    }

    server {
        listen 80;
        server_name localhost;

        # ================================================
        # API 请求统一由 Traefik 网关处理
        # nginx 仅作为静态资源服务，/api/* 全部反代到 traefik:80
        # 路由、限流、熔断、JWT 认证等网关能力由 Traefik 提供
        # ================================================
        location /api/ {
            proxy_pass http://traefik:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            # WebSocket 支持（如 ai/mobile 服务可能用到）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # 超时设置（网关层有自己的超时，这里放宽）
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Group1: IAM/Flow/File/Comm/Im/Notification/Master/Migration/Help 全部走 /api/core/*
        # 由 Traefik 的 router-core 处理，nginx 不再单独拆开 /api/{iam,flow,file,comm}
        # 旧路径 /api/v1/* legacy rewrite 已由 Traefik 统一处理

        # ====== 注意：Group1 / Group2 service 级 /v1 不做 Nginx rewrite ======
        # 改由各服务的 Rust 中间件 (group1/group2_route_compat_middleware) 负责：
        # - 对 /v1 路径加 Deprecation/Warning 响应头和 WARN 日志（标记弃用）
        # - 对新路径 (无 /v1) 透明重写回内部硬编码的 /v1 前缀（实现双轨）
        # /api/v1/* 请求由上面的 /api/ 反代规则统一转发到 Traefik 处理

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}