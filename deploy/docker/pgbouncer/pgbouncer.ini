[databases]
; 所有服务共用一个连接池，按需扩展
topems = host=postgres port=5432 dbname=topems

[pgbouncer]
; 监听端口 6432（标准 PgBouncer 端口）
listen_addr = 0.0.0.0
listen_port = 6432

; 认证方式：scram-sha-256（PG18 默认口令加密方式；md5 已被上游标记为弃用）
; userlist.txt 由 deploy/docker/pgbouncer/render-userlist.sh 在部署时生成（600 权限），
; 仓库里只保留 userlist.txt.example，禁止把真实口令提交进来。
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; 连接池配置
; 每个数据库最大连接数 = 服务数 * max_connections_per_service
; 唯一事实源：docker-compose.yml 不再注入 PGBOUNCER_* 覆盖值
; 上限受 postgres -c max_connections=200 约束（150 给池 + 50 给迁移/运维直连）
max_db_connections = 150
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; 超时设置
server_connect_timeout = 15
server_idle_timeout = 300
server_lifetime = 1800
server_check_delay = 30
server_check_query = SELECT 1

; 客户端连接限制
max_client_conn = 500

; 日志配置
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

; 管理接口
admin_users = topems
stats_users = topems