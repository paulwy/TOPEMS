[databases]
; 所有服务共用一个连接池，按需扩展
topems = host=postgres port=5432 dbname=topems

[pgbouncer]
; 监听端口 6432（标准 PgBouncer 端口）
listen_addr = 0.0.0.0
listen_port = 6432

; 认证方式：使用 PostgreSQL 用户密码
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; 连接池配置
; 每个数据库最大连接数 = 服务数 * max_connections_per_service
max_db_connections = 100
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3

; 超时设置
server_connect_timeout = 15
server_idle_timeout = 300
server_lifetime = 1800
server_check_delay = 30
server_check_query = SELECT 1

; 客户端连接限制
max_client_conn = 500
default_client_connection_limit = 0

; 日志配置
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

; 管理接口
admin_users = topems
stats_users = topems