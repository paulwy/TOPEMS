# Grafana Configuration for TOPEMS
# Non-Docker deployment

[server]
# Protocol (http or https)
protocol = http

# The ip address to bind to
http_addr = 0.0.0.0

# The http port to use
http_port = 3000

# The public facing domain name used to access grafana from a browser
domain = localhost

# Redirect to correct domain if host header does not match domain
enforce_domain = false

[database]
# Either "mysql", "postgres" or "sqlite3"
type = sqlite3

# Only for sqlite3
path = /opt/topems/data/grafana/grafana.db

[security]
# default admin user
admin_user = admin

# default admin password (change this!)
admin_password = admin

# disable gravatar profile images
disable_gravatar = true

# enable https
[server]
cert_file =
cert_key =

[users]
# disable user signup / registration
allow_sign_up = false

# Allow non admin users to create organizations
allow_org_create = false

# Set to true to automatically assign new users to the default organization
auto_assign_org = true

# Default role new users will be automatically assigned
auto_assign_org_role = Viewer

[auth]
# Set to true to disable (hide) the login form
disable_login_form = false

# Set to true to enable anonymous access
anonymous = false

# Organization name that should be used for unauthenticated users
org_name = Main Org.

# Role for unauthenticated users
org_role = Viewer

[auth.basic]
enabled = true

[auth.proxy]
enabled = false

[dataproxy]
# Timeout for data proxy requests
timeout = 30

[analytics]
# Set to false to disable all checking for new versions
check_for_updates = false

[smtp]
enabled = false
host = localhost:25
user =
password =
from_address = grafana@localhost
from_name = Grafana

[log]
# Either "console", "file", "syslog"
mode = console file

# Either "trace", "debug", "info", "warn", "error", "critical"
level = info

[log.file]
log_dir = /opt/topems/logs/grafana

[plugins]
# Enable plugin loading
enable_plugins = true

# Directory where plugins are installed
plugins_dir = /opt/topems/data/grafana/plugins

[alerting]
# Enable alerting
enabled = true

# Execute alerting rules
execute_alerts = true

[dashboards]
# Directory where dashboards are stored
versions_to_keep = 20

[paths]
# Path to where grafana can store temp files, sessions, and the sqlite3 db
data = /opt/topems/data/grafana

# Temporary files
temp_data_lifetime = 24h

# Directory where grafana stores logs
logs = /opt/topems/logs/grafana

# Directory where grafana stores plugins
plugins = /opt/topems/data/grafana/plugins

# Directory where grafana stores provisioning files
provisioning = /opt/topems/config/grafana/provisioning