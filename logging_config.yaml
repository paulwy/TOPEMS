# ============================================
# TOPEMS 系统日志配置文件
# ============================================

# 日志级别
level: info

# 日志输出格式
format:
  # 输出目标: console, file, both
  output: both
  
  # 日志格式: json, pretty
  style: pretty

# 文件输出配置
file:
  # 日志文件目录
  directory: /var/log/topems
  
  # 单个日志文件大小限制（MB）
  max_size: 50
  
  # 保留日志文件数量
  max_files: 10
  
  # 是否压缩旧日志
  compress: true

# 日志内容配置
content:
  # 是否包含时间戳
  timestamp: true
  
  # 是否包含模块名
  module: true
  
  # 是否包含文件和行号
  file_line: true
  
  # 是否包含线程ID
  thread_id: false

# 结构化日志字段（JSON格式时使用）
fields:
  - timestamp
  - level
  - module
  - message
  - request_id
  - user_id
  - ip_address
  - endpoint
  - status_code
  - duration

# 敏感信息过滤（自动脱敏）
redact:
  - password
  - secret
  - token
  - api_key
  - jwt
  - authorization

# 性能日志配置
performance:
  # 是否记录请求耗时
  track_request_time: true
  
  # 慢请求阈值（毫秒）
  slow_request_threshold: 1000
  
  # 是否记录数据库查询时间
  track_db_queries: true

# 安全日志配置
security:
  # 是否记录认证失败
  log_auth_failures: true
  
  # 是否记录认证成功
  log_auth_success: true
  
  # 是否记录权限拒绝
  log_permission_denied: true
  
  # 是否记录登录尝试
  log_login_attempts: true

# 采样配置
sampling:
  # 调试级别采样率（0-1.0）
  debug: 1.0
  
  # 信息级别采样率
  info: 1.0
  
  # 警告级别采样率
  warn: 1.0
  
  # 错误级别采样率
  error: 1.0

# 日志轮转配置
rotation:
  # 轮转时间间隔: hourly, daily, weekly, monthly
  interval: daily
  
  # 轮转时间点（小时）
  at_hour: 0

# 输出目标配置
sinks:
  console:
    enabled: true
    level: info
  
  file:
    enabled: true
    level: debug
  
  # 可选：日志聚合服务
  # elasticsearch:
  #   enabled: false
  #   url: http://localhost:9200
  #   index: topems-logs
  
  # 可选：告警服务
  # alerting:
  #   enabled: false
  #   webhook: https://alerting.example.com/webhook
