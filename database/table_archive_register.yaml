# TOPEMS 表级归档登记（逻辑归档，不落任何 DDL）
#
# 为什么新建本文件：仓库现有的“归档”约定只有两种，都不适用于本轮约束：
#   1) database/migrations 里的 `ALTER TABLE ... RENAME TO _archive_<name>`：会改表名/结构、
#      会让在跑二进制按原名查询失败，且必须在目标库执行写操作 —— prod 侧禁止。
#   2) database/migration_manifest.yaml：登记对象是“迁移版本”，不是表；没有表级处置字段。
# 因此这里只做**仓库侧逻辑登记**：prod 库不改一行、不改一列、不停写，
# 仅在本文登记“该表已判定为非权威成员、逻辑归档、不得新增写入、不得作为迁移目标”。
# 真正的物理下线（DROP）需要另立项目，前置证据见每条的 decommission_requires。
#
# 不变量：
#   - 本文件不产生任何 DDL/DML；prod 连接仍固定 default_transaction_read_only=on。
#   - 登记后该表禁止出现在任何新迁移的写入目标里；如需恢复使用，先在本文件把 status 改回 active。
#   - rows_at_registration 必须为 0 才允许登记（有数据的表走“迁数据”通道，不走归档）。

schema_version: 1
created_at: "2026-11-15"
scope: >-
  A1/A2 组“仅 prod 存在、无权威地位”的非权威成员。dev 侧不存在这些表，
  因此 dev 无需任何动作；prod 侧只登记逻辑归档，不删、不改。
source:
  - "docs/database/table-family-authority-recommendations-2026-11-15.md（族权威建议）"
  - "docs/database/column-drift-attribution-2026-11-15.md §3.1"
prod_evidence:
  host: "xingzhai@192.168.3.129 → topems_prod（unix socket, PostgreSQL 18.4）"
  captured_at: "2026-11-15"
  method: "默认只读事务；逐表 count(*) + information_schema 比对，未执行任何写操作"
  dev_absence: "dev topems 的 information_schema.tables 无同名条目（2026-11-15 实测）"
count_note: >-
  族清单 §5 记的是 9 张；按“族处置字段里逐成员标注 仅 prod → 标记归档”实测为 11 张。
  差额 2 来自 F001 / F014 两族各有两个 prod-only 成员（F001: iam.refresh_tokens + public.refresh_tokens；
  F014: public.equipment + rs.equipment），族清单把它们都标了归档，但 §5 汇总时按族计了 1。
  本文以逐成员实测为准列 11 条；口径差异需 owner 确认。

