#   Repo14 = Applied ⊎ ToApply ⊎ Hold ⊎ Excluded ⊎ Superseded ⊎ Obsolete ⊎ Forwarded
#   Applied = Ledger14 ∩ Repo14
#   ToApply 必须是 version > 实时账本 max 的新版本（旧版本不得 in-place 重放）
