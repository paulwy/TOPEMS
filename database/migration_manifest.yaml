#      逐版本生产结构/数据结论，来自只读审计：
#      docs/quality/prod-schema-drift-2026-11-09.md（2026-11-09，全程 SELECT/pg_dump）。
#   2) 历史基线结构/账本，来自：
#      database/baseline/prod_schema_20261105235700.sql.gz（1349 表，2026-11-05）
#      database/baseline/prod_ledger_20261105235700.sql（576 行，max 20261105235700）
#   3) 代码引用以仓库当前 HEAD 为准（文件:行号）。
#   4) 未使用「文件名猜测」；每条结论至少有一条账本/目录/数据/代码证据。
#
# 本文件随门禁补丁一并提交，作为方案 C 的 B0 登记产物；后续处置只追加、不改写历史。

