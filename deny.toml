# cargo-deny 配置 — 许可证合规 + 安全公告 + 禁用 crate 双查
#
# 与 cargo-audit 互补：cargo-audit 仅查 RLSA 漏洞，cargo-deny 额外覆盖
# 许可证合规（防止引入 GPL/AGPL 等传染性许可证）和 crate 禁用列表。
#
# 本地运行：cargo deny check advisories bans licenses sources
# CI job：.github/workflows/ci.yml → cargo-deny

# ────────────────────────────────────────────────────────────────────────────
# [advisories] 安全公告检查（RLSA + RustSec advisory-db）
# ────────────────────────────────────────────────────────────────────────────
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# yanked crate 版本直接拒绝
yanked = "deny"
# 暂不忽略任何公告；CI 发现新公告时应立即评估
# RUSTSEC-2023-0071（rsa 0.9.10, Marvin 攻击）：官方无修复版（crates.io 最新 0.9.x）；
#   项目仅启用 sqlx postgres 后端，sqlx-mysql 为 macros 默认后端未实际使用；
#   即使 MySQL 启用，rsa 仅用于 caching_sha2_password 的公钥加密（服务端挑战），不涉及私钥解密，
#   无时序侧信道暴露面。跟踪上游 rsa 0.9.11+/sqlx 0.9 移除 rsa 后解除。
# RUSTSEC-2024-0370（proc-macro-error 1.0.4, unmaintained）：构建期 proc-macro 诊断辅助库，
#   链路 utoipa-gen → utoipa（OpenAPI 宏），仅编译期使用、不进入运行时二进制；无安全漏洞，
#   仅维护者失联。utoipa 升级或迁移 manyhow/proc-macro2-diagnostics 后解除。
# RUSTSEC-2026-0192（ttf-parser 0.25.1, unmaintained）：字体解析库，链路 lopdf → pdf-extract
#   → topems-ai（PDF 抽取），无已知可利用漏洞，仅作者停止维护；官方无修复版。
#   跟踪 pdf-extract 切换 skrifa 后解除。
# RUSTSEC-2026-0253（lru 0.16.4, informational unsound）：经 async-graphql 传递锁定，
#   触发需 catch_unwind + panic 落在 Drop 路径（本仓无此用法）；2026-10-07 快照比对确认仅此 1 条
#   informational，随 async-graphql 升级滚动消除（P3-8 2026-10-24 登记接受）。
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2026-0192",
  "RUSTSEC-2026-0253",
]

# ────────────────────────────────────────────────────────────────────────────
# [licenses] 许可证合规检查
# ────────────────────────────────────────────────────────────────────────────
[licenses]
version = 2
# 允许的宽松开源许可证（permissive）
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
  "bzip2-1.0.6",
]
# 许可证置信度阈值（0-1），低于此值会 warn
confidence-threshold = 0.8
# 无许可证 crate：cargo-deny 0.20+ 已移除 unlicensed 键（默认即 deny，行为不变）

# ────────────────────────────────────────────────────────────────────────────
# [bans] 禁用 crate + 重复版本检查
# ────────────────────────────────────────────────────────────────────────────
[bans]
# cargo-deny 0.20+ 已移除本段 version 键（保留会导致配置反序列化失败，CI 用 unpinned 安装）
# 重复版本：warn（允许但报告，后续可收紧为 deny）
multiple-versions = "warn"
# 通配符依赖（dep = "*"）：warn
wildcards = "warn"
# 高亮所有重复项
highlight = "all"
# 允许列表（空 = 允许所有未被 deny 的）
allow = []
# 禁用列表（可按需添加，如已知有问题的 crate）
deny = []
# 跳过重复版本检查的 crate（可按需添加）
skip = []

# ────────────────────────────────────────────────────────────────────────────
# [sources] crate 来源限制
# ────────────────────────────────────────────────────────────────────────────
[sources]
# cargo-deny 0.20+ 已移除本段 version 键
# 未知 registry：deny（只允许 crates.io）
unknown-registry = "deny"
# 未知 git 来源：deny（防止直接引用 GitHub 仓库）
unknown-git = "deny"
# 允许的 registry 列表
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 允许的 git 来源（空 = 不允许任何 git 依赖）
allow-git = []
