# cargo-deny 配置 — 许可证合规 + 安全公告 + 禁用 crate 双查
#
# 与 cargo-audit 互补：cargo-audit 仅查 RLSA 漏洞，cargo-deny 额外覆盖
# 许可证合规（防止引入 GPL/AGPL 等传染性许可证）和 crate 禁用列表。
#
# 本地运行：cargo deny check advisories bans licenses sources
# CI job：.github/workflows/ci.yml → cargo-deny

# ────────────────────────────────────────────────────────────────────────────
# [advisories] 安全公告检查（RLSA + RustSec advisory-db）
# ────────────────────────────────────────────────────────────────────────────
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# yanked crate 版本直接拒绝
yanked = "deny"
# 暂不忽略任何公告；CI 发现新公告时应立即评估
ignore = []

# ────────────────────────────────────────────────────────────────────────────
# [licenses] 许可证合规检查
# ────────────────────────────────────────────────────────────────────────────
[licenses]
version = 2
# 允许的宽松开源许可证（permissive）
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
]
# 许可证置信度阈值（0-1），低于此值会 warn
confidence-threshold = 0.8
# 对无许可证文件的 crate 的处理方式
unlicensed = "deny"

# ────────────────────────────────────────────────────────────────────────────
# [bans] 禁用 crate + 重复版本检查
# ────────────────────────────────────────────────────────────────────────────
[bans]
version = 2
# 重复版本：warn（允许但报告，后续可收紧为 deny）
multiple-versions = "warn"
# 通配符依赖（dep = "*"）：warn
wildcards = "warn"
# 高亮所有重复项
highlight = "all"
# 允许列表（空 = 允许所有未被 deny 的）
allow = []
# 禁用列表（可按需添加，如已知有问题的 crate）
deny = []
# 跳过重复版本检查的 crate（可按需添加）
skip = []

# ────────────────────────────────────────────────────────────────────────────
# [sources] crate 来源限制
# ────────────────────────────────────────────────────────────────────────────
[sources]
version = 2
# 未知 registry：deny（只允许 crates.io）
unknown-registry = "deny"
# 未知 git 来源：deny（防止直接引用 GitHub 仓库）
unknown-git = "deny"
# 允许的 registry 列表
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 允许的 git 来源（空 = 不允许任何 git 依赖）
allow-git = []
