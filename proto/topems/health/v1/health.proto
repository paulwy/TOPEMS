// V24.0 模块 C: gRPC 健康检查协议
// 遵循 grpc.health.v1 标准健康检查协议
// 参考: https://github.com/grpc/grpc/blob/master/doc/health-checking.md

syntax = "proto3";

package topems.health.v1;

option go_package = "topems/health/v1;healthv1";
option java_package = "topems.health.v1";

// 健康状态枚举
enum ServingStatus {
  UNKNOWN = 0;
  SERVING = 1;
  NOT_SERVING = 2;
  SERVICE_UNKNOWN = 3; // 仅用于 Check 请求（health.v1 兼容）
}

// 健康检查请求
message HealthCheckRequest {
  // 服务名称，留空表示整体健康状态
  string service = 1;
}

// 健康检查响应
message HealthCheckResponse {
  ServingStatus status = 1;
  // 扩展字段：详细状态信息（V24.0 增强）
  string message = 2;
  // 扩展字段：检查时间戳（Unix 毫秒）
  int64 checked_at = 3;
  // 扩展字段：依赖项状态摘要
  map<string, string> dependencies = 4;
}

// 健康检查服务
service Health {
  // 同步健康检查（grpc.health.v1 兼容）
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  // 流式健康检查（grpc.health.v1 兼容）
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
