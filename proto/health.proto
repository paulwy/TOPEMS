syntax = "proto3";

package topems.health;

import "core.proto";

option java_multiple_files = true;
option java_package = "com.topems.health";
option java_outer_classname = "HealthProto";
option objc_class_prefix = "TPM";

option go_package = "github.com/topems/proto/health";

service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse);
}

message HealthCheckRequest {
  string service = 1;
  topems.core.RequestContext context = 2;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  
  string service = 1;
  ServingStatus status = 2;
  string message = 3;
  topems.core.Timestamp check_time = 4;
  map<string, string> details = 5;
}

message ServerInfoRequest {
  topems.core.RequestContext context = 1;
}

message ServerInfoResponse {
  string server_name = 1;
  string version = 2;
  string environment = 3;
  topems.core.Timestamp start_time = 4;
  int64 uptime_seconds = 5;
  map<string, string> build_info = 6;
  map<string, string> metrics = 7;
}