syntax = "proto3";

package topems.core;

option java_multiple_files = true;
option java_package = "com.topems.core";
option java_outer_classname = "CoreProto";
option objc_class_prefix = "TPM";

option go_package = "github.com/topems/proto/core";

message Empty {}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Status {
  int32 code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
  int32 total_pages = 4;
}

message TenantContext {
  string tenant_id = 1;
  string tenant_name = 2;
}

message UserContext {
  string user_id = 1;
  string username = 2;
  string email = 3;
  repeated string roles = 4;
}

message RequestContext {
  TenantContext tenant = 1;
  UserContext user = 2;
  string trace_id = 3;
  Timestamp timestamp = 4;
}