[package]
name = "notification-service"
version = "1.0.0"
edition = "2021"
authors = ["TOPEMS Team"]
description = "TOPEMS Notification Service - Real-time notification system"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
parking_lot = "0.12"
thiserror = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
topems-shared = { path = "../../shared/lib" }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "notification-service"
path = "src/main.rs"

[[example]]
name = "create_test_notification"
path = "examples/create_test_notification.rs"
