[package]
name = "topems-erp"
version = "1.0.0"
edition = "2021"
authors = ["TOPEMS Team"]
description = "TOPEMS Enterprise Resource Planning System"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
tower-http = { version = "0.6", features = ["cors"] }
validator = { version = "0.18", features = ["derive"] }
regex = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "rust_decimal"] }
rust_decimal = { version = "1.35", features = ["serde"] }
topems-shared = { path = "../../shared/lib" }

[dev-dependencies]
tower = "0.4"
hyper = "1"
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
fake = { version = "3", features = ["derive", "uuid", "chrono"] }
rand = "0.8"

[lib]
name = "topems_erp"
path = "src/lib.rs"

[[bin]]
name = "topems-erp"
path = "src/main.rs"

[[bin]]
name = "test-db"
path = "test_db.rs"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
