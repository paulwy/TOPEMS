# Monitor Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: topems
  labels:
    app: monitor
    suite: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
        suite: analytics
    spec:
      containers:
      - name: monitor
        image: topems/monitor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8062
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: MONITOR_PORT
          value: "8062"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8062
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8062
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8062
    targetPort: 8062
  selector:
    app: monitor