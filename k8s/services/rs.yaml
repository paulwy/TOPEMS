# RS (R&D) Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rs
  namespace: topems
  labels:
    app: rs
    suite: quality
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rs
  template:
    metadata:
      labels:
        app: rs
        suite: quality
    spec:
      containers:
      - name: rs
        image: topems/rs:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8053
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: RS_PORT
          value: "8053"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        - name: PM_URL
          value: "http://pm-service:8023"
        - name: MES_URL
          value: "http://mes-service:8030"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8053
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8053
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rs-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8053
    targetPort: 8053
  selector:
    app: rs