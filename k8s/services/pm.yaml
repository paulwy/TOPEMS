# PM Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm
  namespace: topems
  labels:
    app: pm
    suite: management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pm
  template:
    metadata:
      labels:
        app: pm
        suite: management
    spec:
      containers:
      - name: pm
        image: topems/pm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8023
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: PM_PORT
          value: "8023"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8023
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8023
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pm-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8023
    targetPort: 8023
  selector:
    app: pm