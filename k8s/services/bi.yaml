# BI Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bi
  namespace: topems
  labels:
    app: bi
    suite: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bi
  template:
    metadata:
      labels:
        app: bi
        suite: analytics
    spec:
      containers:
      - name: bi
        image: topems/bi:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8060
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: BI_PORT
          value: "8060"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8060
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8060
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bi-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8060
    targetPort: 8060
  selector:
    app: bi
