# Report Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report
  namespace: topems
  labels:
    app: report
    suite: analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report
  template:
    metadata:
      labels:
        app: report
        suite: analytics
    spec:
      containers:
      - name: report
        image: topems/report:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8061
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: REPORT_PORT
          value: "8061"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8061
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8061
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8061
    targetPort: 8061
  selector:
    app: report
