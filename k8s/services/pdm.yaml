# PDM Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdm
  namespace: topems
  labels:
    app: pdm
    suite: manufacturing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pdm
  template:
    metadata:
      labels:
        app: pdm
        suite: manufacturing
    spec:
      containers:
      - name: pdm
        image: topems/pdm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8031
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: PDM_PORT
          value: "8031"
        - name: MES_URL
          value: "http://mes-service:8030"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8031
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8031
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pdm-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8031
    targetPort: 8031
  selector:
    app: pdm
