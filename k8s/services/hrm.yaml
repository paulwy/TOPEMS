# HRM Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrm
  namespace: topems
  labels:
    app: hrm
    suite: management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hrm
  template:
    metadata:
      labels:
        app: hrm
        suite: management
    spec:
      containers:
      - name: hrm
        image: topems/hrm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8020
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: HRM_PORT
          value: "8020"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hrm-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8020
    targetPort: 8020
  selector:
    app: hrm