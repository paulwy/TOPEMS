# Document Service - Kubernetes Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc
  namespace: topems
  labels:
    app: doc
    suite: management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doc
  template:
    metadata:
      labels:
        app: doc
        suite: management
    spec:
      containers:
      - name: doc
        image: topems/doc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8012
          name: http
        envFrom:
        - configMapRef:
            name: topems-config
        - secretRef:
            name: topems-secrets
        env:
        - name: DOC_PORT
          value: "8012"
        - name: CONSUL_URL
          value: "http://consul-service:8500"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: doc-service
  namespace: topems
spec:
  type: ClusterIP
  ports:
  - port: 8012
    targetPort: 8012
  selector:
    app: doc
