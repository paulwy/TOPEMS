---
# TOPEMS High Availability Cluster Configuration
# Kubernetes Deployment for Production

apiVersion: v1
kind: Namespace
metadata:
  name: topems
  labels:
    app.kubernetes.io/name: topems
    app.kubernetes.io/managed-by: Helm

---
# ConfigMap for TOPEMS configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: topems-config
  namespace: topems
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log main;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript 
                   application/xml application/xml+rss text/javascript application/x-javascript;
        
        # Rate limiting zones
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
        limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
        
        # Upstream definitions for each service
        upstream topems_iam {
            least_conn;
            server topems-iam-1.topems-internal:8080 weight=100;
            server topems-iam-2.topems-internal:8080 weight=100;
            server topems-iam-3.topems-internal:8080 weight=100;
            keepalive 32;
        }
        
        upstream topems_portal {
            least_conn;
            server topems-portal-1.topems-internal:3000 weight=100;
            server topems-portal-2.topems-internal:3000 weight=100;
            server topems-portal-3.topems-internal:3000 weight=100;
            keepalive 32;
        }
        
        upstream topems_rs {
            least_conn;
            server topems-rs-1.topems-internal:8080 weight=100;
            server topems-rs-2.topems-internal:8080 weight=100;
            keepalive 32;
        }
        
        upstream topems_lims {
            least_conn;
            server topems-lims-1.topems-internal:8080 weight=100;
            server topems-lims-2.topems-internal:8080 weight=100;
            keepalive 32;
        }
        
        # Default server configuration
        server {
            listen 80;
            listen [::]:80;
            server_name _;
            return 301 https://$host$request_uri;
        }
        
        server {
            listen 443 ssl http2;
            listen [::]:443 ssl http2;
            server_name _;
            
            ssl_certificate /etc/nginx/ssl/tls.crt;
            ssl_certificate_key /etc/nginx/ssl/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 1d;
            
            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            
            # API routes
            location /api/iam/ {
                limit_req zone=api_limit burst=50 nodelay;
                proxy_pass http://topems_iam;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
                proxy_connect_timeout 5s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }
            
            location /api/portal/ {
                limit_req zone=api_limit burst=50 nodelay;
                proxy_pass http://topems_portal;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
            }
            
            location /api/rs/ {
                limit_req zone=api_limit burst=50 nodelay;
                proxy_pass http://topems_rs;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /api/lims/ {
                limit_req zone=api_limit burst=50 nodelay;
                proxy_pass http://topems_lims;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Health check endpoints
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            location /healthz {
                proxy_pass http://topems_iam/health;
                proxy_connect_timeout 2s;
                proxy_read_timeout 3s;
            }
        }
    }

---
# IAM Service - 3 replicas for HA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topems-iam
  namespace: topems
  labels:
    app: topems-iam
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: topems-iam
  template:
    metadata:
      labels:
        app: topems-iam
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - topems-iam
              topologyKey: kubernetes.io/hostname
      containers:
      - name: iam
        image: topems/topems-iam:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: topems-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: topems-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: config
        configMap:
          name: topems-config

---
# IAM Service - ClusterIP for internal communication
apiVersion: v1
kind: Service
metadata:
  name: topems-iam-internal
  namespace: topems
  labels:
    app: topems-iam
spec:
  clusterIP: None
  selector:
    app: topems-iam
  ports:
  - port: 8080
    targetPort: 8080
    name: http

---
# Portal Service - 3 replicas for HA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topems-portal
  namespace: topems
  labels:
    app: topems-portal
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: topems-portal
  template:
    metadata:
      labels:
        app: topems-portal
        tier: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - topems-portal
              topologyKey: kubernetes.io/hostname
      containers:
      - name: portal
        image: topems/topems-portal:latest
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Portal Service - ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: topems-portal-internal
  namespace: topems
spec:
  clusterIP: None
  selector:
    app: topems-portal
  ports:
  - port: 3000
    targetPort: 3000

---
# Horizontal Pod Autoscaler for IAM
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: topems-iam-hpa
  namespace: topems
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: topems-iam
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
# PodDisruptionBudget for IAM
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: topems-iam-pdb
  namespace: topems
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: topems-iam

---
# PostgreSQL High Availability Setup
apiVersion: v1
kind: Secret
metadata:
  name: topems-secrets
  namespace: topems
type: Opaque
stringData:
  database-url: "postgres://topems:topems_secret@postgres.primary:5432/topems"
  jwt-secret: "your-super-secret-jwt-key-change-in-production"

---
# External Name Service for primary database
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: topems
spec:
  type: ExternalName
  externalName: postgres-primary.database.svc.cluster.local

---
# Monitoring Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: topems-monitoring
  namespace: topems

---
# NetworkPolicy for IAM
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: topems-iam-network-policy
  namespace: topems
spec:
  podSelector:
    matchLabels:
      app: topems-iam
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
