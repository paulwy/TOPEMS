# TOPEMS ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: topems-config
  namespace: topems
data:
  # Database
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "topems"
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # Core
  CORE_URL: "http://unified-core-service:8000"
  # Service Ports
  MES_PORT: "8030"
  PDM_PORT: "8031"
  QMS_PORT: "8050"
  LIMS_PORT: "8051"
  EHS_PORT: "8052"
  BI_PORT: "8060"
  REPORT_PORT: "8061"
  # Logging
  RUST_LOG: "info"
---
# TOPEMS Secrets (Base64 encoded)
# Note: In production, use external secrets manager
apiVersion: v1
kind: Secret
metadata:
  name: topems-secrets
  namespace: topems
type: Opaque
stringData:
  POSTGRES_USER: "topems"
  POSTGRES_PASSWORD: "topems_secret"
  DATABASE_URL: "postgres://topems:topems_secret@postgres-service:5432/topems"
  REDIS_URL: "redis://redis-service:6379"
