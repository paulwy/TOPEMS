# TOPEMS ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: topems-config
  namespace: topems
data:
  # Database
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "topems"
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # Core
  CORE_URL: "http://unified-core-service:8000"
  # Service Ports
  FINANCE_PORT: "8011"
  DOC_PORT: "8012"
  AI_PORT: "8013"
  MES_PORT: "8030"
  PDM_PORT: "8031"
  QMS_PORT: "8050"
  LIMS_PORT: "8051"
  EHS_PORT: "8052"
  BI_PORT: "8060"
  REPORT_PORT: "8061"
  # Logging
  RUST_LOG: "info"
  # V13.0 Plugin Architecture
  CONSUL_ENABLED: "true"
  CONSUL_URL: "http://consul-service:8500"
  PLUGIN_AUTO_REGISTER: "true"
  PLUGIN_REGISTER_URL: "http://unified-core-service:8000/api/core/plugin/dev/plugins"
  SERVICE_HEARTBEAT_INTERVAL: "30"
  PLUGIN_HEARTBEAT_TIMEOUT: "90"
---
# TOPEMS Secrets (Base64 encoded)
# Note: In production, use external secrets manager
apiVersion: v1
kind: Secret
metadata:
  name: topems-secrets
  namespace: topems
type: Opaque
stringData:
  POSTGRES_USER: "topems"
  POSTGRES_PASSWORD: "topems_secret"
  DATABASE_URL: "postgres://topems:topems_secret@postgres-service:5432/topems"
  REDIS_URL: "redis://redis-service:6379"
  # V13.0 Plugin Registration Token (CHANGE IN PRODUCTION!)
  # Generate with: openssl rand -hex 32
  PLUGIN_REGISTRATION_TOKEN: "CHANGE_ME_TO_A_SECURE_RANDOM_TOKEN"
